<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#4f5d75"/>
    </marker>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .txt{font:800 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .box{fill:#fff;stroke:rgba(45,49,66,.18);stroke-width:1.2}
      .observe{fill:#f8fafc;stroke:#94a3b8}
      .test{fill:#eff6ff;stroke:#2563eb}
      .normal{fill:#f0fdf4;stroke:#16a34a}
      .hold{fill:#ecfdf5;stroke:#059669}
      .reduce{fill:#fff7ed;stroke:#f59e0b}
      .exit{fill:#fef2f2;stroke:#dc2626}
      .repair{fill:#f5f3ff;stroke:#7c3aed}
      .line{stroke:#4f5d75;stroke-width:2.2;marker-end:url(#arrow);fill:none}
      .dash{stroke-dasharray:7 6}
      .axis{stroke:#cbd5e1;stroke-width:1.4}
      .bar0{fill:#e2e8f0}
      .bar1{fill:#bfdbfe}
      .bar2{fill:#86efac}
      .bar3{fill:#34d399}
      .bar4{fill:#fed7aa}
      .bar5{fill:#fecaca}
      .bar6{fill:#ddd6fe}
    </style>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text class="title" x="64" y="70">结构状态 → 仓位动作分层图</text>
  <text class="sub" x="64" y="102">系统原则：仓位不是由“感觉强弱”决定，而是由结构确认质量、失败线清晰度、风险收益比共同决定。</text>

  <!-- column headers -->
  <text class="tiny" x="92" y="152">结构状态</text>
  <text class="tiny" x="360" y="152">确认条件</text>
  <text class="tiny" x="724" y="152">仓位动作</text>
  <text class="tiny" x="976" y="152">必须同时做什么</text>
  <text class="tiny" x="1220" y="152">仓位示意</text>
  <line class="axis" x1="64" y1="168" x2="1336" y2="168"/>

  <!-- row 1 -->
  <rect class="box observe" x="64" y="192" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="224">观察区</text>
  <text class="small" x="84" y="250">靠近关键位，但还没确认</text>
  <rect class="box" x="320" y="192" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="224">只出现止跌、反弹、触碰防守/上下沿</text>
  <text class="tiny" x="340" y="250">没有收盘突破关键压力，也没有二次验证</text>
  <rect class="box observe" x="700" y="192" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="224">0 仓 / 不动</text>
  <text class="small" x="720" y="250">已有仓位则只观察</text>
  <rect class="box" x="956" y="192" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="224">先画清关键位</text>
  <text class="tiny" x="976" y="250">防守位 / 压力位 / 上下沿</text>
  <rect class="bar0" x="1220" y="218" width="32" height="28" rx="4"/>
  <rect class="bar0" x="1260" y="218" width="32" height="28" rx="4" opacity=".35"/>
  <rect class="bar0" x="1300" y="218" width="32" height="28" rx="4" opacity=".18"/>

  <!-- row 2 -->
  <rect class="box test" x="64" y="300" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="332">普通确认</text>
  <text class="small" x="84" y="358">第一层结构打破</text>
  <rect class="box" x="320" y="300" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="332">收盘突破关键位</text>
  <text class="tiny" x="340" y="358">如突破反弹压力位 / 修复小高点</text>
  <rect class="box test" x="700" y="300" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="332">小仓试错</text>
  <text class="small" x="720" y="358">不是重仓确认</text>
  <rect class="box" x="956" y="300" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="332">立刻设失败线</text>
  <text class="tiny" x="976" y="358">跌回关键位/前低则认错</text>
  <rect class="bar1" x="1220" y="326" width="32" height="28" rx="4"/>
  <rect class="bar0" x="1260" y="326" width="32" height="28" rx="4" opacity=".35"/>
  <rect class="bar0" x="1300" y="326" width="32" height="28" rx="4" opacity=".18"/>

  <!-- row 3 -->
  <rect class="box normal" x="64" y="408" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="440">稳健确认</text>
  <text class="small" x="84" y="466">突破后回踩守住</text>
  <rect class="box" x="320" y="408" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="440">突破 → 回踩不破 → 再次向上</text>
  <text class="tiny" x="340" y="466">压力有机会转支撑，结构开始修复</text>
  <rect class="box normal" x="700" y="408" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="440">正常仓位</text>
  <text class="small" x="720" y="466">可从试错仓提升</text>
  <rect class="box" x="956" y="408" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="440">新防守位上移</text>
  <text class="tiny" x="976" y="466">回踩低点成为新防守候选</text>
  <rect class="bar2" x="1220" y="434" width="32" height="28" rx="4"/>
  <rect class="bar2" x="1260" y="434" width="32" height="28" rx="4"/>
  <rect class="bar0" x="1300" y="434" width="32" height="28" rx="4" opacity=".18"/>

  <!-- row 4 -->
  <rect class="box hold" x="64" y="516" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="548">趋势延续</text>
  <text class="small" x="84" y="574">高低点继续抬升</text>
  <rect class="box" x="320" y="516" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="548">新高后回调不破新防守</text>
  <text class="tiny" x="340" y="574">上涨结构仍然有效</text>
  <rect class="box hold" x="700" y="516" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="548">持有 / 不乱卖</text>
  <text class="small" x="720" y="574">不因普通回调出局</text>
  <rect class="box" x="956" y="516" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="548">防守位滚动上移</text>
  <text class="tiny" x="976" y="574">利润保护，而非猜顶</text>
  <rect class="bar3" x="1220" y="542" width="32" height="28" rx="4"/>
  <rect class="bar3" x="1260" y="542" width="32" height="28" rx="4"/>
  <rect class="bar3" x="1300" y="542" width="32" height="28" rx="4"/>

  <!-- row 5 -->
  <rect class="box reduce" x="64" y="624" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="656">尾声变弱</text>
  <text class="small" x="84" y="682">未破防，但质量下降</text>
  <rect class="box" x="320" y="624" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="656">高点推进弱 / 回调加深 / 量价背离</text>
  <text class="tiny" x="340" y="682">还不是反转确认，只是风险上升</text>
  <rect class="box reduce" x="700" y="624" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="656">减仓 / 不加仓</text>
  <text class="small" x="720" y="682">把主动权拿回来</text>
  <rect class="box" x="956" y="624" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="656">盯紧防守位</text>
  <text class="tiny" x="976" y="682">破防才进入离场逻辑</text>
  <rect class="bar4" x="1220" y="650" width="32" height="28" rx="4"/>
  <rect class="bar4" x="1260" y="650" width="32" height="28" rx="4" opacity=".6"/>
  <rect class="bar0" x="1300" y="650" width="32" height="28" rx="4" opacity=".18"/>

  <!-- row 6 -->
  <rect class="box exit" x="64" y="732" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="764">有效破防</text>
  <text class="small" x="84" y="790">旧持有逻辑失效</text>
  <rect class="box" x="320" y="732" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="764">收盘跌破防守位，且没有快速收回</text>
  <text class="tiny" x="340" y="790">不能把希望当成结构</text>
  <rect class="box exit" x="700" y="732" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="764">离场 / 大幅降仓</text>
  <text class="small" x="720" y="790">先控制亏损扩大</text>
  <rect class="box" x="956" y="732" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="764">等待修复确认</text>
  <text class="tiny" x="976" y="790">找破防后反弹压力位</text>
  <rect class="bar5" x="1220" y="758" width="32" height="28" rx="4"/>
  <rect class="bar0" x="1260" y="758" width="32" height="28" rx="4" opacity=".2"/>
  <rect class="bar0" x="1300" y="758" width="32" height="28" rx="4" opacity=".1"/>

  <!-- row 7 -->
  <rect class="box repair" x="64" y="840" width="220" height="80" rx="8"/>
  <text class="txt" x="84" y="872">修复接回</text>
  <text class="small" x="84" y="898">破防后重新确认</text>
  <rect class="box" x="320" y="840" width="344" height="80" rx="8"/>
  <text class="small" x="340" y="872">突破压力位，回踩不破，再次向上</text>
  <text class="tiny" x="340" y="898">不是站回原防守位就立刻买回</text>
  <rect class="box repair" x="700" y="840" width="220" height="80" rx="8"/>
  <text class="txt" x="720" y="872">重新建仓 / 接回</text>
  <text class="small" x="720" y="898">从小仓到正常仓</text>
  <rect class="box" x="956" y="840" width="224" height="80" rx="8"/>
  <text class="small" x="976" y="872">设新的防守位</text>
  <text class="tiny" x="976" y="898">接回后也要能认错</text>
  <rect class="bar6" x="1220" y="866" width="32" height="28" rx="4"/>
  <rect class="bar6" x="1260" y="866" width="32" height="28" rx="4"/>
  <rect class="bar0" x="1300" y="866" width="32" height="28" rx="4" opacity=".18"/>

  <!-- system flow cues -->
  <path class="line dash" d="M920 340 C1012 340 1032 444 956 448"/>
  <path class="line dash" d="M920 772 C1012 772 1032 876 956 880"/>
  <text class="tiny" x="1016" y="352">确认后才升仓</text>
  <text class="tiny" x="1016" y="784">破防后另开新判断</text>

  <text class="tiny" x="64" y="956">学习用途，不构成投资建议。仓位比例应结合个人风险承受能力、标的波动、流动性和交易计划；本图只训练结构化判断。</text>
</svg>
