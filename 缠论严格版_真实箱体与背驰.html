  const merged=[];

  return merged.slice(-2);
}
function appendBeichi(cur,resEl){
  const lastTwo=localHPs();
  if(lastTwo.length<2){resEl.innerHTML+='<br><br><b style="color:#33475e">◆ 背驰结论</b>：当前点往前数据不足形成两个完整阶段高点，暂无法稳定判断。';return;}
  const A=DATA[lastTwo[0]],B=DATA[lastTwo[1]];
  const pUp=B.h>=A.h; const mB=Math.abs(B.macd||0),mA=Math.abs(A.macd||0);
  let s;
  if(pUp&&mB<mA*0.8)s='<b style="color:#d64045">有顶背驰</b>：价格创新高（'+A.h.toFixed(2)+'→'+B.h.toFixed(2)+'），但MACD动能从'+mA.toFixed(2)+'降到'+mB.toFixed(2)+'，上涨力竭，潜在<b>见顶/卖点</b>信号。';
  else if(pUp)s='<b style="color:#0e6f46">无顶背驰</b>：价格创新高，MACD动能跟上（'+mA.toFixed(2)+'→'+mB.toFixed(2)+'），上涨健康，暂无见顶信号。';
  else s='<b>当前无顶背驰信号</b>：近高点'+B.h.toFixed(2)+'未超前高'+A.h.toFixed(2)+'，处下降/整理结构，谈不上"创新高衰竭"。';
  resEl.innerHTML+='<br><br><b style="color:#33475e">◆ 背驰结论</b>：'+s+'<br><span style="color:#8899aa">对比的两阶段高点：前高'+A.h.toFixed(2)+'('+A.d.slice(5)+',MACD动能'+mA.toFixed(2)+') → 近高'+B.h.toFixed(2)+'('+B.d.slice(5)+',MACD动能'+mB.toFixed(2)+')</span>';
}
