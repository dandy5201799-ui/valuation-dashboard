  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,cv.width,cv.height);
  const {mn,mx,pb}=pscale();
  ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;
  for(let k=0;k<=6;k++){const v=mn+(mx-mn)*k/6,yy=pb-(pb-priceTop())*k/6;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(cv.width-34,yy);ctx.stroke();ctx.fillStyle='#8894a6';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(1),padL-6,yy+3)}
  // MACD分隔
  ctx.strokeStyle='#dfe6ef';ctx.beginPath();ctx.moveTo(padL,pb+12);ctx.lineTo(cv.width-34,pb+12);ctx.stroke();
  ctx.fillStyle='#667085';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('MACD 12,26,9',padL,pb+22);
  // 日期轴(只到cut)
  ctx.textAlign='center';ctx.fillStyle='#99a4b4';ctx.font='9px sans-serif';
  DATA.slice(0,cut+1).forEach((d,i)=>{if(i%7===0)ctx.fillText(d.d.slice(5),xs(i),cv.height-padB+15)});
  // K线(只到cut)
  const s=DATA.slice(0,cut+1);const bw=Math.max(1.5,cv.width/DATA.length*0.42);
  s.forEach((d,i)=>{const up=d.c>=d.o;ctx.strokeStyle=up?'#c0392b':'#1a7a4c';ctx.fillStyle=up?'rgba(192,57,43,.92)':'rgba(26,122,76,.92)';ctx.beginPath();ctx.moveTo(xs(i),yv(d.l));ctx.lineTo(xs(i),yv(d.h));ctx.stroke();const t=Math.min(yv(d.o),yv(d.c)),b=Math.max(yv(d.o),yv(d.c));ctx.fillRect(xs(i)-bw/2,t,bw,Math.max(1,b-t));});
  // MACD(到cut)
  const macx=Math.max(...s.map(d=>Math.abs(d.macd||0)))*1.2||1;
  const mTop=pb+16,mBot=cv.height-padB-8,mMid=mTop+(mBot-mTop)*0.34;
  s.forEach((d,i)=>{const m=d.macd||0;const hh=(Math.abs(m)/macx)*(mBot-mTop)/2;ctx.fillStyle=m>=0?'rgba(34,160,107,.85)':'rgba(214,64,69,.85)';const y0=m>=0?mMid-hh:mMid;ctx.fillRect(xs(i)-bw/2,y0,bw,hh);});
  // 真实箱体(到cut) —— 仅当选中是❸箱体时显示
  if(sel.has(3)){
    ctx.save();
    BOXES.forEach(b=>{if(b.i0>cut)return;const x0=xs(b.i0),x1=Math.min(xs(b.i1),xs(cut));const on=cut>=b.i0&&cut<=b.i1;
      ctx.fillStyle=on?'rgba(183,121,31,0.16)':'rgba(183,121,31,0.06)';ctx.fillRect(x0,yv(b.top),x1-x0,yv(b.bot)-yv(b.top));
      ctx.strokeStyle=on?'#b7791f':'rgba(183,121,31,0.45)';ctx.lineWidth=on?2.4:1.2;ctx.setLineDash([6,3]);ctx.strokeRect(x0,yv(b.top),x1-x0,yv(b.bot)-yv(b.top));ctx.setLineDash([]);
      if(on){ctx.font='bold 11px sans-serif';ctx.fillStyle='#b7791f';ctx.textAlign='left';ctx.fillText('上沿/压力 '+b.top.toFixed(2),x0+4,yv(b.top)-8);ctx.fillText('下沿/支撑 '+b.bot.toFixed(2),x0+4,yv(b.bot)+16);}
    });
    ctx.restore();
  }
  // 分步绘制(勾选才画,可叠加)
  if(sel.has(1))drawHLine();
  if(sel.has(2))drawHLine(true);
  if(sel.has(4))drawTrig();
  // 当前点竖线
  ctx.save();ctx.strokeStyle='#d64045';ctx.lineWidth=2.2;ctx.setLineDash([5,3]);
  ctx.beginPath();ctx.moveTo(xs(cut),priceTop());ctx.lineTo(xs(cut),cv.height-padB);ctx.stroke();ctx.restore();
  const xCut=xs(cut), lbl='▮ '+DATA[cut].d+' 收'+DATA[cut].c.toFixed(2);
  ctx.font='bold 12px sans-serif';ctx.fillStyle='#d64045';
  // 避免标签越界被裁：靠左边缘时左对齐，靠右边缘时右对齐，中间居中
  const lw=ctx.measureText(lbl).width;
  if(xCut+lw/2>cv.width-6){ctx.textAlign='right';ctx.fillText(lbl, xCut-6, priceTop()+16);}
  else if(xCut-lw/2<padL){ctx.textAlign='left';ctx.fillText(lbl, xCut+6, priceTop()+16);}
  else {ctx.textAlign='center';ctx.fillText(lbl, xCut, priceTop()+16);}
  document.getElementById('nowtag').textContent='当前停在：'+DATA[cut].d+'　收盘 '+DATA[cut].c.toFixed(2)+'　（cut之后无数据=无未来）';
  // 步骤按钮(多选/可叠加)
  const st=document.getElementById('steps');st.innerHTML='';
  STEPS.forEach((nm,i)=>{const b=document.createElement('button');b.className='step'+(sel.has(i+1)?' on':'');b.textContent=nm;b.onclick=()=>{
    if(sel.has(i+1)){sel.delete(i+1);}else{sel.add(i+1);lastStep=i+1;}
    draw();
  };st.appendChild(b);});
  renderConclusion();
}
// 真正的波段高低点：间隔足够(≥4根)才算两个独立波段，避免把临近小高点并掉
function highsLows(){
  const s=DATA.slice(0,cut+1);const H=[],L=[];
  // 找局部极大值。注意：若要判断"cut当天是否新高"，需把 cut 当天也纳入极大候选
  for(let i=1;i<s.length;i++){
    const isPeak = i===s.length-1 ? (s[i].h>=s[i-1].h)  /* 当前点即最后一天，只要>=前一天就算阶段性高点 */ 
              : (s[i].h>=s[i-1].h && s[i].h>=s[i+1].h);
    if(isPeak)H.push(i);
    const isTrough = i===s.length-1 ? (s[i].l<=s[i-1].l) : (s[i].l<=s[i-1].l && s[i].l<=s[i+1].l);
    if(isTrough)L.push(i);
  }
  // 保留真正的波段极值：间隔>=4根才各自独立；同区间内取更高/更低
  function dedup(arr, isHi){
    const out=[];
    for(const g of arr){
      if(out.length && g-out[out.length-1]<=3){ // 太近,合并
        if(isHi ? DATA[g].h>DATA[out[out.length-1]].h : DATA[g].l<DATA[out[out.length-1]].l)
          out[out.length-1]=g;
      } else out.push(g);
    }
    return out;
  }
  return {H:dedup(H,true), L:dedup(L,false)};
}
// 背驰用：到当前点为止的最高点=近高, 它之前最近一个波段高点=前高
function beichiHiLo(){
  const {H}=highsLows(); // H 已按时间排序, 且含cut当天可能的最高
  if(H.length<2) return null;
  const B=H[H.length-1];            // 最近一个波段高点(含cut当天)
  let A=H[H.length-2];              // 前一个波段高点
  // 安全：确保 A 在 B 之前且两者价格和动能都可得
  if(A>=B && H.length>2) A=H[H.length-3];
  if(A>=B) return null;
  return {A,B};
}
function drawHLine(alsoHL){
  const {H,L}=highsLows();ctx.save();
  // 取"当前点之前"最近的2个波段高点/低点连线(趋势只看最近，不画远古的)
  if(H.length>=2){const h0=H[H.length-2],h1=H[H.length-1];ctx.strokeStyle='#d64045';ctx.lineWidth=2.4;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(h0),yv(DATA[h0].h));ctx.lineTo(xs(h1),yv(DATA[h1].h));ctx.stroke();[h0,h1].forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].h),5,0,7);ctx.fillStyle='#d64045';ctx.fill()});}
  if(L.length>=2){const l0=L[L.length-2],l1=L[L.length-1];ctx.strokeStyle='#1a7a4c';ctx.lineWidth=2.4;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(l0),yv(DATA[l0].l));ctx.lineTo(xs(l1),yv(DATA[l1].l));ctx.stroke();[l0,l1].forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].l),5,0,7);ctx.fillStyle='#1a7a4c';ctx.fill()});}
  ctx.restore();
}
function drawTrig(){
  // 在最近箱体上下沿画虚线
  const inb=BOXES.find(b=>cut>=b.i0&&cut<=b.i1);if(!inb)return;
  ctx.save();ctx.strokeStyle='#b7791f';ctx.lineWidth=1.6;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(padL,yv(inb.top));ctx.lineTo(cv.width-34,yv(inb.top));ctx.stroke();
  ctx.beginPath();ctx.moveTo(padL,yv(inb.bot));ctx.lineTo(cv.width-34,yv(inb.bot));ctx.stroke();ctx.restore();
}
function inBox(){return BOXES.find(b=>cut>=b.i0&&cut<=b.i1)}
function renderConclusion(){
  const s=DATA.slice(0,cut+1),cur=DATA[cut];
  const el=document.getElementById('res');let html='';
  if(lastStep===1){
    const {H,L}=highsLows();let dir='数据不足';
    if(H.length>=2&&L.length>=2){const hp=DATA[H[1]].h>=DATA[H[0]].h,lp=DATA[L[1]].l>=DATA[L[0]].l;
      dir=hp&&lp?'<b>上涨趋势</b>（高点和低点都在抬升）':(!hp&&!lp)?'<b>下跌趋势</b>（高点和低点都在走低）':'<b>横盘/整理</b>';}
    html='<b>❶ 走势方向结论</b>：'+dir+'<br><span class="btn-concl">方法：把当前点前的高点连线、低点连线，看方向。</span>';
  }else if(lastStep===2){
    let hi=s[0],lo=s[0];s.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
    html='<b>❷ 高低点结论</b>：近高 <b>'+hi.h.toFixed(2)+'</b>（'+hi.d.slice(5)+'）=压力位；近低 <b>'+lo.l.toFixed(2)+'</b>（'+lo.d.slice(5)+'）=支撑位。';
  }else if(lastStep===3){
    const b=inBox();
    if(b){const pos=(cur.c-b.bot)/((b.top-b.bot)||1);html='<b>❸ 箱体结论</b>：当前在<b class="bx">真实窄箱体</b>内（<b class="bx">'+b.d0.slice(5)+'~'+b.d1.slice(5)+'</b>）。下沿/支撑 <b>'+b.bot.toFixed(2)+'</b>，上沿/压力 <b>'+b.top.toFixed(2)+'</b>。当前位于 <b>'+Math.round(pos*100)+'%</b>处。';}
    else{const near=BOXES.reduce((a,x)=>Math.abs(x.i0-cut)<Math.abs(a.i0-cut)?x:a,BOXES[0]);html='<b>❸ 箱体结论</b>：当前<b>不在窄箱体</b>内（属趋势/整理段）。最近箱体是 <b class="bx">'+near.d0.slice(5)+'~'+near.d1.slice(5)+'</b>（'+near.bot.toFixed(2)+'~'+near.top.toFixed(2)+'）。缠论此时以"回踩/突破关键位"为主，不做箱体高抛低吸。';}
  }else if(lastStep===4){
    // 使用预先在真实数据上验证过的背驰计算结果（BEICHI[cut-1]）
    const bc = cut>=1 && BEICHI[cut-1] && !BEICHI[cut-1].none ? BEICHI[cut-1] : null;
    if(bc){
      const A=DATA[bc.A],B=DATA[bc.B];
      const beichi = bc.isTop
        ? '<span style="color:#d64045"><b>有顶背驰</b></span>：价格创阶段新高（'+A.h.toFixed(2)+'→'+B.h.toFixed(2)+'），但MACD动能从'+bc.mA.toFixed(2)+'降到'+bc.mB.toFixed(2)+'，<b>上涨力竭→潜在卖/见顶信号</b>'
        : bc.pB
        ? '<span style="color:#0e6f46"><b>无顶背驰</b></span>：价格创阶段新高，且MACD动能未明显衰减（'+bc.mA.toFixed(2)+'→'+bc.mB.toFixed(2)+'），上涨健康，暂无见顶信号'
        : '<b>无顶背驰信号</b>：近高（'+B.h.toFixed(2)+'）尚未超过前高（'+A.h.toFixed(2)+'），仍处整理/回落结构';
      html='<b>❹ 突破/背驰结论</b>：'+beichi
        +'<br><span style="color:#667085">对比的真实波段高点：前高 <b>'+A.h.toFixed(2)+'</b>('+A.d.slice(5)+',动能'+bc.mA.toFixed(2)+') → 近高 <b>'+B.h.toFixed(2)+'</b>('+B.d.slice(5)+',动能'+bc.mB.toFixed(2)+')</span>';
    }
    else html='<b>❹ 突破/背驰结论</b>：当前点往前数据不足两个波段高点，暂无法稳定判断背驰。';
  }else if(lastStep===5){
    const b=inBox();let type,txt;
    if(b){const pos=(cur.c-b.bot)/((b.top-b.bot)||1);
      if(pos>0.72){type='sell';txt='贴近箱体上沿'+b.top.toFixed(2)+'：缠论技术上<b>卖/做T止盈区</b>（除非放量突破站稳转多）';}
      else if(pos<0.28){type='buy';txt='贴近箱体下沿'+b.bot.toFixed(2)+'：缠论技术上<b>买/做T低吸区</b>（除非跌破走空）';}
      else{type='hold';txt='处箱体中段：<b>持有/等待</b>，无明确买卖信号';}}
    else{const near=BOXES.reduce((a,x)=>Math.abs(x.i0-cut)<Math.abs(a.i0-cut)?x:a,BOXES[0]);type='hold';
      if(cur.c>near.top){txt='已突破最近箱体上沿'+near.top.toFixed(2)+'：观察是否<span style="color:#d64045"><b>收盘站稳</b></span>(否则假突破)，站稳看多';}
      else if(cur.c<near.bot){txt='已跌破最近箱体下沿'+near.bot.toFixed(2)+'：关注是否<span style="color:#d64045"><b>收盘收回</b></span>，收回则假破位，否则看空';}
      else txt='非箱体段，缠论技术上为<b>趋势延续，持有/跟随</b>，不及早反向判断';}
    const color=type==='buy'?'#e5f6ee':type==='sell'?'#fdeaea':'#eef2f7';
    html='<b>❺ 纯技术买卖建议</b><br><span style="background:'+color+';display:inline-block;padding:8px 12px;border-radius:8px;font-weight:700;">'+txt+'</span><br><span style="color:#8899aa">（仅缠论纯技术信号，不含你的估值判断）</span>';
  }
  el.innerHTML=html;
}
document.getElementById('slider').addEventListener('input',(e)=>{cut=+e.target.value;document.getElementById('slab').textContent=DATA[cut].d;draw()});
window.addEventListener('resize',()=>{px();draw()});
px();draw();
</script></body></html>
