<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第1章 · 趋势方向演示器</title>
<link rel="stylesheet" href="demo-base.css">
<style>
  .chart{min-height:280px;}
  .drag-pt{cursor:grab;}
  .drag-pt.dragging{cursor:grabbing;}
</style>
</head>
<body>
<div class="demo">
  <div class="demo-head">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="demo-title">趋势方向演示器</div>
    <div class="demo-sub">第1章 · 拖动高点或低点，看趋势分类怎么变</div>
  </div>

  <div class="chart">
    <svg id="svg" class="chart-svg" viewBox="0 0 640 300" role="img" aria-label="高低点趋势演示"></svg>
  </div>

  <div class="controls">
    <div class="ctl-group">
      <span class="lbl">高点比较：</span>
      <span id="highChip" class="chip watch">—</span>
      <span id="highDetail" class="mono" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="ctl-group">
      <span class="lbl">低点比较：</span>
      <span id="lowChip" class="chip watch">—</span>
      <span id="lowDetail" class="mono" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div style="margin-left:auto">
      <button class="btn" id="resetBtn">恢复初始</button>
    </div>
  </div>

  <div class="verdict">
    <span class="chip watch" id="verdictChip">拖动试试</span>
    <span class="vtext" id="verdictText">比较最近两组高点和两组低点的变化，判断整体方向。</span>
  </div>

  <div class="hint"><b>怎么玩：</b>用鼠标<b>上下拖动</b>任意圆点——绿色圆点是高点，蓝色圆点是低点。高点一起抬高、低点一起抬高 → 上升；一起降低 → 下降；都在一个窄范围里反复 → 横盘；方向矛盾 → 证据不够。</div>
</div>

<script>
(function(){
  // 六个交替点：低1 高1 低2 高2 低3 高3
  var PTS = [
    {id:"l1", type:"L", price:0.90, x:70,  label:"低1"},
    {id:"h1", type:"H", price:1.00, x:150, label:"高1"},
    {id:"l2", type:"L", price:0.96, x:240, label:"低2"},
    {id:"h2", type:"H", price:1.08, x:320, label:"高2"},
    {id:"l3", type:"L", price:1.04, x:410, label:"低3"},
    {id:"h3", type:"H", price:1.16, x:500, label:"高3"}
  ];
  var DEFAULTS = PTS.map(function(p){return p.price;});
  var W = 640, H = 300, padT = 44, padB = 40, padL = 46, padR = 20;
  var svg = document.getElementById("svg");

  function yRange(){
    var prices = PTS.map(function(p){return p.price;});
    var mn = Math.min.apply(null, prices), mx = Math.max.apply(null, prices);
    var gap = (mx - mn) || 1;
    return { min: mn - gap*0.22, max: mx + gap*0.28 };
  }
  function yOf(price){
    var r = yRange();
    return padT + (r.max - price) / (r.max - r.min) * (H - padT - padB);
  }
  function priceOf(yy){
    var r = yRange();
    return r.max - (yy - padT) / (H - padT - padB) * (r.max - r.min);
  }
  function cls(a, b){
    var dy = yOf(b.price) - yOf(a.price); // b 比 a 高 => dy 为负
    var tol = 5;
    if (dy < -tol) return "up";      // 抬高
    if (dy >  tol) return "down";    // 降低
    return "flat";                   // 接近
  }

  function verdictText(){
    var hs = [cls(PTS[1],PTS[3]), cls(PTS[3],PTS[5])];
    var ls = [cls(PTS[0],PTS[2]), cls(PTS[2],PTS[4])];
    var hUp = hs[0]==="up" && hs[1]==="up";
    var hDn = hs[0]==="down" && hs[1]==="down";
    var lUp = ls[0]==="up" && ls[1]==="up";
    var lDn = ls[0]==="down" && ls[1]==="down";
    var allFlat = hs.concat(ls).every(function(c){return c==="flat";});

    var hLabel = hUp ? "抬高" : (hDn ? "降低" : "反复/接近");
    var lLabel = lUp ? "抬高" : (lDn ? "降低" : "反复/接近");

    var chip, text;
    if (hUp && lUp){ chip = ["up", "上升趋势"]; text = "后面的高点更高，低点也更高 → 重心上移，更像上升。"; }
    else if (hDn && lDn){ chip = ["down", "下降趋势"]; text = "后面的高点更低，低点也更低 → 重心下移，更像下降。"; }
    else if (allFlat){ chip = ["flat", "横盘"]; text = "高低点都在一个窄范围里反复重叠 → 更像横盘。"; }
    else { chip = ["watch", "证据不够"]; text = "高点和低点给出的方向不一致 → 先不贴标签，继续观察。"; }

    setChip("highChip", hLabel, clsChip(hs));
    setChip("lowChip", lLabel, clsChip(ls));
    document.getElementById("highDetail").textContent =
      "高1→高2 " + dirChar(hs[0]) + "  高2→高3 " + dirChar(hs[1]);
    document.getElementById("lowDetail").textContent =
      "低1→低2 " + dirChar(ls[0]) + "  低2→低3 " + dirChar(ls[1]);

    var vc = document.getElementById("verdictChip");
    vc.className = "chip " + chip[0];
    vc.textContent = chip[1];
    document.getElementById("verdictText").textContent = text;
  }
  function clsChip(arr){
    if (arr.every(function(c){return c==="up";})) return "up";
    if (arr.every(function(c){return c==="down";})) return "down";
    if (arr.every(function(c){return c==="flat";})) return "flat";
    return "watch";
  }
  function dirChar(c){
    return c==="up" ? "↑" : (c==="down" ? "↓" : "→");
  }
  function setChip(id, text, cls){
    var el = document.getElementById(id);
    el.className = "chip " + cls;
    el.textContent = text;
  }

  function arrowMark(x, y, cls, label){
    var g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","cmp");
    var text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.textContent = label;
    text.setAttribute("x", x); text.setAttribute("y", y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("font-size","12");
    text.setAttribute("font-weight","700");
    text.setAttribute("fill", cls==="up" ? "#1f9d63" : (cls==="down" ? "#d1453a" : "#a19c8c"));
    var line = document.createElementNS("http://www.w3.org/2000/svg","line");
    var dir = cls==="up" ? -1 : (cls==="down" ? 1 : 0);
    line.setAttribute("x1", x); line.setAttribute("y1", y + (cls==="flat" ? -8 : 0));
    line.setAttribute("x2", x); line.setAttribute("y2", y + (cls==="flat" ? 8 : 0) + dir*10);
    line.setAttribute("stroke", cls==="up" ? "#1f9d63" : (cls==="down" ? "#d1453a" : "#a19c8c"));
    line.setAttribute("stroke-width","2");
    line.setAttribute("marker-end", cls==="up" ? "url(#arrUp)" : (cls==="down" ? "url(#arrDn)" : ""));
    g.appendChild(line); g.appendChild(text);
    return g;
  }

  function draw(){
    var NS = "http://www.w3.org/2000/svg";
    svg.innerHTML = "";
    var defs = document.createElementNS(NS,"defs");
    defs.innerHTML =
      '<marker id="arrUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 8 L5 0 L10 8" fill="none" stroke="#1f9d63" stroke-width="1.8"/></marker>' +
      '<marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 2 L5 10 L10 2" fill="none" stroke="#d1453a" stroke-width="1.8"/></marker>';
    svg.appendChild(defs);

    // 网格
    var r = yRange();
    for (var k=0;k<=5;k++){
      var v = r.min + (r.max-r.min)*k/5, yy = yOf(v);
      var line = document.createElementNS(NS,"line");
      line.setAttribute("x1",padL); line.setAttribute("y1",yy);
      line.setAttribute("x2",W-padR); line.setAttribute("y2",yy);
      line.setAttribute("stroke","#e9e6dd"); line.setAttribute("stroke-width","1");
      svg.appendChild(line);
      var t = document.createElementNS(NS,"text");
      t.textContent = v.toFixed(2);
      t.setAttribute("x",padL-8); t.setAttribute("y",yy+3);
      t.setAttribute("text-anchor","end"); t.setAttribute("font-size","10");
      t.setAttribute("fill","#a19c8c");
      svg.appendChild(t);
    }

    // 连线
    var poly = document.createElementNS(NS,"polyline");
    var pts = PTS.map(function(p){return (p.x)+","+(yOf(p.price).toFixed(1));}).join(" ");
    poly.setAttribute("points",pts);
    poly.setAttribute("fill","none"); poly.setAttribute("stroke","#393735");
    poly.setAttribute("stroke-width","2.6"); poly.setAttribute("stroke-linejoin","round");
    poly.setAttribute("stroke-linecap","round");
    svg.appendChild(poly);

    // 比较箭头（同类型相邻点）
    var pairs = [[1,3,"H"],[3,5,"H"],[0,2,"L"],[2,4,"L"]];
    pairs.forEach(function(pr){
      var a = PTS[pr[0]], b = PTS[pr[1]], c = cls(a,b);
      var mx = (a.x+b.x)/2;
      if (pr[2]==="H"){
        var topY = Math.min(yOf(a.price), yOf(b.price));
        svg.appendChild(arrowMark(mx, topY-16, c, c==="up"?"抬高":(c==="down"?"降低":"接近")));
      } else {
        var botY = Math.max(yOf(a.price), yOf(b.price));
        svg.appendChild(arrowMark(mx, botY+24, c, c==="up"?"抬高":(c==="down"?"降低":"接近")));
      }
    });

    // 点
    PTS.forEach(function(p){
      var yy = yOf(p.price);
      var g = document.createElementNS(NS,"g");
      g.setAttribute("class","drag-pt");
      g.setAttribute("data-id",p.id);
      var c1 = document.createElementNS(NS,"circle");
      c1.setAttribute("cx",p.x); c1.setAttribute("cy",yy);
      c1.setAttribute("r",9);
      c1.setAttribute("fill", p.type==="H" ? "#d97757" : "#2f8f6b");
      c1.setAttribute("fill-opacity","0.16");
      c1.setAttribute("stroke", p.type==="H" ? "#d97757" : "#2f8f6b");
      c1.setAttribute("stroke-width","2");
      var c2 = document.createElementNS(NS,"circle");
      c2.setAttribute("cx",p.x); c2.setAttribute("cy",yy);
      c2.setAttribute("r",5);
      c2.setAttribute("fill", p.type==="H" ? "#d97757" : "#2f8f6b");
      c2.setAttribute("stroke","#fff"); c2.setAttribute("stroke-width","1.4");
      var t = document.createElementNS(NS,"text");
      t.textContent = p.label;
      t.setAttribute("x",p.x); t.setAttribute("y", yy + (p.type==="H" ? -14 : 24));
      t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","11");
      t.setAttribute("font-weight","700"); t.setAttribute("fill","#5f5b55");
      g.appendChild(c1); g.appendChild(c2); g.appendChild(t);
      svg.appendChild(g);
    });
    verdictText();
  }

  // 拖动
  var drag = null;
  svg.addEventListener("pointerdown", function(e){
    var g = e.target.closest(".drag-pt");
    if (!g) return;
    var id = g.getAttribute("data-id");
    var p = PTS.find(function(x){return x.id===id;});
    drag = { id:id, lastY:e.clientY, p:p };
    g.classList.add("dragging");
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", function(e){
    if (!drag) return;
    var rect = svg.getBoundingClientRect();
    var scale = H / rect.height;
    var yy = (e.clientY - rect.top) * scale;
    yy = Math.max(padT+4, Math.min(H-padB-4, yy));
    drag.p.price = priceOf(yy);
    draw();
  });
  function endDrag(){ if (drag){ drag = null; } draw(); }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  document.getElementById("resetBtn").addEventListener("click", function(){
    PTS.forEach(function(p,i){ p.price = DEFAULTS[i]; });
    draw();
  });

  draw();
})();
</script>
</body>
</html>
