<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">证据是什么：小高点被收盘突破</title>
  <desc id="desc">价格跌到防守位后来回晃，晃出一个小高点；后面一根K线收盘站上这个小高点，就是确认点。</desc>
  <defs>
    <style>
      .axis{stroke:#d8d4ca;stroke-width:1.2}
      .key{stroke:#b8790a;stroke-width:2.2;stroke-dasharray:9 8}
      .guide{stroke:#1f9d63;stroke-width:1.8;stroke-dasharray:5 6}
      .up{fill:#fff;stroke:#d97757;stroke-width:2}
      .up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}
      .down{fill:#e8e5db;stroke:#747069;stroke-width:2}
      .down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}
      .trend{fill:none;stroke:#181817;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#181817;stroke:#fff;stroke-width:4}
      .hi{fill:#d97757;stroke:#fff;stroke-width:4}
      .ok{fill:#1f9d63;stroke:#fff;stroke-width:4}
      .label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:24px;font-weight:700;fill:#181817}
      .tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:19px;font-weight:700;fill:#181817}
      .tag-amber{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#8a5a06}
      .tag-green{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#15734a}
      .white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .white-note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:450;fill:#e9e6dd}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#fff"/>
  <g transform="translate(96 60)">
    <text class="label" x="0" y="0">买入例子：小高点被突破，才算确认</text>
    <line class="axis" x1="4" y1="330" x2="1030" y2="330"/>
    <line class="key" x1="4" y1="300" x2="1030" y2="300"/>
    <text class="tag-amber" x="12" y="292">防守位</text>
    <line class="guide" x1="350" y1="210" x2="720" y2="210"/>
    <g>
      <line class="down-wick" x1="30" y1="70" x2="30" y2="150"/><rect class="down" x="19" y="96" width="22" height="32" rx="3"/>
      <line class="down-wick" x1="90" y1="130" x2="90" y2="210"/><rect class="down" x="79" y="156" width="22" height="34" rx="3"/>
      <line class="down-wick" x1="150" y1="190" x2="150" y2="270"/><rect class="down" x="139" y="216" width="22" height="34" rx="3"/>
      <line class="down-wick" x1="210" y1="250" x2="210" y2="300"/><rect class="down" x="199" y="270" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="270" y1="240" x2="270" y2="292"/><rect class="up" x="259" y="254" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="330" y1="216" x2="330" y2="266"/><rect class="up" x="319" y="230" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="390" y1="210" x2="390" y2="252"/><rect class="up" x="379" y="222" width="22" height="20" rx="3"/>
      <line class="down-wick" x1="450" y1="222" x2="450" y2="270"/><rect class="down" x="439" y="234" width="22" height="24" rx="3"/>
      <line class="down-wick" x1="510" y1="238" x2="510" y2="284"/><rect class="down" x="499" y="250" width="22" height="22" rx="3"/>
      <line class="up-wick" x1="570" y1="226" x2="570" y2="268"/><rect class="up" x="559" y="238" width="22" height="20" rx="3"/>
      <line class="up-wick" x1="630" y1="214" x2="630" y2="260"/><rect class="up" x="619" y="226" width="22" height="22" rx="3"/>
      <line class="up-wick" x1="690" y1="170" x2="690" y2="230"/><rect class="up" x="679" y="188" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="750" y1="120" x2="750" y2="182"/><rect class="up" x="739" y="140" width="22" height="30" rx="3"/>
    </g>
    <polyline class="trend" points="30,110 150,270 330,216 450,246 630,214 750,120"/>
    <path d="M330 202 L342 218 L318 218 Z" fill="#d97757" stroke="#fff" stroke-width="1.2"/>
    <circle class="ok" cx="690" cy="200" r="9"/>
    <text class="tag" x="270" y="190">①小高点</text>
    <text class="note tag-amber" x="150" y="308">②回踩不破防守位</text>
    <text class="tag-green" x="706" y="196">③收盘站上①→确认点</text>
    <rect x="700" y="290" width="330" height="76" rx="20" fill="#181817"/>
    <text class="white" x="726" y="324">证据＝收盘价站上这个小高点</text>
    <text class="white-note" x="726" y="350">卖出反过来：收盘价跌破一个小低点</text>
  </g>
</svg>
