<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <rect width="920" height="480" fill="#ffffff"/>
  <text x="40" y="52" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#111827">上升趋势：重点看下方防守区</text>
  <text x="40" y="88" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#6b7280">高点抬高、低点抬高；最近一次重要回调低点，是判断上涨结构是否还在的关键位置。</text>

  <g transform="translate(60 115)">
    <rect x="0" y="0" width="800" height="300" rx="16" fill="#f8fafc" stroke="#dbe3ef"/>
    <line x1="50" y1="250" x2="760" y2="250" stroke="#e5e7eb"/>
    <line x1="50" y1="190" x2="760" y2="190" stroke="#e5e7eb"/>
    <line x1="50" y1="130" x2="760" y2="130" stroke="#e5e7eb"/>
    <line x1="50" y1="70" x2="760" y2="70" stroke="#e5e7eb"/>

    <rect x="455" y="175" width="190" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="485" y="204" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#15803d">防守区</text>

    <polyline points="70,235 180,150 280,205 400,105 535,195 690,65" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="235" r="7" fill="#2563eb"/>
    <circle cx="180" cy="150" r="7" fill="#ef4444"/>
    <circle cx="280" cy="205" r="7" fill="#16a34a"/>
    <circle cx="400" cy="105" r="7" fill="#ef4444"/>
    <circle cx="535" cy="195" r="8" fill="#16a34a"/>
    <circle cx="690" cy="65" r="7" fill="#ef4444"/>

    <text x="150" y="135" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#991b1b">高点1</text>
    <text x="370" y="90" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#991b1b">高点2更高</text>
    <text x="248" y="232" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#166534">低点1</text>
    <text x="505" y="242" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#166534">低点2更高</text>
  </g>
</svg>
