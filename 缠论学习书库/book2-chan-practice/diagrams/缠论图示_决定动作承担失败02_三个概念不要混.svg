<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">三个概念不要混：关键线、判断失败线、实际止损执行价</title>
  <desc id="desc">关键线是防守位本身；判断失败线由理由推导，这里恰好和关键线重合在10元；实际止损执行价留出缓冲，设在9.8元，防止毛刺扫损。</desc>
  <defs>
    <style>
      .axis{stroke:#d8d4ca;stroke-width:1.2}
      .key{stroke:#747069;stroke-width:2.2;stroke-dasharray:9 8}
      .exec{stroke:#d97757;stroke-width:2.2;stroke-dasharray:5 6}
      .up{fill:#fff;stroke:#d97757;stroke-width:2}
      .up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}
      .down{fill:#e8e5db;stroke:#747069;stroke-width:2}
      .down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}
      .trend{fill:none;stroke:#181817;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#181817;stroke:#fff;stroke-width:4}
      .label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:24px;font-weight:700;fill:#181817}
      .tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#181817}
      .tag-grey{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#5f5b55}
      .tag-red{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#a8471f}
      .white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .white-note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:450;fill:#e9e6dd}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#fff"/>
  <g transform="translate(96 56)">
    <text class="label" x="0" y="0">防守位C＝10元：关键线、失败线、执行价，三个位置</text>
    <line class="axis" x1="4" y1="330" x2="1030" y2="330"/>
    <line class="key" x1="4" y1="280" x2="1030" y2="280"/>
    <line class="exec" x1="4" y1="310" x2="1030" y2="310"/>
    <text class="tag-grey" x="560" y="272">关键线／判断失败线＝10元（这里两者重合）</text>
    <text class="tag-red" x="560" y="326">实际止损执行价＝9.8元（留一点缓冲）</text>
    <g>
      <line class="down-wick" x1="30" y1="60" x2="30" y2="140"/><rect class="down" x="19" y="80" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="90" y1="110" x2="90" y2="190"/><rect class="down" x="79" y="130" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="150" y1="160" x2="150" y2="240"/><rect class="down" x="139" y="180" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="210" y1="220" x2="210" y2="270"/><rect class="down" x="199" y="230" width="22" height="30" rx="3"/>
      <line class="down-wick" x1="270" y1="240" x2="270" y2="300"/><rect class="down" x="259" y="250" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="330" y1="230" x2="330" y2="270"/><rect class="up" x="319" y="240" width="22" height="20" rx="3"/>
      <line class="up-wick" x1="390" y1="190" x2="390" y2="250"/><rect class="up" x="379" y="210" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="450" y1="150" x2="450" y2="210"/><rect class="up" x="439" y="170" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="510" y1="110" x2="510" y2="170"/><rect class="up" x="499" y="130" width="22" height="30" rx="3"/>
    </g>
    <polyline class="trend" points="30,60 150,240 270,300 390,190 510,110"/>
    <circle class="dot" cx="270" cy="300" r="8"/>
    <path d="M278 292 C 360 220, 480 170, 552 148" fill="none" stroke="#a8471f" stroke-width="1.4" stroke-dasharray="3 4"/>
    <text class="tag-red" x="560" y="128">毛刺：碰到10元一下</text>
    <text class="tag-red" x="560" y="150">没到9.8元，不算跌破</text>
    <rect x="700" y="360" width="330" height="76" rx="20" fill="#181817"/>
    <text class="white" x="726" y="394">关键线／失败线可能重合</text>
    <text class="white-note" x="726" y="420">执行价留缓冲，防毛刺扫损</text>
  </g>
</svg>
