<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .panel{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .txt{font:800 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .label{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .grid{stroke:#e8eef7;stroke-width:1}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .future{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:6 6}
      .oldGuard{stroke:#f59e0b;stroke-width:2.8}
      .pressure{stroke:#2563eb;stroke-width:3}
      .newGuard{stroke:#16a34a;stroke-width:2.8}
      .fail{stroke:#dc2626;stroke-width:2.6}
      .pressureBand{fill:rgba(37,99,235,.08);stroke:#2563eb;stroke-width:1.5;stroke-dasharray:6 6}
      .weakBand{fill:rgba(220,38,38,.05);stroke:#dc2626;stroke-width:1.3;stroke-dasharray:6 6}
      .up{fill:#dc2626;stroke:#dc2626}
      .down{fill:#16a34a;stroke:#16a34a}
      .dotH{fill:#fee2e2;stroke:#dc2626;stroke-width:3}
      .dotL{fill:#dcfce7;stroke:#16a34a;stroke-width:3}
      .dotO{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}
      .dotB{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .dotG{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}
      .dotR{fill:#fef2f2;stroke:#dc2626;stroke-width:3}
      .tagG{fill:#f0fdf4;stroke:#16a34a}
      .tagB{fill:#eff6ff;stroke:#2563eb}
      .tagO{fill:#fff7ed;stroke:#f59e0b}
      .tagR{fill:#fef2f2;stroke:#dc2626}
    </style>
  </defs>

  <rect class="bg" width="1400" height="940"/>
  <text class="title" x="64" y="70">观察区关键线 05：破防后接回，新压力位怎么画？</text>
  <text class="sub" x="64" y="102">破防后，原防守位不再是买点。新的关键线来自“破防后反弹失败的小高点”；突破它才是普通修复，回踩守住再上才是稳健修复。</text>

  <rect class="panel" x="64" y="136" width="1272" height="548" rx="10"/>
  <text class="txt" x="96" y="176">一、破防后先换逻辑：从“守防守位”切到“突破新压力位”</text>
  <text class="small" x="96" y="204">如果已经有效跌破原防守位，就不能把“重新接近原防守位”当买点；要等右侧重新修复。</text>

  <!-- grid -->
  <g>
    <line class="grid" x1="112" y1="564" x2="1288" y2="564"/>
    <line class="grid" x1="112" y1="508" x2="1288" y2="508"/>
    <line class="grid" x1="112" y1="452" x2="1288" y2="452"/>
    <line class="grid" x1="112" y1="396" x2="1288" y2="396"/>
    <line class="grid" x1="112" y1="340" x2="1288" y2="340"/>
    <line class="grid" x1="112" y1="284" x2="1288" y2="284"/>
  </g>

  <!-- levels -->
  <line class="oldGuard" x1="112" y1="392" x2="1288" y2="392"/>
  <text class="tiny" x="1112" y="384">原防守位：已失效，不能直接当买点</text>
  <rect class="weakBand" x="112" y="392" width="1176" height="168" rx="8"/>
  <text class="tiny" x="1120" y="548">破防后的弱势区</text>

  <rect class="pressureBand" x="596" y="304" width="692" height="44" rx="8"/>
  <line class="pressure" x1="596" y1="324" x2="1288" y2="324"/>
  <text class="tiny" x="1032" y="316">新压力位 = 破防后反弹失败小高点</text>
  <text class="tiny" x="1032" y="344">压力位下方：只观察，不接回</text>

  <line class="newGuard" x1="972" y1="424" x2="1288" y2="424"/>
  <text class="tiny" x="1092" y="444">修复后的新防守候选：回踩低点</text>
  <line class="fail" x1="596" y1="568" x2="1288" y2="568"/>
  <text class="tiny" x="1040" y="588">再创新低：接回观察失败</text>

  <!-- candles -->
  <g>
    <!-- old uptrend and break -->
    <line class="up" x1="132" y1="496" x2="132" y2="580"/><rect class="up" x="120" y="524" width="24" height="32"/>
    <line class="up" x1="188" y1="416" x2="188" y2="516"/><rect class="up" x="176" y="452" width="24" height="44"/>
    <line class="down" x1="244" y1="444" x2="244" y2="536"/><rect class="down" x="232" y="472" width="24" height="38"/>
    <line class="up" x1="300" y1="344" x2="300" y2="468"/><rect class="up" x="288" y="384" width="24" height="56"/>
    <line class="down" x1="356" y1="388" x2="356" y2="520"/><rect class="down" x="344" y="428" width="24" height="58"/>
    <line class="up" x1="412" y1="292" x2="412" y2="420"/><rect class="up" x="400" y="332" width="24" height="60"/>
    <line class="down" x1="468" y1="348" x2="468" y2="464"/><rect class="down" x="456" y="384" width="24" height="52"/>
    <line class="down" x1="524" y1="392" x2="524" y2="540"/><rect class="down" x="512" y="432" width="24" height="78"/>
    <!-- broken and rebound -->
    <line class="down" x1="580" y1="468" x2="580" y2="588"/><rect class="down" x="568" y="500" width="24" height="62"/>
    <line class="up" x1="636" y1="456" x2="636" y2="560"/><rect class="up" x="624" y="492" width="24" height="42"/>
    <line class="up" x1="692" y1="380" x2="692" y2="508"/><rect class="up" x="680" y="424" width="24" height="58"/>
    <line class="down" x1="748" y1="324" x2="748" y2="480"/><rect class="down" x="736" y="364" width="24" height="82"/>
    <line class="down" x1="804" y1="376" x2="804" y2="532"/><rect class="down" x="792" y="420" width="24" height="80"/>
    <line class="up" x1="860" y1="436" x2="860" y2="552"/><rect class="up" x="848" y="472" width="24" height="48"/>
    <line class="down" x1="916" y1="420" x2="916" y2="568"/><rect class="down" x="904" y="464" width="24" height="76"/>
    <!-- repair -->
    <line class="up" x1="972" y1="408" x2="972" y2="516"/><rect class="up" x="960" y="444" width="24" height="50"/>
    <line class="up" x1="1028" y1="312" x2="1028" y2="452"/><rect class="up" x="1016" y="352" width="24" height="70"/>
    <line class="down" x1="1084" y1="344" x2="1084" y2="448"/><rect class="down" x="1072" y="376" width="24" height="44"/>
    <line class="down" x1="1140" y1="384" x2="1140" y2="444"/><rect class="down" x="1128" y="404" width="24" height="24"/>
    <line class="up" x1="1196" y1="336" x2="1196" y2="432"/><rect class="up" x="1184" y="368" width="24" height="42"/>
    <line class="up" x1="1252" y1="252" x2="1252" y2="368"/><rect class="up" x="1240" y="288" width="24" height="52"/>
  </g>

  <!-- swing line -->
  <path class="price" d="M132 556 L188 416 L244 510 L300 344 L356 486 L412 292 L468 436 L580 562 L748 324 L916 540 L972 444 L1028 312 L1140 420 L1196 336 L1252 252"/>

  <!-- key dots -->
  <circle class="dotL" cx="468" cy="436" r="10"/>
  <text class="tiny" x="424" y="460">原防守低点</text>
  <circle class="dotR" cx="580" cy="562" r="11"/>
  <text class="tiny" x="540" y="604">① 有效破防</text>
  <circle class="dotB" cx="748" cy="324" r="11"/>
  <text class="tiny" x="688" y="304">② 反弹失败小高点</text>
  <circle class="dotO" cx="916" cy="540" r="10"/>
  <text class="tiny" x="864" y="528">③ 回落验证压力</text>
  <circle class="dotO" cx="972" cy="444" r="9"/>
  <text class="tiny" x="928" y="424">仍在压力下方</text>
  <circle class="dotB" cx="1028" cy="312" r="11"/>
  <text class="tiny" x="976" y="292">④ 普通修复：收盘突破</text>
  <circle class="dotG" cx="1140" cy="420" r="10"/>
  <text class="tiny" x="1088" y="476">⑤ 回踩守住</text>
  <circle class="dotG" cx="1252" cy="252" r="11"/>
  <text class="tiny" x="1200" y="232">⑥ 稳健修复：再次向上</text>

  <!-- callouts -->
  <rect class="tagR" x="120" y="560" width="332" height="72" rx="8"/>
  <text class="label" x="140" y="588" fill="#b91c1c">破防后：旧逻辑结束</text>
  <text class="small" x="140" y="614">原防守位只说明哪里坏了，不能再当接回买点。</text>

  <rect class="tagB" x="532" y="216" width="360" height="76" rx="8"/>
  <text class="label" x="552" y="244" fill="#1d4ed8">新压力位怎么来？</text>
  <text class="small" x="552" y="270">破防后反弹到 748，随后 916 回落，证明 748 压住过价格。</text>

  <rect class="tagG" x="940" y="552" width="344" height="76" rx="8"/>
  <text class="label" x="960" y="580" fill="#15803d">接回看两层确认</text>
  <text class="small" x="960" y="606">突破新压力是普通修复；回踩守住再上是稳健修复。</text>

  <!-- bottom explanation cards -->
  <g transform="translate(64 724)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第一步：确认破防有效</text>
    <text class="small" x="24" y="68">收盘跌破原防守位，并且没有快速收回。</text>
    <text class="tiny" x="24" y="100">这时不能再按“上升回调低吸”处理。</text>
    <text class="tiny" x="24" y="124">先退出/降风险，等待右侧修复。</text>
  </g>

  <g transform="translate(502 724)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第二步：画破防后压力位</text>
    <text class="small" x="24" y="68">找破防后第一次/最近一次反弹失败小高点。</text>
    <text class="tiny" x="24" y="100">先反弹，后回落，才确认这个高点是压力。</text>
    <text class="tiny" x="24" y="124">用最高价画水平线，不画斜线。</text>
  </g>

  <g transform="translate(940 724)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第三步：从观察到接回</text>
    <text class="small" x="24" y="68">压力下方只是观察；收盘突破才是普通修复。</text>
    <text class="tiny" x="24" y="100">稳健接回：突破后回踩不破，再次向上。</text>
    <text class="tiny" x="24" y="124">失败线：跌破修复回踩低点，或再创新低。</text>
  </g>

  <text class="tiny" x="64" y="908">学习用途，不构成投资建议。本图只讲结构识别：真实操作还要结合级别、波动、仓位和个人风险承受能力。</text>
</svg>
