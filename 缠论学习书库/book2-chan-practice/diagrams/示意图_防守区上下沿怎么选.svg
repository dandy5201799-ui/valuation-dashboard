<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .bg { fill: #16162a; }
      .grid { stroke: #2a2a40; stroke-width: 1; }
      .yang { fill: #4ade80; }
      .yin { fill: #f87171; }
      .wick { stroke-width: 2; }
      .lower-line { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 8 5; }
      .upper-line { stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 8 5; }
      .zone { fill: rgba(251, 191, 36, 0.12); stroke: rgba(251, 191, 36, 0.4); stroke-width: 1; stroke-dasharray: 4 3; }
      .label { fill: #e2e8f0; font-size: 14px; }
      .label-sm { fill: #94a3b8; font-size: 12px; }
      .title { fill: #f1f5f9; font-size: 20px; font-weight: bold; }
      .lower-label { fill: #f87171; font-size: 14px; font-weight: bold; }
      .upper-label { fill: #60a5fa; font-size: 14px; font-weight: bold; }
      .c-label { fill: #fbbf24; font-size: 14px; font-weight: bold; }
      .brace { stroke: #fbbf24; stroke-width: 1.5; fill: none; }
      .arrow { stroke: #fbbf24; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect class="bg" width="820" height="560"/>

  <!-- 标题 -->
  <text class="title" x="40" y="40">防守区：上沿与下沿怎么选</text>
  <text class="label-sm" x="40" y="62">上升趋势回调中，找到前一个低点后，防守区就是这个低点附近的一小块价格范围</text>

  <!-- 网格线 -->
  <line class="grid" x1="80" y1="100" x2="760" y2="100"/>
  <line class="grid" x1="80" y1="180" x2="760" y2="180"/>
  <line class="grid" x1="80" y1="260" x2="760" y2="260"/>
  <line class="grid" x1="80" y1="340" x2="760" y2="340"/>
  <line class="grid" x1="80" y1="420" x2="760" y2="420"/>

  <!-- 价格标签 -->
  <text class="label-sm" x="50" y="105">115</text>
  <text class="label-sm" x="50" y="185">110</text>
  <text class="label-sm" x="50" y="265">105</text>
  <text class="label-sm" x="50" y="345">100</text>
  <text class="label-sm" x="50" y="425">95</text>

  <!-- ========== K线 ========== -->
  <!-- 价格转y: y = 100 + (115-price)*16, 范围95~115 -->
  <!-- K线宽24, x中心: 130,180,230,280,330,380,430,480,530,580,630 -->

  <!-- K1 阳 开100收105高106低99 -->
  <line class="wick yang" x1="130" y1="244" x2="130" y2="356"/>
  <rect class="yang" x="118" y="260" width="24" height="80"/>

  <!-- K2 阳 开105收110高112低104 -->
  <line class="wick yang" x1="180" y1="148" x2="180" y2="276"/>
  <rect class="yang" x="168" y="164" width="24" height="96"/>

  <!-- K3 阳 开110收114高115低109 -->
  <line class="wick yang" x1="230" y1="100" x2="230" y2="196"/>
  <rect class="yang" x="218" y="116" width="24" height="64"/>

  <!-- K4 阴 开114收110高115低108 -->
  <line class="wick yin" x1="280" y1="100" x2="280" y2="212"/>
  <rect class="yin" x="268" y="116" width="24" height="80"/>

  <!-- K5 阴 开110收105高111低103 -->
  <line class="wick yin" x1="330" y1="164" x2="330" y2="292"/>
  <rect class="yin" x="318" y="180" width="24" height="96"/>

  <!-- K6 阴 C点 开105收100.5高106低99.2 -->
  <line class="wick yin" x1="380" y1="244" x2="380" y2="352.8"/>
  <rect class="yin" x="368" y="260" width="24" height="76"/>

  <!-- K7 阳 开100.5收103高104.5低100 -->
  <line class="wick yang" x1="430" y1="268" x2="430" y2="340"/>
  <rect class="yang" x="418" y="284" width="24" height="44"/>

  <!-- K8 阴 开103收100.5高105.2低99.5 -->
  <line class="wick yin" x1="480" y1="256.8" x2="480" y2="348"/>
  <rect class="yin" x="468" y="284" width="24" height="52"/>

  <!-- K9 阳 开100.5收104高104.8低99.8 -->
  <line class="wick yang" x1="530" y1="263.2" x2="530" y2="343.2"/>
  <rect class="yang" x="518" y="276" width="24" height="56"/>

  <!-- K10 阳 开104收110高112低103 -->
  <line class="wick yang" x1="580" y1="148" x2="580" y2="292"/>
  <rect class="yang" x="568" y="164" width="24" height="112"/>

  <!-- K11 阳 开110收114高115低109 -->
  <line class="wick yang" x1="630" y1="100" x2="630" y2="196"/>
  <rect class="yang" x="618" y="116" width="24" height="64"/>

  <!-- ========== 防守区阴影 ========== -->
  <!-- 底部K线组 K6-K9, x从368到542, 上沿y=256.8, 下沿y=352.8 -->
  <rect class="zone" x="360" y="256.8" width="190" height="96" rx="4"/>

  <!-- ========== 下沿（红色虚线） ========== -->
  <line class="lower-line" x1="100" y1="352.8" x2="700" y2="352.8"/>
  <text class="lower-label" x="710" y="357">下沿</text>
  <text class="label-sm" x="710" y="375">= 低点C的最低价</text>

  <!-- ========== 上沿（蓝色虚线） ========== -->
  <line class="upper-line" x1="100" y1="256.8" x2="700" y2="256.8"/>
  <text class="upper-label" x="710" y="261">上沿</text>
  <text class="label-sm" x="710" y="279">= 低点附近几根K线的最高价</text>

  <!-- ========== C点标注 ========== -->
  <circle cx="380" cy="352.8" r="5" fill="#fbbf24" stroke="#16162a" stroke-width="2"/>
  <line class="arrow" x1="320" y1="440" x2="375" y2="358"/>
  <text class="c-label" x="180" y="455">有效低点C</text>
  <text class="label-sm" x="180" y="473">（前一个低点，第二章已选出）</text>
  <text class="label-sm" x="180" y="491">最低价 99.2 → 就是下沿</text>

  <!-- ========== 上沿来源标注 ========== -->
  <circle cx="480" cy="256.8" r="5" fill="#60a5fa" stroke="#16162a" stroke-width="2"/>
  <line class="arrow" x1="560" y1="130" x2="485" y2="252"/>
  <text class="upper-label" x="570" y="125">上沿从哪来？</text>
  <text class="label-sm" x="570" y="143">K8（底部争夺中）的最高价 105.2</text>
  <text class="label-sm" x="570" y="161">是低点附近几根K线里最高的</text>

  <!-- ========== 底部K线组大括号 ========== -->
  <path class="brace" d="M 360 520 Q 360 535 375 535 L 535 535 Q 550 535 550 520"/>
  <text class="c-label" x="385" y="553">低点附近的K线（K6～K9）</text>
  <text class="label-sm" x="395" y="553" transform="translate(0,0)"></text>

  <!-- ========== 防守区标注 ========== -->
  <text class="label" x="400" y="310" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">防守区</text>
  <text class="label-sm" x="400" y="328" text-anchor="middle" fill="#fbbf24">99.2 ～ 105.2</text>

  <!-- ========== 说明文字 ========== -->
  <rect x="40" y="510" width="280" height="40" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text class="label-sm" x="55" y="530">价格进入防守区 → 开始观察</text>
  <text class="label-sm" x="55" y="546">有效跌破下沿 → 防守失败</text>

</svg>
