<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .panel{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .txt{font:800 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .label{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .grid{stroke:#e8eef7;stroke-width:1}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .future{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:6 6}
      .upper{stroke:#2563eb;stroke-width:2.6}
      .lower{stroke:#16a34a;stroke-width:3}
      .lowerBand{fill:rgba(22,163,74,.10);stroke:#16a34a;stroke-width:1.5;stroke-dasharray:6 6}
      .upperBand{fill:rgba(37,99,235,.06);stroke:#2563eb;stroke-width:1.4;stroke-dasharray:6 6}
      .repair{stroke:#2563eb;stroke-width:2.5}
      .fail{stroke:#dc2626;stroke-width:2.6}
      .up{fill:#dc2626;stroke:#dc2626}
      .down{fill:#16a34a;stroke:#16a34a}
      .dotH{fill:#fee2e2;stroke:#dc2626;stroke-width:3}
      .dotL{fill:#dcfce7;stroke:#16a34a;stroke-width:3}
      .dotO{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}
      .dotB{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .dotR{fill:#fef2f2;stroke:#dc2626;stroke-width:3}
      .tagG{fill:#f0fdf4;stroke:#16a34a}
      .tagB{fill:#eff6ff;stroke:#2563eb}
      .tagO{fill:#fff7ed;stroke:#f59e0b}
      .tagR{fill:#fef2f2;stroke:#dc2626}
      .tagGray{fill:#f8fafc;stroke:#cbd5e1}
    </style>
  </defs>

  <rect class="bg" width="1400" height="940"/>
  <text class="title" x="64" y="70">观察区关键线 03：震荡下沿怎么画？</text>
  <text class="sub" x="64" y="102">震荡下沿不是“右侧最低点”，而是至少两次相近低点守住后形成的区域。第三次靠近下沿只是观察，收回并突破修复小高点才是确认。</text>

  <rect class="panel" x="64" y="136" width="1272" height="524" rx="10"/>
  <text class="txt" x="96" y="176">一、震荡下沿：由两次相近低点确认，不由单个最低点决定</text>
  <text class="small" x="96" y="204">先找上沿和下沿都比较稳定的横向波动；下沿看“多次跌到附近但跌不下去”的低点区域。</text>

  <!-- grid -->
  <g>
    <line class="grid" x1="112" y1="548" x2="1288" y2="548"/>
    <line class="grid" x1="112" y1="488" x2="1288" y2="488"/>
    <line class="grid" x1="112" y1="428" x2="1288" y2="428"/>
    <line class="grid" x1="112" y1="368" x2="1288" y2="368"/>
    <line class="grid" x1="112" y1="308" x2="1288" y2="308"/>
    <line class="grid" x1="112" y1="248" x2="1288" y2="248"/>
  </g>

  <!-- bands -->
  <rect class="upperBand" x="112" y="240" width="1176" height="48" rx="8"/>
  <line class="upper" x1="112" y1="264" x2="1288" y2="264"/>
  <text class="tiny" x="1120" y="256">震荡上沿区域</text>
  <rect class="lowerBand" x="112" y="484" width="1176" height="52" rx="8"/>
  <line class="lower" x1="112" y1="508" x2="1288" y2="508"/>
  <text class="tiny" x="1120" y="500">震荡下沿区域</text>
  <line class="fail" x1="760" y1="552" x2="1288" y2="552"/>
  <text class="tiny" x="1036" y="572">观察失效线：有效跌破下沿区</text>
  <line class="repair" x1="916" y1="412" x2="1288" y2="412"/>
  <text class="tiny" x="1032" y="404">修复小高点：收盘突破才是普通确认</text>

  <!-- candles -->
  <g>
    <line class="up" x1="132" y1="376" x2="132" y2="476"/><rect class="up" x="120" y="404" width="24" height="44"/>
    <line class="up" x1="188" y1="276" x2="188" y2="420"/><rect class="up" x="176" y="320" width="24" height="68"/>
    <line class="down" x1="244" y1="252" x2="244" y2="384"/><rect class="down" x="232" y="292" width="24" height="58"/>
    <line class="down" x1="300" y1="336" x2="300" y2="520"/><rect class="down" x="288" y="384" width="24" height="98"/>
    <line class="up" x1="356" y1="492" x2="356" y2="548"/><rect class="up" x="344" y="512" width="24" height="20"/>
    <line class="up" x1="412" y1="404" x2="412" y2="520"/><rect class="up" x="400" y="440" width="24" height="54"/>
    <line class="up" x1="468" y1="292" x2="468" y2="424"/><rect class="up" x="456" y="336" width="24" height="58"/>
    <line class="down" x1="524" y1="244" x2="524" y2="372"/><rect class="down" x="512" y="284" width="24" height="56"/>
    <line class="down" x1="580" y1="324" x2="580" y2="508"/><rect class="down" x="568" y="372" width="24" height="96"/>
    <line class="up" x1="636" y1="488" x2="636" y2="540"/><rect class="up" x="624" y="508" width="24" height="18"/>
    <line class="up" x1="692" y1="404" x2="692" y2="512"/><rect class="up" x="680" y="440" width="24" height="48"/>
    <line class="up" x1="748" y1="292" x2="748" y2="420"/><rect class="up" x="736" y="332" width="24" height="58"/>
    <line class="down" x1="804" y1="252" x2="804" y2="384"/><rect class="down" x="792" y="292" width="24" height="58"/>
    <line class="down" x1="860" y1="344" x2="860" y2="532"/><rect class="down" x="848" y="392" width="24" height="98"/>
    <line class="down" x1="916" y1="500" x2="916" y2="568"/><rect class="down" x="904" y="524" width="24" height="24"/>
    <line class="up" x1="972" y1="472" x2="972" y2="560"/><rect class="up" x="960" y="504" width="24" height="30"/>
    <line class="up" x1="1028" y1="396" x2="1028" y2="508"/><rect class="up" x="1016" y="432" width="24" height="54"/>
    <line class="up" x1="1084" y1="344" x2="1084" y2="456"/><rect class="up" x="1072" y="380" width="24" height="52"/>
    <line class="down" x1="1140" y1="356" x2="1140" y2="468"/><rect class="down" x="1128" y="392" width="24" height="48"/>
    <line class="up" x1="1196" y1="300" x2="1196" y2="424"/><rect class="up" x="1184" y="340" width="24" height="60"/>
  </g>

  <!-- swing -->
  <path class="price" d="M132 448 L244 252 L356 512 L524 244 L636 508 L804 252 L916 548 L972 504 L1028 396 L1084 344 L1140 432 L1196 300"/>

  <!-- dots -->
  <circle class="dotH" cx="244" cy="252" r="9"/>
  <text class="tiny" x="220" y="232">上沿1</text>
  <circle class="dotL" cx="356" cy="512" r="11"/>
  <text class="tiny" x="328" y="548">下沿1</text>
  <circle class="dotH" cx="524" cy="244" r="9"/>
  <text class="tiny" x="500" y="224">上沿2</text>
  <circle class="dotL" cx="636" cy="508" r="11"/>
  <text class="tiny" x="608" y="544">下沿2</text>
  <circle class="dotH" cx="804" cy="252" r="9"/>
  <text class="tiny" x="780" y="232">上沿3</text>
  <circle class="dotO" cx="916" cy="548" r="11"/>
  <text class="tiny" x="872" y="588">第三次靠近：观察</text>
  <circle class="dotO" cx="972" cy="504" r="9"/>
  <text class="tiny" x="940" y="488">收回下沿区</text>
  <circle class="dotB" cx="1028" cy="396" r="10"/>
  <text class="tiny" x="984" y="376">修复小高点</text>
  <circle class="dotB" cx="1084" cy="344" r="10"/>
  <text class="tiny" x="1048" y="324">普通确认</text>
  <circle class="dotB" cx="1196" cy="300" r="10"/>
  <text class="tiny" x="1152" y="280">后续延续</text>

  <!-- callouts -->
  <rect class="tagG" x="140" y="560" width="328" height="72" rx="8"/>
  <text class="label" x="160" y="588" fill="#15803d">下沿不是一个最低点</text>
  <text class="small" x="160" y="614">下沿1、下沿2 都在 508 附近，才形成“区域”。</text>

  <rect class="tagO" x="560" y="560" width="328" height="72" rx="8"/>
  <text class="label" x="580" y="588" fill="#b45309">第三次靠近下沿：只是观察</text>
  <text class="small" x="580" y="614">跌到下沿附近，不等于可以买；要看能否收回。</text>

  <rect class="tagB" x="932" y="560" width="336" height="72" rx="8"/>
  <text class="label" x="952" y="588" fill="#1d4ed8">普通确认在哪里？</text>
  <text class="small" x="952" y="614">收回区间后，收盘突破修复小高点，才是普通确认。</text>

  <!-- bottom explanation cards -->
  <g transform="translate(64 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第一步：先确认震荡区间</text>
    <text class="small" x="24" y="68">上沿多次压住，下沿多次守住。</text>
    <text class="tiny" x="24" y="100">只有一个低点，不叫下沿；只有一个高点，不叫上沿。</text>
    <text class="tiny" x="24" y="124">上下沿都稳定，才按震荡逻辑处理。</text>
  </g>

  <g transform="translate(502 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第二步：下沿画成区域</text>
    <text class="small" x="24" y="68">用两次以上相近低点画出下沿区。</text>
    <text class="tiny" x="24" y="100">右侧更低的单点，不能直接替代旧下沿。</text>
    <text class="tiny" x="24" y="124">如果有效跌破下沿区，观察失效。</text>
  </g>

  <g transform="translate(940 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第三步：从观察到确认</text>
    <text class="small" x="24" y="68">低吸确认不是碰下沿，而是收回后转强。</text>
    <text class="tiny" x="24" y="100">普通确认：重新站回区间，并突破修复小高点。</text>
    <text class="tiny" x="24" y="124">稳健确认：之后回踩不跌回下沿，再次向上。</text>
  </g>

  <text class="tiny" x="64" y="908">学习用途，不构成投资建议。本图只讲结构识别：真正操作还要结合级别、波动、仓位和个人风险承受能力。</text>
</svg>
