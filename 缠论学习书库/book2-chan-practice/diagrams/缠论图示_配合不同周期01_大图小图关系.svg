<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">大图小图关系</title>
  <desc id="desc">同一段走势在日线里是一段上升趋势中的回调，在 30 分钟图里会展开成几次涨跌。</desc>
  <defs><style>
    .axis{stroke:#d8d4ca;stroke-width:1.2}.box{fill:none;stroke:#d97757;stroke-width:1.7;stroke-dasharray:8 8}.up{fill:#fff;stroke:#d97757;stroke-width:2}.up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}.down{fill:#e8e5db;stroke:#747069;stroke-width:2}.down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}.trend{fill:none;stroke:#181817;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:23px;font-weight:700;fill:#181817}.tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#181817}.note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:500;fill:#747069}.white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
  </style></defs>
  <rect width="1200" height="620" fill="#fff"/>
  <g transform="translate(70 78)">
    <text class="label" x="70" y="28">大图：日线</text><text class="tag" x="396" y="28">看整体</text>
    <line class="axis" x1="40" y1="382" x2="500" y2="382"/><line class="axis" x1="40" y1="70" x2="40" y2="382"/>
    <rect class="box" x="286" y="154" width="142" height="190" rx="18"/>
    <g>
      <line class="up-wick" x1="76" y1="286" x2="76" y2="352"/><rect class="up" x="65" y="312" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="122" y1="220" x2="122" y2="306"/><rect class="up" x="111" y="254" width="22" height="32" rx="3"/>
      <line class="up-wick" x1="168" y1="132" x2="168" y2="236"/><rect class="up" x="157" y="172" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="214" y1="190" x2="214" y2="294"/><rect class="down" x="203" y="222" width="22" height="40" rx="3"/>
      <line class="up-wick" x1="260" y1="166" x2="260" y2="260"/><rect class="up" x="249" y="202" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="306" y1="96" x2="306" y2="204"/><rect class="up" x="295" y="138" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="352" y1="162" x2="352" y2="282"/><rect class="down" x="341" y="198" width="22" height="48" rx="3"/>
      <line class="down-wick" x1="398" y1="240" x2="398" y2="344"/><rect class="down" x="387" y="272" width="22" height="40" rx="3"/>
      <line class="up-wick" x1="444" y1="204" x2="444" y2="306"/><rect class="up" x="433" y="244" width="22" height="38" rx="3"/>
    </g>
    <polyline class="trend" points="76,352 168,132 214,294 306,96 398,344 444,204"/>
  </g>
  <path d="M566 286 C604 286 604 286 642 286" fill="none" stroke="#5f5b55" stroke-width="1.9"/>
  <circle cx="604" cy="276" r="24" fill="none" stroke="#5f5b55" stroke-width="2"/>
  <line x1="622" y1="294" x2="646" y2="318" stroke="#5f5b55" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(668 78)">
    <text class="label" x="70" y="28">小图：30分钟</text><text class="tag" x="396" y="28">看细节</text>
    <line class="axis" x1="40" y1="382" x2="500" y2="382"/><line class="axis" x1="40" y1="70" x2="40" y2="382"/>
    <g>
      <line class="down-wick" x1="76" y1="104" x2="76" y2="184"/><rect class="down" x="65" y="130" width="22" height="32" rx="3"/>
      <line class="down-wick" x1="122" y1="166" x2="122" y2="254"/><rect class="down" x="111" y="194" width="22" height="34" rx="3"/>
      <line class="down-wick" x1="168" y1="234" x2="168" y2="330"/><rect class="down" x="157" y="264" width="22" height="38" rx="3"/>
      <line class="up-wick" x1="214" y1="202" x2="214" y2="294"/><rect class="up" x="203" y="238" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="260" y1="154" x2="260" y2="252"/><rect class="up" x="249" y="192" width="22" height="36" rx="3"/>
      <line class="down-wick" x1="306" y1="220" x2="306" y2="326"/><rect class="down" x="295" y="252" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="352" y1="292" x2="352" y2="366"/><rect class="down" x="341" y="316" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="398" y1="260" x2="398" y2="344"/><rect class="up" x="387" y="292" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="444" y1="206" x2="444" y2="304"/><rect class="up" x="433" y="244" width="22" height="36" rx="3"/>
    </g>
    <polyline class="trend" points="76,104 168,330 260,154 352,366 444,206"/>
  </g>
  <rect x="718" y="500" width="420" height="76" rx="20" fill="#181817"/><text class="white" x="744" y="546">不是谁对谁错，是看的范围不一样</text>
</svg>
