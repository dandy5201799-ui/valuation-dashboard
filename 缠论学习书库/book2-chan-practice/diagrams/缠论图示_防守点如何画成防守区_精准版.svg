<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f97316"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#dbe3ef;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#64748b}
      .h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#64748b}
      .price{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:700;fill:#475569}
      .grid{stroke:#e5eaf2;stroke-width:1}
      .axis{stroke:#cbd5e1;stroke-width:1}
      .wick-red{stroke:#dc2626;stroke-width:3;stroke-linecap:round}
      .wick-green{stroke:#16a34a;stroke-width:3;stroke-linecap:round}
      .k-red{fill:#ef4444;stroke:#dc2626;stroke-width:2}
      .k-green{fill:#22c55e;stroke:#16a34a;stroke-width:2}
      .zone{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .entity{stroke:#f97316;stroke-width:4}
      .lowline{stroke:#dc2626;stroke-width:4;stroke-dasharray:9 7}
      .midline{stroke:#f59e0b;stroke-width:3;stroke-dasharray:8 7}
      .swing{fill:none;stroke:#475569;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
      .tagbox{fill:#fff;stroke-width:2}
      .tag{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:800}
      .call{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
      .bad{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
      .good{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}
    </style>
  </defs>

  <rect class="bg" width="1440" height="980"/>
  <text class="title" x="64" y="64">防守点如何画成防守区：精准版</text>
  <text class="sub" x="64" y="100">防守区不是随手画带子，而是从“防守点所在 K 线 + 前后几根 K 线的实体低位与最低刺破”推导出来。</text>

  <rect class="panel" x="64" y="136" width="1312" height="584" rx="18"/>

  <!-- Main chart -->
  <g transform="translate(104,176)">
    <rect x="0" y="0" width="840" height="456" rx="10" fill="#ffffff" stroke="#dbe3ef"/>

    <!-- price grid; mapping: 10.80 y=40, 10.00 y=360, each 0.10=40px -->
    <line class="grid" x1="0" y1="40" x2="840" y2="40"/>
    <line class="grid" x1="0" y1="80" x2="840" y2="80"/>
    <line class="grid" x1="0" y1="120" x2="840" y2="120"/>
    <line class="grid" x1="0" y1="160" x2="840" y2="160"/>
    <line class="grid" x1="0" y1="200" x2="840" y2="200"/>
    <line class="grid" x1="0" y1="240" x2="840" y2="240"/>
    <line class="grid" x1="0" y1="280" x2="840" y2="280"/>
    <line class="grid" x1="0" y1="320" x2="840" y2="320"/>
    <line class="grid" x1="0" y1="360" x2="840" y2="360"/>
    <line class="axis" x1="0" y1="400" x2="840" y2="400"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="400"/>

    <text class="price" x="-52" y="44">10.80</text>
    <text class="price" x="-52" y="124">10.60</text>
    <text class="price" x="-52" y="204">10.40</text>
    <text class="price" x="-52" y="284">10.20</text>
    <text class="price" x="-52" y="364">10.00</text>

    <!-- Defense zone: top 10.30 y=240, bottom 10.05 y=340 -->
    <rect class="zone" x="304" y="240" width="348" height="100" rx="8" opacity="0.72"/>
    <line class="entity" x1="0" y1="240" x2="840" y2="240"/>
    <line class="midline" x1="0" y1="284" x2="840" y2="284"/>
    <line class="lowline" x1="0" y1="340" x2="840" y2="340"/>

    <!-- candles before and after the low area -->
    <!-- x 72: O10.72 y72, C10.62 y112, H10.78 y48, L10.58 y128 red -->
    <line class="wick-red" x1="72" y1="48" x2="72" y2="128"/><rect class="k-red" x="58" y="72" width="28" height="40"/>
    <!-- x 144: O10.58 y128, C10.47 y172, H10.63 y108, L10.42 y192 red -->
    <line class="wick-red" x1="144" y1="108" x2="144" y2="192"/><rect class="k-red" x="130" y="128" width="28" height="44"/>
    <!-- x 216: O10.45 y180, C10.35 y220, H10.49 y164, L10.28 y248 red -->
    <line class="wick-red" x1="216" y1="164" x2="216" y2="248"/><rect class="k-red" x="202" y="180" width="28" height="40"/>

    <!-- defense cluster -->
    <!-- x 328: O10.30 y240, C10.38 y208, H10.44 y184, L10.12 y312 green -->
    <line class="wick-green" x1="328" y1="184" x2="328" y2="312"/><rect class="k-green" x="314" y="208" width="28" height="32"/>
    <!-- x 400: O10.36 y216, C10.30 y240, H10.42 y192, L10.05 y340 red; defense point -->
    <line class="wick-red" x1="400" y1="192" x2="400" y2="340"/><rect class="k-red" x="386" y="216" width="28" height="24"/>
    <!-- x 472: O10.32 y232, C10.41 y196, H10.48 y168, L10.18 y288 green -->
    <line class="wick-green" x1="472" y1="168" x2="472" y2="288"/><rect class="k-green" x="458" y="196" width="28" height="36"/>
    <!-- x 544: O10.39 y204, C10.46 y176, H10.53 y148, L10.26 y256 green -->
    <line class="wick-green" x1="544" y1="148" x2="544" y2="256"/><rect class="k-green" x="530" y="176" width="28" height="28"/>
    <!-- x 616: O10.44 y184, C10.34 y224, H10.49 y164, L10.22 y272 red -->
    <line class="wick-red" x1="616" y1="164" x2="616" y2="272"/><rect class="k-red" x="602" y="184" width="28" height="40"/>

    <!-- later verification up -->
    <!-- x 704: O10.38 y208 C10.55 y140 H10.60 y120 L10.31 y236 green -->
    <line class="wick-green" x1="704" y1="120" x2="704" y2="236"/><rect class="k-green" x="690" y="140" width="28" height="68"/>
    <!-- x 776: O10.54 y144 C10.68 y88 H10.73 y68 L10.50 y160 green -->
    <line class="wick-green" x1="776" y1="68" x2="776" y2="160"/><rect class="k-green" x="762" y="88" width="28" height="56"/>

    <path class="swing" d="M72 88 L216 220 L400 340 L544 176 L616 224 L776 88"/>
    <circle cx="400" cy="340" r="10" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="328" cy="312" r="8" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="472" cy="288" r="8" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="544" cy="256" r="8" fill="#fff" stroke="#f59e0b" stroke-width="4"/>

    <!-- precise labels -->
    <rect class="tagbox" x="264" y="196" width="224" height="40" rx="8" stroke="#f97316"/>
    <text class="tag" x="280" y="222" fill="#c2410c">实体低位密集区 ≈ 10.30</text>

    <rect class="tagbox" x="432" y="332" width="244" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="448" y="358" fill="#dc2626">最低刺破点 10.05 = 防守点</text>

    <rect class="tagbox" x="520" y="244" width="236" height="40" rx="8" stroke="#f59e0b"/>
    <text class="tag" x="536" y="270" fill="#b45309">防守区：10.30 ~ 10.05</text>

    <text class="tiny" x="680" y="236" fill="#c2410c">上沿：多数实体能收回的位置</text>
    <text class="tiny" x="680" y="280" fill="#b45309">中线：争夺区内部，不作卖出触发</text>
    <text class="tiny" x="680" y="336" fill="#dc2626">下沿：收盘有效跌破才判失败</text>

    <text class="small" x="316" y="432">D1</text>
    <text class="small" x="388" y="432">D2</text>
    <text class="small" x="460" y="432">D3</text>
    <text class="small" x="532" y="432">D4</text>
    <text class="small" x="604" y="432">D5</text>
  </g>

  <!-- Right derivation panel -->
  <g transform="translate(1000,176)">
    <rect class="call" x="0" y="0" width="328" height="116" rx="12"/>
    <text class="h" x="24" y="36">第一步：找防守点</text>
    <text class="small" x="24" y="66">这组回调里最低价 = 10.05</text>
    <text class="small" x="24" y="92">它是“点”，不是直接等于整条线</text>

    <path d="M164 128 L164 160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect class="call" x="0" y="164" width="328" height="132" rx="12"/>
    <text class="h" x="24" y="200">第二步：看实体低位</text>
    <text class="small" x="24" y="230">D1 / D2 / D3 多次收在</text>
    <text class="small" x="24" y="256">10.30 附近或上方</text>
    <text class="small" x="24" y="280">所以 10.30 附近是上沿</text>

    <path d="M164 308 L164 340" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect class="call" x="0" y="344" width="328" height="132" rx="12"/>
    <text class="h" x="24" y="380">第三步：画防守区</text>
    <text class="small" x="24" y="410">上沿：10.30 附近</text>
    <text class="small" x="24" y="436">下沿：10.05 附近</text>
    <text class="small" x="24" y="460">失败线：防守区下沿下方</text>
  </g>

  <!-- Bottom explanation cards -->
  <g transform="translate(64,752)">
    <rect class="panel" x="0" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="28" y="40">为什么不是一根线？</text>
    <text class="txt" x="28" y="78">K 线有影线、实体、盘中刺破。</text>
    <text class="txt" x="28" y="108">单点太脆，容易被噪音骗。</text>
    <text class="txt" x="28" y="136">所以要把点扩展成价格带。</text>

    <rect class="panel" x="452" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="480" y="40">区域怎么取？</text>
    <text class="txt" x="480" y="78">上沿看多数实体收回的位置。</text>
    <text class="txt" x="480" y="108">下沿看最低刺破的位置。</text>
    <text class="txt" x="480" y="136">中间就是市场争夺区。</text>

    <rect class="panel" x="904" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="932" y="40">什么时候卖？</text>
    <text class="txt" x="932" y="78">进防守区：观察，不急判死。</text>
    <text class="txt" x="932" y="108">收盘跌破下沿：确认失败。</text>
    <text class="txt" x="932" y="136">几根 K 收不回：同样要认错。</text>
  </g>

  <line x1="64" y1="936" x2="1376" y2="936" stroke="#dbe3ef"/>
  <text class="tiny" x="64" y="960">学习用途：这张图只讲结构识别与风险承担，不构成任何投资建议。</text>
</svg>
