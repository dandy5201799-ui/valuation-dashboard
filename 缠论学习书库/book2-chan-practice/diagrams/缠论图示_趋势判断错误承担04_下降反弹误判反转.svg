<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#dbe3ef;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#64748b}
      .h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#64748b}
      .grid{stroke:#e5eaf2;stroke-width:1}
      .axis{stroke:#cbd5e1;stroke-width:1}
      .k-red{fill:#ef4444;stroke:#dc2626;stroke-width:2}
      .k-green{fill:#22c55e;stroke:#16a34a;stroke-width:2}
      .wick-red{stroke:#dc2626;stroke-width:3;stroke-linecap:round}
      .wick-green{stroke:#16a34a;stroke-width:3;stroke-linecap:round}
      .swing{fill:none;stroke:#475569;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
      .downline{stroke:#dc2626;stroke-width:4;stroke-dasharray:9 7}
      .pressure{stroke:#f97316;stroke-width:4}
      .confirm{stroke:#2563eb;stroke-width:4;stroke-dasharray:9 7}
      .fail{stroke:#991b1b;stroke-width:4;stroke-dasharray:7 7}
      .zone-pressure{fill:#ffedd5;stroke:#f97316;stroke-width:1.5}
      .zone-watch{fill:#e0f2fe;stroke:#38bdf8;stroke-width:1.5}
      .zone-bad{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
      .tag{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:800}
      .tagbox{fill:#fff;stroke-width:2}
      .node-focus{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .node-bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .node-blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .node-green{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1440" height="940"/>
  <text class="title" x="64" y="64">趋势判断错误承担 04：把“下降反弹”误判成底部反转</text>
  <text class="sub" x="64" y="100">下降趋势中，反弹本身不改变趋势；只有收盘突破最近下降小高点，并且回踩不再创新低，才开始谈转强。</text>

  <rect class="panel" x="64" y="136" width="1312" height="516" rx="18"/>

  <g transform="translate(104,176)">
    <rect x="0" y="0" width="860" height="400" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <line class="grid" x1="0" y1="80" x2="860" y2="80"/>
    <line class="grid" x1="0" y1="160" x2="860" y2="160"/>
    <line class="grid" x1="0" y1="240" x2="860" y2="240"/>
    <line class="grid" x1="0" y1="320" x2="860" y2="320"/>
    <line class="axis" x1="0" y1="400" x2="860" y2="400"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="400"/>

    <rect class="zone-pressure" x="360" y="148" width="304" height="52" rx="8" opacity="0.62"/>
    <rect class="zone-watch" x="476" y="200" width="220" height="72" rx="8" opacity="0.52"/>
    <rect class="zone-bad" x="612" y="292" width="200" height="76" rx="8" opacity="0.78"/>

    <line class="pressure" x1="0" y1="176" x2="860" y2="176"/>
    <line class="confirm" x1="0" y1="136" x2="860" y2="136"/>
    <line class="fail" x1="0" y1="324" x2="860" y2="324"/>
    <path class="downline" d="M84 80 L364 152 L628 196"/>

    <!-- K bars -->
    <g>
      <line class="wick-red" x1="60" y1="60" x2="60" y2="124"/><rect class="k-red" x="48" y="76" width="24" height="36"/>
      <line class="wick-green" x1="132" y1="120" x2="132" y2="204"/><rect class="k-green" x="120" y="148" width="24" height="36"/>
      <line class="wick-red" x1="204" y1="184" x2="204" y2="268"/><rect class="k-red" x="192" y="204" width="24" height="44"/>
      <line class="wick-green" x1="276" y1="128" x2="276" y2="212"/><rect class="k-green" x="264" y="156" width="24" height="40"/>
      <line class="wick-red" x1="348" y1="156" x2="348" y2="288"/><rect class="k-red" x="336" y="184" width="24" height="76"/>
      <line class="wick-red" x1="420" y1="248" x2="420" y2="332"/><rect class="k-red" x="408" y="272" width="24" height="36"/>
      <line class="wick-green" x1="492" y1="200" x2="492" y2="300"/><rect class="k-green" x="480" y="228" width="24" height="48"/>
      <line class="wick-green" x1="564" y1="168" x2="564" y2="256"/><rect class="k-green" x="552" y="196" width="24" height="40"/>
      <line class="wick-red" x1="636" y1="156" x2="636" y2="240"/><rect class="k-red" x="624" y="184" width="24" height="36"/>
      <line class="wick-red" x1="708" y1="252" x2="708" y2="352"/><rect class="k-red" x="696" y="276" width="24" height="52"/>
      <line class="wick-green" x1="780" y1="296" x2="780" y2="372"/><rect class="k-green" x="768" y="320" width="24" height="28"/>
    </g>

    <path class="swing" d="M60 76 L132 172 L204 248 L276 156 L348 260 L420 304 L492 228 L564 196 L636 184 L708 328 L780 344"/>

    <circle cx="60" cy="76" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="276" cy="156" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="636" cy="184" r="9" fill="#fff" stroke="#f97316" stroke-width="4"/>
    <circle cx="420" cy="304" r="9" fill="#fff" stroke="#991b1b" stroke-width="4"/>
    <circle cx="708" cy="328" r="9" fill="#fff" stroke="#991b1b" stroke-width="4"/>

    <rect class="tagbox" x="36" y="24" width="224" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="52" y="50" fill="#dc2626">高点逐步降低：下降结构</text>

    <rect class="tagbox" x="352" y="136" width="244" height="40" rx="8" stroke="#f97316"/>
    <text class="tag" x="368" y="162" fill="#c2410c">最近下降小高点 = 压力位</text>

    <rect class="tagbox" x="500" y="204" width="220" height="40" rx="8" stroke="#38bdf8"/>
    <text class="tag" x="516" y="230" fill="#0369a1">反弹到压力下方：观察</text>

    <rect class="tagbox" x="560" y="100" width="244" height="40" rx="8" stroke="#2563eb"/>
    <text class="tag" x="576" y="126" fill="#2563eb">收盘突破这里才普通转强</text>

    <rect class="tagbox" x="632" y="328" width="192" height="40" rx="8" stroke="#991b1b"/>
    <text class="tag" x="648" y="354" fill="#991b1b">再创新低：判断失败</text>

    <text class="tiny" x="36" y="172" fill="#c2410c">压力线</text>
    <text class="tiny" x="36" y="132" fill="#2563eb">确认线</text>
    <text class="tiny" x="36" y="320" fill="#991b1b">失败线</text>
  </g>

  <g transform="translate(1000,176)">
    <rect class="node-focus" x="0" y="0" width="328" height="84" rx="12"/>
    <text class="h" x="24" y="34">错误假设</text>
    <text class="small" x="24" y="62">“跌久了反弹 = 底部反转”</text>

    <path d="M164 96 L164 128" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <polygon points="164,132 292,204 164,276 36,204" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="h" x="164" y="192" text-anchor="middle">是否收盘突破</text>
    <text class="h" x="164" y="220" text-anchor="middle">最近下降小高点？</text>

    <path d="M164 276 L164 324" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <rect x="172" y="288" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="180" y="304" fill="#dc2626">否</text>

    <path d="M292 204 L324 204 L324 324" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="292" y="184" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="300" y="200" fill="#2563eb">是</text>

    <rect class="node-bad" x="0" y="324" width="220" height="80" rx="12"/>
    <text class="h" x="24" y="356">仍是下降反弹</text>
    <text class="small" x="24" y="384">不追；已有仓位</text>
    <text class="small" x="24" y="404">反弹不过要减/出</text>

    <rect class="node-blue" x="244" y="324" width="220" height="80" rx="12"/>
    <text class="h" x="268" y="356">普通转强</text>
    <text class="small" x="268" y="384">可小仓试错；失败线</text>
    <text class="small" x="268" y="404">看突破前低点</text>
  </g>

  <g transform="translate(64,684)">
    <rect class="panel" x="0" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="28" y="40">1. 错在哪里？</text>
    <text class="txt" x="28" y="78">下降趋势里也会有强反弹。</text>
    <text class="txt" x="28" y="108">但只要高点仍然降低，</text>
    <text class="txt" x="28" y="138">它就还不是趋势反转。</text>

    <rect class="panel" x="452" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="480" y="40">2. 关键压力怎么找？</text>
    <text class="txt" x="480" y="78">找最近一次反弹失败的小高点。</text>
    <text class="txt" x="480" y="108">它是下降结构的压力位。</text>
    <text class="txt" x="480" y="138">没收盘突破，就不能说转强。</text>

    <rect class="panel" x="904" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="932" y="40">3. 怎么承担？</text>
    <text class="txt" x="932" y="78">压力不过：不追、减仓防守。</text>
    <text class="txt" x="932" y="108">突破后再跌回：试错失败。</text>
    <text class="txt" x="932" y="138">反弹失败再新低：确认认错。</text>
  </g>

  <line x1="64" y1="900" x2="1376" y2="900" stroke="#dbe3ef"/>
  <text class="tiny" x="64" y="924">学习用途：这张图只讲结构识别与风险承担，不构成任何投资建议。</text>
</svg>
