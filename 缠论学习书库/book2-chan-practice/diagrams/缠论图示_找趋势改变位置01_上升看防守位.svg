    <text class="tag" x="624" y="368">防守位</text>
    <rect x="720" y="330" width="302" height="82" rx="18" fill="#181817"/>
    <text class="terminal-label" x="746" y="364">上升先看低点</text>
    <text class="terminal-note" x="746" y="392">最近保护上涨的有效低点</text>
    <rect x="132" y="38" width="284" height="76" rx="18" fill="#fff" stroke="#d8d4ca"/>
    <text class="label" x="158" y="71">结构还在上移</text>
    <text class="note" x="158" y="100">高点和低点仍在抬高</text>
