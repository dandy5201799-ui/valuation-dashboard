    <g>
      <line class="up-wick" x1="76" y1="336" x2="76" y2="402"/><rect class="up" x="65" y="360" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="124" y1="292" x2="124" y2="374"/><rect class="up" x="113" y="324" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="172" y1="242" x2="172" y2="330"/><rect class="up" x="161" y="276" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="220" y1="164" x2="220" y2="268"/><rect class="up" x="209" y="204" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="268" y1="204" x2="268" y2="306"/><rect class="down" x="257" y="234" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="316" y1="258" x2="316" y2="366"/><rect class="down" x="305" y="288" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="364" y1="312" x2="364" y2="402"/><rect class="down" x="353" y="338" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="412" y1="282" x2="412" y2="366"/><rect class="up" x="401" y="316" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="460" y1="220" x2="460" y2="310"/><rect class="up" x="449" y="254" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="508" y1="144" x2="508" y2="250"/><rect class="up" x="497" y="184" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="556" y1="174" x2="556" y2="280"/><rect class="down" x="545" y="204" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="604" y1="228" x2="604" y2="338"/><rect class="down" x="593" y="260" width="22" height="44" rx="3"/>
      <line class="down-wick" x1="652" y1="286" x2="652" y2="382"/><rect class="down" x="641" y="314" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="700" y1="250" x2="700" y2="340"/><rect class="up" x="689" y="286" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="748" y1="190" x2="748" y2="288"/><rect class="up" x="737" y="228" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="796" y1="122" x2="796" y2="224"/><rect class="up" x="785" y="162" width="22" height="40" rx="3"/>
