<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <rect width="920" height="480" fill="#ffffff"/>
  <text x="40" y="52" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#111827">下降趋势：重点看上方压力区</text>
  <text x="40" y="88" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#6b7280">高点降低、低点降低；最近一次反弹失败的小高点，是判断下降结构有没有修复的关键位置。</text>

  <g transform="translate(60 115)">
    <rect x="0" y="0" width="800" height="300" rx="16" fill="#f8fafc" stroke="#dbe3ef"/>
    <line x1="50" y1="250" x2="760" y2="250" stroke="#e5e7eb"/>
    <line x1="50" y1="190" x2="760" y2="190" stroke="#e5e7eb"/>
    <line x1="50" y1="130" x2="760" y2="130" stroke="#e5e7eb"/>
    <line x1="50" y1="70" x2="760" y2="70" stroke="#e5e7eb"/>

    <rect x="425" y="92" width="190" height="44" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="455" y="121" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#b91c1c">压力区</text>

    <polyline points="70,65 185,160 300,105 425,210 535,115 690,245" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="65" r="7" fill="#ef4444"/>
    <circle cx="185" cy="160" r="7" fill="#16a34a"/>
    <circle cx="300" cy="105" r="8" fill="#ef4444"/>
    <circle cx="425" cy="210" r="7" fill="#16a34a"/>
    <circle cx="535" cy="115" r="8" fill="#ef4444"/>
    <circle cx="690" cy="245" r="7" fill="#16a34a"/>

    <text x="45" y="48" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#991b1b">高点1</text>
    <text x="268" y="88" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#991b1b">高点2降低</text>
    <text x="502" y="155" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#991b1b">反弹小高点</text>
    <text x="155" y="188" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#166534">低点1</text>
    <text x="395" y="238" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#166534">低点2更低</text>
  </g>
</svg>
