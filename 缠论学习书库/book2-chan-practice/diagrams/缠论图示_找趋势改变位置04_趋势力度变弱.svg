      <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#d97757" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#747069" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
