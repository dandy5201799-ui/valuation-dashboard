<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">证据是什么：小低点被跌破，确认下跌延续</title>
  <desc id="desc">价格反弹到压力位后来回晃，晃出一个小低点；后面一根K线收盘跌破这个小低点，就是确认下跌延续的确认点。</desc>
  <defs>
    <style>
      .axis{stroke:#d8d4ca;stroke-width:1.2}
      .key{stroke:#b8790a;stroke-width:2.2;stroke-dasharray:9 8}
      .guide{stroke:#747069;stroke-width:1.8;stroke-dasharray:5 6}
      .up{fill:#fff;stroke:#d97757;stroke-width:2}
      .up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}
      .down{fill:#e8e5db;stroke:#747069;stroke-width:2}
      .down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}
      .trend{fill:none;stroke:#181817;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#181817;stroke:#fff;stroke-width:4}
      .lo{fill:#747069;stroke:#fff;stroke-width:4}
      .bad{fill:#d1453a;stroke:#fff;stroke-width:4}
      .label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:24px;font-weight:700;fill:#181817}
      .tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:19px;font-weight:700;fill:#181817}
      .tag-amber{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#8a5a06}
      .tag-red{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#b03a30}
      .white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
      .white-note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:450;fill:#e9e6dd}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#fff"/>
  <g transform="translate(96 60)">
    <text class="label" x="0" y="0">卖出例子：小低点被跌破，确认下跌延续</text>
    <line class="axis" x1="4" y1="330" x2="1030" y2="330"/>
    <line class="key" x1="4" y1="90" x2="1030" y2="90"/>
    <text class="tag-amber" x="12" y="82">压力位</text>
    <line class="guide" x1="350" y1="195" x2="720" y2="195"/>
    <g>
      <line class="down-wick" x1="30" y1="250" x2="30" y2="295"/><rect class="down" x="19" y="268" width="22" height="22" rx="3"/>
      <line class="up-wick" x1="90" y1="200" x2="90" y2="255"/><rect class="up" x="79" y="215" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="150" y1="150" x2="150" y2="205"/><rect class="up" x="139" y="165" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="210" y1="90" x2="210" y2="160"/><rect class="up" x="199" y="105" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="270" y1="120" x2="270" y2="175"/><rect class="down" x="259" y="135" width="22" height="30" rx="3"/>
      <line class="down-wick" x1="330" y1="155" x2="330" y2="195"/><rect class="down" x="319" y="168" width="22" height="20" rx="3"/>
      <line class="up-wick" x1="390" y1="165" x2="390" y2="205"/><rect class="up" x="379" y="178" width="22" height="20" rx="3"/>
      <line class="up-wick" x1="450" y1="140" x2="450" y2="185"/><rect class="up" x="439" y="153" width="22" height="25" rx="3"/>
      <line class="down-wick" x1="510" y1="160" x2="510" y2="205"/><rect class="down" x="499" y="175" width="22" height="20" rx="3"/>
      <line class="up-wick" x1="570" y1="145" x2="570" y2="190"/><rect class="up" x="559" y="158" width="22" height="22" rx="3"/>
      <line class="down-wick" x1="630" y1="180" x2="630" y2="225"/><rect class="down" x="619" y="193" width="22" height="22" rx="3"/>
      <line class="down-wick" x1="690" y1="210" x2="690" y2="260"/><rect class="down" x="679" y="225" width="22" height="26" rx="3"/>
      <line class="down-wick" x1="750" y1="240" x2="750" y2="300"/><rect class="down" x="739" y="255" width="22" height="30" rx="3"/>
    </g>
    <polyline class="trend" points="30,270 210,110 330,180 450,160 630,200 750,270"/>
    <path d="M330 209 L342 193 L318 193 Z" fill="#747069" stroke="#fff" stroke-width="1.2"/>
    <circle class="bad" cx="690" cy="238" r="9"/>
    <text class="tag" x="270" y="242">①小低点</text>
    <text class="tag-amber" x="150" y="112">②反抽不破压力位</text>
    <text class="tag-red" x="706" y="234">③收盘跌破①→确认点</text>
    <rect x="700" y="290" width="330" height="76" rx="20" fill="#181817"/>
    <text class="white" x="726" y="324">证据＝收盘价跌破这个小低点</text>
    <text class="white-note" x="726" y="350">买入反过来：收盘价站上一个小高点</text>
  </g>
</svg>
