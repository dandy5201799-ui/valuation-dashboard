<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">选点成立与不成立</title>
  <desc id="desc">一段 K 线中标出成立的局部高点和低点，同时说明当天不能确认，以及相邻高低点不能共用同一根 K 线。</desc>
  <defs>
    <style>
      .axis{stroke:#d8d4ca;stroke-width:1.2}.up{fill:#fff;stroke:#d97757;stroke-width:2}.up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}.down{fill:#e8e5db;stroke:#747069;stroke-width:2}.down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}.guide{stroke:#c9c3b8;stroke-width:1.1;stroke-dasharray:6 8}.valid{fill:#181817;stroke:#fff;stroke-width:4}.candidate{fill:#fff;stroke:#d97757;stroke-width:3}.invalid{fill:#fff;stroke:#747069;stroke-width:3;stroke-dasharray:5 5}.label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:23px;font-weight:700;fill:#181817}.note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:450;fill:#747069}.terminal-label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:23px;font-weight:700;fill:#fff}.terminal-note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:450;fill:#e9e6dd}.tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:20px;font-weight:700;fill:#181817}.small{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:500;fill:#747069}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <g transform="translate(90 56)">
    <line class="axis" x1="36" y1="430" x2="1040" y2="430"/>
    <line class="axis" x1="36" y1="70" x2="36" y2="430"/>

    <g>
      <line class="up-wick" x1="70" y1="336" x2="70" y2="406"/><rect class="up" x="59" y="364" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="118" y1="300" x2="118" y2="384"/><rect class="up" x="107" y="334" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="166" y1="250" x2="166" y2="342"/><rect class="up" x="155" y="286" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="214" y1="172" x2="214" y2="278"/><rect class="up" x="203" y="212" width="22" height="40" rx="3"/>
      <line class="down-wick" x1="262" y1="210" x2="262" y2="314"/><rect class="down" x="251" y="238" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="310" y1="264" x2="310" y2="374"/><rect class="down" x="299" y="296" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="358" y1="318" x2="358" y2="404"/><rect class="down" x="347" y="344" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="406" y1="286" x2="406" y2="372"/><rect class="up" x="395" y="320" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="454" y1="226" x2="454" y2="318"/><rect class="up" x="443" y="262" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="502" y1="154" x2="502" y2="258"/><rect class="up" x="491" y="194" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="550" y1="188" x2="550" y2="292"/><rect class="down" x="539" y="216" width="22" height="44" rx="3"/>
      <line class="down-wick" x1="598" y1="246" x2="598" y2="356"/><rect class="down" x="587" y="278" width="22" height="44" rx="3"/>
      <line class="up-wick" x1="646" y1="200" x2="646" y2="374"/><rect class="up" x="635" y="258" width="22" height="46" rx="3"/>
      <line class="up-wick" x1="694" y1="234" x2="694" y2="330"/><rect class="up" x="683" y="270" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="742" y1="178" x2="742" y2="278"/><rect class="up" x="731" y="216" width="22" height="36" rx="3"/>
      <line class="down-wick" x1="790" y1="206" x2="790" y2="306"/><rect class="down" x="779" y="232" width="22" height="42" rx="3"/>
      <line class="up-wick" x1="838" y1="168" x2="838" y2="260"/><rect class="up" x="827" y="204" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="886" y1="132" x2="886" y2="230"/><rect class="up" x="875" y="170" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="934" y1="104" x2="934" y2="196"/><rect class="up" x="923" y="140" width="22" height="34" rx="3"/>
    </g>

    <line class="guide" x1="214" y1="172" x2="214" y2="430"/>
    <line class="guide" x1="358" y1="404" x2="358" y2="430"/>
    <line class="guide" x1="646" y1="200" x2="646" y2="430"/>
    <line class="guide" x1="934" y1="104" x2="934" y2="430"/>

    <circle class="valid" cx="214" cy="172" r="9"/>
    <circle class="valid" cx="358" cy="404" r="9"/>
    <circle class="invalid" cx="646" cy="200" r="10"/>
    <circle class="candidate" cx="934" cy="104" r="10"/>

    <text class="tag" x="184" y="154">高点成立</text>
    <text class="tag" x="326" y="394">低点成立</text>
    <text class="tag" x="616" y="188">不采用</text>
    <text class="tag" x="904" y="88">候选高点</text>

    <g>
      <rect x="110" y="36" width="294" height="82" rx="18" fill="#fff" stroke="#d8d4ca"/>
      <text class="label" x="136" y="70">比前后都高 / 都低</text>
      <text class="note" x="136" y="98">成立点要经过前后 K 线比较</text>

      <rect x="496" y="354" width="314" height="82" rx="18" fill="#fff" stroke="#d8d4ca"/>
      <text class="label" x="522" y="388">同一根 K 线不共用</text>
      <text class="note" x="522" y="416">相邻高低点要有清楚先后</text>

      <rect x="802" y="254" width="304" height="82" rx="18" fill="#181817"/>
      <text class="terminal-label" x="828" y="288">当天不能确认</text>
      <text class="terminal-note" x="828" y="316">还缺后面几根 K 线</text>
    </g>
  </g>
</svg>
