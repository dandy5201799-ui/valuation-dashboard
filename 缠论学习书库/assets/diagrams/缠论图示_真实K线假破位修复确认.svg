<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 740; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .swing { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .guard-zone { fill: rgba(245, 158, 11, .13); stroke: #f59e0b; stroke-width: 2; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .fake-low { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .repair-high { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .confirm { stroke: #16a34a; stroke-width: 5; }
      .retest { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .zone-red { fill: rgba(220, 38, 38, .08); stroke: #dc2626; stroke-width: 2; }
      .zone-blue { fill: rgba(37, 99, 235, .08); stroke: #2563eb; stroke-width: 2; }
      .zone-green { fill: rgba(22, 163, 74, .10); stroke: #16a34a; stroke-width: 2; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-orange { fill: #f59e0b; }
      .dot-red { fill: #dc2626; }
      .dot-blue { fill: #2563eb; }
      .dot-green { fill: #16a34a; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-orange { stroke: #f59e0b; }
      .box-red { stroke: #dc2626; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #16a34a; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="960"/>

  <text class="title" x="56" y="64">真实 K 线里：假破位后的修复确认点</text>
  <text class="sub" x="56" y="100">跌破防守位不能买；收回防守位只是观察；突破修复小高点才是普通确认，回踩不破再上才更稳健。</text>

  <rect class="panel" x="52" y="132" width="1396" height="612" rx="24"/>
  <rect x="96" y="176" width="1308" height="480" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="128" y1="236" x2="1372" y2="236"/>
  <line class="axis" x1="128" y1="316" x2="1372" y2="316"/>
  <line class="axis" x1="128" y1="396" x2="1372" y2="396"/>
  <line class="axis" x1="128" y1="476" x2="1372" y2="476"/>
  <line class="axis" x1="128" y1="556" x2="1372" y2="556"/>

  <!-- Guard / fake break / repair lines -->
  <rect class="guard-zone" x="128" y="468" width="1244" height="46" rx="8"/>
  <line class="guard" x1="128" y1="492" x2="1372" y2="492"/>
  <text class="small" x="140" y="458">原防守位：跌破时先不买，收回后也只是观察</text>

  <line class="fake-low" x1="128" y1="584" x2="1372" y2="584"/>
  <text class="small" x="140" y="610">假破低点：后续再破这里，修复失败</text>

  <rect class="zone-blue" x="800" y="344" width="224" height="56" rx="10"/>
  <line class="repair-high" x1="784" y1="372" x2="1372" y2="372"/>
  <text class="small" x="800" y="334">修复小高点：收回后反弹形成的局部压力</text>

  <line class="confirm" x1="1008" y1="344" x2="1372" y2="344"/>
  <text class="small" x="1036" y="324">普通确认：收盘突破修复小高点</text>

  <line class="retest" x1="1064" y1="398" x2="1372" y2="398"/>
  <text class="small" x="1080" y="424">稳健观察：突破后回踩不破，再次向上</text>

  <!-- realistic candles: pre-uptrend, pullback, fake break, reclaim, repair -->
  <g>
    <!-- earlier uptrend and pullback -->
    <line class="wick-up" x1="152" y1="420" x2="152" y2="520"/><rect class="up" x="138" y="452" width="28" height="40"/>
    <line class="wick-up" x1="204" y1="348" x2="204" y2="500"/><rect class="up" x="190" y="392" width="28" height="78"/>
    <line class="wick-down" x1="256" y1="380" x2="256" y2="516"/><rect class="down" x="242" y="414" width="28" height="60"/>
    <line class="wick-up" x1="308" y1="292" x2="308" y2="452"/><rect class="up" x="294" y="334" width="28" height="82"/>
    <line class="wick-down" x1="360" y1="336" x2="360" y2="500"/><rect class="down" x="346" y="382" width="28" height="76"/>
    <line class="wick-up" x1="412" y1="244" x2="412" y2="408"/><rect class="up" x="398" y="286" width="28" height="84"/>
    <line class="wick-down" x1="464" y1="304" x2="464" y2="480"/><rect class="down" x="450" y="340" width="28" height="110"/>
    <line class="wick-down" x1="516" y1="376" x2="516" y2="536"/><rect class="down" x="502" y="412" width="28" height="84"/>
    <!-- false break area -->
    <line class="wick-down" x1="568" y1="448" x2="568" y2="596"/><rect class="down" x="554" y="480" width="28" height="58"/>
    <line class="wick-up" x1="620" y1="460" x2="620" y2="604"/><rect class="up" x="606" y="492" width="28" height="42"/>
    <line class="wick-up" x1="672" y1="424" x2="672" y2="568"/><rect class="up" x="658" y="458" width="28" height="72"/>
    <line class="wick-down" x1="724" y1="420" x2="724" y2="536"/><rect class="down" x="710" y="454" width="28" height="44"/>
    <!-- reclaim and repair high -->
    <line class="wick-up" x1="776" y1="392" x2="776" y2="520"/><rect class="up" x="762" y="430" width="28" height="58"/>
    <line class="wick-up" x1="828" y1="360" x2="828" y2="492"/><rect class="up" x="814" y="402" width="28" height="62"/>
    <line class="wick-down" x1="880" y1="348" x2="880" y2="480"/><rect class="down" x="866" y="386" width="28" height="58"/>
    <line class="wick-up" x1="932" y1="364" x2="932" y2="492"/><rect class="up" x="918" y="408" width="28" height="48"/>
    <line class="wick-down" x1="984" y1="356" x2="984" y2="468"/><rect class="down" x="970" y="390" width="28" height="42"/>
    <!-- confirmation and retest -->
    <line class="wick-up" x1="1036" y1="316" x2="1036" y2="452"/><rect class="up" x="1022" y="348" width="28" height="72"/>
    <line class="wick-up" x1="1088" y1="292" x2="1088" y2="404"/><rect class="up" x="1074" y="324" width="28" height="48"/>
    <line class="wick-down" x1="1140" y1="332" x2="1140" y2="424"/><rect class="down" x="1126" y="356" width="28" height="42"/>
    <line class="wick-up" x1="1192" y1="336" x2="1192" y2="420"/><rect class="up" x="1178" y="360" width="28" height="34"/>
    <line class="wick-up" x1="1244" y1="276" x2="1244" y2="388"/><rect class="up" x="1230" y="312" width="28" height="52"/>
    <line class="wick-down" x1="1296" y1="292" x2="1296" y2="392"/><rect class="down" x="1282" y="318" width="28" height="38"/>
    <line class="wick-up" x1="1348" y1="248" x2="1348" y2="360"/><rect class="up" x="1334" y="282" width="28" height="52"/>
  </g>

  <!-- skeleton -->
  <path class="swing" d="M152 492 L204 348 L256 474 L308 292 L360 458 L412 244 L568 538 L620 604 L672 458 L724 498 L828 360 L984 432 L1036 348 L1140 398 L1192 360 L1244 276 L1348 248"/>

  <!-- key zones / dots -->
  <rect class="zone-red" x="540" y="520" width="140" height="86" rx="10"/>
  <text class="tiny" x="548" y="634">跌破区：不能买</text>
  <circle class="dot dot-red" cx="620" cy="604" r="13"/>
  <text class="txt" x="636" y="610">假破低点</text>

  <circle class="dot dot-orange" cx="672" cy="458" r="13"/>
  <text class="txt" x="688" y="464">收回防守位</text>
  <text class="tiny" x="688" y="488">只是观察，不是确认</text>

  <circle class="dot dot-blue" cx="828" cy="360" r="12"/>
  <text class="txt" x="844" y="366">修复小高点</text>

  <circle class="dot dot-green" cx="1036" cy="348" r="14"/>
  <text class="txt" x="1052" y="354">普通确认</text>
  <text class="tiny" x="1052" y="378">收盘突破小高点</text>

  <circle class="dot dot-orange" cx="1140" cy="398" r="12"/>
  <text class="txt" x="1156" y="404">回踩不破</text>

  <circle class="dot dot-green" cx="1244" cy="276" r="14"/>
  <text class="txt" x="1260" y="282">稳健确认</text>

  <!-- Failure path marker -->
  <path d="M932 432 C1000 512 1060 570 1130 618" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 7" opacity=".75"/>
  <circle class="dot dot-red" cx="1130" cy="618" r="11" opacity=".9"/>
  <text class="tiny" x="1146" y="624">失败路径：再次跌破假破低点</text>

  <!-- callouts -->
  <rect class="box box-red" x="124" y="664" width="260" height="56" rx="12"/>
  <text class="txt" x="148" y="698">① 跌破防守位：不能买</text>
  <path class="arrow" d="M384 684 C450 650 540 612 604 604"/>

  <rect class="box box-orange" x="416" y="664" width="296" height="56" rx="12"/>
  <text class="txt" x="440" y="698">② 收回防守位：只观察</text>
  <path class="arrow" d="M624 664 C650 608 666 520 672 464"/>

  <rect class="box box-blue" x="744" y="664" width="284" height="56" rx="12"/>
  <text class="txt" x="768" y="698">③ 找修复小高点</text>
  <path class="arrow" d="M900 664 C884 560 850 420 832 364"/>

  <rect class="box box-green" x="1060" y="664" width="292" height="56" rx="12"/>
  <text class="txt" x="1084" y="698">④ 突破后回踩不破再上</text>
  <path class="arrow" d="M1192 664 C1200 560 1216 392 1240 284"/>

  <!-- bottom summary -->
  <rect class="panel" x="72" y="788" width="1356" height="108" rx="20"/>
  <text class="txt" x="104" y="824">判断流程：</text>
  <text class="txt" x="204" y="824">跌破防守位 → 快速收回 → 形成修复小高点 → 收盘突破小高点 → 回踩不破 → 再次向上。</text>
  <text class="small" x="104" y="856">普通确认：收盘突破修复小高点。稳健确认：突破后回踩不破，再向上。</text>
  <text class="small" x="104" y="880">失效：再次跌破假破低点，或者收回后反弹不过小高点又转弱。学习用途，不构成投资建议。</text>
</svg>
