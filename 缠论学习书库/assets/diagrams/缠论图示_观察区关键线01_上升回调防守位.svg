<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .panel{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .txt{font:800 18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .label{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .grid{stroke:#e8eef7;stroke-width:1}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .future{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:6 6}
      .guard{stroke:#f59e0b;stroke-width:3}
      .guardBand{fill:rgba(245,158,11,.10);stroke:#f59e0b;stroke-width:1.4;stroke-dasharray:6 6}
      .minor{stroke:#2563eb;stroke-width:2.4}
      .fail{stroke:#dc2626;stroke-width:2.4}
      .up{fill:#dc2626;stroke:#dc2626}
      .down{fill:#16a34a;stroke:#16a34a}
      .dotH{fill:#fee2e2;stroke:#dc2626;stroke-width:3}
      .dotL{fill:#dcfce7;stroke:#16a34a;stroke-width:3}
      .dotG{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}
      .dotB{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .dotR{fill:#fef2f2;stroke:#dc2626;stroke-width:3}
      .tagG{fill:#f0fdf4;stroke:#16a34a}
      .tagB{fill:#eff6ff;stroke:#2563eb}
      .tagO{fill:#fff7ed;stroke:#f59e0b}
      .tagR{fill:#fef2f2;stroke:#dc2626}
      .tagGray{fill:#f8fafc;stroke:#cbd5e1}
      .arrow{fill:none;stroke:#4f5d75;stroke-width:2.2;marker-end:url(#arrow)}
      .arrowB{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="940"/>
  <text class="title" x="64" y="70">观察区关键线 01：上升回调里的防守位怎么画？</text>
  <text class="sub" x="64" y="102">防守位不是“当前最低价”，而是最近一个已经被后续新高确认过的有效回调低点。价格回到它附近，只是观察区，不是直接买点。</text>

  <!-- main chart -->
  <rect class="panel" x="64" y="136" width="1272" height="524" rx="10"/>
  <text class="txt" x="96" y="176">一、先从 K 线画出上升波段结构</text>
  <text class="small" x="96" y="204">判断顺序：高点抬升 + 低点抬升 → 找最近被新高确认的低点 → 画水平防守位 → 回调到附近只进入观察。</text>

  <!-- grid -->
  <g>
    <line class="grid" x1="112" y1="548" x2="1288" y2="548"/>
    <line class="grid" x1="112" y1="488" x2="1288" y2="488"/>
    <line class="grid" x1="112" y1="428" x2="1288" y2="428"/>
    <line class="grid" x1="112" y1="368" x2="1288" y2="368"/>
    <line class="grid" x1="112" y1="308" x2="1288" y2="308"/>
    <line class="grid" x1="112" y1="248" x2="1288" y2="248"/>
  </g>

  <!-- observation zone band around defense -->
  <rect class="guardBand" x="112" y="472" width="1176" height="52" rx="8"/>
  <line class="guard" x1="112" y1="500" x2="1288" y2="500"/>
  <text class="tiny" x="1136" y="492">防守位 = L3 低点</text>
  <text class="tiny" x="1136" y="520">观察区：防守位附近</text>

  <!-- minor high confirmation line -->
  <line class="minor" x1="900" y1="404" x2="1288" y2="404"/>
  <text class="tiny" x="1052" y="396">回调后小高点：突破它才是确认</text>

  <!-- invalid line -->
  <line class="fail" x1="900" y1="536" x2="1288" y2="536" opacity=".75"/>
  <text class="tiny" x="1032" y="556">观察失效：有效跌破防守区</text>

  <!-- candles -->
  <g>
    <line class="up" x1="132" y1="520" x2="132" y2="584"/><rect class="up" x="120" y="540" width="24" height="28"/>
    <line class="up" x1="188" y1="456" x2="188" y2="540"/><rect class="up" x="176" y="488" width="24" height="34"/>
    <line class="down" x1="244" y1="472" x2="244" y2="556"/><rect class="down" x="232" y="500" width="24" height="34"/>
    <line class="up" x1="300" y1="392" x2="300" y2="488"/><rect class="up" x="288" y="424" width="24" height="42"/>
    <line class="down" x1="356" y1="420" x2="356" y2="512"/><rect class="down" x="344" y="448" width="24" height="40"/>
    <line class="up" x1="412" y1="332" x2="412" y2="456"/><rect class="up" x="400" y="368" width="24" height="60"/>
    <line class="down" x1="468" y1="388" x2="468" y2="500"/><rect class="down" x="456" y="420" width="24" height="54"/>
    <line class="up" x1="524" y1="284" x2="524" y2="408"/><rect class="up" x="512" y="320" width="24" height="62"/>
    <line class="down" x1="580" y1="356" x2="580" y2="500"/><rect class="down" x="568" y="392" width="24" height="72"/>
    <line class="up" x1="636" y1="372" x2="636" y2="456"/><rect class="up" x="624" y="400" width="24" height="32"/>
    <line class="down" x1="692" y1="344" x2="692" y2="484"/><rect class="down" x="680" y="384" width="24" height="68"/>
    <line class="up" x1="748" y1="248" x2="748" y2="372"/><rect class="up" x="736" y="288" width="24" height="56"/>
    <line class="down" x1="804" y1="292" x2="804" y2="420"/><rect class="down" x="792" y="328" width="24" height="58"/>
    <line class="up" x1="860" y1="224" x2="860" y2="348"/><rect class="up" x="848" y="260" width="24" height="62"/>
    <line class="down" x1="916" y1="300" x2="916" y2="516"/><rect class="down" x="904" y="344" width="24" height="140"/>
    <line class="up" x1="972" y1="456" x2="972" y2="532"/><rect class="up" x="960" y="484" width="24" height="24"/>
    <line class="down" x1="1028" y1="408" x2="1028" y2="516"/><rect class="down" x="1016" y="440" width="24" height="48"/>
    <line class="up" x1="1084" y1="428" x2="1084" y2="508"/><rect class="up" x="1072" y="456" width="24" height="30"/>
    <line class="up" x1="1140" y1="372" x2="1140" y2="472"/><rect class="up" x="1128" y="404" width="24" height="44"/>
    <line class="up" x1="1196" y1="312" x2="1196" y2="420"/><rect class="up" x="1184" y="344" width="24" height="52"/>
  </g>

  <!-- swing line -->
  <path class="price" d="M132 568 L188 456 L244 534 L300 392 L356 488 L412 332 L468 474 L524 284 L580 500 L636 400 L692 452 L748 248 L804 386 L860 224 L916 484 L972 508 L1028 408 L1084 486 L1140 372 L1196 312"/>

  <!-- key dots labels -->
  <circle class="dotL" cx="132" cy="568" r="9"/>
  <text class="tiny" x="116" y="604">L1</text>
  <circle class="dotH" cx="300" cy="392" r="9"/>
  <text class="tiny" x="284" y="380">H1</text>
  <circle class="dotL" cx="356" cy="488" r="9"/>
  <text class="tiny" x="340" y="520">L2</text>
  <circle class="dotH" cx="524" cy="284" r="9"/>
  <text class="tiny" x="508" y="272">H2</text>
  <circle class="dotG" cx="580" cy="500" r="11"/>
  <text class="tiny" x="552" y="532">L3 防守位来源</text>
  <circle class="dotH" cx="860" cy="224" r="10"/>
  <text class="tiny" x="812" y="212">H3 新高确认 L3</text>
  <circle class="dotG" cx="916" cy="484" r="10"/>
  <text class="tiny" x="884" y="464">回到观察区</text>
  <circle class="dotB" cx="1028" cy="408" r="9"/>
  <text class="tiny" x="1000" y="388">回调小高点</text>
  <circle class="dotB" cx="1140" cy="372" r="10"/>
  <text class="tiny" x="1112" y="352">确认点</text>

  <!-- callouts -->
  <rect class="tagG" x="148" y="232" width="284" height="72" rx="8"/>
  <text class="label" x="168" y="260" fill="#15803d">结构条件：上升趋势</text>
  <text class="small" x="168" y="286">H1 → H2 → H3 抬升；L1 → L2 → L3 大体抬升。</text>

  <rect class="tagO" x="536" y="224" width="292" height="80" rx="8"/>
  <text class="label" x="556" y="252" fill="#b45309">防守位为什么是 L3？</text>
  <text class="small" x="556" y="278">L3 后面出现 H3 新高，说明 L3 已经被右侧确认。</text>

  <rect class="tagB" x="924" y="240" width="344" height="88" rx="8"/>
  <text class="label" x="944" y="268" fill="#1d4ed8">观察区不是买点</text>
  <text class="small" x="944" y="294">回到防守位附近，只能观察是否止跌；突破小高点后才是确认。</text>

  <!-- bottom panels -->
  <g transform="translate(64 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第一步：确认它是上升趋势</text>
    <text class="small" x="24" y="68">至少看两组以上波段高低点。</text>
    <text class="tiny" x="24" y="100">高点：H1 &lt; H2 &lt; H3</text>
    <text class="tiny" x="24" y="124">低点：L1 &lt; L2 &lt; L3</text>
    <text class="tiny" x="24" y="148">如果高低点不同步，就不能直接按上升趋势处理。</text>
  </g>

  <g transform="translate(502 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第二步：防守位选最近确认低点</text>
    <text class="small" x="24" y="68">不是选右侧正在形成的最低价。</text>
    <text class="tiny" x="24" y="100">标准：这个低点之后，价格重新向上并创出新高。</text>
    <text class="tiny" x="24" y="124">因此 L3 是防守位；右侧回调低点只是候选。</text>
  </g>

  <g transform="translate(940 700)">
    <rect class="panel" x="0" y="0" width="396" height="164" rx="10"/>
    <text class="txt" x="24" y="36">第三步：观察区到确认点</text>
    <text class="small" x="24" y="68">接近防守位 ≠ 可以买。</text>
    <text class="tiny" x="24" y="100">观察：回调到防守位附近但未有效跌破。</text>
    <text class="tiny" x="24" y="124">确认：二次不破后，收盘突破回调小高点。</text>
  </g>

  <text class="tiny" x="64" y="908">学习用途，不构成投资建议。本图只讲结构识别：真正操作还要结合级别、波动、仓位和个人风险承受能力。</text>
</svg>
