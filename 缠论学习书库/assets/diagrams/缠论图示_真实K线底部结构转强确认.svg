<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 740; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .swing { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .downline { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .lowline { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .trigger { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .confirm { stroke: #16a34a; stroke-width: 5; }
      .fail { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .zone-red { fill: rgba(220, 38, 38, .08); stroke: #dc2626; stroke-width: 2; }
      .zone-orange { fill: rgba(245, 158, 11, .10); stroke: #f59e0b; stroke-width: 2; }
      .zone-blue { fill: rgba(37, 99, 235, .08); stroke: #2563eb; stroke-width: 2; }
      .zone-green { fill: rgba(22, 163, 74, .10); stroke: #16a34a; stroke-width: 2; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-red { fill: #dc2626; }
      .dot-orange { fill: #f59e0b; }
      .dot-blue { fill: #2563eb; }
      .dot-green { fill: #16a34a; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-red { stroke: #dc2626; }
      .box-orange { stroke: #f59e0b; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #16a34a; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="960"/>

  <text class="title" x="56" y="64">真实 K 线里：下跌后的底部结构转强确认</text>
  <text class="sub" x="56" y="100">这不是“跌多了就买”。要先看到下降结构被破坏，再看到低点不再降低，最后才考虑转强确认。</text>

  <rect class="panel" x="52" y="132" width="1396" height="612" rx="24"/>
  <rect x="96" y="176" width="1308" height="480" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="128" y1="236" x2="1372" y2="236"/>
  <line class="axis" x1="128" y1="316" x2="1372" y2="316"/>
  <line class="axis" x1="128" y1="396" x2="1372" y2="396"/>
  <line class="axis" x1="128" y1="476" x2="1372" y2="476"/>
  <line class="axis" x1="128" y1="556" x2="1372" y2="556"/>

  <!-- important levels -->
  <line class="downline" x1="188" y1="252" x2="748" y2="392"/>
  <text class="small" x="228" y="236">下降压力线：只作辅助，不是突破确认线</text>

  <line class="lowline" x1="128" y1="568" x2="1372" y2="568"/>
  <text class="small" x="140" y="592">前低 / 防守：再创新低则底部转强失败</text>

  <rect class="zone-blue" x="752" y="348" width="132" height="52" rx="10"/>
  <line class="trigger" x1="756" y1="372" x2="1372" y2="372"/>
  <text class="small" x="772" y="342">最近下降小高点：用反弹失败 K 线的高点画水平压力线</text>

  <line class="confirm" x1="928" y1="354" x2="1372" y2="354"/>
  <text class="small" x="944" y="334">普通确认：第一根收盘站上下降小高点</text>

  <line class="confirm" x1="1112" y1="448" x2="1372" y2="448"/>
  <text class="small" x="1128" y="474">稳健确认：回踩不破前低，再次向上</text>

  <line class="fail" x1="784" y1="600" x2="1372" y2="600"/>
  <text class="small" x="930" y="624">失败线：回踩后再创新低</text>

  <!-- candles: noisy downtrend, base, breakout, retest -->
  <g>
    <!-- downtrend -->
    <line class="wick-down" x1="152" y1="220" x2="152" y2="356"/><rect class="down" x="138" y="260" width="28" height="60"/>
    <line class="wick-up" x1="204" y1="236" x2="204" y2="332"/><rect class="up" x="190" y="270" width="28" height="34"/>
    <line class="wick-down" x1="256" y1="288" x2="256" y2="420"/><rect class="down" x="242" y="318" width="28" height="70"/>
    <line class="wick-down" x1="308" y1="340" x2="308" y2="480"/><rect class="down" x="294" y="372" width="28" height="76"/>
    <line class="wick-up" x1="360" y1="328" x2="360" y2="432"/><rect class="up" x="346" y="360" width="28" height="44"/>
    <line class="wick-down" x1="412" y1="384" x2="412" y2="528"/><rect class="down" x="398" y="420" width="28" height="74"/>
    <line class="wick-up" x1="464" y1="376" x2="464" y2="488"/><rect class="up" x="450" y="414" width="28" height="42"/>
    <line class="wick-down" x1="516" y1="428" x2="516" y2="572"/><rect class="down" x="502" y="462" width="28" height="74"/>
    <!-- first no-new-low and messy base -->
    <line class="wick-up" x1="568" y1="456" x2="568" y2="580"/><rect class="up" x="554" y="498" width="28" height="46"/>
    <line class="wick-down" x1="620" y1="468" x2="620" y2="560"/><rect class="down" x="606" y="494" width="28" height="34"/>
    <line class="wick-up" x1="672" y1="432" x2="672" y2="552"/><rect class="up" x="658" y="472" width="28" height="48"/>
    <line class="wick-up" x1="724" y1="388" x2="724" y2="520"/><rect class="up" x="710" y="430" width="28" height="62"/>
    <line class="wick-down" x1="776" y1="372" x2="776" y2="512"/><rect class="down" x="762" y="410" width="28" height="62"/>
    <line class="wick-up" x1="828" y1="386" x2="828" y2="532"/><rect class="up" x="814" y="432" width="28" height="54"/>
    <!-- breakout -->
    <line class="wick-up" x1="880" y1="350" x2="880" y2="476"/><rect class="up" x="866" y="386" width="28" height="58"/>
    <line class="wick-up" x1="932" y1="320" x2="932" y2="420"/><rect class="up" x="918" y="354" width="28" height="42"/>
    <line class="wick-up" x1="984" y1="292" x2="984" y2="398"/><rect class="up" x="970" y="326" width="28" height="46"/>
    <!-- retest not breaking low -->
    <line class="wick-down" x1="1036" y1="332" x2="1036" y2="468"/><rect class="down" x="1022" y="364" width="28" height="64"/>
    <line class="wick-down" x1="1088" y1="392" x2="1088" y2="544"/><rect class="down" x="1074" y="424" width="28" height="82"/>
    <line class="wick-up" x1="1140" y1="420" x2="1140" y2="556"/><rect class="up" x="1126" y="462" width="28" height="56"/>
    <line class="wick-up" x1="1192" y1="372" x2="1192" y2="504"/><rect class="up" x="1178" y="410" width="28" height="62"/>
    <line class="wick-up" x1="1244" y1="312" x2="1244" y2="452"/><rect class="up" x="1230" y="350" width="28" height="72"/>
    <line class="wick-down" x1="1296" y1="332" x2="1296" y2="424"/><rect class="down" x="1282" y="358" width="28" height="38"/>
    <line class="wick-up" x1="1348" y1="264" x2="1348" y2="396"/><rect class="up" x="1334" y="304" width="28" height="58"/>
  </g>

  <!-- swing skeleton -->
  <path class="swing" d="M152 260 L204 236 L308 448 L360 328 L516 536 L568 498 L620 528 L776 372 L828 486 L932 354 L1140 518 L1244 312 L1348 264"/>

  <!-- zones -->
  <rect class="zone-red" x="136" y="248" width="396" height="324" rx="10"/>
  <text class="tiny" x="148" y="640">左侧：下降趋势仍在，不因为跌多就买</text>
  <rect class="zone-orange" x="548" y="496" width="108" height="72" rx="10"/>
  <rect class="zone-blue" x="752" y="348" width="140" height="164" rx="10"/>
  <rect class="zone-green" x="968" y="324" width="332" height="228" rx="10"/>

  <!-- key dots and labels -->
  <circle class="dot dot-red" cx="516" cy="536" r="13"/>
  <text class="txt" x="532" y="542">前低</text>

  <circle class="dot dot-orange" cx="568" cy="498" r="13"/>
  <text class="txt" x="584" y="504">第一次不创新低</text>
  <text class="tiny" x="584" y="528">只是止跌观察</text>

  <circle class="dot dot-blue" cx="776" cy="372" r="13"/>
  <text class="txt" x="792" y="378">最近下降小高点</text>
  <text class="tiny" x="792" y="402">后面回落，确认这里是压力</text>

  <circle class="dot dot-green" cx="932" cy="354" r="14"/>
  <text class="txt" x="948" y="360">普通确认</text>
  <text class="tiny" x="948" y="384">收盘突破水平压力线</text>

  <circle class="dot dot-orange" cx="1140" cy="518" r="13"/>
  <text class="txt" x="1156" y="524">回踩不破前低</text>

  <circle class="dot dot-green" cx="1244" cy="312" r="14"/>
  <text class="txt" x="1260" y="318">稳健确认</text>
  <text class="tiny" x="1260" y="342">再次向上</text>

  <!-- failure ghost -->
  <path d="M932 354 C1012 432 1110 560 1180 616" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 7" opacity=".75"/>
  <circle class="dot dot-red" cx="1180" cy="616" r="11" opacity=".9"/>
  <text class="tiny" x="1196" y="622">失败路径：回踩再创新低</text>

  <!-- step cards -->
  <rect class="box box-red" x="112" y="672" width="260" height="56" rx="12"/>
  <text class="txt" x="136" y="706">① 下降仍在：不抄底</text>

  <rect class="box box-orange" x="404" y="672" width="280" height="56" rx="12"/>
  <text class="txt" x="428" y="706">② 不创新低：只观察</text>

  <rect class="box box-blue" x="716" y="672" width="292" height="56" rx="12"/>
  <text class="txt" x="740" y="706">③ 突破水平小高点</text>

  <rect class="box box-green" x="1040" y="672" width="300" height="56" rx="12"/>
  <text class="txt" x="1064" y="706">④ 回踩不破后再上</text>

  <!-- bottom summary -->
  <rect class="panel" x="72" y="788" width="1356" height="108" rx="20"/>
  <text class="txt" x="104" y="824">判断流程：</text>
  <text class="txt" x="204" y="824">下降趋势 → 第一次不创新低 → 突破最近下降小高点 → 回踩不破前低 → 再次向上。</text>
  <text class="small" x="104" y="856">普通确认：收盘突破下降小高点。稳健确认：突破后回踩不破前低，再向上。</text>
  <text class="small" x="104" y="880">失效：回踩再创新低。底部转强最忌“跌多了就买”，必须等结构给证据。学习用途，不构成投资建议。</text>
</svg>
