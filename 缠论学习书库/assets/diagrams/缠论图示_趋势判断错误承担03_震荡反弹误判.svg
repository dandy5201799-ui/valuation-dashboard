<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#dbe3ef;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#64748b}
      .h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#64748b}
      .grid{stroke:#e5eaf2;stroke-width:1}
      .axis{stroke:#cbd5e1;stroke-width:1}
      .k-red{fill:#ef4444;stroke:#dc2626;stroke-width:2}
      .k-green{fill:#22c55e;stroke:#16a34a;stroke-width:2}
      .wick-red{stroke:#dc2626;stroke-width:3;stroke-linecap:round}
      .wick-green{stroke:#16a34a;stroke-width:3;stroke-linecap:round}
      .swing{fill:none;stroke:#475569;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
      .upper{stroke:#2563eb;stroke-width:4}
      .lower{stroke:#16a34a;stroke-width:4}
      .fail{stroke:#dc2626;stroke-width:4;stroke-dasharray:9 7}
      .range{fill:#e0f2fe;stroke:#38bdf8;stroke-width:1.5}
      .watch{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
      .bad{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
      .tag{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:800}
      .tagbox{fill:#fff;stroke-width:2}
      .node-focus{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .node-bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .node-blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .node-green{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1440" height="940"/>
  <text class="title" x="64" y="64">趋势判断错误承担 03：把“震荡反弹”误判成新上升趋势</text>
  <text class="sub" x="64" y="100">震荡区间里的上涨，只能先当区间反弹；没有收盘突破上沿并回踩守住，不能升级为新上升趋势。</text>

  <rect class="panel" x="64" y="136" width="1312" height="516" rx="18"/>

  <g transform="translate(104,176)">
    <rect x="0" y="0" width="860" height="400" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <line class="grid" x1="0" y1="80" x2="860" y2="80"/>
    <line class="grid" x1="0" y1="160" x2="860" y2="160"/>
    <line class="grid" x1="0" y1="240" x2="860" y2="240"/>
    <line class="grid" x1="0" y1="320" x2="860" y2="320"/>
    <line class="axis" x1="0" y1="400" x2="860" y2="400"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="400"/>

    <rect class="range" x="64" y="108" width="656" height="188" rx="10" opacity="0.42"/>
    <rect class="watch" x="420" y="248" width="192" height="48" rx="8" opacity="0.75"/>
    <rect class="bad" x="588" y="296" width="196" height="64" rx="8" opacity="0.75"/>

    <line class="upper" x1="0" y1="108" x2="860" y2="108"/>
    <line class="lower" x1="0" y1="296" x2="860" y2="296"/>
    <line class="fail" x1="0" y1="328" x2="860" y2="328"/>

    <!-- K bars in range -->
    <g>
      <line class="wick-green" x1="56" y1="264" x2="56" y2="332"/><rect class="k-green" x="44" y="284" width="24" height="28"/>
      <line class="wick-red" x1="124" y1="128" x2="124" y2="196"/><rect class="k-red" x="112" y="144" width="24" height="40"/>
      <line class="wick-green" x1="192" y1="244" x2="192" y2="320"/><rect class="k-green" x="180" y="264" width="24" height="32"/>
      <line class="wick-red" x1="260" y1="116" x2="260" y2="184"/><rect class="k-red" x="248" y="132" width="24" height="36"/>
      <line class="wick-green" x1="328" y1="236" x2="328" y2="312"/><rect class="k-green" x="316" y="260" width="24" height="28"/>
      <line class="wick-red" x1="396" y1="124" x2="396" y2="204"/><rect class="k-red" x="384" y="148" width="24" height="44"/>
      <line class="wick-green" x1="464" y1="252" x2="464" y2="324"/><rect class="k-green" x="452" y="276" width="24" height="28"/>
      <line class="wick-green" x1="532" y1="200" x2="532" y2="296"/><rect class="k-green" x="520" y="228" width="24" height="48"/>
      <line class="wick-red" x1="600" y1="112" x2="600" y2="188"/><rect class="k-red" x="588" y="132" width="24" height="44"/>
      <line class="wick-red" x1="668" y1="116" x2="668" y2="216"/><rect class="k-red" x="656" y="144" width="24" height="52"/>
      <line class="wick-green" x1="736" y1="260" x2="736" y2="340"/><rect class="k-green" x="724" y="288" width="24" height="32"/>
      <line class="wick-red" x1="804" y1="304" x2="804" y2="372"/><rect class="k-red" x="792" y="328" width="24" height="28"/>
    </g>

    <path class="swing" d="M56 312 L124 144 L192 296 L260 132 L328 288 L396 148 L464 300 L532 228 L600 132 L668 196 L736 304 L804 356"/>

    <circle cx="192" cy="296" r="9" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <circle cx="328" cy="288" r="9" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <circle cx="464" cy="300" r="9" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <circle cx="124" cy="144" r="9" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="260" cy="132" r="9" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="600" cy="132" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="804" cy="356" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>

    <rect class="tagbox" x="84" y="68" width="180" height="40" rx="8" stroke="#2563eb"/>
    <text class="tag" x="100" y="94" fill="#2563eb">震荡上沿：压力</text>

    <rect class="tagbox" x="264" y="296" width="196" height="40" rx="8" stroke="#16a34a"/>
    <text class="tag" x="280" y="322" fill="#15803d">震荡下沿：观察区</text>

    <rect class="tagbox" x="516" y="84" width="244" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="532" y="110" fill="#dc2626">冲到上沿，不等于趋势恢复</text>

    <rect class="tagbox" x="584" y="332" width="220" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="600" y="358" fill="#dc2626">有效跌破下沿：区间失败</text>

    <text class="tiny" x="36" y="104" fill="#2563eb">上沿：突破前是压力</text>
    <text class="tiny" x="36" y="292" fill="#15803d">下沿：只适合观察修复</text>
    <text class="tiny" x="36" y="324" fill="#dc2626">失败线</text>
  </g>

  <g transform="translate(1000,176)">
    <rect class="node-focus" x="0" y="0" width="328" height="84" rx="12"/>
    <text class="h" x="24" y="34">错误假设</text>
    <text class="small" x="24" y="62">“下沿反弹 = 新上升趋势”</text>

    <path d="M164 96 L164 128" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <polygon points="164,132 292,204 164,276 36,204" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="h" x="164" y="192" text-anchor="middle">是否收盘突破</text>
    <text class="h" x="164" y="220" text-anchor="middle">震荡上沿？</text>

    <path d="M164 276 L164 324" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <rect x="172" y="288" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="180" y="304" fill="#dc2626">否</text>

    <path d="M292 204 L324 204 L324 324" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="292" y="184" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="300" y="200" fill="#2563eb">是</text>

    <rect class="node-bad" x="0" y="324" width="220" height="80" rx="12"/>
    <text class="h" x="24" y="356">仍是震荡</text>
    <text class="small" x="24" y="384">上沿不过：不加仓</text>
    <text class="small" x="24" y="404">靠上沿反而要防回落</text>

    <rect class="node-blue" x="244" y="324" width="220" height="80" rx="12"/>
    <text class="h" x="268" y="356">普通转强</text>
    <text class="small" x="268" y="384">只是第一确认；还需</text>
    <text class="small" x="268" y="404">回踩上沿不跌回区间</text>
  </g>

  <g transform="translate(64,684)">
    <rect class="panel" x="0" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="28" y="40">1. 错在哪里？</text>
    <text class="txt" x="28" y="78">震荡区里的反弹很像上涨，</text>
    <text class="txt" x="28" y="108">但只要没突破上沿，</text>
    <text class="txt" x="28" y="138">它仍然只是区间运动。</text>

    <rect class="panel" x="452" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="480" y="40">2. 怎么承担？</text>
    <text class="txt" x="480" y="78">下沿买错：失败线看下沿下方。</text>
    <text class="txt" x="480" y="108">上沿追错：上沿不过要降仓。</text>
    <text class="txt" x="480" y="138">跌破下沿：区间判断失败。</text>

    <rect class="panel" x="904" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="932" y="40">3. 什么时候才升级？</text>
    <text class="txt" x="932" y="78">收盘突破上沿 = 普通确认。</text>
    <text class="txt" x="932" y="108">回踩上沿不跌回区间，</text>
    <text class="txt" x="932" y="138">再次向上 = 稳健确认。</text>
  </g>

  <line x1="64" y1="900" x2="1376" y2="900" stroke="#dbe3ef"/>
  <text class="tiny" x="64" y="924">学习用途：这张图只讲结构识别与风险承担，不构成任何投资建议。</text>
</svg>
