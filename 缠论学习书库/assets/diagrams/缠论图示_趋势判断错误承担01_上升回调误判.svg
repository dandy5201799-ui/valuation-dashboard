<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#dbe3ef;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#64748b}
      .h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#64748b}
      .axis{stroke:#cbd5e1;stroke-width:1}
      .grid{stroke:#e5eaf2;stroke-width:1}
      .k-red{fill:#ef4444;stroke:#dc2626;stroke-width:2}
      .k-green{fill:#22c55e;stroke:#16a34a;stroke-width:2}
      .wick-red{stroke:#dc2626;stroke-width:3;stroke-linecap:round}
      .wick-green{stroke:#16a34a;stroke-width:3;stroke-linecap:round}
      .swing{fill:none;stroke:#475569;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
      .defense{stroke:#f59e0b;stroke-width:4}
      .fail{stroke:#dc2626;stroke-width:4;stroke-dasharray:9 7}
      .confirm{stroke:#2563eb;stroke-width:4;stroke-dasharray:9 7}
      .zone{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}
      .badzone{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
      .goodzone{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}
      .tag{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:800}
      .tagbox{fill:#fff;stroke-width:2}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .node-focus{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .node-bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .node-good{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1440" height="940"/>
  <text class="title" x="64" y="64">趋势判断错误承担 01：把“上升回调”误判成可以买</text>
  <text class="sub" x="64" y="100">重点：靠近防守位只是观察区；真正承担错误的是“有效跌破失败线”这一刻，而不是用希望继续解释。</text>

  <rect class="panel" x="64" y="136" width="1312" height="516" rx="18"/>

  <!-- chart area -->
  <g transform="translate(104,176)">
    <rect x="0" y="0" width="860" height="400" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <line class="grid" x1="0" y1="80" x2="860" y2="80"/>
    <line class="grid" x1="0" y1="160" x2="860" y2="160"/>
    <line class="grid" x1="0" y1="240" x2="860" y2="240"/>
    <line class="grid" x1="0" y1="320" x2="860" y2="320"/>
    <line class="axis" x1="0" y1="400" x2="860" y2="400"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="400"/>

    <!-- zones -->
    <rect class="zone" x="424" y="224" width="304" height="48" rx="8" opacity="0.75"/>
    <rect class="badzone" x="424" y="272" width="304" height="76" rx="8" opacity="0.85"/>
    <rect class="goodzone" x="424" y="144" width="244" height="80" rx="8" opacity="0.45"/>

    <!-- lines -->
    <line class="defense" x1="0" y1="248" x2="860" y2="248"/>
    <line class="fail" x1="0" y1="284" x2="860" y2="284"/>
    <line class="confirm" x1="0" y1="148" x2="860" y2="148"/>

    <!-- K bars -->
    <g>
      <line class="wick-green" x1="56" y1="300" x2="56" y2="356"/><rect class="k-green" x="44" y="312" width="24" height="28"/>
      <line class="wick-red" x1="128" y1="208" x2="128" y2="268"/><rect class="k-red" x="116" y="220" width="24" height="44"/>
      <line class="wick-green" x1="204" y1="232" x2="204" y2="292"/><rect class="k-green" x="192" y="244" width="24" height="36"/>
      <line class="wick-red" x1="292" y1="116" x2="292" y2="192"/><rect class="k-red" x="280" y="128" width="24" height="56"/>
      <line class="wick-green" x1="372" y1="172" x2="372" y2="256"/><rect class="k-green" x="360" y="192" width="24" height="44"/>
      <line class="wick-red" x1="452" y1="140" x2="452" y2="248"/><rect class="k-red" x="440" y="160" width="24" height="72"/>
      <line class="wick-green" x1="520" y1="216" x2="520" y2="280"/><rect class="k-green" x="508" y="236" width="24" height="32"/>
      <line class="wick-red" x1="588" y1="228" x2="588" y2="300"/><rect class="k-red" x="576" y="248" width="24" height="40"/>
      <line class="wick-red" x1="656" y1="260" x2="656" y2="340"/><rect class="k-red" x="644" y="284" width="24" height="44"/>
      <line class="wick-green" x1="724" y1="292" x2="724" y2="352"/><rect class="k-green" x="712" y="304" width="24" height="28"/>
      <line class="wick-red" x1="792" y1="308" x2="792" y2="372"/><rect class="k-red" x="780" y="324" width="24" height="36"/>
    </g>

    <!-- swing line -->
    <path class="swing" d="M56 340 L128 220 L204 268 L292 128 L372 236 L452 160 L520 268 L588 248 L656 328 L724 304 L792 356"/>

    <!-- key point circles -->
    <circle cx="372" cy="236" r="9" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="520" cy="268" r="9" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="656" cy="328" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <circle cx="452" cy="160" r="8" fill="#fff" stroke="#2563eb" stroke-width="4"/>

    <!-- labels -->
    <rect class="tagbox" x="40" y="216" width="168" height="40" rx="8" stroke="#f59e0b"/>
    <text class="tag" x="56" y="242" fill="#b45309">防守位：最近低点</text>
    <rect class="tagbox" x="428" y="196" width="184" height="40" rx="8" stroke="#f59e0b"/>
    <text class="tag" x="444" y="222" fill="#b45309">观察区：只能观察</text>
    <rect class="tagbox" x="596" y="292" width="196" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="612" y="318" fill="#dc2626">有效跌破：判断失败</text>
    <rect class="tagbox" x="500" y="104" width="232" height="40" rx="8" stroke="#2563eb"/>
    <text class="tag" x="516" y="130" fill="#2563eb">若重新站上小高点才修复</text>

    <text class="tiny" x="752" y="252" fill="#b45309">防守线</text>
    <text class="tiny" x="752" y="288" fill="#dc2626">失败线</text>
    <text class="tiny" x="752" y="144" fill="#2563eb">修复确认线</text>
  </g>

  <!-- right explanation -->
  <g transform="translate(1000,176)">
    <rect class="node-focus" x="0" y="0" width="328" height="92" rx="12"/>
    <text class="h" x="24" y="34">你的原判断</text>
    <text class="small" x="24" y="62">“这里还是上升趋势回调”</text>
    <text class="small" x="24" y="84">成立条件：防守区不能被有效跌破</text>

    <path d="M164 104 L164 132" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <polygon points="164,136 292,208 164,280 36,208" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="h" x="164" y="196" text-anchor="middle">有没有有效跌破</text>
    <text class="h" x="164" y="222" text-anchor="middle">失败线？</text>

    <path d="M292 208 L324 208 L324 328" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <rect x="292" y="188" width="42" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="300" y="204" fill="#dc2626">是</text>

    <path d="M164 280 L164 328" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="172" y="292" width="42" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="180" y="308" fill="#16a34a">否</text>

    <rect class="node-good" x="0" y="328" width="220" height="72" rx="12"/>
    <text class="h" x="24" y="360">继续观察</text>
    <text class="small" x="24" y="388">等二次不破 + 突破小高点</text>

    <rect class="node-bad" x="244" y="328" width="220" height="72" rx="12"/>
    <text class="h" x="268" y="360">承认判断错</text>
    <text class="small" x="268" y="388">退出 / 降级为破防修复观察</text>
  </g>

  <!-- bottom cards -->
  <g transform="translate(64,684)">
    <rect class="panel" x="0" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="28" y="40">1. 错误发生在哪里？</text>
    <text class="txt" x="28" y="78">不是“看成上升回调”本身错。</text>
    <text class="txt" x="28" y="108">真正的错，是把观察区当买点，</text>
    <text class="txt" x="28" y="138">并且破防后还不承认假设失败。</text>

    <rect class="panel" x="452" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="480" y="40">2. 失败线怎么设？</text>
    <text class="txt" x="480" y="78">以上升趋势最后一个被确认的</text>
    <text class="txt" x="480" y="108">有效低点为防守区。</text>
    <text class="txt" x="480" y="138">有效跌破防守区下沿 = 判断失败。</text>

    <rect class="panel" x="904" y="0" width="408" height="176" rx="16"/>
    <text class="h" x="932" y="40">3. 怎么承担？</text>
    <text class="txt" x="932" y="78">先退出或减到可承受仓位。</text>
    <text class="txt" x="932" y="108">然后重新按“破防后修复”判断，</text>
    <text class="txt" x="932" y="138">不再用旧上升趋势安慰自己。</text>
  </g>

  <line x1="64" y1="900" x2="1376" y2="900" stroke="#dbe3ef"/>
  <text class="tiny" x="64" y="924">学习用途：这张图只讲结构识别与风险承担，不构成任何投资建议。</text>
</svg>
