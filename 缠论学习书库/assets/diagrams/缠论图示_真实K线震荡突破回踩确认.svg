<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 740; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .swing { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .range-zone { fill: rgba(37, 99, 235, .08); stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 7; }
      .upper { stroke: #2563eb; stroke-width: 5; }
      .lower { stroke: #16a34a; stroke-width: 4; stroke-dasharray: 8 7; }
      .retest { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .confirm { stroke: #16a34a; stroke-width: 5; }
      .fail { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-blue { fill: #2563eb; }
      .dot-green { fill: #16a34a; }
      .dot-orange { fill: #f59e0b; }
      .dot-red { fill: #dc2626; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #16a34a; }
      .box-orange { stroke: #f59e0b; }
      .box-red { stroke: #dc2626; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="960"/>

  <text class="title" x="56" y="64">真实 K 线里：震荡突破后的回踩确认</text>
  <text class="sub" x="56" y="100">刚突破上沿只是第一层确认；更稳健的入手点，是突破后回踩上沿不破，再次向上。</text>

  <rect class="panel" x="52" y="132" width="1396" height="600" rx="24"/>
  <rect x="96" y="176" width="1308" height="468" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="128" y1="236" x2="1372" y2="236"/>
  <line class="axis" x1="128" y1="316" x2="1372" y2="316"/>
  <line class="axis" x1="128" y1="396" x2="1372" y2="396"/>
  <line class="axis" x1="128" y1="476" x2="1372" y2="476"/>
  <line class="axis" x1="128" y1="556" x2="1372" y2="556"/>

  <!-- range -->
  <rect class="range-zone" x="128" y="332" width="684" height="164" rx="10"/>
  <line class="upper" x1="128" y1="332" x2="1372" y2="332"/>
  <text class="small" x="140" y="320">震荡上沿：多次反弹过不去</text>
  <line class="lower" x1="128" y1="496" x2="812" y2="496"/>
  <text class="small" x="140" y="518">震荡下沿：多次回落跌不穿</text>

  <!-- retest/fail -->
  <line class="retest" x1="812" y1="348" x2="1372" y2="348"/>
  <text class="small" x="824" y="372">回踩区：原上沿被突破后，变成支撑观察区</text>
  <line class="fail" x1="812" y1="376" x2="1372" y2="376"/>
  <text class="small" x="1050" y="402">失效：收盘跌回箱体内太深</text>

  <!-- candles in range -->
  <g>
    <line class="wick-up" x1="164" y1="424" x2="164" y2="504"/><rect class="up" x="150" y="454" width="28" height="30"/>
    <line class="wick-up" x1="220" y1="340" x2="220" y2="456"/><rect class="up" x="206" y="376" width="28" height="54"/>
    <line class="wick-down" x1="276" y1="352" x2="276" y2="496"/><rect class="down" x="262" y="384" width="28" height="74"/>
    <line class="wick-down" x1="332" y1="412" x2="332" y2="520"/><rect class="down" x="318" y="442" width="28" height="52"/>
    <line class="wick-up" x1="388" y1="348" x2="388" y2="504"/><rect class="up" x="374" y="388" width="28" height="78"/>
    <line class="wick-down" x1="444" y1="336" x2="444" y2="472"/><rect class="down" x="430" y="368" width="28" height="72"/>
    <line class="wick-up" x1="500" y1="424" x2="500" y2="508"/><rect class="up" x="486" y="452" width="28" height="34"/>
    <line class="wick-up" x1="556" y1="344" x2="556" y2="484"/><rect class="up" x="542" y="384" width="28" height="72"/>
    <line class="wick-down" x1="612" y1="340" x2="612" y2="508"/><rect class="down" x="598" y="376" width="28" height="90"/>
    <line class="wick-up" x1="668" y1="432" x2="668" y2="512"/><rect class="up" x="654" y="454" width="28" height="32"/>
    <line class="wick-up" x1="724" y1="336" x2="724" y2="488"/><rect class="up" x="710" y="376" width="28" height="80"/>
  </g>

  <!-- breakout and retest -->
  <g>
    <line class="wick-up" x1="812" y1="268" x2="812" y2="388"/><rect class="up" x="798" y="304" width="28" height="48"/>
    <line class="wick-up" x1="868" y1="236" x2="868" y2="340"/><rect class="up" x="854" y="268" width="28" height="42"/>
    <line class="wick-down" x1="924" y1="284" x2="924" y2="364"/><rect class="down" x="910" y="306" width="28" height="34"/>
    <line class="wick-down" x1="980" y1="304" x2="980" y2="360"/><rect class="down" x="966" y="320" width="28" height="24"/>
    <line class="wick-up" x1="1036" y1="292" x2="1036" y2="356"/><rect class="up" x="1022" y="314" width="28" height="26"/>
    <line class="wick-up" x1="1092" y1="244" x2="1092" y2="332"/><rect class="up" x="1078" y="272" width="28" height="36"/>
    <line class="wick-up" x1="1148" y1="212" x2="1148" y2="304"/><rect class="up" x="1134" y="244" width="28" height="36"/>
  </g>

  <!-- failure ghost path -->
  <path d="M868 268 C928 300 988 348 1048 404" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 7" opacity=".7"/>
  <circle class="dot dot-red" cx="1048" cy="404" r="11" opacity=".9"/>
  <text class="tiny" x="1064" y="410">失败路径：跌回箱体</text>

  <path class="swing" d="M164 484 L220 340 L332 494 L444 336 L500 486 L612 340 L668 486 L724 336 L812 304 L868 268 L980 344 L1036 314 L1148 244"/>

  <!-- key dots -->
  <circle class="dot dot-blue" cx="444" cy="336" r="11"/>
  <circle class="dot dot-blue" cx="612" cy="340" r="11"/>
  <circle class="dot dot-blue" cx="724" cy="336" r="11"/>
  <text class="tiny" x="472" y="300">多次过不去 → 上沿成立</text>

  <circle class="dot dot-green" cx="812" cy="304" r="13"/>
  <text class="txt" x="828" y="310">普通确认</text>
  <text class="tiny" x="828" y="334">收盘突破上沿</text>

  <circle class="dot dot-orange" cx="980" cy="344" r="13"/>
  <text class="txt" x="996" y="350">回踩不破</text>
  <text class="tiny" x="996" y="374">跌不回箱体</text>

  <circle class="dot dot-green" cx="1092" cy="272" r="14"/>
  <text class="txt" x="1108" y="278">稳健确认</text>
  <text class="tiny" x="1108" y="302">再次向上</text>

  <!-- callout boxes -->
  <rect class="box box-blue" x="1168" y="452" width="196" height="84" rx="12"/>
  <text class="txt" x="1190" y="484">普通确认</text>
  <text class="small" x="1190" y="512">突破上沿收盘站上</text>

  <rect class="box box-green" x="1168" y="552" width="196" height="72" rx="12"/>
  <text class="txt" x="1190" y="582">稳健确认</text>
  <text class="small" x="1190" y="608">回踩不破再上</text>

  <!-- bottom steps -->
  <rect class="panel" x="52" y="764" width="1396" height="132" rx="24"/>
  <rect class="box box-blue" x="92" y="800" width="296" height="64" rx="12"/>
  <text class="txt" x="116" y="828">① 先画震荡上下沿</text>
  <text class="small" x="116" y="852">至少两次上沿/下沿验证</text>

  <rect class="box box-green" x="424" y="800" width="296" height="64" rx="12"/>
  <text class="txt" x="448" y="828">② 收盘突破上沿</text>
  <text class="small" x="448" y="852">普通确认，但可能假突破</text>

  <rect class="box box-orange" x="756" y="800" width="296" height="64" rx="12"/>
  <text class="txt" x="780" y="828">③ 回踩上沿不破</text>
  <text class="small" x="780" y="852">原压力变支撑</text>

  <rect class="box box-green" x="1088" y="800" width="296" height="64" rx="12"/>
  <text class="txt" x="1112" y="828">④ 再次向上</text>
  <text class="small" x="1112" y="852">稳健确认点出现</text>

  <rect x="84" y="916" width="1332" height="44" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text class="txt" x="112" y="944">口诀：震荡突破不是一冲就完事；突破站上是普通确认，回踩不跌回箱体再向上，才是更稳健的确认。</text>
</svg>
