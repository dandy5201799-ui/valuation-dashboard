<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第7章 · 大图小图演示器</title>
<link rel="stylesheet" href="demo-base.css">
<style>
  .chart{min-height:520px;}
  .pan-label{font-size:11px;font-weight:700;fill:#5f5b55;}
</style>
</head>
<body>
<div class="demo">
  <div class="demo-head">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="demo-title">大图小图演示器</div>
    <div class="demo-sub">第7章 · 日线定方向，30分钟找入场：把回调放大，看小图里怎么给确认</div>
  </div>

  <div class="chart">
    <svg id="svg" class="chart-svg" viewBox="0 0 720 560" role="img" aria-label="大图小图联动演示"></svg>
  </div>

  <div class="controls">
    <div class="ctl-group">
      <span class="lbl">放大日线第几天：</span>
      <input id="daySlider" type="range" min="7" max="11" step="1" value="11" style="width:180px">
      <span id="dayLabel" class="mono" style="font-size:11px;color:var(--muted)">07-11</span>
    </div>
    <div class="ctl-group" style="margin-left:auto">
      <button class="btn" id="playBtn">▶ 顺一遍</button>
      <button class="btn" id="resetBtn">回到确认日</button>
    </div>
  </div>

  <div class="verdict">
    <span class="chip watch" id="verdictChip">大图观察</span>
    <span class="vtext" id="verdictText">大图（日线）：上升趋势里回调到防守位，进入观察。拖动滑块，看同一段回调在30分钟里怎么演变。</span>
  </div>

  <div class="hint"><b>怎么玩：</b>把滑块从 07-07 拖到 07-11：日线只是“一根阴线→一根阳线”，30分钟里却是一段完整的<b>下跌→反弹→再跌→站回→突破确认</b>。这就是大图定方向、小图找入场——入场点在小图确认的那一刻，失败线用你进场那一层的防守位。</div>
</div>

<script>
(function(){
  var W = 720, H = 560;
  var DAILY = [
    {d:"07-01", o:100.0, h:101.4, l:99.3,  c:100.6},
    {d:"07-02", o:101.0, h:107.8, l:100.7, c:106.8},
    {d:"07-03", o:106.6, h:108.6, l:103.7, c:104.4},
    {d:"07-06", o:104.7, h:114.2, l:104.2, c:113.5},
    {d:"07-07", o:113.1, h:114.4, l:108.6, c:109.4},
    {d:"07-08", o:109.8, h:118.8, l:109.5, c:117.9},
    {d:"07-09", o:117.0, h:117.2, l:110.2, c:111.0},
    {d:"07-10", o:111.2, h:112.0, l:110.0, c:111.6},
    {d:"07-13", o:111.4, h:111.8, l:110.1, c:110.8},
    {d:"07-14", o:110.9, h:112.4, l:110.0, c:112.1},
    {d:"07-15", o:112.0, h:114.6, l:111.6, c:114.1},
    {d:"07-16", o:114.0, h:117.2, l:113.5, c:116.8},
    {d:"07-17", o:116.6, h:119.8, l:116.2, c:119.2}
  ];
  // 日线第 7-11 天对应的 30 分钟细节（索引 6..10）
  var SUB = {
    7: {bars:[
      [110.9,111.4,110.2,110.6],[110.5,110.8,109.6,109.9],[109.8,110.2,108.9,109.1],
      [109.2,109.6,108.1,108.4],[108.3,108.7,107.5,107.8]
    ], note:"一路阴跌：30分钟里连续跌破，防守位下方"},
    8: {bars:[
      [108.0,108.8,107.8,108.6],[108.5,109.6,108.3,109.4],[109.3,110.3,109.0,110.1],
      [110.0,110.8,109.6,110.5],[110.4,111.6,110.2,111.4]
    ], note:"反弹修复：30分钟止跌回升，没再创新低"},
    9: {bars:[
      [111.2,111.5,110.6,110.8],[110.9,111.3,110.1,110.3],[110.4,110.7,109.8,110.0],
      [110.1,110.4,109.5,109.7],[109.6,110.0,109.2,109.4]
    ], note:"反弹后回落：30分钟里形成小高点（压力）"},
    10: {bars:[
      [109.5,110.2,109.3,110.0],[109.9,110.7,109.7,110.5],[110.4,111.2,110.2,111.0],
      [110.9,111.8,110.7,111.5],[111.4,112.4,111.2,112.2]
    ], note:"站回防守位上方：但还没突破小高点，仍不算确认"},
    11: {bars:[
      [112.0,112.6,111.8,112.4],[112.3,113.2,112.1,113.0],[112.9,113.8,112.7,113.6],
      [113.5,114.4,113.3,114.2],[114.1,115.0,113.9,114.8]
    ], note:"突破确认：30分钟放量站上小高点，小图入场点"}
  };

  var sel = 11, playing = null;
  var svg = document.getElementById("svg");
  function ns(name, attrs){
    var el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function text(x,y,s,attrs){
    var t = ns("text", Object.assign({x:x,y:y,"text-anchor":"middle","font-size":"10.5",fill:"#5f5b55"}, attrs||{}));
    t.textContent = s;
    return t;
  }

  function candles(bars, x0, x1, yTop, yBot, idxLabel){
    // 通用K线绘制（用归一化的 y 范围）
    var mn = Math.min.apply(null, bars.map(function(b){return b[2];}));
    var mx = Math.max.apply(null, bars.map(function(b){return b[1];}));
    var gap = (mx-mn)||1;
    var lo = mn-gap*0.12, hi = mx+gap*0.18;
    function yy(v){ return yTop + (hi-v)/(hi-lo)*(yBot-yTop); }
    var bw = Math.max(3, (x1-x0)/bars.length*0.34);
    for (var k=0;k<=4;k++){
      var v = lo + (hi-lo)*k/4;
      svg.appendChild(ns("line",{x1:x0,y1:yy(v),x2:x1,y2:yy(v),stroke:"#e9e6dd","stroke-width":"1"}));
      svg.appendChild(text(x0-7,yy(v)+3,v.toFixed(1),{"text-anchor":"end","font-size":"9",fill:"#a19c8c"}));
    }
    bars.forEach(function(b,i){
      var x = x0 + i*(x1-x0)/(bars.length-1);
      var up = b[3] >= b[0];
      var col = up ? "#d97757" : "#2f8f6b";
      svg.appendChild(ns("line",{x1:x,y1:yy(b[1]),x2:x,y2:yy(b[2]),stroke:col,"stroke-width":"1.3"}));
      var top = yy(Math.max(b[0],b[3])), bot = yy(Math.min(b[0],b[3]));
      svg.appendChild(ns("rect",{x:x-bw/2,y:top,width:bw,height:Math.max(1.4,bot-top),fill:col,"fill-opacity":"0.88",rx:1}));
      if (idxLabel) svg.appendChild(text(x, yBot+14, i+1, {fill:"#a19c8c","font-size":"8.5"}));
    });
    return {yy:yy, lo:lo, hi:hi};
  }

  function pivots1(bars){
    var out = [];
    for (var i=1;i<bars.length-1;i++){
      if (bars[i][1] > bars[i-1][1] && bars[i][1] > bars[i+1][1]) out.push({i:i,type:"H",v:bars[i][1]});
      if (bars[i][2] < bars[i-1][2] && bars[i][2] < bars[i+1][2]) out.push({i:i,type:"L",v:bars[i][2]});
    }
    return out;
  }

  function draw(){
    svg.innerHTML = "";
    var topY0 = 44, topY1 = 252;      // 日线面板
    var botY0 = 320, botY1 = 528;     // 30分钟面板

    // ===== 日线（大图） =====
    var dX0 = 52, dX1 = 700;
    var c = candles(DAILY.map(function(d){return [d.o,d.h,d.l,d.c];}), dX0, dX1, topY0, topY1, true);
    // 趋势线（从低点连到低点）
    svg.appendChild(ns("line",{x1:dX0,y1:c.yy(99.3),x2:dX1,y2:c.yy(111.6),stroke:"#1f9d63","stroke-width":"2","stroke-dasharray":"1 0","stroke-opacity":"0.65"}));
    svg.appendChild(text(dX0+18, c.yy(99.3)+16, "上升趋势线", {"text-anchor":"start","font-size":"10",fill:"#15734a","font-weight":"700"}));
    // 防守位
    svg.appendChild(ns("line",{x1:dX0,y1:c.yy(110.2),x2:dX1,y2:c.yy(110.2),stroke:"#b8790a","stroke-width":"1.6","stroke-dasharray":"6 4"}));
    svg.appendChild(text(dX1-10, c.yy(110.2)-7, "防守位 110.2", {"text-anchor":"end","font-size":"10",fill:"#8a5a06","font-weight":"700"}));
    // 选中日高亮
    var selDaily = sel-1;
    var sx = dX0 + selDaily*(dX1-dX0)/(DAILY.length-1);
    svg.appendChild(ns("rect",{x:sx-14,y:topY0-10,width:28,height:topY1-topY0+20,fill:"none",stroke:"#181817","stroke-width":"1.6",rx:5}));
    // 面板标题
    svg.appendChild(text((dX0+dX1)/2, topY0-18, "日线 · 大图定方向：上升趋势，回调到防守位 → 观察", {fill:"#5f5b55","font-weight":"700","font-size":"12"}));

    // ===== 30分钟（小图） =====
    var sub = SUB[sel];
    var bX0 = 52, bX1 = 700;
    var c2 = candles(sub.bars, bX0, bX1, botY0, botY1, true);
    svg.appendChild(text((bX0+bX1)/2, botY0-16, "30分钟 · 小图找入场：回调在更小周期里是一段完整走势", {fill:"#5f5b55","font-weight":"700","font-size":"12"}));

    // 小高点/小低点标记
    pivots1(sub.bars).forEach(function(p){
      var x = bX0 + p.i*(bX1-bX0)/(sub.bars.length-1), yy = c2.yy(p.v);
      if (p.type==="H"){
        svg.appendChild(ns("path",{d:"M"+x+" "+(yy-8)+" L"+(x+5)+" "+(yy-1)+" L"+(x-5)+" "+(yy-1)+" Z",fill:"#d97757",stroke:"#fff","stroke-width":"1"}));
        svg.appendChild(text(x, yy-13, "小高点", {fill:"#b3542f","font-weight":"700","font-size":"9"}));
      } else {
        svg.appendChild(ns("path",{d:"M"+x+" "+(yy+8)+" L"+(x+5)+" "+(yy+1)+" L"+(x-5)+" "+(yy+1)+" Z",fill:"#2f8f6b",stroke:"#fff","stroke-width":"1"}));
        svg.appendChild(text(x, yy+19, "小低点", {fill:"#23664c","font-weight":"700","font-size":"9"}));
      }
    });

    // 30分钟压力线（若该日有小高点）
    var hiPivot = pivots1(sub.bars).filter(function(p){return p.type==="H";});
    if (hiPivot.length){
      var hx = bX0 + hiPivot[hiPivot.length-1].i*(bX1-bX0)/(sub.bars.length-1);
      svg.appendChild(ns("line",{x1:bX0,y1:c2.yy(hiPivot[0].v),x2:bX1,y2:c2.yy(hiPivot[0].v),stroke:"#b8790a","stroke-width":"1.4","stroke-dasharray":"5 4"}));
    }

    // 日期标题
    svg.appendChild(text((bX0+bX1)/2, botY1+18, DAILY[selDaily].d + " 的30分钟分解：", {fill:"#8b8677","font-size":"10"}));
    svg.appendChild(text((bX0+bX1)/2, botY1+34, sub.note, {fill:"#393735","font-weight":"700","font-size":"12"}));

    // 结论
    var chip, vtxt;
    if (sel === 11){
      chip = ["ok","小图确认"];
      vtxt = "大图给了方向（上升＋回调防守位），小图在 07-17 这一天给出确认（30分钟站上小高点）→ 这就是具体入场点。失败线用你进场这一层的防守位。";
    } else {
      chip = ["watch","大图观察"];
      vtxt = "大图（日线）依然是上升趋势里的回调，没破防守位 → 观察。小图还在演变：" + sub.note + "，等它给出确认信号再动手。";
    }
    var vc = document.getElementById("verdictChip");
    vc.className = "chip " + chip[0];
    vc.textContent = chip[1];
    document.getElementById("verdictText").textContent = vtxt;
    document.getElementById("dayLabel").textContent = "07-" + String(sel).padStart(2,"0");
  }

  document.getElementById("daySlider").addEventListener("input", function(e){
    sel = +e.target.value;
    draw();
  });
  document.getElementById("playBtn").addEventListener("click", function(){
    if (playing){ clearInterval(playing); playing=null; return; }
    sel = 7;
    var max = 11;
    playing = setInterval(function(){
      if (sel >= max){ clearInterval(playing); playing=null; return; }
      sel++;
      document.getElementById("daySlider").value = sel;
      draw();
    }, 900);
  });
  document.getElementById("resetBtn").addEventListener("click", function(){
    sel = 11;
    document.getElementById("daySlider").value = 11;
    draw();
  });

  draw();
})();
</script>
</body>
</html>
