<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">确认点与两种路径</title>
  <desc id="desc">二次回试更稳，直接突破更快，两种路径都以突破形成确认点。</desc>
  <defs>
    <style>
      .axis{stroke:#d8d4ca;stroke-width:1.1}.sep{stroke:#e9e6dd;stroke-width:1.2}.key{stroke:#d97757;stroke-width:2;stroke-dasharray:8 8}.up{fill:#fff;stroke:#d97757;stroke-width:2}.up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}.down{fill:#e8e5db;stroke:#747069;stroke-width:2}.down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}.trend{fill:none;stroke:#181817;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#181817;stroke:#fff;stroke-width:4}.label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:22px;font-weight:700;fill:#181817}.tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#181817}.white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <line class="sep" x1="92" y1="304" x2="1100" y2="304"/>
  <g transform="translate(96 46)">
    <text class="label" x="52" y="34">路径一：二次回试，更稳</text>
    <line class="axis" x1="40" y1="226" x2="1030" y2="226"/>
    <line class="key" x1="104" y1="202" x2="588" y2="202"/>
    <g>
      <line class="down-wick" x1="104" y1="78" x2="104" y2="158"/><rect class="down" x="93" y="104" width="22" height="32" rx="3"/>
      <line class="down-wick" x1="154" y1="126" x2="154" y2="204"/><rect class="down" x="143" y="150" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="204" y1="142" x2="204" y2="210"/><rect class="up" x="193" y="168" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="254" y1="104" x2="254" y2="188"/><rect class="up" x="243" y="136" width="22" height="30" rx="3"/>
      <line class="down-wick" x1="304" y1="138" x2="304" y2="206"/><rect class="down" x="293" y="162" width="22" height="26" rx="3"/>
      <line class="up-wick" x1="354" y1="128" x2="354" y2="202"/><rect class="up" x="343" y="156" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="404" y1="84" x2="404" y2="176"/><rect class="up" x="393" y="120" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="454" y1="42" x2="454" y2="140"/><rect class="up" x="443" y="82" width="22" height="38" rx="3"/>
    </g>
    <polyline class="trend" points="104,78 154,204 254,104 304,206 354,128 454,42"/>
    <circle class="dot" cx="454" cy="42" r="9"/>
    <text class="tag" x="112" y="194">防守位</text>
    <text class="tag" x="470" y="48">确认点</text>
  </g>
  <g transform="translate(96 328)">
    <text class="label" x="52" y="34">路径二：直接突破，更快</text>
    <line class="axis" x1="40" y1="226" x2="1030" y2="226"/>
    <line class="key" x1="104" y1="202" x2="588" y2="202"/>
    <g>
      <line class="down-wick" x1="104" y1="80" x2="104" y2="160"/><rect class="down" x="93" y="106" width="22" height="32" rx="3"/>
      <line class="down-wick" x1="154" y1="130" x2="154" y2="204"/><rect class="down" x="143" y="154" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="204" y1="130" x2="204" y2="206"/><rect class="up" x="193" y="160" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="254" y1="48" x2="254" y2="190"/><rect class="up" x="243" y="94" width="22" height="72" rx="3"/>
      <line class="up-wick" x1="304" y1="36" x2="304" y2="130"/><rect class="up" x="293" y="72" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="354" y1="22" x2="354" y2="112"/><rect class="up" x="343" y="58" width="22" height="34" rx="3"/>
    </g>
    <polyline class="trend" points="104,80 154,204 204,130 254,48 354,22"/>
    <circle class="dot" cx="254" cy="48" r="9"/>
    <text class="tag" x="112" y="194">防守位</text>
    <text class="tag" x="274" y="54">确认点</text>
  </g>
  <rect x="738" y="498" width="370" height="76" rx="20" fill="#181817"/>
  <text class="white" x="766" y="544">二次回试更稳，直接突破更快</text>
</svg>
