<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">动作计划与失败线</title>
  <desc id="desc">上升趋势回调到防守位后突破确认，入场价、失败线和防守位共同决定仓位。</desc>
  <defs><style>
    .axis{stroke:#d8d4ca;stroke-width:1.2}.def{stroke:#747069;stroke-width:2;stroke-dasharray:9 8}.fail{stroke:#d97757;stroke-width:2.3;stroke-dasharray:9 8}.up{fill:#fff;stroke:#d97757;stroke-width:2}.up-wick{stroke:#d97757;stroke-width:2;stroke-linecap:round}.down{fill:#e8e5db;stroke:#747069;stroke-width:2}.down-wick{stroke:#747069;stroke-width:2;stroke-linecap:round}.trend{fill:none;stroke:#181817;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#181817;stroke:#fff;stroke-width:4}.card{fill:#fff;stroke:#d8d4ca;stroke-width:1.2}.label{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:23px;font-weight:700;fill:#181817}.note{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:500;fill:#747069}.tag{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:700;fill:#181817}.red{fill:#d97757}.white{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-size:21px;font-weight:700;fill:#fff}
  </style></defs>
  <rect width="1200" height="620" fill="#fff"/>
  <g transform="translate(84 58)">
    <line class="axis" x1="42" y1="430" x2="610" y2="430"/><line class="axis" x1="42" y1="72" x2="42" y2="430"/>
    <line class="def" x1="94" y1="332" x2="574" y2="332"/><line class="fail" x1="94" y1="388" x2="574" y2="388"/>
    <g>
      <line class="up-wick" x1="96" y1="302" x2="96" y2="380"/><rect class="up" x="85" y="332" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="146" y1="226" x2="146" y2="326"/><rect class="up" x="135" y="266" width="22" height="38" rx="3"/>
      <line class="up-wick" x1="196" y1="132" x2="196" y2="244"/><rect class="up" x="185" y="176" width="22" height="44" rx="3"/>
      <line class="down-wick" x1="246" y1="194" x2="246" y2="308"/><rect class="down" x="235" y="230" width="22" height="44" rx="3"/>
      <line class="down-wick" x1="296" y1="270" x2="296" y2="360"/><rect class="down" x="285" y="298" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="346" y1="286" x2="346" y2="362"/><rect class="up" x="335" y="314" width="22" height="30" rx="3"/>
      <line class="up-wick" x1="396" y1="232" x2="396" y2="328"/><rect class="up" x="385" y="270" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="446" y1="164" x2="446" y2="274"/><rect class="up" x="435" y="206" width="22" height="44" rx="3"/>
      <line class="up-wick" x1="496" y1="110" x2="496" y2="214"/><rect class="up" x="485" y="150" width="22" height="40" rx="3"/>
    </g>
    <polyline class="trend" points="96,380 196,132 296,360 346,286 496,110"/>
    <circle class="dot" cx="396" cy="232" r="9"/>
    <text class="tag" x="420" y="238">入场价</text><text class="tag" x="112" y="322">防守位</text><text class="tag red" x="112" y="408">失败线</text>
    <g transform="translate(680 72)">
      <rect class="card" x="0" y="0" width="330" height="60" rx="17"/><text class="label" x="24" y="38">为什么做</text>
      <rect class="card" x="0" y="82" width="330" height="60" rx="17"/><text class="label" x="24" y="120">什么时候走人</text>
      <rect class="card" x="0" y="164" width="330" height="60" rx="17"/><text class="label" x="24" y="202">最多亏多少</text>
      <rect class="card" x="0" y="246" width="330" height="60" rx="17"/><text class="label" x="24" y="284">做多少</text>
      <text class="note" x="4" y="362">可承受损失 ÷ 每股可能亏损 = 仓位</text>
    </g>
  </g>
  <rect x="730" y="500" width="390" height="76" rx="20" fill="#181817"/><text class="white" x="758" y="546">理由决定失败线，失败线决定仓位</text>
</svg>
