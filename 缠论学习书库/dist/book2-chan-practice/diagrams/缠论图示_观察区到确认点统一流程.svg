<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .panel{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .box{fill:#fff;stroke:#2d3142;stroke-width:1.3}
      .observe{fill:#fff7ed;stroke:#f59e0b}
      .ordinary{fill:#eff6ff;stroke:#2563eb}
      .robust{fill:#f0fdf4;stroke:#16a34a}
      .fail{fill:#fef2f2;stroke:#dc2626}
      .purple{fill:#f5f3ff;stroke:#7c3aed}
      .txt{font:800 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .label{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .arrow{fill:none;stroke:#4f5d75;stroke-width:2.2;marker-end:url(#arrow)}
      .arrowB{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow-blue)}
      .dash{stroke-dasharray:7 6}
      .lineO{stroke:#f59e0b;stroke-width:3}
      .lineB{stroke:#2563eb;stroke-width:3}
      .lineG{stroke:#16a34a;stroke-width:3}
      .lineR{stroke:#dc2626;stroke-width:3}
      .price{fill:none;stroke:#64748b;stroke-width:2.8;stroke-dasharray:8 7}
      .dotO{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.8}
      .dotB{fill:#eff6ff;stroke:#2563eb;stroke-width:2.8}
      .dotG{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.8}
      .dotR{fill:#fef2f2;stroke:#dc2626;stroke-width:2.8}
    </style>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text class="title" x="64" y="70">从观察区到确认点：统一判断流程</text>
  <text class="sub" x="64" y="102">五类场景虽然关键线不同，但动作顺序相同：先找被市场验证过的关键线，再区分观察、普通确认、稳健确认和失败。</text>

  <!-- top flow -->
  <g>
    <rect class="box" x="96" y="148" width="208" height="76" rx="8"/>
    <text class="txt" x="200" y="180" text-anchor="middle">1 先判结构</text>
    <text class="small" x="200" y="204" text-anchor="middle">上升 / 下降 / 震荡 / 破防</text>

    <rect class="box" x="356" y="148" width="240" height="76" rx="8"/>
    <text class="txt" x="476" y="180" text-anchor="middle">2 找关键线来源</text>
    <text class="small" x="476" y="204" text-anchor="middle">必须是已被右侧验证的点/区</text>

    <rect class="observe" x="648" y="148" width="208" height="76" rx="8"/>
    <text class="txt" x="752" y="180" text-anchor="middle">3 进入观察区</text>
    <text class="small" x="752" y="204" text-anchor="middle">靠近关键线 ≠ 确认</text>

    <rect class="ordinary" x="908" y="148" width="196" height="76" rx="8"/>
    <text class="txt" x="1006" y="180" text-anchor="middle">4 普通确认</text>
    <text class="small" x="1006" y="204" text-anchor="middle">收盘突破确认线</text>

    <rect class="robust" x="1156" y="148" width="180" height="76" rx="8"/>
    <text class="txt" x="1246" y="180" text-anchor="middle">5 稳健确认</text>
    <text class="small" x="1246" y="204" text-anchor="middle">回踩守住再上</text>

    <path class="arrow" d="M304 186 L356 186"/>
    <path class="arrow" d="M596 186 L648 186"/>
    <path class="arrow" d="M856 186 L908 186"/>
    <path class="arrowB" d="M1104 186 L1156 186"/>
  </g>

  <!-- failure branch -->
  <path class="arrow dash" d="M752 224 C752 272 660 292 572 292"/>
  <rect class="fail" x="356" y="256" width="216" height="72" rx="8"/>
  <text class="txt" x="464" y="284" text-anchor="middle">失败</text>
  <text class="small" x="464" y="308" text-anchor="middle">有效跌破/跌回关键区</text>

  <!-- key line table as visual cards -->
  <rect class="panel" x="64" y="364" width="1272" height="396" rx="10"/>
  <text class="txt" x="96" y="404">二、五类场景：关键线分别从哪里来？</text>
  <text class="small" x="96" y="432">你每次不要先问“能不能买”，先问：当前结构里，哪条线能证明这个观察对或错？</text>

  <!-- row headings -->
  <text class="tiny" x="96" y="480">场景</text>
  <text class="tiny" x="316" y="480">关键线来源</text>
  <text class="tiny" x="612" y="480">观察区</text>
  <text class="tiny" x="836" y="480">普通确认</text>
  <text class="tiny" x="1088" y="480">失败线</text>
  <line x1="96" y1="496" x2="1304" y2="496" stroke="rgba(45,49,66,.12)"/>

  <!-- rows -->
  <g transform="translate(96 516)">
    <rect class="observe" x="0" y="0" width="180" height="44" rx="8"/>
    <text class="label" x="16" y="28" fill="#b45309">上升回调</text>
    <text class="small" x="220" y="28">最近被新高确认的回调低点 = 防守位</text>
    <text class="small" x="516" y="28">回调到防守区附近</text>
    <text class="small" x="740" y="28">二次不破后突破回调小高点</text>
    <text class="small" x="992" y="28">有效跌破防守区</text>
  </g>

  <g transform="translate(96 572)">
    <rect class="ordinary" x="0" y="0" width="180" height="44" rx="8"/>
    <text class="label" x="16" y="28" fill="#1d4ed8">下降转强</text>
    <text class="small" x="220" y="28">最近反弹失败小高点 = 水平压力位</text>
    <text class="small" x="516" y="28">压力位下方等待</text>
    <text class="small" x="740" y="28">第一根收盘站上压力位</text>
    <text class="small" x="992" y="28">反弹不过/再创新低</text>
  </g>

  <g transform="translate(96 628)">
    <rect class="robust" x="0" y="0" width="180" height="44" rx="8"/>
    <text class="label" x="16" y="28" fill="#15803d">震荡下沿</text>
    <text class="small" x="220" y="28">两次以上相近低点 = 下沿区</text>
    <text class="small" x="516" y="28">第三次靠近下沿</text>
    <text class="small" x="740" y="28">收回区间并突破修复小高点</text>
    <text class="small" x="992" y="28">有效跌破下沿区</text>
  </g>

  <g transform="translate(96 684)">
    <rect class="purple" x="0" y="0" width="180" height="44" rx="8"/>
    <text class="label" x="16" y="28" fill="#6d28d9">震荡上沿</text>
    <text class="small" x="220" y="28">两次以上相近高点 = 上沿区</text>
    <text class="small" x="516" y="28">上沿附近等待突破</text>
    <text class="small" x="740" y="28">第一根收盘站上上沿区</text>
    <text class="small" x="992" y="28">突破后有效跌回区间</text>
  </g>

  <g transform="translate(96 740)">
    <rect class="fail" x="0" y="0" width="180" height="44" rx="8"/>
    <text class="label" x="16" y="28" fill="#b91c1c">破防接回</text>
    <text class="small" x="220" y="28">破防后反弹失败小高点 = 新压力位</text>
    <text class="small" x="516" y="28">新压力位下方等待</text>
    <text class="small" x="740" y="28">收盘突破新压力位</text>
    <text class="small" x="992" y="28">跌破修复回踩低点</text>
  </g>

  <!-- mini kline formula -->
  <rect class="panel" x="64" y="792" width="1272" height="112" rx="10"/>
  <text class="txt" x="96" y="832">三、所有确认点都遵守同一个小公式</text>
  <g transform="translate(96 852)">
    <path class="price" d="M0 44 L52 12 L104 56 L156 28 L208 64 L260 36 L312 8 L364 40 L416 16"/>
    <line class="lineO" x1="0" y1="52" x2="416" y2="52"/>
    <line class="lineB" x1="220" y1="28" x2="416" y2="28"/>
    <circle class="dotO" cx="208" cy="64" r="8"/>
    <circle class="dotB" cx="312" cy="8" r="8"/>
    <circle class="dotG" cx="416" cy="16" r="8"/>
    <text class="tiny" x="0" y="84">关键位附近 = 观察</text>
    <text class="tiny" x="220" y="84">收盘突破确认线 = 普通确认</text>
    <text class="tiny" x="488" y="24">突破后回踩守住，再次向上 = 稳健确认</text>
    <line class="lineR" x1="636" y1="52" x2="744" y2="52"/>
    <text class="tiny" x="764" y="56">有效跌破/跌回关键区 = 失败</text>
  </g>

  <text class="tiny" x="64" y="944">学习用途，不构成投资建议。本图只讲结构识别：真实操作还要结合级别、波动、仓位和个人风险承受能力。</text>
</svg>
