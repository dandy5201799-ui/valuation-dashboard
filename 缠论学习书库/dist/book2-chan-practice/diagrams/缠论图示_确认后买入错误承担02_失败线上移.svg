<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#dbe3ef;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:800;fill:#0f172a}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#64748b}
      .h{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#334155}
      .small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#64748b}
      .tiny{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:700;fill:#64748b}
      .price{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:700;fill:#475569}
      .grid{stroke:#e5eaf2;stroke-width:1}
      .axis{stroke:#cbd5e1;stroke-width:1}
      .wick-red{stroke:#dc2626;stroke-width:3;stroke-linecap:round}
      .wick-green{stroke:#16a34a;stroke-width:3;stroke-linecap:round}
      .k-red{fill:#ef4444;stroke:#dc2626;stroke-width:2}
      .k-green{fill:#22c55e;stroke:#16a34a;stroke-width:2}
      .swing{fill:none;stroke:#475569;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
      .old-confirm{stroke:#2563eb;stroke-width:4}
      .old-fail{stroke:#94a3b8;stroke-width:4;stroke-dasharray:9 7}
      .new-defense{stroke:#f97316;stroke-width:4}
      .new-fail{stroke:#dc2626;stroke-width:4;stroke-dasharray:9 7}
      .zone-old{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.5}
      .zone-new{fill:#ffedd5;stroke:#f97316;stroke-width:1.5}
      .zone-risk{fill:#fee2e2;stroke:#ef4444;stroke-width:1.5}
      .tagbox{fill:#fff;stroke-width:2}
      .tag{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:800}
      .node-focus{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .node-blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .node-red{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .node-gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1440" height="980"/>
  <text class="title" x="64" y="64">确认后买入错误承担 02：失败线什么时候上移？</text>
  <text class="sub" x="64" y="100">普通确认后先用旧确认线/突破前低点防守；回踩守住并再创新高后，失败线才上移到“新回踩低点防守区”。</text>

  <rect class="panel" x="64" y="136" width="1312" height="584" rx="18"/>

  <g transform="translate(104,176)">
    <rect x="0" y="0" width="860" height="456" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <line class="grid" x1="0" y1="56" x2="860" y2="56"/>
    <line class="grid" x1="0" y1="112" x2="860" y2="112"/>
    <line class="grid" x1="0" y1="168" x2="860" y2="168"/>
    <line class="grid" x1="0" y1="224" x2="860" y2="224"/>
    <line class="grid" x1="0" y1="280" x2="860" y2="280"/>
    <line class="grid" x1="0" y1="336" x2="860" y2="336"/>
    <line class="grid" x1="0" y1="392" x2="860" y2="392"/>
    <line class="axis" x1="0" y1="420" x2="860" y2="420"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="420"/>

    <text class="price" x="-52" y="60">12.80</text>
    <text class="price" x="-52" y="116">12.60</text>
    <text class="price" x="-52" y="172">12.40</text>
    <text class="price" x="-52" y="228">12.20</text>
    <text class="price" x="-52" y="284">12.00</text>
    <text class="price" x="-52" y="340">11.80</text>
    <text class="price" x="-52" y="396">11.60</text>

    <!-- zones and lines -->
    <rect class="zone-old" x="224" y="184" width="260" height="52" rx="8" opacity="0.56"/>
    <rect class="zone-new" x="492" y="236" width="180" height="72" rx="8" opacity="0.72"/>
    <rect class="zone-risk" x="628" y="308" width="180" height="76" rx="8" opacity="0.76"/>

    <line class="old-confirm" x1="0" y1="208" x2="860" y2="208"/>
    <line class="old-fail" x1="0" y1="300" x2="860" y2="300"/>
    <line class="new-defense" x1="0" y1="252" x2="860" y2="252"/>
    <line class="new-fail" x1="0" y1="308" x2="860" y2="308"/>

    <!-- K candles -->
    <!-- consolidation below confirm -->
    <line class="wick-green" x1="56" y1="300" x2="56" y2="368"/><rect class="k-green" x="44" y="324" width="24" height="28"/>
    <line class="wick-red" x1="124" y1="220" x2="124" y2="308"/><rect class="k-red" x="112" y="244" width="24" height="44"/>
    <line class="wick-green" x1="192" y1="276" x2="192" y2="344"/><rect class="k-green" x="180" y="300" width="24" height="24"/>
    <line class="wick-red" x1="260" y1="204" x2="260" y2="288"/><rect class="k-red" x="248" y="224" width="24" height="40"/>
    <!-- breakout -->
    <line class="wick-green" x1="328" y1="160" x2="328" y2="264"/><rect class="k-green" x="316" y="188" width="24" height="52"/>
    <line class="wick-green" x1="396" y1="108" x2="396" y2="196"/><rect class="k-green" x="384" y="132" width="24" height="44"/>
    <!-- retest -->
    <line class="wick-red" x1="464" y1="164" x2="464" y2="252"/><rect class="k-red" x="452" y="188" width="24" height="40"/>
    <line class="wick-red" x1="532" y1="220" x2="532" y2="304"/><rect class="k-red" x="520" y="240" width="24" height="40"/>
    <line class="wick-green" x1="600" y1="228" x2="600" y2="308"/><rect class="k-green" x="588" y="252" width="24" height="32"/>
    <!-- new high after retest -->
    <line class="wick-green" x1="668" y1="136" x2="668" y2="252"/><rect class="k-green" x="656" y="164" width="24" height="68"/>
    <line class="wick-green" x1="736" y1="76" x2="736" y2="176"/><rect class="k-green" x="724" y="100" width="24" height="56"/>
    <!-- later failure example -->
    <line class="wick-red" x1="804" y1="196" x2="804" y2="340"/><rect class="k-red" x="792" y="228" width="24" height="80"/>

    <path class="swing" d="M56 352 L124 244 L192 324 L260 224 L328 188 L396 132 L464 228 L532 280 L600 252 L668 164 L736 100 L804 308"/>

    <!-- key points -->
    <circle cx="328" cy="188" r="9" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="396" cy="132" r="9" fill="#fff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="532" cy="280" r="9" fill="#fff" stroke="#f97316" stroke-width="4"/>
    <circle cx="600" cy="252" r="9" fill="#fff" stroke="#f97316" stroke-width="4"/>
    <circle cx="736" cy="100" r="9" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <circle cx="804" cy="308" r="9" fill="#fff" stroke="#dc2626" stroke-width="4"/>

    <!-- labels -->
    <rect class="tagbox" x="220" y="164" width="232" height="40" rx="8" stroke="#2563eb"/>
    <text class="tag" x="236" y="190" fill="#2563eb">① 普通确认：可小仓试错</text>

    <rect class="tagbox" x="444" y="256" width="244" height="40" rx="8" stroke="#f97316"/>
    <text class="tag" x="460" y="282" fill="#c2410c">② 回踩低点形成新防守区</text>

    <rect class="tagbox" x="612" y="116" width="220" height="40" rx="8" stroke="#16a34a"/>
    <text class="tag" x="628" y="142" fill="#15803d">③ 再创新高：失败线上移</text>

    <rect class="tagbox" x="624" y="312" width="212" height="40" rx="8" stroke="#dc2626"/>
    <text class="tag" x="640" y="338" fill="#dc2626">跌破新失败线：退出</text>

    <text class="tiny" x="36" y="204" fill="#2563eb">旧确认线</text>
    <text class="tiny" x="36" y="296" fill="#64748b">旧失败线</text>
    <text class="tiny" x="36" y="248" fill="#c2410c">新防守区上沿</text>
    <text class="tiny" x="36" y="304" fill="#dc2626">新失败线</text>

    <!-- arrow showing stop move -->
    <path d="M520 332 C520 392, 676 392, 676 324" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <rect x="548" y="376" width="160" height="28" rx="6" fill="#fff7ed" stroke="#f97316"/>
    <text class="tiny" x="568" y="394" fill="#c2410c">失败线从旧线抬到新低点区</text>
  </g>

  <!-- right flow -->
  <g transform="translate(1000,176)">
    <rect class="node-blue" x="0" y="0" width="328" height="84" rx="12"/>
    <text class="h" x="24" y="34">普通确认买入</text>
    <text class="small" x="24" y="62">先按“小仓试错”处理</text>

    <path d="M164 96 L164 128" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <polygon points="164,132 292,204 164,276 36,204" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="h" x="164" y="192" text-anchor="middle">是否回踩守住</text>
    <text class="h" x="164" y="220" text-anchor="middle">并再次创新高？</text>

    <path d="M292 204 L324 204 L324 324" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="292" y="184" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="300" y="200" fill="#2563eb">是</text>

    <path d="M164 276 L164 324" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <rect x="172" y="288" width="44" height="24" rx="4" fill="#fff"/>
    <text class="tiny" x="180" y="304" fill="#dc2626">否</text>

    <rect class="node-red" x="0" y="324" width="220" height="92" rx="12"/>
    <text class="h" x="24" y="356">不上移失败线</text>
    <text class="small" x="24" y="384">仍按旧确认线/</text>
    <text class="small" x="24" y="408">突破前低点防守</text>

    <rect class="node-focus" x="244" y="324" width="220" height="92" rx="12"/>
    <text class="h" x="268" y="356">失败线上移</text>
    <text class="small" x="268" y="384">新防守 = 回踩低点</text>
    <text class="small" x="268" y="408">跌破它才认错</text>
  </g>

  <g transform="translate(64,752)">
    <rect class="panel" x="0" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="28" y="40">1. 普通确认后</text>
    <text class="txt" x="28" y="78">不要马上把失败线抬太高。</text>
    <text class="txt" x="28" y="108">这时只是“试错成功了一半”。</text>
    <text class="txt" x="28" y="136">先看后面的回踩质量。</text>

    <rect class="panel" x="452" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="480" y="40">2. 什么时候上移？</text>
    <text class="txt" x="480" y="78">突破后回踩不跌回原区间，</text>
    <text class="txt" x="480" y="108">并且再次创新高。</text>
    <text class="txt" x="480" y="136">此时回踩低点才成为新防守。</text>

    <rect class="panel" x="904" y="0" width="408" height="156" rx="16"/>
    <text class="h" x="932" y="40">3. 上移后的承担</text>
    <text class="txt" x="932" y="78">后续跌破新防守区下沿，</text>
    <text class="txt" x="932" y="108">说明稳健确认失败。</text>
    <text class="txt" x="932" y="136">动作：退出或明显减仓。</text>
  </g>

  <line x1="64" y1="936" x2="1376" y2="936" stroke="#dbe3ef"/>
  <text class="tiny" x="64" y="960">学习用途：这张图只讲结构识别与风险承担，不构成任何投资建议。</text>
</svg>
