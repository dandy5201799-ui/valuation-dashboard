<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 730; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .card { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .blue-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .green-card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .orange-card { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .red-card { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .path { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .path-green { fill: none; stroke: #16a34a; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .path-red { fill: none; stroke: #dc2626; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .guard { stroke: #f59e0b; stroke-width: 3.5; stroke-dasharray: 8 7; }
      .trigger { stroke: #2563eb; stroke-width: 3.5; stroke-dasharray: 8 7; }
      .fail { stroke: #dc2626; stroke-width: 3.5; stroke-dasharray: 8 7; }
      .dot { stroke: #ffffff; stroke-width: 3.5; }
      .dot-buy { fill: #16a34a; }
      .dot-watch { fill: #2563eb; }
      .dot-risk { fill: #dc2626; }
      .dot-guard { fill: #f59e0b; }
      .label { fill: #ffffff; stroke-width: 2; }
      .label-blue { stroke: #2563eb; }
      .label-green { stroke: #16a34a; }
      .label-red { stroke: #dc2626; }
      .label-orange { stroke: #f59e0b; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="960"/>

  <text class="title" x="56" y="64">没有二次回落，直接突破小高点：怎么确认？</text>
  <text class="sub" x="56" y="100">直接突破只能算第一层确认；后面要看“继续上涨”或“回踩不破”来补确认。若跌回并破防守，确认失败。</text>

  <!-- Common setup -->
  <rect class="panel" x="56" y="136" width="1388" height="250" rx="24"/>
  <text class="h2" x="96" y="184">共同前提：回调到防守区附近后，没有二次回落，直接突破回调小高点</text>
  <text class="small" x="96" y="214">这个突破点不是“最终安全”，只是说明回调里的短期下跌节奏被打断。</text>

  <rect class="blue-card" x="96" y="240" width="680" height="104" rx="16"/>
  <line class="guard" x1="128" y1="316" x2="736" y2="316"/>
  <text class="tiny" x="136" y="306">防守区</text>
  <line class="trigger" x1="376" y1="280" x2="736" y2="280"/>
  <text class="tiny" x="384" y="270">回调小高点 B</text>
  <path class="path" d="M136 324 L208 280 L280 308 L352 252 L424 300 L496 316 L584 280 L704 248"/>
  <circle class="dot dot-guard" cx="496" cy="316" r="10"/>
  <text class="tiny" x="460" y="340">A：防守区止跌</text>
  <circle class="dot dot-watch" cx="584" cy="280" r="10"/>
  <text class="tiny" x="548" y="252">B：小高点</text>
  <circle class="dot dot-buy" cx="704" cy="248" r="12"/>
  <text class="txt" x="720" y="254">第一层确认</text>

  <rect class="label label-blue" x="836" y="252" width="528" height="80" rx="12"/>
  <text class="txt" x="860" y="284">此刻只能说：</text>
  <text class="small" x="860" y="312">“短期下跌节奏被打断”，还不能说一定恢复上升。</text>

  <!-- Branch cards -->
  <rect class="green-card" x="56" y="430" width="424" height="370" rx="22"/>
  <rect class="green-card" x="536" y="430" width="424" height="370" rx="22"/>
  <rect class="red-card" x="1016" y="430" width="424" height="370" rx="22"/>

  <!-- Branch 1 -->
  <text class="h2" x="88" y="476">后续 A：强势延续</text>
  <text class="small" x="88" y="506">突破后不回头，继续接近/突破前高</text>
  <rect class="card" x="88" y="532" width="360" height="152" rx="12"/>
  <line class="guard" x1="116" y1="640" x2="420" y2="640"/>
  <line class="trigger" x1="196" y1="596" x2="420" y2="596"/>
  <path class="path-green" d="M116 652 L164 616 L212 636 L260 596 L320 560 L396 520"/>
  <circle class="dot dot-buy" cx="260" cy="596" r="10"/>
  <circle class="dot dot-buy" cx="396" cy="520" r="11"/>
  <text class="tiny" x="276" y="590">突破 B</text>
  <text class="tiny" x="330" y="512">继续上涨补确认</text>
  <rect class="label label-green" x="88" y="708" width="360" height="56" rx="12"/>
  <text class="txt" x="112" y="742">确认增强：可视为强势跟随</text>

  <!-- Branch 2 -->
  <text class="h2" x="568" y="476">后续 B：回踩不破</text>
  <text class="small" x="568" y="506">突破后回踩 B 或防守区，不破再上</text>
  <rect class="card" x="568" y="532" width="360" height="152" rx="12"/>
  <line class="guard" x1="596" y1="640" x2="900" y2="640"/>
  <line class="trigger" x1="676" y1="596" x2="900" y2="596"/>
  <path class="path-green" d="M596 652 L644 616 L692 636 L740 596 L792 560 L836 596 L900 552"/>
  <circle class="dot dot-buy" cx="740" cy="596" r="10"/>
  <circle class="dot dot-guard" cx="836" cy="596" r="10"/>
  <circle class="dot dot-buy" cx="900" cy="552" r="11"/>
  <text class="tiny" x="752" y="590">突破 B</text>
  <text class="tiny" x="796" y="620">回踩不破</text>
  <text class="tiny" x="856" y="544">再次向上</text>
  <rect class="label label-green" x="568" y="708" width="360" height="56" rx="12"/>
  <text class="txt" x="592" y="742">稳健确认：更慢，但更可靠</text>

  <!-- Branch 3 -->
  <text class="h2" x="1048" y="476">后续 C：突破失败</text>
  <text class="small" x="1048" y="506">突破后跌回 B 下方，并有效跌破防守区</text>
  <rect class="card" x="1048" y="532" width="360" height="152" rx="12"/>
  <line class="guard" x1="1076" y1="640" x2="1380" y2="640"/>
  <line class="trigger" x1="1156" y1="596" x2="1380" y2="596"/>
  <line class="fail" x1="1076" y1="664" x2="1380" y2="664"/>
  <path class="path-red" d="M1076 652 L1124 616 L1172 636 L1220 596 L1272 560 L1320 620 L1372 688"/>
  <circle class="dot dot-buy" cx="1220" cy="596" r="10"/>
  <circle class="dot dot-risk" cx="1320" cy="620" r="10"/>
  <circle class="dot dot-risk" cx="1372" cy="688" r="11"/>
  <text class="tiny" x="1232" y="590">假突破</text>
  <text class="tiny" x="1280" y="644">跌回</text>
  <text class="tiny" x="1308" y="708">破防守</text>
  <rect class="label label-red" x="1048" y="708" width="360" height="56" rx="12"/>
  <text class="txt" x="1072" y="742">确认失败：取消入手计划</text>

  <!-- Arrows from setup to branches -->
  <path class="arrow" d="M396 388 C340 400 276 408 268 424"/>
  <path class="arrow" d="M744 388 C744 404 744 412 744 424"/>
  <path class="arrow" d="M1088 388 C1152 400 1216 408 1228 424"/>

  <!-- Footer -->
  <rect class="panel" x="72" y="836" width="1356" height="72" rx="20"/>
  <text class="txt" x="104" y="868">判断口诀：</text>
  <text class="txt" x="204" y="868">直接突破小高点 = 第一层确认；继续上涨 = 跟随确认；回踩不破再上 = 稳健确认；跌回并破防守 = 确认失败。</text>
  <text class="small" x="104" y="892">学习用途，不构成投资建议。越靠前越容易买得低，但假信号更多；越靠后越稳，但价格更高。</text>
</svg>
