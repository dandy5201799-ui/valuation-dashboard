<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">上升趋势中的高点抬高和低点抬高</title>
  <desc id="desc">一段真实 K 线式波动被整理成高低点连线，后一个高点高于前一个高点，后一个低点高于前一个低点，因此更像上升趋势。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#5f5b55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accentArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#d97757" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .boundary { fill: #fbfaf7; stroke: #ded8cc; stroke-width: 1.2; }
      .grid { stroke: #e9e6dd; stroke-width: 1; }
      .axis { stroke: #b8b4aa; stroke-width: 1.2; }
      .up { fill: #ffffff; stroke: #d97757; stroke-width: 2; }
      .up-wick { stroke: #d97757; stroke-width: 2; stroke-linecap: round; }
      .down { fill: #e8e5db; stroke: #747069; stroke-width: 2; }
      .down-wick { stroke: #747069; stroke-width: 2; stroke-linecap: round; }
      .trend { fill: none; stroke: #393735; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #181817; stroke: #ffffff; stroke-width: 4; }
      .accent-point { fill: #d97757; stroke: #ffffff; stroke-width: 4; }
      .compare { fill: none; stroke: #d97757; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#accentArrow); }
      .guide { stroke: #a8a39a; stroke-width: 1.2; stroke-dasharray: 7 8; }
      .label { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #181817; }
      .note { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 450; fill: #747069; }
      .terminal-label { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #ffffff; }
      .terminal-note { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 450; fill: #e9e6dd; }
      .small { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #747069; }
      .tag { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #181817; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <g>
    <g aria-hidden="true">
      <line class="axis" x1="124" y1="492" x2="1074" y2="492"/>
      <line class="axis" x1="124" y1="104" x2="124" y2="492"/>
    </g>

    <g>
      <line class="down-wick" x1="158" y1="414" x2="158" y2="458"/>
      <rect class="down" x="147" y="426" width="22" height="22" rx="3"/>
      <line class="up-wick" x1="200" y1="382" x2="200" y2="444"/>
      <rect class="up" x="189" y="408" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="242" y1="338" x2="242" y2="414"/>
      <rect class="up" x="231" y="360" width="22" height="42" rx="3"/>
      <line class="up-wick" x1="284" y1="292" x2="284" y2="368"/>
      <rect class="up" x="273" y="318" width="22" height="32" rx="3"/>
      <line class="up-wick" x1="326" y1="248" x2="326" y2="330"/>
      <rect class="up" x="315" y="276" width="22" height="36" rx="3"/>
      <line class="down-wick" x1="368" y1="266" x2="368" y2="344"/>
      <rect class="down" x="357" y="286" width="22" height="38" rx="3"/>
      <line class="down-wick" x1="410" y1="306" x2="410" y2="382"/>
      <rect class="down" x="399" y="324" width="22" height="34" rx="3"/>
      <line class="down-wick" x1="452" y1="334" x2="452" y2="402"/>
      <rect class="down" x="441" y="350" width="22" height="26" rx="3"/>
      <line class="up-wick" x1="494" y1="300" x2="494" y2="374"/>
      <rect class="up" x="483" y="332" width="22" height="24" rx="3"/>
      <line class="up-wick" x1="536" y1="250" x2="536" y2="336"/>
      <rect class="up" x="525" y="286" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="578" y1="204" x2="578" y2="292"/>
      <rect class="up" x="567" y="238" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="620" y1="164" x2="620" y2="244"/>
      <rect class="up" x="609" y="196" width="22" height="28" rx="3"/>
      <line class="down-wick" x1="662" y1="182" x2="662" y2="262"/>
      <rect class="down" x="651" y="206" width="22" height="36" rx="3"/>
      <line class="down-wick" x1="704" y1="224" x2="704" y2="310"/>
      <rect class="down" x="693" y="244" width="22" height="42" rx="3"/>
      <line class="down-wick" x1="746" y1="260" x2="746" y2="342"/>
      <rect class="down" x="735" y="282" width="22" height="32" rx="3"/>
      <line class="up-wick" x1="788" y1="232" x2="788" y2="314"/>
      <rect class="up" x="777" y="266" width="22" height="28" rx="3"/>
      <line class="up-wick" x1="830" y1="184" x2="830" y2="270"/>
      <rect class="up" x="819" y="220" width="22" height="32" rx="3"/>
      <line class="up-wick" x1="872" y1="136" x2="872" y2="224"/>
      <rect class="up" x="861" y="172" width="22" height="34" rx="3"/>
      <line class="up-wick" x1="914" y1="96" x2="914" y2="178"/>
      <rect class="up" x="903" y="128" width="22" height="32" rx="3"/>
      <line class="down-wick" x1="956" y1="126" x2="956" y2="206"/>
      <rect class="down" x="945" y="150" width="22" height="36" rx="3"/>
      <line class="up-wick" x1="998" y1="108" x2="998" y2="180"/>
      <rect class="up" x="987" y="136" width="22" height="26" rx="3"/>
      <line class="up-wick" x1="1040" y1="82" x2="1040" y2="158"/>
      <rect class="up" x="1029" y="112" width="22" height="28" rx="3"/>
    </g>

    <polyline class="trend" points="158,458 326,248 452,402 620,164 746,342 1040,82"/>

    <g>
      <line class="guide" x1="326" y1="248" x2="326" y2="492"/>
      <line class="guide" x1="620" y1="164" x2="620" y2="492"/>
      <line class="guide" x1="1040" y1="82" x2="1040" y2="492"/>
      <line class="guide" x1="158" y1="458" x2="158" y2="492"/>
      <line class="guide" x1="452" y1="402" x2="452" y2="492"/>
      <line class="guide" x1="746" y1="342" x2="746" y2="492"/>
    </g>

    <g>
      <circle class="point" cx="158" cy="458" r="8"/>
      <circle class="accent-point" cx="326" cy="248" r="8"/>
      <circle class="point" cx="452" cy="402" r="8"/>
      <circle class="accent-point" cx="620" cy="164" r="8"/>
      <circle class="point" cx="746" cy="342" r="8"/>
      <circle class="accent-point" cx="1040" cy="82" r="8"/>
    </g>

    <g>
      <text class="tag" x="297" y="230">H1</text>
      <text class="tag" x="590" y="146">H2</text>
      <text class="tag" x="1008" y="65">H3</text>
      <text class="tag" x="128" y="444">L1</text>
      <text class="tag" x="422" y="388">L2</text>
      <text class="tag" x="716" y="328">L3</text>
    </g>

    <g>
      <path class="compare" d="M 360 230 C 430 190, 510 168, 584 158"/>
      <path class="compare" d="M 654 146 C 760 104, 890 78, 1008 74"/>
      <path class="compare" d="M 190 450 C 270 432, 350 410, 416 400"/>
      <path class="compare" d="M 486 386 C 560 366, 644 348, 710 338"/>
    </g>

    <g>
      <rect x="214" y="82" width="252" height="78" rx="18" fill="#ffffff" stroke="#d8d4ca" stroke-width="1.2"/>
      <text class="label" x="240" y="116">高点抬高</text>
      <text class="note" x="240" y="143">H2 高于 H1，H3 高于 H2</text>
      <rect x="214" y="476" width="252" height="78" rx="18" fill="#ffffff" stroke="#d8d4ca" stroke-width="1.2"/>
      <text class="label" x="240" y="510">低点抬高</text>
      <text class="note" x="240" y="537">L2 高于 L1，L3 高于 L2</text>
      <rect x="740" y="426" width="276" height="78" rx="18" fill="#181817"/>
      <text class="terminal-label" x="766" y="459">更像上升趋势</text>
      <text class="terminal-note" x="766" y="486">不是一天涨，而是一段波动上移</text>
    </g>
  </g>
</svg>
