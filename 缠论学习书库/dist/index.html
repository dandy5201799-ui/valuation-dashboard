<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>缠论学习书库</title>
<meta name="description" content="缠论学习书库：看懂K线走势与缠论标记工具">
<style>
:root {
  --page-bg: #f4efe4;
  --panel-bg: rgba(252, 248, 239, 0.82);
  --panel-strong: rgba(247, 241, 230, 0.94);
  --panel-border: rgba(61, 47, 31, 0.12);
  --text-strong: #221b14;
  --text-body: #4c4135;
  --text-muted: #786b5c;
  --accent: #875932;
  --accent-strong: #312015;
  --shadow: 0 24px 60px rgba(50, 37, 23, 0.10);
  --shadow-soft: 0 10px 24px rgba(50, 37, 23, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Source Han Serif SC", serif;
  color: var(--text-body);
  background:
    radial-gradient(circle at top left, rgba(187, 145, 94, 0.16), transparent 26%),
    radial-gradient(circle at 85% 10%, rgba(120, 100, 76, 0.12), transparent 20%),
    linear-gradient(180deg, #f8f3ea 0%, #f1eadc 100%);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
.site-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 16px 0 44px;
}
.hero {
  position: relative;
  overflow: hidden;
  padding: 48px 44px 52px;
  border: 1px solid var(--panel-border);
  border-radius: 30px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.55), transparent 46%),
    linear-gradient(180deg, var(--panel-strong), rgba(249, 243, 233, 0.90));
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
}
.hero__eyebrow {
  margin: 0 0 12px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.hero h1 {
  margin: 0;
  max-width: 18ch;
  font-size: clamp(1.72rem, 3.3vw, 2.72rem);
  line-height: 1.08;
  color: var(--text-strong);
}
.hero p {
  max-width: 46em;
  margin: 18px 0 0;
  font-size: 1.05rem;
  line-height: 1.72;
}
  .library {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  margin-top: 24px;
}
.book-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  border-radius: 24px;
  background: var(--panel-bg);
  box-shadow: var(--shadow-soft);
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.book-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
.book-card__cover {
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: var(--panel-strong);
}
.book-card__cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.book-card__body {
  padding: 20px 22px 24px;
}
.book-card__body h3 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  color: var(--text-strong);
}
.book-card__body p {
  margin: 0 0 16px;
  font-size: 0.92rem;
  line-height: 1.62;
  color: var(--text-muted);
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--accent-strong);
  color: #f8f4ea;
  font-size: 13px;
  font-weight: 700;
}
@media (max-width: 860px) {
  .library { grid-template-columns: 1fr; }
  .hero { padding: 32px 24px 36px; }
}
</style>
</head>
<body>
<main class="site-shell">
  <section class="hero">
    <p class="hero__eyebrow">缠论学习书库</p>
    <h1>从 K 线到判断，把缠论讲成能看的书</h1>
    <p>这里不再按“基础册、实战册”拆开，而是合成一条真实学习路径：先用《看懂K线走势》理解价格走势，再用《缠论标记工具》把标记、解释和复盘串起来。</p>
  </section>
  <section class="library">
    
        <a class="book-card" href="book2-chan-practice/index.html">
          <div class="book-card__cover">
            <img src="book2-chan-practice/assets/cover.svg" alt="看懂K线走势封面" loading="lazy">
          </div>
          <div class="book-card__body">
            <h3>看懂K线走势</h3>
            <p>从真实K线出发，看清趋势、画出走势、判断结构、确认机会</p>
            <span class="button">在线阅读</span>
          </div>
        </a>
        
        <a class="book-card" href="book3-auto-marker/index.html">
          <div class="book-card__cover">
            <img src="book3-auto-marker/assets/cover.svg" alt="缠论标记工具封面" loading="lazy">
          </div>
          <div class="book-card__body">
            <h3>缠论标记工具</h3>
            <p>把缠论结构标出来，辅助观察、解释和复盘</p>
            <span class="button">在线阅读</span>
          </div>
        </a>
        
  </section>
</main>
</body>
</html>
