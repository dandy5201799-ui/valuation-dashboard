<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="980" viewBox="0 0 1420 980">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 730; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .card { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .green-card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .blue-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .orange-card { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .purple-card { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .path { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
      .path-green { fill: none; stroke: #16a34a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .path-blue { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .path-orange { fill: none; stroke: #f59e0b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .path-purple { fill: none; stroke: #7c3aed; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .box-line { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .buy-line { stroke: #16a34a; stroke-width: 4; }
      .fail-line { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 7 7; }
      .buy-dot { fill: #16a34a; stroke: #ffffff; stroke-width: 4; }
      .guard-dot { fill: #f59e0b; stroke: #ffffff; stroke-width: 4; }
      .risk-dot { fill: #dc2626; stroke: #ffffff; stroke-width: 4; }
      .neutral-dot { fill: #64748b; stroke: #ffffff; stroke-width: 4; }
      .callout { fill: #ffffff; stroke-width: 2; }
      .callout-green { stroke: #16a34a; }
      .callout-blue { stroke: #2563eb; }
      .callout-orange { stroke: #f59e0b; }
      .callout-purple { stroke: #7c3aed; }
      .legend { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1420" height="980"/>

  <text class="title" x="56" y="64">四类入手机会：买点必须带防守位</text>
  <text class="sub" x="56" y="100">入手不是“看起来要涨”，而是“如果判断错了，知道哪里错”。每一种机会都要同时标出买点与防守位。</text>

  <rect class="panel" x="44" y="132" width="1332" height="748" rx="24"/>

  <!-- Card 1 -->
  <rect class="card green-card" x="84" y="176" width="596" height="320" rx="20"/>
  <text class="h2" x="120" y="220">① 上升趋势中的回调低吸</text>
  <text class="small" x="120" y="250">前提：高点抬高、低点抬高，回调不破防守位</text>
  <rect class="callout callout-green" x="120" y="276" width="520" height="164" rx="12"/>
  <line class="guard" x1="148" y1="386" x2="612" y2="386"/>
  <text class="tiny" x="154" y="374">防守位：最近确认低点</text>
  <path class="path-green" d="M154 410 L214 360 L270 382 L334 316 L394 350 L456 298 L520 384 L594 322"/>
  <circle class="guard-dot" cx="520" cy="384" r="11"/>
  <circle class="buy-dot" cx="534" cy="370" r="12"/>
  <text class="txt" x="550" y="374">买</text>
  <text class="tiny" x="484" y="418">靠近防守位止跌</text>
  <text class="txt" x="120" y="470">动作：靠近防守位观察入手；跌破防守位则判断失效。</text>

  <!-- Card 2 -->
  <rect class="card blue-card" x="740" y="176" width="596" height="320" rx="20"/>
  <text class="h2" x="776" y="220">② 震荡突破后的回踩确认</text>
  <text class="small" x="776" y="250">前提：震荡区间形成，向上突破上沿后不跌回区间</text>
  <rect class="callout callout-blue" x="776" y="276" width="520" height="164" rx="12"/>
  <rect x="804" y="326" width="250" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 7"/>
  <line class="box-line" x1="804" y1="326" x2="1054" y2="326"/>
  <text class="tiny" x="812" y="316">区间上沿</text>
  <path class="path-blue" d="M816 382 L866 334 L916 390 L970 332 L1024 386 L1082 300 L1142 326 L1214 286"/>
  <circle class="neutral-dot" cx="1082" cy="300" r="10"/>
  <circle class="buy-dot" cx="1142" cy="326" r="12"/>
  <text class="txt" x="1158" y="331">买</text>
  <line class="guard" x1="1088" y1="336" x2="1232" y2="336"/>
  <text class="tiny" x="1100" y="361">防守：回踩低点/上沿</text>
  <text class="txt" x="776" y="470">动作：不抢第一根突破，等回踩不破再跟随。</text>

  <!-- Card 3 -->
  <rect class="card purple-card" x="84" y="532" width="596" height="320" rx="20"/>
  <text class="h2" x="120" y="576">③ 下跌后的底部结构转强</text>
  <text class="small" x="120" y="606">前提：不再创新低，突破前一个小高点，回踩不破前低</text>
  <rect class="callout callout-purple" x="120" y="632" width="520" height="164" rx="12"/>
  <path class="path-purple" d="M154 662 L214 704 L270 682 L334 742 L394 720 L458 690 L518 718 L594 650"/>
  <line class="fail-line" x1="360" y1="742" x2="552" y2="742"/>
  <text class="tiny" x="372" y="765">前低：不再跌破</text>
  <line class="box-line" x1="406" y1="690" x2="604" y2="690"/>
  <text class="tiny" x="408" y="680">突破小高点</text>
  <circle class="guard-dot" cx="518" cy="718" r="11"/>
  <circle class="buy-dot" cx="548" cy="690" r="12"/>
  <text class="txt" x="564" y="695">买</text>
  <text class="txt" x="120" y="826">动作：等“低点不再降低 + 高点开始抬高”，不要只因跌多了买。</text>

  <!-- Card 4 -->
  <rect class="card orange-card" x="740" y="532" width="596" height="320" rx="20"/>
  <text class="h2" x="776" y="576">④ 假破位后的修复买点</text>
  <text class="small" x="776" y="606">前提：跌破防守位后快速收回，重新站上关键位置</text>
  <rect class="callout callout-orange" x="776" y="632" width="520" height="164" rx="12"/>
  <line class="guard" x1="808" y1="710" x2="1260" y2="710"/>
  <text class="tiny" x="816" y="698">原防守位</text>
  <path class="path-orange" d="M814 686 L876 638 L940 674 L1000 628 L1058 668 L1108 744 L1168 696 L1240 650"/>
  <circle class="risk-dot" cx="1108" cy="744" r="11"/>
  <text class="tiny" x="1072" y="768">刺破/短破</text>
  <circle class="buy-dot" cx="1168" cy="696" r="12"/>
  <text class="txt" x="1184" y="701">买</text>
  <line class="guard" x1="1090" y1="752" x2="1174" y2="752"/>
  <text class="tiny" x="1180" y="756">防守：假破低点</text>
  <text class="txt" x="776" y="826">动作：看到收回和确认再考虑；刚跌破时不要急着抄底。</text>

  <!-- Footer -->
  <rect class="legend" x="64" y="908" width="1288" height="48" rx="16"/>
  <circle cx="100" cy="932" r="7" fill="#16a34a"/>
  <text class="small" x="116" y="938">绿色点 = 入手观察点</text>
  <circle cx="304" cy="932" r="7" fill="#f59e0b"/>
  <text class="small" x="320" y="938">橙色线/点 = 防守位</text>
  <circle cx="512" cy="932" r="7" fill="#dc2626"/>
  <text class="small" x="528" y="938">红色点 = 风险/失效点</text>
  <text class="small" x="820" y="938">口诀：买点不是预测上涨，而是风险可控的位置。学习用途，不构成投资建议。</text>
</svg>
