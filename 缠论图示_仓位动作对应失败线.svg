<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#4f5d75"/>
    </marker>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .txt{font:800 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .box{fill:#fff;stroke:rgba(45,49,66,.18);stroke-width:1.2}
      .head{fill:#2d3142}
      .headtxt{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#fff}
      .observe{fill:#f8fafc;stroke:#94a3b8}
      .test{fill:#eff6ff;stroke:#2563eb}
      .normal{fill:#f0fdf4;stroke:#16a34a}
      .hold{fill:#ecfdf5;stroke:#059669}
      .reduce{fill:#fff7ed;stroke:#f59e0b}
      .exit{fill:#fef2f2;stroke:#dc2626}
      .repair{fill:#f5f3ff;stroke:#7c3aed}
      .danger{fill:#fff1f2;stroke:#e11d48}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .failLine{stroke:#dc2626;stroke-width:2.6}
      .keyLine{stroke:#2563eb;stroke-width:2.4}
      .guardLine{stroke:#f59e0b;stroke-width:2.4}
      .okDot{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}
      .failDot{fill:#fef2f2;stroke:#dc2626;stroke-width:3}
      .watchDot{fill:#fff7ed;stroke:#f59e0b;stroke-width:3}
      .testDot{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .arrow{fill:none;stroke:#4f5d75;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text class="title" x="64" y="70">每一层仓位动作，对应哪条失败线？</text>
  <text class="sub" x="64" y="102">判断一个动作是否完整，不只看“在哪买/卖”，还要知道“错了在哪里认”。失败线越清楚，动作越可控。</text>

  <!-- table headers -->
  <rect class="head" x="64" y="136" width="240" height="44" rx="6"/>
  <text class="headtxt" x="84" y="164">仓位动作</text>
  <rect class="head" x="324" y="136" width="360" height="44" rx="6"/>
  <text class="headtxt" x="344" y="164">动作成立的结构条件</text>
  <rect class="head" x="704" y="136" width="360" height="44" rx="6"/>
  <text class="headtxt" x="724" y="164">失败线怎么设</text>
  <rect class="head" x="1084" y="136" width="252" height="44" rx="6"/>
  <text class="headtxt" x="1104" y="164">失败后的动作</text>

  <!-- row 1 -->
  <rect class="box observe" x="64" y="200" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="232">观察区：0仓/不动</text>
  <text class="small" x="84" y="256">还没有确认点</text>
  <rect class="box" x="324" y="200" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="232">只是靠近防守位、下沿或压力位</text>
  <text class="tiny" x="344" y="256">没有收盘突破，也没有二次不破</text>
  <rect class="box" x="704" y="200" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="232">没有交易，就没有交易失败线</text>
  <text class="tiny" x="724" y="256">但要先画观察失效线：如跌破候选低点</text>
  <rect class="box observe" x="1084" y="200" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="232">继续等</text>
  <text class="tiny" x="1104" y="256">不要把观察当确认</text>

  <!-- row 2 -->
  <rect class="box test" x="64" y="300" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="332">小仓试错</text>
  <text class="small" x="84" y="356">普通确认后</text>
  <rect class="box" x="324" y="300" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="332">收盘突破关键压力/修复小高点</text>
  <text class="tiny" x="344" y="356">只证明第一层压制被打破</text>
  <rect class="box" x="704" y="300" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="332">跌回突破线下方，或跌破试错K低点</text>
  <text class="tiny" x="724" y="356">二者取更适合风险控制的一条</text>
  <rect class="box test" x="1084" y="300" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="332">小亏认错</text>
  <text class="tiny" x="1104" y="356">试错失败，不加码摊平</text>

  <!-- row 3 -->
  <rect class="box normal" x="64" y="400" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="432">正常仓位</text>
  <text class="small" x="84" y="456">稳健确认后</text>
  <rect class="box" x="324" y="400" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="432">突破后回踩不破，再次向上</text>
  <text class="tiny" x="344" y="456">压力转支撑，结构更稳定</text>
  <rect class="box" x="704" y="400" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="432">跌破回踩低点/新防守位</text>
  <text class="tiny" x="724" y="456">这表示稳健确认失败</text>
  <rect class="box normal" x="1084" y="400" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="432">降回试错仓或退出</text>
  <text class="tiny" x="1104" y="456">不再按稳健结构持有</text>

  <!-- row 4 -->
  <rect class="box hold" x="64" y="500" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="532">趋势持有</text>
  <text class="small" x="84" y="556">趋势延续中</text>
  <rect class="box" x="324" y="500" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="532">高点、低点继续抬升</text>
  <text class="tiny" x="344" y="556">回调没有破最近确认低点</text>
  <rect class="box" x="704" y="500" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="532">最近确认低点 = 滚动防守位</text>
  <text class="tiny" x="724" y="556">新高后出现新低点，再把防守位上移</text>
  <rect class="box hold" x="1084" y="500" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="532">跌破则转破防处理</text>
  <text class="tiny" x="1104" y="556">先保护利润</text>

  <!-- row 5 -->
  <rect class="box reduce" x="64" y="600" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="632">减仓观察</text>
  <text class="small" x="84" y="656">尾声变弱</text>
  <rect class="box" x="324" y="600" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="632">未破防，但高点推进弱/回调加深</text>
  <text class="tiny" x="344" y="656">风险上升，但还不是反转确认</text>
  <rect class="box" x="704" y="600" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="632">仍看原防守位</text>
  <text class="tiny" x="724" y="656">只要没破防，剩余仓位还有持有理由</text>
  <rect class="box reduce" x="1084" y="600" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="632">破防继续降仓/离场</text>
  <text class="tiny" x="1104" y="656">再创新高可恢复持有</text>

  <!-- row 6 -->
  <rect class="box exit" x="64" y="700" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="732">离场/大幅降仓</text>
  <text class="small" x="84" y="756">有效破防</text>
  <rect class="box" x="324" y="700" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="732">收盘跌破防守位，且没有快速收回</text>
  <text class="tiny" x="344" y="756">旧持有逻辑已经失效</text>
  <rect class="box" x="704" y="700" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="732">离场后不再用旧防守位做买点</text>
  <text class="tiny" x="724" y="756">新的判断线是破防后的反弹压力位</text>
  <rect class="box exit" x="1084" y="700" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="732">等待，不追弱反弹</text>
  <text class="tiny" x="1104" y="756">反弹不过压力不接回</text>

  <!-- row 7 -->
  <rect class="box repair" x="64" y="800" width="240" height="76" rx="8"/>
  <text class="txt" x="84" y="832">接回/重新建仓</text>
  <text class="small" x="84" y="856">修复确认后</text>
  <rect class="box" x="324" y="800" width="360" height="76" rx="8"/>
  <text class="small" x="344" y="832">突破破防后压力位，回踩不破再上</text>
  <text class="tiny" x="344" y="856">普通修复可小仓，稳健修复可提升仓位</text>
  <rect class="box" x="704" y="800" width="360" height="76" rx="8"/>
  <text class="small" x="724" y="832">跌破修复回踩低点</text>
  <text class="tiny" x="724" y="856">说明接回失败，重新离场观察</text>
  <rect class="box repair" x="1084" y="800" width="252" height="76" rx="8"/>
  <text class="small" x="1104" y="832">小亏退出/退回观察</text>
  <text class="tiny" x="1104" y="856">不能把修复失败当洗盘</text>

  <!-- right mini diagrams -->
  <g transform="translate(1084 900)">
    <line x1="0" y1="0" x2="252" y2="0" stroke="rgba(45,49,66,.12)"/>
  </g>

  <!-- compact visual examples -->
  <g transform="translate(64 900)">
    <text class="tiny" x="0" y="20">三条最常用失败线：</text>
    <line class="keyLine" x1="164" y1="16" x2="220" y2="16"/>
    <text class="tiny" x="232" y="20">突破线</text>
    <line class="guardLine" x1="320" y1="16" x2="376" y2="16"/>
    <text class="tiny" x="388" y="20">防守位</text>
    <line class="failLine" x1="488" y1="16" x2="544" y2="16"/>
    <text class="tiny" x="556" y="20">前低/回踩低点</text>
  </g>

  <text class="tiny" x="64" y="956">学习用途，不构成投资建议。真实交易还要考虑滑点、仓位上限、标的波动和个人风险承受能力。</text>
</svg>
