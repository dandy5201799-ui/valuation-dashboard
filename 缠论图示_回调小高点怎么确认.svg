<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 740; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .swing { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .trigger { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .not-yet { stroke: #94a3b8; stroke-width: 3.5; stroke-dasharray: 6 7; }
      .confirm { stroke: #16a34a; stroke-width: 4; }
      .fail { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .zone-orange { fill: rgba(245, 158, 11, .13); stroke: #f59e0b; stroke-width: 2; }
      .zone-blue { fill: rgba(37, 99, 235, .10); stroke: #2563eb; stroke-width: 2; }
      .zone-green { fill: rgba(22, 163, 74, .12); stroke: #16a34a; stroke-width: 2; }
      .zone-red { fill: rgba(220, 38, 38, .10); stroke: #dc2626; stroke-width: 2; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-a { fill: #f59e0b; }
      .dot-b { fill: #2563eb; }
      .dot-c { fill: #7c3aed; }
      .dot-d { fill: #16a34a; }
      .dot-x { fill: #dc2626; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #16a34a; }
      .box-orange { stroke: #f59e0b; }
      .box-red { stroke: #dc2626; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="980"/>

  <text class="title" x="56" y="64">回调小高点 B：在真实 K 线里怎么确认？</text>
  <text class="sub" x="56" y="100">小高点不是随便挑一根高点。它要满足：从防守区反弹后形成局部高点，随后价格回落，说明这里暂时有压力。</text>

  <!-- Main chart -->
  <rect class="panel" x="52" y="132" width="1396" height="520" rx="24"/>
  <rect x="96" y="176" width="1308" height="388" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="128" y1="236" x2="1372" y2="236"/>
  <line class="axis" x1="128" y1="316" x2="1372" y2="316"/>
  <line class="axis" x1="128" y1="396" x2="1372" y2="396"/>
  <line class="axis" x1="128" y1="476" x2="1372" y2="476"/>

  <rect class="zone-orange" x="128" y="472" width="1244" height="44" rx="8"/>
  <line class="guard" x1="128" y1="494" x2="1372" y2="494"/>
  <text class="small" x="140" y="462">防守区：先观察，不是确认点</text>

  <rect class="zone-blue" x="668" y="338" width="156" height="46" rx="8"/>
  <line class="trigger" x1="128" y1="360" x2="1372" y2="360"/>
  <text class="small" x="684" y="330">B：反弹后被回落确认的小高点</text>

  <line class="confirm" x1="128" y1="322" x2="1372" y2="322"/>
  <text class="small" x="900" y="312">D：收盘突破 B，上方确认线</text>

  <!-- Candles left trend -->
  <g>
    <line class="wick-up" x1="156" y1="440" x2="156" y2="516"/><rect class="up" x="142" y="466" width="28" height="34"/>
    <line class="wick-up" x1="212" y1="356" x2="212" y2="488"/><rect class="up" x="198" y="390" width="28" height="66"/>
    <line class="wick-down" x1="268" y1="380" x2="268" y2="500"/><rect class="down" x="254" y="414" width="28" height="52"/>
    <line class="wick-up" x1="324" y1="296" x2="324" y2="436"/><rect class="up" x="310" y="332" width="28" height="72"/>
    <line class="wick-down" x1="380" y1="340" x2="380" y2="500"/><rect class="down" x="366" y="378" width="28" height="84"/>
    <line class="wick-up" x1="436" y1="224" x2="436" y2="392"/><rect class="up" x="422" y="268" width="28" height="90"/>
  </g>

  <!-- Pullback to A -->
  <g>
    <line class="wick-down" x1="504" y1="292" x2="504" y2="456"/><rect class="down" x="490" y="336" width="28" height="86"/>
    <line class="wick-down" x1="560" y1="360" x2="560" y2="508"/><rect class="down" x="546" y="404" width="28" height="70"/>
    <line class="wick-up" x1="616" y1="452" x2="616" y2="528"/><rect class="up" x="602" y="474" width="28" height="30"/>
  </g>

  <!-- Rebound to B, then C pullback -->
  <g>
    <line class="wick-up" x1="684" y1="408" x2="684" y2="500"/><rect class="up" x="670" y="438" width="28" height="38"/>
    <line class="wick-up" x1="740" y1="344" x2="740" y2="456"/><rect class="up" x="726" y="382" width="28" height="48"/>
    <line class="wick-down" x1="796" y1="356" x2="796" y2="488"/><rect class="down" x="782" y="392" width="28" height="58"/>
    <line class="wick-down" x1="852" y1="388" x2="852" y2="508"/><rect class="down" x="838" y="426" width="28" height="50"/>
    <line class="wick-up" x1="908" y1="424" x2="908" y2="508"/><rect class="up" x="894" y="448" width="28" height="36"/>
  </g>

  <!-- Breakout D -->
  <g>
    <line class="wick-up" x1="976" y1="312" x2="976" y2="456"/><rect class="up" x="962" y="344" width="28" height="82"/>
    <line class="wick-up" x1="1032" y1="284" x2="1032" y2="392"/><rect class="up" x="1018" y="314" width="28" height="48"/>
    <line class="wick-down" x1="1088" y1="316" x2="1088" y2="420"/><rect class="down" x="1074" y="342" width="28" height="44"/>
    <line class="wick-up" x1="1144" y1="274" x2="1144" y2="390"/><rect class="up" x="1130" y="304" width="28" height="52"/>
  </g>

  <path class="swing" d="M156 500 L212 356 L268 466 L324 296 L380 462 L436 224 L616 504 L740 344 L908 484 L976 344 L1144 274"/>

  <circle class="dot dot-a" cx="616" cy="504" r="13"/>
  <text class="txt" x="632" y="510">A</text>
  <text class="tiny" x="572" y="548">防守区止跌点</text>
  <path class="arrow" d="M612 540 C612 528 612 516 616 508"/>

  <circle class="dot dot-b" cx="740" cy="344" r="13"/>
  <text class="txt" x="756" y="350">B</text>
  <text class="tiny" x="712" y="292">先反弹到这里</text>
  <path class="arrow" d="M748 304 C748 316 744 332 740 340"/>

  <circle class="dot dot-c" cx="908" cy="484" r="13"/>
  <text class="txt" x="924" y="490">C</text>
  <text class="tiny" x="872" y="548">回落不破 A</text>
  <path class="arrow" d="M900 540 C900 524 904 500 908 488"/>

  <circle class="dot dot-d" cx="976" cy="344" r="14"/>
  <text class="txt" x="992" y="350">D 确认点</text>
  <text class="tiny" x="1012" y="382">收盘突破 B</text>

  <rect class="box box-blue" x="1168" y="224" width="200" height="118" rx="12"/>
  <text class="txt" x="1192" y="256">B 点成立条件</text>
  <text class="small" x="1192" y="286">1. A 后反弹</text>
  <text class="small" x="1192" y="312">2. B 后回落</text>

  <rect class="box box-green" x="1168" y="370" width="200" height="118" rx="12"/>
  <text class="txt" x="1192" y="402">D 点确认条件</text>
  <text class="small" x="1192" y="432">收盘突破 B</text>
  <text class="small" x="1192" y="458">下跌节奏被打断</text>

  <!-- Comparison row -->
  <rect class="panel" x="52" y="684" width="1396" height="210" rx="24"/>
  <text class="h2" x="88" y="732">对比：什么时候还不能说“小高点 B 已经确认”？</text>

  <rect class="box box-red" x="88" y="760" width="396" height="92" rx="12"/>
  <path class="path" d="M116 820 L164 792 L212 808 L260 768 L320 744 L424 716"/>
  <line class="not-yet" x1="112" y1="768" x2="452" y2="768"/>
  <circle class="dot dot-x" cx="320" cy="744" r="10"/>
  <text class="txt" x="132" y="792">还在连续上冲</text>
  <text class="small" x="132" y="824">没有回落，不能确认 B 是压力</text>

  <rect class="box box-red" x="552" y="760" width="396" height="92" rx="12"/>
  <path class="path" d="M580 832 L636 792 L700 824 L760 776 L824 836 L904 868"/>
  <line class="guard" x1="580" y1="824" x2="920" y2="824"/>
  <circle class="dot dot-x" cx="904" cy="868" r="10"/>
  <text class="txt" x="596" y="792">回落直接跌破 A / 防守区</text>
  <text class="small" x="596" y="824">这不是确认买点，而是计划失效</text>

  <rect class="box box-green" x="1016" y="760" width="396" height="92" rx="12"/>
  <path class="path" d="M1044 832 L1100 792 L1164 824 L1224 776 L1288 832 L1368 764"/>
  <line class="trigger" x1="1044" y1="776" x2="1384" y2="776"/>
  <circle class="dot dot-b" cx="1224" cy="776" r="10"/>
  <circle class="dot dot-d" cx="1368" cy="764" r="10"/>
  <text class="txt" x="1032" y="792">B 后回落，再突破 B</text>
  <text class="small" x="1032" y="824">这才是结构化确认</text>

  <rect x="88" y="916" width="1324" height="44" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text class="txt" x="116" y="944">口诀：A 后反弹形成 B；B 后回落，才知道 B 是小高点；再收盘突破 B，才是确认点。</text>
</svg>
