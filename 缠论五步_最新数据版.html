function swing(useHi){
  const s=seg();if(s.length<3)return [];
  const local=[];
  for(let i=1;i<s.length-1;i++){
    const gi=Math.max(0,cut-wk()+1)+i;
    if(useHi && s[i].h>=s[i-1].h && s[i].h>=s[i+1].h) local.push(gi);
    if(!useHi && s[i].l<=s[i-1].l && s[i].l<=s[i+1].l) local.push(gi);
  }
  // 相邻<4合并
  const out=[];
  for(const g of local){
    if(out.length && g-out[out.length-1]<=3){ if(useHi?DATA[g].h>DATA[out[out.length-1]].h:DATA[g].l<DATA[out[out.length-1]].l) out[out.length-1]=g; }
    else out.push(g);
  }

}
function safe(o,f){try{return o?f(o):null}catch(e){return null}}
function fmt(n){return Number.isFinite(n)?n.toFixed(2):'--'}

function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function ma(n,i=cut){const a=DATA.slice(Math.max(0,i-n+1),i+1).map(d=>d.c);return mean(a)}
function last(arr,n=1){return arr[arr.length-n]}

function detectBox(){
  if(cut<4)return null;
  let best=null;
  const start=Math.max(0,cut-24);
  for(let i=start;i<=cut-3;i++){
    for(let j=i+3;j<=cut;j++){
      const s=DATA.slice(i,j+1);
      const top=Math.min(...s.map(d=>d.h)),bot=Math.max(...s.map(d=>d.l));
      if(top<=bot)continue;
      const span=Math.max(...s.map(d=>d.h))-Math.min(...s.map(d=>d.l));
      const overlap=top-bot;
      const closes=s.map(d=>d.c);
      const closeTop=Math.max(...closes),closeBot=Math.min(...closes);
      const tight=(closeTop-closeBot)/(span||1);
      const score=overlap/(span||1)+(j-i)*0.035-tight*0.35;
      if(overlap/span>0.16 && tight<0.82 && (!best||score>best.score))best={i0:i,i1:j,d0:DATA[i].d,d1:DATA[j].d,top,bot,score};
    }
  }

}

function classifyAt(i){

  if(H.length>=2&&L.length>=2){

    const hh=DATA[bH].h>DATA[aH].h,ll=DATA[bL].l<DATA[aL].l,hl=DATA[bL].l>=DATA[aL].l,lh=DATA[bH].h<=DATA[aH].h;

    else{dir='横盘/整理';dirClass='flat';guard=Math.min(DATA[aL].l,DATA[bL].l);confirm=Math.max(DATA[aH].h,DATA[bH].h);evidence='高低点不同步：高点 '+fmt(DATA[aH].h)+'→'+fmt(DATA[bH].h)+'；低点 '+fmt(DATA[aL].l)+'→'+fmt(DATA[bL].l);}

function momentumDivergence(a){
  const H=a.H,L=a.L;
  const top=H.length>=2?(()=>{const A=last(H,2),B=last(H);return DATA[B].h>DATA[A].h&&DATA[B].macd<DATA[A].macd?{type:'顶背驰迹象',A,B,txt:'价创新高但MACD走弱 '+fmt(DATA[A].macd)+'→'+fmt(DATA[B].macd)}:null})():null;
  const bot=L.length>=2?(()=>{const A=last(L,2),B=last(L);return DATA[B].l<DATA[A].l&&DATA[B].macd>DATA[A].macd?{type:'底背驰迹象',A,B,txt:'价创新低但MACD改善 '+fmt(DATA[A].macd)+'→'+fmt(DATA[B].macd)}:null})():null;
  return top||bot;
}

  const prev=cut>3?classifyAt(cut-1):null;

  let boxState='无有效整理区',boxPos=null,boxBreak='无';

}

      wseg.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
      const iHi=DATA.indexOf(hi),iLo=DATA.indexOf(lo);
      if(iHi>=0){ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#d64045';ctx.fillText('近高 '+hi.h.toFixed(2), xs(iHi), yv(hi.h)-14);ctx.strokeStyle='#d64045';ctx.beginPath();ctx.arc(xs(iHi),yv(hi.h),6,0,7);ctx.stroke();}
      if(iLo>=0){ctx.fillStyle='#1a7a4c';ctx.fillText('近低 '+lo.l.toFixed(2), xs(iLo), yv(lo.l)+20);ctx.strokeStyle='#1a7a4c';ctx.beginPath();ctx.arc(xs(iLo),yv(lo.l),6,0,7);ctx.stroke();}
    }
  }
  // 防守位、确认位、趋势状态
  if(sel.has(1)||sel.has(4)){
    const color=a.dirClass==='up'?'#c0392b':a.dirClass==='down'?'#1a7a4c':'#667085';
    labelBox(a.dir+' · '+(a.warnLevel==='高'?'结尾证据强':a.warnLevel==='中'?'观察结尾':'趋势未坏'),padL+8,priceTop()+8,color);
    if(Number.isFinite(a.guard)){ctx.save();ctx.strokeStyle='#2563eb';ctx.lineWidth=1.8;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(padL,yv(a.guard));ctx.lineTo(cv.width-34,yv(a.guard));ctx.stroke();labelBox('防守位 '+fmt(a.guard),cv.width-145,yv(a.guard)-11,'#2563eb');ctx.restore();}
    if(a.div){const p=a.div.type==='顶背驰迹象'?DATA[a.div.B].h:DATA[a.div.B].l;labelBox(a.div.type,xs(a.div.B)-42,yv(p)+(a.div.type==='顶背驰迹象'?-58:34),'#d97706');}
  }
  // 当前点竖线+标签(防越界)
  const xCut=xs(cut),cLabel='▮ '+DATA[cut].d+' 收'+DATA[cut].c.toFixed(2);
  ctx.save();ctx.strokeStyle='#d64045';ctx.lineWidth=2.2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(xCut,priceTop());ctx.lineTo(xCut,cv.height-padB);ctx.stroke();ctx.restore();
  ctx.font='bold 12px sans-serif';ctx.fillStyle='#d64045';
  const lwTxt=ctx.measureText(cLabel).width;
  if(xCut+lwTxt/2>cv.width-6)ctx.textAlign='right',ctx.fillText(cLabel,xCut-6,priceTop()+16);
  else if(xCut-lwTxt/2<padL)ctx.textAlign='left',ctx.fillText(cLabel,xCut+6,priceTop()+16);
  else ctx.textAlign='center',ctx.fillText(cLabel,xCut,priceTop()+16);
  document.getElementById('nowtag').textContent='当前停在：'+DATA[cut].d+'　收盘 '+DATA[cut].c.toFixed(2)+'　趋势：'+a.dir+'　结尾证据：'+a.warnLevel+'　'+a.positionState+'（cut之后无数据=无未来）';
  // 按钮
  const st=document.getElementById('steps');st.innerHTML='';
  STEPS.forEach((nm,i)=>{const b=document.createElement('button');b.className='step'+(sel.has(i+1)?' on':'');b.textContent=nm;
    b.onclick=()=>{if(sel.has(i+1)){sel.delete(i+1)}else{sel.add(i+1);lastStep=i+1}draw();};st.appendChild(b);});
  renderConclusion();
}
// ---- 结论(每步必给, 缺数据明确标注) ----
function renderConclusion(){
  const el=document.getElementById('res'),meta=document.getElementById('meta');
  const a=analyze(),cur=a.cur,H=a.H,L=a.L;
  let html='',metaTxt='窗口'+wk()+'根 · 到 '+DATA[cut].d;
  metaTxt+=' · 波段高'+H.length+'/低'+L.length+' · 动态整理区'+(a.box?'■有':'□无')+' · 5日线 '+fmt(a.m5)+' · 10日线 '+fmt(a.m10);
  const overview='<div class="panel">'
    +'<div class="pill"><div class="k">当前趋势</div><div class="v">'+a.dir+'</div><div class="s">'+a.evidence+'</div></div>'
    +'<div class="pill"><div class="k">结尾证据</div><div class="v">'+(a.warnLevel==='低'?'未出现':a.warnLevel)+'</div><div class="s">'+a.warning+'；'+a.positionState+'</div></div>'
    +'<div class="pill"><div class="k">转折确认</div><div class="v">'+(a.changed?'有切换':'未确认')+'</div><div class="s">'+a.confirmText+'</div></div>'
    +'<div class="pill"><div class="k">下一趋势</div><div class="v">'+(a.dirClass==='flat'?'等待':'跟踪')+'</div><div class="s">'+a.newTrend+'</div></div>'
    +'</div>';
  if(lastStep===1){
    html=overview+'<div class="note"><b>❶ 总览</b>：当前判为 <b>'+a.dir+'</b>。图上同色标签显示趋势，高点/低点虚线显示证据；蓝色横线是当前判断的防守位或破坏位。<br>学习核对：趋势不是看当天红绿 K，而是看最近两个波段高点和低点是否同向抬升/走低。</div>';
  }else if(lastStep===2){
    let hi=cur,lo=cur;const wseg=DATA.slice(Math.max(0,cut-14),cut+1);
    wseg.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
    html=overview+'<div class="note"><b>❷ 趋势证据</b>：'+a.evidence+'<br>近10日压力 <b>'+fmt(hi.h)+'</b>（'+hi.d.slice(5)+'），近10日支撑 <b>'+fmt(lo.l)+'</b>（'+lo.d.slice(5)+'）。防守位：<b>'+fmt(a.guard)+'</b>；确认/突破位：<b>'+fmt(a.confirm)+'</b>。</div>';
  }else if(lastStep===3){
    html=overview+(a.box?'<div class="note"><b>❸ 整理/箱体</b>：当前用历史数据识别到动态整理区 <b class="bx">'+a.boxState+'</b>。当前状态：<b>'+a.boxBreak+'</b>。<br>注意：这里是学习版“类中枢/整理区”，用于训练观察压力支撑；严格缠论还需要同级别笔、线段和中枢递归确认。</div>':'<div class="note"><b>❸ 整理/箱体</b>：当前历史数据里没有形成足够清楚的重叠整理区，所以不把它当箱体高抛低吸处理。</div>');
  }else if(lastStep===4){
    html=overview+'<div class="note '+(a.warnLevel==='高'?'danger':a.warnLevel==='中'?'warn':'ok')+'"><b>❹ 转折确认</b>：'+a.confirmText+'<br>趋势结尾证据：<b>'+a.warnLevel+'</b>，'+a.warning+'<br>位置状态：'+a.positionState+'。<br>背驰/动能：'+(a.div?'<b>'+a.div.type+'</b>，'+a.div.txt:'暂无明确顶/底背驰迹象')+'。<br>关键点：近期高点和大阳线只能说明位置高、走势强；背驰或跌破防守位才是“可能结束”，真正进入新趋势还要看结构切换和后续站稳。</div>';
  }else if(lastStep===5){
    let txt='保持观察：'+a.newTrend,cls='note';
    if(a.dirClass==='up'&&a.warnLevel==='低')txt='上升结构仍在：以防守位 '+fmt(a.guard)+' 为观察线，没破之前先按趋势延续学习。';
    if(a.dirClass==='up'&&a.warnLevel==='低'&&a.newHighExhaust)txt='上升结构仍在，但处于阶段新高/加速上涨位置：这不是顶部确认，后面重点看是否继续站稳，或回落跌破防守位 '+fmt(a.guard)+'。';
    if(a.dirClass==='up'&&a.warnLevel!=='低')txt='上涨可能进入末段：不要只因背驰就断言反转，重点看是否跌破 '+fmt(a.guard)+'，以及反抽是否过不了前高。',cls='note warn';
    if(a.dirClass==='down'&&a.warnLevel==='低')txt='下降结构仍在：以防守位 '+fmt(a.guard)+' 为观察线，没突破之前先按趋势延续学习。';
    if(a.dirClass==='down'&&a.warnLevel==='低'&&a.newLowExhaust)txt='下降结构仍在，但处于阶段新低/加速下跌位置：这不是底部确认，后面重点看是否收回，或反弹突破防守位 '+fmt(a.guard)+'。';
    if(a.dirClass==='down'&&a.warnLevel!=='低')txt='下跌可能进入末段：重点看是否突破 '+fmt(a.guard)+'，以及回踩是否不再创新低。',cls='note warn';
    if(a.dirClass==='flat'&&a.box)txt='横盘学习重点：上沿 '+fmt(a.box.top)+'、下沿 '+fmt(a.box.bot)+'。靠近边界先看突破真假，不急着把横盘叫成新趋势。';
    html=overview+'<div class="'+cls+'"><b>❺ 操作提示</b>：'+txt+'<br><span style="color:#8899aa">这是学习用技术判读，不构成买卖建议；它会暴露判断依据，方便你核对它有没有说错。</span></div>';
  }
  el.innerHTML=html;meta.innerHTML='<b>自检：</b>'+metaTxt;
}
document.getElementById('slider').addEventListener('input',(e)=>{cut=+e.target.value;draw()});
window.addEventListener('resize',()=>{px();draw()});
px();draw();
</script></body></html>
