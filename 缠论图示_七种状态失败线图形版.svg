<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
  <defs>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .card{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .txt{font:800 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .future{fill:none;stroke:#94a3b8;stroke-width:2.6;stroke-dasharray:6 6}
      .key{stroke:#2563eb;stroke-width:2.4}
      .guard{stroke:#f59e0b;stroke-width:2.4}
      .fail{stroke:#dc2626;stroke-width:2.8}
      .range{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}
      .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.6}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2.6}
      .orange{fill:#fff7ed;stroke:#f59e0b;stroke-width:2.6}
      .red{fill:#fef2f2;stroke:#dc2626;stroke-width:2.6}
      .purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.6}
      .tagG{fill:#f0fdf4;stroke:#16a34a}
      .tagB{fill:#eff6ff;stroke:#2563eb}
      .tagO{fill:#fff7ed;stroke:#f59e0b}
      .tagR{fill:#fef2f2;stroke:#dc2626}
      .tagP{fill:#f5f3ff;stroke:#7c3aed}
      .tagText{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    </style>
  </defs>

  <rect class="bg" width="1400" height="1120"/>
  <text class="title" x="64" y="70">一个状态一个状态看：失败线到底画在哪里？</text>
  <text class="sub" x="64" y="102">每个动作都要回答两个问题：现在该做什么？如果判断错了，哪条线被跌破/突破就要承认？</text>

  <!-- 1 observe -->
  <g transform="translate(64 136)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">① 观察区：先不入手</text>
    <text class="small" x="24" y="62">状态：靠近关键位，但没有确认</text>
    <line class="guard" x1="40" y1="152" x2="356" y2="152"/>
    <text class="tiny" x="264" y="144">候选关键位</text>
    <path class="price" d="M48 112 L96 68 L144 128 L192 86 L240 150 L292 132 L344 156"/>
    <circle class="orange" cx="344" cy="156" r="9"/>
    <path class="future" d="M344 156 C360 172 364 188 368 204"/>
    <rect class="tagO" x="28" y="188" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="212" text-anchor="middle" fill="#b45309">动作：等待；失败线只是“观察失效线”</text>
  </g>

  <!-- 2 ordinary -->
  <g transform="translate(502 136)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">② 普通确认：小仓试错</text>
    <text class="small" x="24" y="62">状态：第一根收盘突破压力位</text>
    <line class="key" x1="40" y1="124" x2="356" y2="124"/>
    <text class="tiny" x="260" y="116">突破线/压力位</text>
    <line class="fail" x1="40" y1="164" x2="356" y2="164"/>
    <text class="tiny" x="252" y="182">失败线：试错K低点</text>
    <path class="price" d="M48 172 L96 128 L144 156 L192 136 L240 168 L288 116 L344 92"/>
    <circle class="blue" cx="288" cy="116" r="9"/>
    <circle class="red" cx="288" cy="164" r="7"/>
    <rect class="tagB" x="28" y="188" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="212" text-anchor="middle" fill="#1d4ed8">动作：小仓；跌回突破线/试错K低点认错</text>
  </g>

  <!-- 3 robust -->
  <g transform="translate(940 136)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">③ 稳健确认：正常仓位</text>
    <text class="small" x="24" y="62">状态：突破后回踩不破，再次向上</text>
    <line class="key" x1="40" y1="132" x2="356" y2="132"/>
    <text class="tiny" x="252" y="124">压力转支撑</text>
    <line class="fail" x1="40" y1="172" x2="356" y2="172"/>
    <text class="tiny" x="236" y="190">失败线：回踩低点</text>
    <path class="price" d="M48 168 L96 128 L144 156 L192 112 L240 152 L288 126 L344 88"/>
    <circle class="blue" cx="192" cy="112" r="8"/>
    <circle class="orange" cx="240" cy="152" r="8"/>
    <circle class="green" cx="344" cy="88" r="9"/>
    <rect class="tagG" x="28" y="196" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="220" text-anchor="middle" fill="#15803d">动作：提升仓位；跌破回踩低点则失败</text>
  </g>

  <!-- 4 trend hold -->
  <g transform="translate(64 420)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">④ 趋势延续：持有</text>
    <text class="small" x="24" y="62">状态：高点和低点继续抬升</text>
    <line class="guard" x1="40" y1="164" x2="356" y2="164"/>
    <text class="tiny" x="248" y="156">滚动防守位</text>
    <path class="price" d="M48 176 L92 132 L136 160 L180 104 L224 144 L268 84 L312 132 L356 72"/>
    <circle class="orange" cx="312" cy="132" r="8"/>
    <circle class="green" cx="356" cy="72" r="9"/>
    <rect class="tagG" x="28" y="196" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="220" text-anchor="middle" fill="#15803d">动作：持有；跌破最近确认低点再处理</text>
  </g>

  <!-- 5 tail reduce -->
  <g transform="translate(502 420)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">⑤ 尾声变弱：减仓观察</text>
    <text class="small" x="24" y="62">状态：未破防，但推进变弱</text>
    <line class="guard" x1="40" y1="168" x2="356" y2="168"/>
    <text class="tiny" x="248" y="160">原防守位</text>
    <path class="price" d="M48 168 L96 108 L144 148 L192 92 L240 144 L288 112 L344 152"/>
    <circle class="orange" cx="344" cy="152" r="9"/>
    <path class="future" d="M344 152 C352 164 356 176 360 190"/>
    <rect class="tagO" x="28" y="196" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="220" text-anchor="middle" fill="#b45309">动作：减仓；真正失败线仍是原防守位</text>
  </g>

  <!-- 6 break exit -->
  <g transform="translate(940 420)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">⑥ 有效破防：离场/降仓</text>
    <text class="small" x="24" y="62">状态：收盘跌破防守位，旧逻辑失效</text>
    <line class="guard" x1="40" y1="132" x2="356" y2="132"/>
    <text class="tiny" x="248" y="124">原防守位</text>
    <line class="key" x1="184" y1="100" x2="356" y2="100"/>
    <text class="tiny" x="232" y="92">后续压力位</text>
    <path class="price" d="M48 88 L92 64 L136 116 L180 152 L224 104 L268 160 L320 188"/>
    <circle class="red" cx="180" cy="152" r="9"/>
    <circle class="blue" cx="224" cy="104" r="8"/>
    <rect class="tagR" x="28" y="196" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="220" text-anchor="middle" fill="#b91c1c">动作：退出；接回改看破防后压力位</text>
  </g>

  <!-- 7 repair -->
  <g transform="translate(284 704)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">⑦ 修复接回：重新建仓</text>
    <text class="small" x="24" y="62">状态：突破压力，回踩守住，再次向上</text>
    <line class="key" x1="40" y1="128" x2="356" y2="128"/>
    <text class="tiny" x="228" y="120">破防后压力位</text>
    <line class="fail" x1="40" y1="172" x2="356" y2="172"/>
    <text class="tiny" x="228" y="190">失败线：修复回踩低点</text>
    <path class="price" d="M48 160 L96 112 L144 156 L192 104 L240 148 L288 118 L344 84"/>
    <circle class="blue" cx="192" cy="104" r="8"/>
    <circle class="orange" cx="240" cy="148" r="8"/>
    <circle class="purple" cx="344" cy="84" r="9"/>
    <rect class="tagP" x="28" y="196" width="340" height="36" rx="8"/>
    <text class="tagText" x="198" y="220" text-anchor="middle" fill="#6d28d9">动作：接回；跌破回踩低点则修复失败</text>
  </g>

  <!-- 8 range -->
  <g transform="translate(724 704)">
    <rect class="card" x="0" y="0" width="396" height="244" rx="10"/>
    <text class="txt" x="24" y="36">补充：震荡区间仓位</text>
    <text class="small" x="24" y="62">状态：上下沿清楚，区间内来回</text>
    <line class="range" x1="40" y1="88" x2="356" y2="88"/>
    <line class="range" x1="40" y1="176" x2="356" y2="176"/>
    <text class="tiny" x="264" y="80">上沿：减仓/卖压</text>
    <text class="tiny" x="264" y="196">下沿：低吸观察</text>
    <path class="price" d="M48 164 L92 96 L136 172 L180 92 L224 168 L268 104 L320 180"/>
    <circle class="red" cx="320" cy="180" r="9"/>
    <rect class="tagR" x="28" y="204" width="340" height="28" rx="8"/>
    <text class="tagText" x="198" y="224" text-anchor="middle" fill="#b91c1c">下沿有效跌破：区间低吸逻辑失败</text>
  </g>

  <!-- bottom summary -->
  <g transform="translate(64 992)">
    <rect class="card" x="0" y="0" width="1272" height="72" rx="10"/>
    <text class="txt" x="24" y="32">统一口诀</text>
    <text class="small" x="132" y="32">观察区看“候选失效”；试错仓看“突破线/试错K低点”；正常仓看“回踩低点”；持有看“滚动防守位”；破防后接回看“修复回踩低点”。</text>
    <text class="tiny" x="132" y="56">学习用途，不构成投资建议。真实交易还要结合滑点、流动性、仓位上限与个人风险承受能力。</text>
  </g>
</svg>
