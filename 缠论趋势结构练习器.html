<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#eef1f5;color:#1a2233;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.wrap{max-width:1120px;margin:0 auto}h1{font-size:22px;margin:0 0 6px}.sub{font-size:13px;color:#667085;margin:0 0 14px;line-height:1.7}
.card{background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(30,41,59,.08);padding:16px;margin-bottom:14px}
canvas{display:block;width:100%;height:auto;background:#fafbfc;border:1px solid #e2e7ee;border-radius:10px;cursor:crosshair}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.bar input[type=range]{flex:1;min-width:220px;accent-color:#2563eb}.date{font-weight:800;color:#d64045}
.practice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:#344054;font-weight:700}
select,input{height:38px;border:1px solid #cfd8e3;border-radius:9px;padding:0 10px;background:#fff;font:inherit}button{height:38px;border:1px solid #cfd8e3;border-radius:9px;background:#fff;padding:0 13px;font:inherit;font-weight:800;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.actions{display:flex;gap:9px;align-items:end}.drawbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.drawbar button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.hint{font-size:12px;color:#667085;line-height:1.7;margin-top:10px}
.answer{font-size:14px;line-height:1.85;background:#f6f9fd;border:1px solid #d9e0ea;border-radius:10px;padding:14px 16px;margin-top:14px}.answer b{color:#1d4ed8}.ok{color:#0e7a4d;font-weight:800}.bad{color:#c0392b;font-weight:800}.pending{color:#667085;font-weight:800}.muted{color:#667085}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2f7;margin-right:6px;font-weight:800}
@media(max-width:860px){.practice{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:560px){.practice{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>缠论趋势结构练习器</h1>
  <p class="sub">练习顺序：先只看 K 线，自己找波段高低点；再判断上升、下降或横盘；最后点“显示答案”核对。这里用的是学习版日线中短波段，不是严格递归的缠论级别。</p>
  <div class="card">
    <canvas id="cv"></canvas>
    <div class="bar">
      <label><b>练习日期：</b></label>
      <input id="slider" type="range" min="8" max="44" step="1">
      <span id="date" class="date"></span>
    </div>
    <div class="practice">
      <div class="field">
        <label for="trend">你判断的趋势</label>
        <select id="trend">
          <option value="">先不看答案</option>
          <option value="up">上升趋势</option>
          <option value="down">下降趋势</option>
          <option value="flat">横盘/整理</option>
          <option value="insufficient">数据不足</option>
        </select>
      </div>
      <div class="field">
        <label for="state">你判断的状态</label>
        <select id="state">
          <option value="">先不看答案</option>
          <option value="continue">趋势延续</option>
          <option value="watch">尾声观察</option>
          <option value="switch">结构切换</option>
          <option value="flat">横盘整理</option>
          <option value="insufficient">数据不足</option>
        </select>
      </div>
      <div class="field">
        <label for="guard">你画的防守位</label>
        <input id="guard" inputmode="decimal" placeholder="例如 39.23">
      </div>
      <div class="actions">
        <button id="reveal" class="primary">显示答案</button>
        <button id="reset">清空</button>
      </div>
    </div>
    <div class="drawbar">
      <button id="drawMode" class="on">画点模式：开</button>
      <button id="undoPoint">撤销上一个点</button>
      <button id="clearPoints">清空我的折线</button>
      <span id="drawHint" class="muted"></span>
    </div>
    <div class="hint">画点提醒：在 K 线附近点击。点在蜡烛上半区会吸附为该日高点，点在下半区会吸附为该日低点。紫色虚线是你的折线；显示答案后，蓝色实线是参考折线。</div>
    <div id="answer" class="answer"></div>
  </div>
</div>

];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const slider=document.getElementById('slider'),dateEl=document.getElementById('date'),answerEl=document.getElementById('answer');
let cut=44,reveal=false,drawMode=true,userPts=[];
let chart={padL:56,padT:36,pb:0,pt:36,x:null,y:null,bw:8};
function fmt(n){return Number.isFinite(n)?n.toFixed(2):'--'}
function ma(n){const s=DATA.slice(Math.max(0,cut-n+1),cut+1);return s.reduce((a,d)=>a+d.c,0)/s.length}
function pivots(){
  const left=2,right=2,out=[];
  for(let i=left;i<=cut-right;i++){
    const win=DATA.slice(i-left,i+right+1);
    if(DATA[i].h===Math.max(...win.map(d=>d.h)))out.push({i,type:'H',v:DATA[i].h});
    if(DATA[i].l===Math.min(...win.map(d=>d.l)))out.push({i,type:'L',v:DATA[i].l});
  }
  out.sort((a,b)=>a.i-b.i);
  const alt=[];
  for(const p of out){
    const q=alt[alt.length-1];
    if(q&&q.type===p.type){
      if(p.type==='H'?p.v>q.v:p.v<q.v)alt[alt.length-1]=p;
    }else alt.push(p);
  }
  return alt;
}
function analyze(){
  const ps=pivots(),hs=ps.filter(p=>p.type==='H'),ls=ps.filter(p=>p.type==='L');
  let dir='insufficient',guard=null,explain='至少需要两组波段高点和低点。';
  if(hs.length>=2&&ls.length>=2){
    const h1=hs[hs.length-2],h2=hs[hs.length-1],l1=ls[ls.length-2],l2=ls[ls.length-1];
    const highUp=h2.v>h1.v,lowUp=l2.v>l1.v,highDown=h2.v<h1.v,lowDown=l2.v<l1.v;
    if(highUp&&lowUp){dir='up';guard=l2.v;explain=`高点抬升 ${fmt(h1.v)}→${fmt(h2.v)}，低点抬升 ${fmt(l1.v)}→${fmt(l2.v)}。`;}
    else if(highDown&&lowDown){dir='down';guard=h2.v;explain=`高点降低 ${fmt(h1.v)}→${fmt(h2.v)}，低点降低 ${fmt(l1.v)}→${fmt(l2.v)}。`;}
    else{dir='flat';guard=Math.min(l1.v,l2.v);explain=`高低点不同步：高点 ${fmt(h1.v)}→${fmt(h2.v)}，低点 ${fmt(l1.v)}→${fmt(l2.v)}。`;}
  }
  const cur=DATA[cut],m5=ma(5),m10=ma(10);
  let state=dir==='flat'?'flat':dir==='insufficient'?'insufficient':'continue';
  let stateExplain=dir==='flat'?'高低点不同步，先按整理看。':dir==='insufficient'?'数据不足。':'结构尚未破坏，先按趋势延续看。';
  if(dir==='up'&&Number.isFinite(guard)&&cur.c<guard){state='switch';stateExplain='收盘跌破上升趋势防守低点，上升结构被破坏，进入结构切换观察。'}
  if(dir==='down'&&Number.isFinite(guard)&&cur.c>guard){state='switch';stateExplain='收盘突破下降趋势防守高点，下降结构被破坏，进入结构切换观察。'}
  if(dir==='up'&&cur.c<m5&&cur.c>=guard){state='watch';stateExplain='收盘跌破5日均线但未破防守位，只是尾声观察，不是确认反转。'}
  if(dir==='down'&&cur.c>m5&&cur.c<=guard){state='watch';stateExplain='收盘站上5日均线但未破防守位，只是尾声观察，不是确认反转。'}
  return {ps,hs,ls,dir,guard,explain,state,stateExplain,m5,m10};
}
function label(v,map){return map[v]||'未选择'}
function hitPoint(evt){
  const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
  const mx=(evt.clientX-r.left)*sx,my=(evt.clientY-r.top)*sy;
  const idx=Math.max(0,Math.min(cut,Math.round((mx-chart.padL)/(cv.width-chart.padL-28)*(DATA.length-1))));
  if(!chart.x||!chart.y||my<chart.pt-12||my>chart.pb+12)return null;
  const d=DATA[idx],mid=(chart.y(d.h)+chart.y(d.l))/2;
  const type=my<=mid?'H':'L';
  return {i:idx,type,v:type==='H'?d.h:d.l};
}
function addUserPoint(p){
  if(!p)return;
  const last=userPts[userPts.length-1];
  if(last&&last.i===p.i&&last.type===p.type)return;
  if(last&&last.type===p.type){
    const better=p.type==='H'?p.v>last.v:p.v<last.v;
    if(better)userPts[userPts.length-1]=p;
    else userPts.push(p);
  }else userPts.push(p);
  userPts.sort((a,b)=>a.i-b.i);
  reveal=false;document.getElementById('reveal').textContent='显示答案';
  draw();
}
function comparePoints(ref){
  const tol=1,used=new Set(),matched=[];
  for(const rp of ref){
    let best=-1,bestDist=99;
    userPts.forEach((up,j)=>{const dist=Math.abs(up.i-rp.i);if(!used.has(j)&&up.type===rp.type&&dist<=tol&&dist<bestDist){best=j;bestDist=dist}});
    if(best>=0){used.add(best);matched.push({ref:rp,user:userPts[best]})}
  }
  const missing=ref.filter(rp=>!matched.some(m=>m.ref===rp));
  const rawExtra=userPts.filter((_,j)=>!used.has(j));
  const acceptedExtra=[],extra=[];
  for(const p of rawExtra){
    const d=DATA[p.i];
    const isLeftAnchor=p.i===0&&p.type==='L';
    const isRightCandidate=p.i===cut&&(p.type==='H'||p.type==='L');
    if(isLeftAnchor||isRightCandidate)acceptedExtra.push({...p,why:isLeftAnchor?'起点锚点':'最右侧候选点'});
    else extra.push(p);
  }
  const score=ref.length?Math.round(matched.length/ref.length*100):0;
  return {matched,missing,acceptedExtra,extra,score};
}
function ptText(p){return `${DATA[p.i].d.slice(5)} ${p.type==='H'?'高':'低'} ${fmt(p.v)}`}
function extraText(p){return `${ptText(p)}（${p.why}）`}
function checkText(done,ok,label){
  if(!done)return `<span class="pending">○ ${label}未作答</span>`;
  return `<span class="${ok?'ok':'bad'}">${ok?'✓':'×'} ${label}</span>`;
}
function drawPolyline(points,color,lineWidth,dash){
  if(!points.length||!chart.x||!chart.y)return;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lineWidth;if(dash)ctx.setLineDash(dash);ctx.beginPath();
  points.forEach((p,j)=>{const xx=chart.x(p.i),yy=chart.y(p.v);if(j)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy)});
  ctx.stroke();ctx.setLineDash([]);
  points.forEach((p,j)=>{ctx.beginPath();ctx.arc(chart.x(p.i),chart.y(p.v),6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=color;ctx.stroke();ctx.fillStyle=color;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(j+1,chart.x(p.i),chart.y(p.v)-10)});
  ctx.restore();
}
function draw(){
  cv.width=Math.max(900,cv.parentElement.clientWidth-6);cv.height=Math.max(590,cv.width*.64);
  slider.value=cut;dateEl.textContent=DATA[cut].d+' 收盘 '+fmt(DATA[cut].c)+(reveal?'（答案已显示）':'（先自己判断）');
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,cv.width,cv.height);
  const padL=56,padT=36,padB=92,pb=cv.height-padB,pt=padT;
  const s=DATA.slice(0,cut+1),mn=Math.min(...s.map(d=>d.l)),mx=Math.max(...s.map(d=>d.h)),gap=(mx-mn)||1;
  const x=i=>padL+(cv.width-padL-28)*i/(DATA.length-1);
  const y=v=>pb-(pb-pt)*(v-(mn-gap*.08))/((mx+gap*.08)-(mn-gap*.08));
  chart={padL,padT,pb,pt,x,y,bw:Math.max(2,cv.width/DATA.length*.42)};
  ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;
  for(let k=0;k<=6;k++){const val=mn+(mx-mn)*k/6,yy=pb-(pb-pt)*k/6;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(cv.width-28,yy);ctx.stroke();ctx.fillStyle='#8894a6';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(val.toFixed(1),padL-6,yy+3)}
  ctx.textAlign='center';ctx.fillStyle='#99a4b4';ctx.font='10px sans-serif';
  s.forEach((d,i)=>{if(i%5===0||i===cut)ctx.fillText(d.d.slice(5),x(i),pb+20)});
  const bw=chart.bw;
  s.forEach((d,i)=>{const up=d.c>=d.o;ctx.strokeStyle=up?'#c0392b':'#1a7a4c';ctx.fillStyle=up?'rgba(192,57,43,.86)':'rgba(26,122,76,.86)';ctx.beginPath();ctx.moveTo(x(i),y(d.l));ctx.lineTo(x(i),y(d.h));ctx.stroke();const top=Math.min(y(d.o),y(d.c)),bot=Math.max(y(d.o),y(d.c));ctx.fillRect(x(i)-bw/2,top,bw,Math.max(1,bot-top))});
  const xc=x(cut);ctx.save();ctx.strokeStyle='#d64045';ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xc,pt);ctx.lineTo(xc,pb);ctx.stroke();ctx.restore();
  drawPolyline(userPts,'#7c3aed',2.5,[8,4]);
  if(reveal){
    const a=analyze();
    ctx.save();ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();
    a.ps.forEach((p,j)=>{if(j)ctx.lineTo(x(p.i),y(p.v));else ctx.moveTo(x(p.i),y(p.v))});ctx.stroke();
    a.ps.forEach(p=>{ctx.beginPath();ctx.arc(x(p.i),y(p.v),5,0,Math.PI*2);ctx.fillStyle=p.type==='H'?'#fff2f2':'#effaf4';ctx.fill();ctx.strokeStyle=p.type==='H'?'#d64045':'#1a7a4c';ctx.stroke();ctx.fillStyle=p.type==='H'?'#d64045':'#1a7a4c';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText((p.type==='H'?'高 ':'低 ')+fmt(p.v),x(p.i),y(p.v)+(p.type==='H'?-12:20))});
    if(Number.isFinite(a.guard)){ctx.strokeStyle='#2563eb';ctx.setLineDash([4,4]);ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(padL,y(a.guard));ctx.lineTo(cv.width-28,y(a.guard));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#2563eb';ctx.textAlign='left';ctx.fillText('防守位 '+fmt(a.guard),cv.width-145,y(a.guard)-8)}
    ctx.restore();
  }
  document.getElementById('drawHint').textContent=`我的点：${userPts.length} 个${drawMode?'，画点模式已开启':'，画点模式已关闭'}`;
  renderAnswer();
}
function renderAnswer(){
  if(!reveal){answerEl.innerHTML='<span class="muted">答案隐藏中。先在上面选趋势、状态，并尝试填防守位；再点“显示答案”。</span>';return}
  const a=analyze(),trendMap={up:'上升趋势',down:'下降趋势',flat:'横盘/整理',insufficient:'数据不足'},stateMap={continue:'趋势延续',watch:'尾声观察',switch:'结构切换',flat:'横盘整理',insufficient:'数据不足'};
  const myTrend=document.getElementById('trend').value,myState=document.getElementById('state').value,myGuard=parseFloat(document.getElementById('guard').value);
  const guardOk=Number.isFinite(a.guard)&&Number.isFinite(myGuard)&&Math.abs(myGuard-a.guard)<=0.03;
  const trendOk=myTrend&&myTrend===a.dir,stateOk=myState&&myState===a.state;
  const ps=a.ps.map(p=>`${DATA[p.i].d.slice(5)} ${p.type==='H'?'高':'低'} ${fmt(p.v)}`).join(' → ')||'暂无';
  const cmp=comparePoints(a.ps);
  const missing=cmp.missing.map(ptText).join('；')||'无';
  const accepted=cmp.acceptedExtra.map(extraText).join('；')||'无';
  const extra=cmp.extra.map(ptText).join('；')||'无';
  answerEl.innerHTML=
    `<span class="pill">趋势 ${trendMap[a.dir]}</span><span class="pill">状态 ${stateMap[a.state]}</span><span class="pill">防守位 ${fmt(a.guard)}</span><br>`+
    `<b>标准波段折线：</b>${ps}<br>`+
    `<b>你的折线：</b>${userPts.map(ptText).join(' → ')||'还没有画点'}<br>`+
    `<b>画点核对：</b><span class="${cmp.score>=75?'ok':'bad'}">${cmp.score} 分</span>，关键参考点匹配 ${cmp.matched.length}/${a.ps.length}；漏画：${missing}；可接受补充：${accepted}；真正多画：${extra}<br>`+
    `<b>判断理由：</b>${a.explain}${a.stateExplain}<br>`+
    `<b>选择题/防守位核对：</b>${checkText(!!myTrend,trendOk,'趋势')}　${checkText(!!myState,stateOk,'状态')}　${checkText(Number.isFinite(myGuard),guardOk,'防守位')}<br>`+
    `<span class="muted">注意：最右侧当天如果创新高/新低，但右侧还没有后续 K 线，只能先看作候选转折点，不能提前确认为波段点。</span>`;
}
cv.addEventListener('click',e=>{if(drawMode&&!reveal)addUserPoint(hitPoint(e))});
slider.oninput=e=>{cut=+e.target.value;reveal=false;userPts=[];document.getElementById('reveal').textContent='显示答案';draw()};
document.getElementById('reveal').onclick=()=>{reveal=!reveal;document.getElementById('reveal').textContent=reveal?'隐藏答案':'显示答案';draw()};
document.getElementById('reset').onclick=()=>{document.getElementById('trend').value='';document.getElementById('state').value='';document.getElementById('guard').value='';reveal=false;userPts=[];document.getElementById('reveal').textContent='显示答案';draw()};
document.getElementById('drawMode').onclick=()=>{drawMode=!drawMode;document.getElementById('drawMode').className=drawMode?'on':'';document.getElementById('drawMode').textContent=drawMode?'画点模式：开':'画点模式：关';draw()};
document.getElementById('undoPoint').onclick=()=>{userPts.pop();reveal=false;document.getElementById('reveal').textContent='显示答案';draw()};
document.getElementById('clearPoints').onclick=()=>{userPts=[];reveal=false;document.getElementById('reveal').textContent='显示答案';draw()};
['trend','state','guard'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(reveal)renderAnswer()}));
window.addEventListener('resize',draw);
draw();
</script>
</body>
</html>
