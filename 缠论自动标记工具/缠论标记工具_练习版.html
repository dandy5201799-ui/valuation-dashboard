<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缠论结构练习器 · 历史回放</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f0;
    --panel: #ffffff;
    --line: #e2ddd0;
    --chip: #f0eee6;
    --ink: #1c1f26;
    --muted: #8b8677;
    --faint: #a19c8c;
    --up: #1f9d63;
    --down: #d1453a;
    --amber: #b8790a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px 10px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: .2px; }
  .sub { font-size: 12px; color: var(--muted); }
  .tiny { font-size: 11px; color: var(--faint); }
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 22px; border-bottom: 1px solid var(--line); background: #fbfaf6;
  }
  .group { display: flex; align-items: center; gap: 7px; }
  .group > .lbl { font-size: 11px; font-weight: 700; color: var(--muted); }
  button {
    font-family: inherit; font-size: 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: #3a3730; padding: 5px 10px;
  }
  button:hover:not(:disabled) { background: var(--chip); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #2f2b24; border-color: #2f2b24; color: #fff; }
  .step { min-width: 42px; }
  input[type=range] { width: 100%; accent-color: #6b6659; }
  main { display: flex; gap: 0; align-items: stretch; }
  .left { flex: 1; min-width: 0; padding: 12px 10px 12px 22px; }
  .right { width: 330px; flex: none; padding: 12px 22px 12px 14px; border-left: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .chart { padding: 6px 4px; }
  .slider-row { padding: 8px 22px 2px; }
  .marks { display: flex; justify-content: space-between; padding: 0 22px 10px; }
  .qhead { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .5px; }
  .qtext { font-size: 15px; font-weight: 700; line-height: 1.45; margin: 8px 0 4px; }
  .opts { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .opt { text-align: left; padding: 9px 12px; font-size: 13px; font-weight: 600; }
  .opt.up { color: var(--up); }
  .opt.down { color: var(--down); }
  .opt.skip { color: var(--muted); }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; font-size: 12px; margin-top: 10px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .verdict { font-size: 15px; font-weight: 700; margin: 2px 0 6px; }
  .score { display: flex; gap: 14px; font-size: 12px; }
  .score b { font-size: 16px; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .sect { padding: 12px 14px; }
  .sect + .sect { border-top: 1px solid var(--line); }
  footer { padding: 12px 22px 26px; font-size: 11px; color: var(--faint); line-height: 1.7; }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    .right { width: auto; border-left: none; border-top: 1px solid var(--line); padding: 12px 22px; }
    .left { padding: 12px 22px; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
    <h1>缠论结构练习器</h1>
    <span class="sub mono" id="symbolLine">—</span>
    <span class="pill" style="background:#ece9e0;color:#5f5a4e;">当时可见模式</span>
  </div>
  <div class="tiny" id="dataLine">—</div>
</header>

<div class="toolbar">
  <div class="group">
    <span class="lbl">观察日</span>
    <span class="mono" id="asOfLabel" style="font-size:13px;font-weight:600;">—</span>
    <span class="tiny" id="asOfPos">—</span>
  </div>
  <div class="group">
    <button class="step" data-step="-20">−20</button>
    <button class="step" data-step="-5">−5</button>
    <button class="step" data-step="-1">−1</button>
    <button class="step" data-step="1">+1</button>
    <button class="step" data-step="5">+5</button>
    <button class="step" data-step="20">+20</button>
  </div>
  <div class="group">
    <span class="lbl">窗口</span>
    <button class="win" data-win="60">60</button>
    <button class="win" data-win="120">120</button>
    <button class="win" data-win="240">240</button>
  </div>
  <div class="group">
    <span class="lbl">图层</span>
    <button class="layer" data-layer="bi">笔</button>
    <button class="layer" data-layer="zs">中枢</button>
    <button class="layer" data-layer="sig">买卖点</button>
    <button class="layer" data-layer="fail">防守/失败线</button>
    <button class="layer" data-layer="macd">MACD</button>
  </div>
  <div class="group" style="margin-left:auto;">
    <button id="btnNew" style="font-weight:600;">随机出题</button>
  </div>
</div>

<div class="slider-row">
  <input type="range" id="slider" min="0" max="100" value="0">
</div>
<div class="marks">
  <span class="tiny mono" id="rangeStart">—</span>
  <span class="tiny mono" id="rangeEnd">—</span>
</div>

<div class="legend" style="display:flex;flex-wrap:wrap;gap:14px;padding:6px 22px 10px;font-size:11px;color:var(--muted);">
  <span><span class="dot" style="background:#1f9d63;"></span>确认买点（实心）</span>
  <span><span class="dot" style="background:#d1453a;"></span>确认卖点（实心）</span>
  <span><span class="dot" style="border:1.5px dashed #b8790a;background:#fff;"></span>候选（尚未确认）</span>
  <span><span class="dot" style="border:1.5px dashed #9c9788;background:#fff;"></span>已失效（曾触发，后被反向价格击穿）</span>
</div>

<main>
  <div class="left">
    <div class="card chart"><svg id="chart" style="display:block;width:100%;"></svg></div>
  </div>

  <div class="right">
    <div class="card">
      <div class="sect" id="qBox">
        <div class="qhead">本题</div>
        <div class="qtext" id="qText">—</div>
        <div class="note" id="qHint"></div>
        <div class="opts" id="opts" hidden>
          <button class="opt up" data-ans="up">↑ 向上离开中枢</button>
          <button class="opt down" data-ans="down">↓ 向下离开中枢</button>
          <button class="opt skip" data-ans="skip">还看不出（不计分）</button>
        </div>
        <div id="result" hidden>
          <div class="verdict" id="verdictText">—</div>
          <dl class="kv" id="revealKv"></dl>
          <div style="margin-top:12px;"><button id="btnNext" style="font-weight:600;">下一题 →</button></div>
        </div>
      </div>

      <div class="sect">
        <div class="qhead">当前结构（按观察日前缀重算）</div>
        <dl class="kv" id="structKv"></dl>
      </div>

      <div class="sect">
        <div class="qhead">战绩</div>
        <div class="score" style="margin-top:8px;">
          <span>答对 <b style="color:var(--up);" id="scOk">0</b></span>
          <span>答错 <b style="color:var(--down);" id="scNo">0</b></span>
          <span>看不出 <b style="color:var(--muted);" id="scSkip">0</b></span>
          <span>正确率 <b id="scRate">—</b></span>
        </div>
        <div style="margin-top:10px;"><button id="btnReset">清空战绩</button></div>
      </div>
    </div>
  </div>
</main>

<footer id="footNote">—</footer>

<script src="./chan-algo.js"></script>
<script src="./chan-data.js"></script>
<script>
(function () {
  'use strict';

  var C = ChanData.dailyCandles;
  var META = ChanData.dataMeta;

  // SPEC E-L02：MACD 至少 130 根预热，预热不足不据此判定力度/背驰，所以出题起点不早于此。
  var MIN_ASOF = 130;
  var MIN_TAIL = 5;

  var state = {
    asOf: 0,
    win: 120,
    layers: { bi: true, zs: true, sig: true, fail: true, macd: true },
    q: null,          // 当前题目（来自完整数据的 ground truth）
    answered: null,   // 'up' | 'down' | 'skip'
    revealed: false,
    peeked: false,    // 作答前把时间轴拖过了答案位置
    score: { ok: 0, no: 0, skip: 0 }
  };

  var structCache = {};

  // SPEC S-02：失败线必须关联具体假设（信号自带的 boundary），并且只用观察日当时已收盘的
  // 价格判断是否被跌破/涨破——annotateSignals 只扫描传入的 cs（已经是按 asOf 截断的前缀），
  // 不会用到 asOf 之后的数据，所以“已失效”这个状态本身也是当时可见的。
  function annotateSignals(signals, cs) {
    return (signals || []).map(function (sig) {
      var stopPrice = sig.boundary != null ? sig.boundary : sig.price;
      var failed = sig.status === 'failed';
      var failedAt = null;
      if (!failed) {
        for (var k = sig.idx + 1; k < cs.length; k++) {
          var c = cs[k];
          if (sig.dir === 'buy' && c.close < stopPrice) { failed = true; failedAt = c.date; break; }
          if (sig.dir === 'sell' && c.close > stopPrice) { failed = true; failedAt = c.date; break; }
        }
      }
      var baseStatus = sig.status || 'confirmed';
      var out = {};
      for (var kk in sig) out[kk] = sig[kk];
      out.stopPrice = stopPrice;
      out.stopFromIdx = sig.idx;
      out.confirmedAt = baseStatus === 'candidate' ? null : sig.date;
      out.failedAt = failedAt;
      out.status = failed ? 'failed' : baseStatus;
      return out;
    });
  }

  // 取“当前仍然有效”的最新信号；若全部已失效，退回最后一个信号（用于展示“最后一次判断在哪失效”）。
  function getCurrentSignal(list) {
    for (var i = list.length - 1; i >= 0; i--) if (list[i].status !== 'failed') return list[i];
    return list.length ? list[list.length - 1] : null;
  }

  function buildFailLine(active) {
    if (!active || active.stopPrice == null) return null;
    var lineName = active.status === 'candidate' ? '候选失效线'
      : active.status === 'failed' ? '已失效线'
      : '失败线（防守位）';
    var actionWord = active.dir === 'buy' ? '跌破' : '涨破';
    return {
      price: active.stopPrice,
      fromIdx: active.stopFromIdx,
      dir: active.dir,
      status: active.status,
      signalType: active.type,
      label: lineName + ' ' + fmt(active.stopPrice),
      detail: actionWord + ' ' + fmt(active.stopPrice) + ' 视为 ' + active.type + ' 判断失效'
    };
  }

  function computeStruct(cs) {
    var merged = ChanAlgo.mergeInclusion(cs);
    var fx = ChanAlgo.findFenxing(merged);
    var bi = ChanAlgo.buildBi(fx);
    var xd = ChanAlgo.buildXianduan(bi);
    var centers = ChanAlgo.buildAllZhongshu(xd, bi).bi;
    var beichi = ChanAlgo.computeBeichi(centers, cs, bi);
    var rawSignals = ChanAlgo.deriveSignals(centers, beichi);
    var signals = annotateSignals(rawSignals, cs);
    var activeSig = getCurrentSignal(signals);
    var failLine = buildFailLine(activeSig);
    var strength = ChanAlgo.computeTrendStrength(centers, cs, bi);
    return { bi: bi, xd: xd, centers: centers, beichi: beichi, signals: signals, activeSig: activeSig, failLine: failLine, strength: strength };
  }

  function structAt(asOf) {
    if (!structCache[asOf]) structCache[asOf] = computeStruct(C.slice(0, asOf + 1));
    return structCache[asOf];
  }

  // 完整数据结构 —— 只用作“揭晓答案”，绝不参与观察日之前的绘图。
  var FULL = computeStruct(C);

  var EVENTS = FULL.centers.filter(function (c) { return c.leaveObj; }).map(function (c) {
    var lo = c.leaveObj;
    return {
      centerId: c.id, zd: c.zd, zg: c.zg,
      dir: c.leaveDir,
      startIdx: lo.start.idx, endIdx: lo.end.idx,
      startDate: lo.start.date, endDate: lo.end.date,
      startPrice: lo.start.price, endPrice: lo.end.price,
      strength: FULL.strength.byCenter[c.id] || null,
      beichi: FULL.beichi.filter(function (b) { return b.zsId === c.id; })[0] || null,
      signals: FULL.signals.filter(function (s) { return s.zsId === c.id; })
    };
  }).filter(function (e) { return e.endIdx > e.startIdx && e.startIdx >= MIN_ASOF; });

  function nextEventAfter(idx) {
    for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].startIdx > idx) return EVENTS[i];
    return null;
  }

  function fmt(p) { return (p == null || isNaN(p)) ? '—' : Number(p).toFixed(2); }

  // ---------- 出题 ----------
  function newQuestion(fromIdx) {
    var pool = EVENTS.filter(function (e) { return e.endIdx <= C.length - 1 - MIN_TAIL; });
    if (fromIdx != null) pool = pool.filter(function (e) { return e.startIdx > fromIdx; });
    if (!pool.length) pool = EVENTS.filter(function (e) { return e.endIdx <= C.length - 1 - MIN_TAIL; });
    if (!pool.length) return false;
    var e = pool[Math.floor(Math.random() * pool.length)];
    // 观察日随机落在离开段开始前 0~5 根，避免“一出题就说明马上要转”这种泄题。
    var back = Math.floor(Math.random() * 6);
    var asOf = Math.max(MIN_ASOF, e.startIdx - back);
    state.q = e;
    state.answered = null;
    state.revealed = false;
    state.peeked = false;
    state.asOf = asOf;
    return true;
  }

  function answer(choice) {
    if (!state.q || state.revealed) return;
    state.answered = choice;
    state.revealed = true;
    state.asOf = state.q.endIdx;
    if (!state.peeked) {
      if (choice === 'skip') state.score.skip++;
      else if (choice === state.q.dir) state.score.ok++;
      else state.score.no++;
      saveScore();
    }
    render();
  }

  // ---------- 战绩持久化（沙箱里可能抛错，忽略即可） ----------
  var SKEY = 'chanlun_practice_score_v1';
  function saveScore() {
    try { localStorage.setItem(SKEY, JSON.stringify(state.score)); } catch (err) { /* 沙箱禁用存储 */ }
  }
  function loadScore() {
    try {
      var raw = localStorage.getItem(SKEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s.ok === 'number') state.score = { ok: s.ok || 0, no: s.no || 0, skip: s.skip || 0 };
      }
    } catch (err) { /* 沙箱禁用存储 */ }
  }

  // ---------- 绘图 ----------
  function renderChart() {
    var svg = document.getElementById('chart');
    var W = Math.max(520, svg.parentNode.clientWidth - 8);
    var showMacd = state.layers.macd;
    var HP = 380, HM = showMacd ? 92 : 0, H = HP + HM;
    var mL = 54, mR = 14, mT = 12, mB = 24;
    var plotW = W - mL - mR, plotH = HP - mT - mB;

    var to = state.asOf;
    var from = Math.max(0, to - state.win + 1);
    var vis = C.slice(from, to + 1);
    if (!vis.length) { svg.innerHTML = ''; return; }

    var st = structAt(to);
    var step = plotW / vis.length;

    var hi = -Infinity, lo = Infinity;
    vis.forEach(function (c) { if (c.high > hi) hi = c.high; if (c.low < lo) lo = c.low; });
    st.centers.forEach(function (z) {
      if (z.endIdx < from || z.startIdx > to) return;
      if (z.zg > hi) hi = z.zg;
      if (z.zd < lo) lo = z.zd;
    });
    var pad = (hi - lo) * 0.06 || 1;
    hi += pad; lo -= pad;

    function X(idx) { return mL + (idx - from + 0.5) * step; }
    function Y(p) { return mT + (hi - p) / (hi - lo) * plotH; }

    var out = [];
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

    // 网格与价格刻度
    for (var g = 0; g <= 3; g++) {
      var price = hi - (g / 3) * (hi - lo);
      var gy = Y(price);
      out.push('<line x1="' + mL + '" y1="' + gy + '" x2="' + (W - mR) + '" y2="' + gy + '" stroke="#f0eee6" stroke-width="1"/>');
      out.push('<text x="' + (mL - 6) + '" y="' + gy + '" dy="3.5" text-anchor="end" font-size="10.5" fill="#a19c8c" font-family="IBM Plex Mono,monospace">' + fmt(price) + '</text>');
    }

    // 中枢
    if (state.layers.zs) {
      st.centers.forEach(function (z) {
        if (z.endIdx < from || z.startIdx > to) return;
        var x1 = X(Math.max(from, z.startIdx)) - step / 2;
        var x2 = X(Math.min(to, z.endIdx)) + step / 2;
        var yTop = Y(z.zg), yBot = Y(z.zd);
        var dash = z.status === 'confirmed' ? '0' : '4 3';
        out.push('<rect x="' + x1 + '" y="' + yTop + '" width="' + Math.max(2, x2 - x1) + '" height="' + Math.max(2, yBot - yTop) +
          '" fill="rgba(107,102,89,0.06)" stroke="#8b8677" stroke-width="1" stroke-dasharray="' + dash + '"/>');
        if (x2 - x1 > 64) {
          out.push('<text x="' + (x1 + 4) + '" y="' + (yTop - 4) + '" font-size="10" fill="#6b6659" font-family="IBM Plex Mono,monospace">' +
            fmt(z.zd) + '–' + fmt(z.zg) + '</text>');
        }
      });
    }

    // 笔
    if (state.layers.bi) {
      st.bi.forEach(function (b) {
        if (b.end.idx < from || b.start.idx > to) return;
        out.push('<line x1="' + X(b.start.idx) + '" y1="' + Y(b.start.price) + '" x2="' + X(b.end.idx) + '" y2="' + Y(b.end.price) +
          '" stroke="#4a4740" stroke-width="' + (b.provisional ? 1 : 1.5) + '" stroke-dasharray="' + (b.provisional ? '4 3' : '0') + '" stroke-linecap="round"/>');
      });
    }

    // K线
    vis.forEach(function (c) {
      var up = c.close >= c.open;
      var col = up ? '#1f9d63' : '#d1453a';
      var x = X(c.i);
      var bw = Math.max(1.2, step * 0.62);
      var yo = Y(c.open), yc = Y(c.close);
      out.push('<line x1="' + x + '" y1="' + Y(c.high) + '" x2="' + x + '" y2="' + Y(c.low) + '" stroke="' + col + '" stroke-width="1"/>');
      out.push('<rect x="' + (x - bw / 2) + '" y="' + Math.min(yo, yc) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(yc - yo)) + '" fill="' + col + '"/>');
    });

    // 买卖点
    if (state.layers.sig) {
      st.signals.forEach(function (s) {
        if (s.idx < from || s.idx > to) return;
        var isBuy = s.dir === 'buy';
        var col = s.status === 'failed' ? '#9c9788' : (s.status === 'candidate' ? '#b8790a' : (isBuy ? '#1f9d63' : '#d1453a'));
        var solid = s.status === 'confirmed';
        var cy = Y(s.price) + (isBuy ? 20 : -20);
        out.push('<circle cx="' + X(s.idx) + '" cy="' + cy + '" r="9" fill="' + (solid ? col : '#ffffff') +
          '" stroke="' + col + '" stroke-width="1.4" stroke-dasharray="' + (solid ? '0' : '3 2') + '"/>');
        out.push('<text x="' + X(s.idx) + '" y="' + cy + '" dy="3.2" text-anchor="middle" font-size="9.5" font-weight="700" fill="' +
          (solid ? '#ffffff' : col) + '" font-family="IBM Plex Mono,monospace">' + esc(s.type) + '</text>');
      });
    }

    // 防守/失败线：只画“当前仍有效的最新信号”对应的 boundary，来源见 SPEC S-02 —— 关联具体信号，
    // 不是笼统的“防守点前面的低点”；线从信号发生的那根开始画到当前观察日，向右延伸到图右边界。
    if (state.layers.fail && st.failLine && st.failLine.fromIdx <= to) {
      var fl = st.failLine;
      var flColor = fl.status === 'failed' ? '#9c9788' : fl.status === 'candidate' ? '#b8790a' : '#b23b30';
      var flx1 = X(Math.max(from, fl.fromIdx));
      var fly = Y(fl.price);
      out.push('<line x1="' + flx1 + '" y1="' + fly + '" x2="' + (W - mR) + '" y2="' + fly +
        '" stroke="' + flColor + '" stroke-width="1.4" stroke-dasharray="2 3"/>');
      out.push('<text x="' + flx1 + '" y="' + (fly - 4) + '" font-size="10.5" font-weight="700" fill="' + flColor +
        '" font-family="IBM Plex Sans,sans-serif">' + esc(fl.label) + '</text>');
    }

    // 揭晓：高亮真实离开段
    if (state.revealed && state.q) {
      var q = state.q;
      var col2 = q.dir === 'up' ? '#1f9d63' : '#d1453a';
      if (q.endIdx >= from) {
        out.push('<line x1="' + X(Math.max(from, q.startIdx)) + '" y1="' + Y(q.startPrice) + '" x2="' + X(q.endIdx) + '" y2="' + Y(q.endPrice) +
          '" stroke="' + col2 + '" stroke-width="9" stroke-linecap="round" opacity="0.22"/>');
        var lx = X(q.endIdx), ly = Y(q.endPrice) + (q.dir === 'up' ? -26 : 26);
        var label = (q.dir === 'up' ? '↑ 实际向上离开' : '↓ 实际向下离开');
        var lw = label.length * 12 + 14;
        out.push('<rect x="' + (Math.min(lx, W - mR - lw) - 0) + '" y="' + (ly - 13) + '" width="' + lw + '" height="20" rx="4" fill="' + col2 + '"/>');
        out.push('<text x="' + (Math.min(lx, W - mR - lw) + lw / 2) + '" y="' + (ly + 1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">' + label + '</text>');
      }
    }

    // 观察日竖线（未来一律不画）
    var ax = X(to) + step / 2;
    out.push('<line x1="' + ax + '" y1="' + mT + '" x2="' + ax + '" y2="' + (mT + plotH) + '" stroke="#2f2b24" stroke-width="1" stroke-dasharray="2 3"/>');
    out.push('<text x="' + (ax - 4) + '" y="' + (mT + 11) + '" text-anchor="end" font-size="10" fill="#2f2b24" font-family="IBM Plex Mono,monospace">观察日</text>');

    // 日期刻度
    var ticks = Math.max(4, Math.min(10, Math.floor(plotW / 110)));
    for (var t = 0; t < ticks; t++) {
      var vi = Math.round((t / (ticks - 1)) * (vis.length - 1));
      var cc = vis[vi];
      out.push('<text x="' + X(cc.i) + '" y="' + (mT + plotH + 15) + '" text-anchor="middle" font-size="10" fill="#8b8677" font-family="IBM Plex Mono,monospace">' + cc.date.slice(2) + '</text>');
    }

    // MACD
    if (showMacd) {
      var macd = ChanAlgo.computeMacd(C.slice(0, to + 1));
      var mv = macd.filter(function (m) { return m.idx >= from && m.idx <= to; });
      var mx = 0;
      mv.forEach(function (m) { if (Math.abs(m.hist) > mx) mx = Math.abs(m.hist); });
      mx = mx || 1;
      var mTop = HP + 8, mH = HM - 24, mid = mTop + mH / 2;
      out.push('<line x1="' + mL + '" y1="' + mid + '" x2="' + (W - mR) + '" y2="' + mid + '" stroke="#e2ddd0" stroke-width="1"/>');
      out.push('<text x="' + (mL - 6) + '" y="' + (mid + 3.5) + '" text-anchor="end" font-size="10" fill="#a19c8c" font-family="IBM Plex Mono,monospace">MACD</text>');
      mv.forEach(function (m) {
        var h = (Math.abs(m.hist) / mx) * (mH / 2);
        var col3 = m.hist >= 0 ? '#1f9d63' : '#d1453a';
        var bw2 = Math.max(1, step * 0.5);
        out.push('<rect x="' + (X(m.idx) - bw2 / 2) + '" y="' + (m.hist >= 0 ? mid - h : mid) + '" width="' + bw2 + '" height="' + Math.max(0.8, h) + '" fill="' + col3 + '" opacity="0.75"/>');
      });
    }

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('height', H);
    svg.innerHTML = out.join('');
  }

  // ---------- 面板 ----------
  function renderPanel() {
    var to = state.asOf;
    var st = structAt(to);
    var c = C[to];

    document.getElementById('asOfLabel').textContent = c.date;
    document.getElementById('asOfPos').textContent = '第 ' + (to + 1) + ' / ' + C.length + ' 根';
    document.getElementById('slider').value = to;

    var qText = document.getElementById('qText');
    var qHint = document.getElementById('qHint');
    var opts = document.getElementById('opts');
    var result = document.getElementById('result');

    var lastZs = st.centers.length ? st.centers[st.centers.length - 1] : null;

    if (!state.q) {
      qText.textContent = '自由回放中';
      qHint.textContent = '拖动时间轴或用步进按钮观察结构如何随每根K线变化；点右上角「随机出题」进入练习。';
      opts.hidden = true;
      result.hidden = true;
    } else if (!state.revealed) {
      qText.textContent = '从观察日往后，第一次「离开中枢」会是哪个方向？';
      qHint.innerHTML = lastZs
        ? '当前最新笔中枢 <span class="mono">[' + fmt(lastZs.zd) + ', ' + fmt(lastZs.zg) + ']</span>。先自己判断，再揭晓。'
        : '当前观察日尚未形成笔中枢，可先按价格结构判断方向。';
      if (state.peeked) qHint.innerHTML += '<br><span style="color:#b8790a;">已把时间轴拖过答案位置，本题不计分。</span>';
      opts.hidden = false;
      result.hidden = true;
    } else {
      var q = state.q;
      qText.textContent = '本题已揭晓';
      qHint.textContent = '';
      opts.hidden = true;
      result.hidden = false;

      var vt = document.getElementById('verdictText');
      if (state.peeked) { vt.textContent = '未计分（作答前已看到答案区间）'; vt.style.color = '#b8790a'; }
      else if (state.answered === 'skip') { vt.textContent = '记为「还看不出」'; vt.style.color = '#8b8677'; }
      else if (state.answered === q.dir) { vt.textContent = '答对'; vt.style.color = '#1f9d63'; }
      else { vt.textContent = '答错'; vt.style.color = '#d1453a'; }

      var s = q.strength;
      var strengthTxt = (s && s.status === 'comparable')
        ? s.label + '（面积比 ' + s.ratio.toFixed(2) + '）'
        : (s ? s.label : '力度不可比');
      var sigTxt = q.signals.length
        ? q.signals.map(function (x) {
            return x.type + '(' + (x.status === 'confirmed' ? '确认' : x.status === 'failed' ? '失效' : '候选') + ')';
          }).join('、')
        : '无';

      document.getElementById('revealKv').innerHTML =
        row('实际方向', (q.dir === 'up' ? '↑ 向上离开' : '↓ 向下离开'), q.dir === 'up' ? '#1f9d63' : '#d1453a') +
        row('离开区间', q.startDate + ' ~ ' + q.endDate) +
        row('价格', fmt(q.startPrice) + ' → ' + fmt(q.endPrice)) +
        row('中枢', '[' + fmt(q.zd) + ', ' + fmt(q.zg) + ']') +
        row('力度', strengthTxt) +
        row('背驰', q.beichi ? ('有（' + (q.beichi.status === 'confirmed' ? '确认' : '候选') + '，比值 ' + q.beichi.ratio + '）') : '无') +
        row('产生信号', sigTxt);
    }

    // 当前结构摘要
    var lastBi = st.bi.length ? st.bi[st.bi.length - 1] : null;
    var lastSig = st.activeSig;
    var fl = st.failLine;
    var flColor = fl ? (fl.status === 'failed' ? '#8b8677' : fl.status === 'candidate' ? '#b8790a' : '#b23b30') : null;
    document.getElementById('structKv').innerHTML =
      row('收盘', fmt(c.close)) +
      row('笔', st.bi.length + ' 笔' + (lastBi ? '，最新' + (lastBi.dir === 'up' ? '向上' : '向下') + (lastBi.provisional ? '（未完成）' : '') : '')) +
      row('线段', st.xd.length + ' 段（确认 ' + st.xd.filter(function (x) { return x.status === 'confirmed'; }).length + '）') +
      row('笔中枢', lastZs ? ('[' + fmt(lastZs.zd) + ', ' + fmt(lastZs.zg) + ']' + (lastZs.leaveObj ? '，已离开' : '，未离开')) : '尚未形成') +
      row('最新信号', lastSig ? (lastSig.type + '（' + (lastSig.status === 'confirmed' ? '确认' : lastSig.status === 'failed' ? '已失效' : '候选') + '）') : '暂无') +
      row('防守/失效', fl ? fl.label : '—', flColor);

    var sc = state.score, tot = sc.ok + sc.no;
    document.getElementById('scOk').textContent = sc.ok;
    document.getElementById('scNo').textContent = sc.no;
    document.getElementById('scSkip').textContent = sc.skip;
    document.getElementById('scRate').textContent = tot ? Math.round((sc.ok / tot) * 100) + '%' : '—';
  }

  function row(k, v, color) {
    return '<dt>' + k + '</dt><dd' + (color ? ' style="color:' + color + ';font-weight:600;"' : '') + '>' + v + '</dd>';
  }

  function render() { renderChart(); renderPanel(); syncButtons(); }

  function syncButtons() {
    [].forEach.call(document.querySelectorAll('.win'), function (b) {
      b.classList.toggle('on', Number(b.dataset.win) === state.win);
    });
    [].forEach.call(document.querySelectorAll('.layer'), function (b) {
      b.classList.toggle('on', !!state.layers[b.dataset.layer]);
    });
  }

  function setAsOf(idx) {
    var v = Math.max(MIN_ASOF, Math.min(C.length - 1, idx));
    if (state.q && !state.revealed && v >= state.q.startIdx) state.peeked = true;
    state.asOf = v;
    render();
  }

  // ---------- 事件 ----------
  [].forEach.call(document.querySelectorAll('.step'), function (b) {
    b.addEventListener('click', function () { setAsOf(state.asOf + Number(b.dataset.step)); });
  });
  [].forEach.call(document.querySelectorAll('.win'), function (b) {
    b.addEventListener('click', function () { state.win = Number(b.dataset.win); render(); });
  });
  [].forEach.call(document.querySelectorAll('.layer'), function (b) {
    b.addEventListener('click', function () { state.layers[b.dataset.layer] = !state.layers[b.dataset.layer]; render(); });
  });
  [].forEach.call(document.querySelectorAll('.opt'), function (b) {
    b.addEventListener('click', function () { answer(b.dataset.ans); });
  });
  document.getElementById('slider').addEventListener('input', function (e) { setAsOf(Number(e.target.value)); });
  document.getElementById('btnNew').addEventListener('click', function () { if (newQuestion(null)) render(); });
  document.getElementById('btnNext').addEventListener('click', function () {
    if (newQuestion(state.q ? state.q.endIdx : null)) render();
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    state.score = { ok: 0, no: 0, skip: 0 }; saveScore(); render();
  });
  window.addEventListener('resize', function () { renderChart(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { setAsOf(state.asOf + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { setAsOf(state.asOf - 1); e.preventDefault(); }
  });

  // ---------- 启动 ----------
  document.getElementById('symbolLine').textContent = META.name + ' · ' + META.symbol;
  document.getElementById('dataLine').textContent =
    META.source + ' · ' + META.adjustment + ' · ' + META.begin + '~' + META.end + ' · 共 ' + C.length + ' 根日K';
  document.getElementById('slider').min = MIN_ASOF;
  document.getElementById('slider').max = C.length - 1;
  document.getElementById('rangeStart').textContent = C[MIN_ASOF].date;
  document.getElementById('rangeEnd').textContent = C[C.length - 1].date;
  document.getElementById('footNote').innerHTML =
    '规则版本 <span class="mono">' + ChanAlgo.RULE_VERSION + '</span>；共 ' + EVENTS.length + ' 个可出题的离开段。' +
    '观察日左侧的所有标记都由 <span class="mono">candles.slice(0, asOf+1)</span> 重算得到，未来数据不参与绘图。' +
    '出题起点不早于第 ' + MIN_ASOF + ' 根（SPEC E-L02 的 MACD 预热要求）。<br>' +
    '「答案」是本引擎在完整数据上的标注结果，不是市场客观真理——引擎本身仍有已知缺口（见 SPEC 第0节 P-Z07 等）。本页仅供结构判断训练，不构成交易建议。';

  loadScore();
  state.asOf = Math.max(MIN_ASOF, Math.min(C.length - 1, 260));
  render();
})();
</script>
</body>
</html>
