<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缠论工作台 · 600036</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f0; --panel:#ffffff; --line:#e2ddd0; --chip:#f0eee6;
    --ink:#1c1f26; --muted:#8b8677; --faint:#a19c8c;
    --up:#1f9d63; --down:#d1453a; --amber:#b8790a; --dead:#9c9788; --failline:#b23b30;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);}
  body{
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:12.5px; display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
  svg text{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  button{font-family:inherit; cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#dcd7c8;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- toolbar ---------- */
  #toolbar{
    display:flex; align-items:center; gap:14px; height:44px; flex:none;
    padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .dots{display:flex; gap:6px; flex:none;}
  .dots span{width:10px;height:10px;border-radius:50%;display:block;}
  .dots span:nth-child(1){background:#e3564a;}
  .dots span:nth-child(2){background:#e3ac3d;}
  .dots span:nth-child(3){background:#2ea44a;}
  .titlebox{display:flex; align-items:baseline; gap:8px; flex:none;}
  .titlebox .code{font-size:14px; font-weight:700;}
  .titlebox .name{font-size:12.5px; color:var(--muted);}
  #symbolForm{display:flex; align-items:center; gap:6px; margin-left:6px;}
  #symbolInput{
    width:84px; padding:4px 7px; border:1px solid var(--line); border-radius:6px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--chip); color:var(--ink);
  }
  #symbolInput:focus{outline:none; border-color:#c8c1ac; background:#fff;}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:6px; padding:4px 10px; font-size:12px; font-weight:500;
  }
  .btn:hover{background:var(--chip);}
  .btn.primary{background:#2f2b24; border-color:#2f2b24; color:#fff;}
  .btn.primary:hover{opacity:.88;}
  .btn.icon{padding:5px 6px; display:inline-flex; align-items:center; justify-content:center;}
  .btn.on{background:#2f2b24; border-color:#2f2b24; color:#fff;}
  .periodtabs{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none;}
  .periodtabs button{
    border:none; background:var(--panel); padding:5px 12px; font-size:12px; color:var(--muted); font-weight:500;
  }
  .periodtabs button.active{background:#2f2b24; color:#fff;}
  .periodtabs button + button{border-left:1px solid var(--line);}
  #toolbarRight{margin-left:auto; display:flex; align-items:center; gap:8px;}
  #toast{
    position:fixed; top:52px; left:50%; transform:translateX(-50%);
    background:#2f2b24; color:#fff; font-size:12.5px; padding:8px 16px; border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.18); z-index:60; opacity:0; pointer-events:none;
    transition:opacity .18s ease, top .18s ease;
  }
  #toast.show{opacity:1; top:58px;}

  /* ---------- layer row ---------- */
  #layerRow{
    display:flex; align-items:center; gap:10px; height:38px; flex:none;
    padding:0 14px; border-bottom:1px solid var(--line); background:#fbfaf6; position:relative; z-index:30;
  }
  .layergroup{position:relative;}
  .layergroup > .lg-btn{
    display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel);
    border-radius:7px; padding:5px 10px; font-size:12px; font-weight:500; color:var(--ink);
  }
  .layergroup > .lg-btn .swatch{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .layergroup > .lg-btn.active .swatch{background:var(--up);}
  .layergroup > .lg-btn .chev{color:var(--faint); font-size:9px;}
  .lg-panel{
    display:none; position:absolute; top:32px; left:0; min-width:168px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(30,28,20,.14); padding:6px; z-index:40;
  }
  .lg-panel.open{display:block;}
  .lg-item{display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:6px; font-size:12px;}
  .lg-item:hover{background:var(--chip);}
  .lg-item input{accent-color:#2f2b24;}

  /* ---------- main body ---------- */
  #body{flex:1; display:flex; min-height:0; overflow:hidden;}

  #sidebar{
    width:270px; flex:none; border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; min-height:0; transition:width .15s ease;
  }
  #sidebar.collapsed{width:48px;}
  #sidebar.collapsed .sb-content{display:none;}
  #sidebar.collapsed .sb-icons{display:flex;}
  .sb-icons{display:none; flex-direction:column; align-items:center; gap:14px; padding-top:14px;}
  .sb-icons button{border:none; background:none; color:var(--muted); padding:6px;}
  .sb-icons button:hover{color:var(--ink);}
  .sb-content{display:flex; flex-direction:column; min-height:0; flex:1;}
  .sb-pane{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .sb-pane + .sb-pane{border-top:1px solid var(--line);}
  .sb-head{
    flex:none; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.4px;
    padding:9px 12px 6px; display:flex; justify-content:space-between; align-items:center;
  }
  .sb-list{flex:1; overflow-y:auto; padding:0 6px 8px;}
  .row{
    padding:7px 8px; border-radius:7px; cursor:pointer; border:1px solid transparent; margin-bottom:2px;
  }
  .row:hover{background:var(--chip);}
  .row.selected{background:#eef1ec; border-color:#c9dccb;}
  .zs-row-top{display:flex; align-items:center; gap:6px; justify-content:space-between;}
  .zs-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .zs-dates{font-size:11.5px; font-weight:600;}
  .zs-prices{font-size:11px; color:var(--faint);}
  .zs-ruler{position:relative; height:6px; background:var(--chip); border-radius:4px; margin-top:6px;}
  .zs-bar{position:absolute; top:0; height:6px; border-radius:4px; background:rgba(184,121,10,.28); border:1px solid rgba(184,121,10,.55);}

  .sig-row{display:flex; align-items:center; gap:8px;}
  .sig-row.current{background:#eef6ef; border-left:3px solid var(--up); padding-left:6px;}
  .sig-row.current.sell{background:#faeceb; border-left-color:var(--down);}
  .sig-type{
    font-size:11px; font-weight:700; padding:2px 6px; border-radius:5px; min-width:26px; text-align:center; flex:none;
  }
  .sig-meta{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0;}
  .sig-date{font-size:11.5px; font-weight:600;}
  .sig-price{font-size:11px; color:var(--faint);}
  .sig-state{width:7px;height:7px;border-radius:50%; flex:none;}
  .cur-badge{
    font-size:9.5px; font-weight:700; color:var(--up); background:#dff2e4; border-radius:4px; padding:1px 5px; flex:none;
  }
  .cur-badge.sell{color:var(--down); background:#f8e2e0;}

  /* ---------- chart area ---------- */
  #chartArea{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; background:var(--bg);}
  #priceWrap{flex:1; min-height:0; position:relative; overflow:hidden;}
  #priceSvg{display:block; width:100%; height:100%; cursor:grab;}
  #priceSvg.dragging{cursor:grabbing;}
  #phaseBand{height:36px; flex:none; border-top:1px solid var(--line); background:var(--panel); position:relative; overflow:hidden;}
  #macdWrap{height:60px; flex:none; border-top:1px solid var(--line); background:var(--panel); transition:height .16s ease; overflow:hidden;}
  #macdWrap.expanded{height:140px;}
  #macdSvg{display:block; width:100%; height:100%;}
  #minimapRow{height:56px; flex:none; border-top:1px solid var(--line); background:#fbfaf6; display:flex; align-items:center; gap:10px; padding:0 14px;}
  #minimapSvg{flex:1; height:34px; cursor:pointer;}
  .zoomctl{display:flex; align-items:center; gap:4px; flex:none;}
  .zoomctl button{width:22px; height:22px; border-radius:5px; border:1px solid var(--line); background:var(--panel); font-size:13px; line-height:1;}
  .zoompct{font-size:11px; color:var(--muted); width:38px; text-align:center; flex:none;}
  #rangeLabel{font-size:11px; color:var(--muted); flex:none; white-space:nowrap;}

  /* ---------- inspector ---------- */
  #inspector{
    width:360px; flex:none; border-left:1px solid var(--line); background:var(--panel);
    display:none; flex-direction:column; min-height:0; overflow-y:auto;
  }
  #inspector.open{display:flex;}
  .insp-head{padding:14px 16px 10px; border-bottom:1px solid var(--line);}
  .insp-headline{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.4px; margin-bottom:6px;}
  .insp-conclusion{font-size:13px; line-height:1.6; font-weight:600;}
  .insp-sect{padding:12px 16px; border-bottom:1px solid var(--line);}
  .insp-sect h4{font-size:11.5px; font-weight:700; color:var(--muted); margin:0 0 8px; letter-spacing:.3px;}
  .insp-sect p{margin:0 0 6px; font-size:12.5px; line-height:1.65;}
  .role-item{display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--line);}
  .role-item:last-child{border-bottom:none;}
  .role-dot{width:9px; height:9px; border-radius:2px; margin-top:3px; flex:none;}
  .role-label{font-size:11px; font-weight:700; color:var(--muted); width:58px; flex:none;}
  .role-val{font-size:12px; flex:1;}
  .kv2{display:grid; grid-template-columns:64px 1fr; gap:4px 8px; font-size:12px;}
  .kv2 dt{color:var(--muted); margin:0;}
  .kv2 dd{margin:0; font-weight:600;}
  .empty-hint{padding:18px 16px; font-size:12px; color:var(--muted); line-height:1.7;}

  /* ---------- status bar ---------- */
  #statusbar{
    height:26px; flex:none; border-top:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:11px; color:var(--muted);
  }
  #statusLeft{font-weight:700; color:var(--ink);}
  #statusRight span + span{margin-left:12px;}
  #statusRight .mono{color:var(--muted);}

  @media (max-width: 1100px){
    #sidebar{width:48px !important;}
    #sidebar .sb-content{display:none !important;}
    #sidebar .sb-icons{display:flex !important;}
  }
</style>
</head>

  <div class="dots"><span></span><span></span><span></span></div>

    <span class="code mono">600036</span>
    <span class="name">招商银行</span>
  </div>

  <div id="sidebar">
    <div class="sb-icons">
      <button id="peekCenters" title="中枢列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="10" width="18" height="6" rx="1"/></svg>
      </button>

  <div id="chartArea">

      <div class="zoomctl">
        <button id="zoomOut" title="缩小">−</button>

  <div id="statusLeft">—</div>
  <div id="statusRight">
    <span>观察日 <span class="mono" id="stAsOf">—</span></span>
    <span>数据版本 <span class="mono" id="stData">—</span></span>

<script>
(function(){
'use strict';

var CANDLES = ChanData.dailyCandles;
var META = ChanData.dataMeta;
var LAST_IDX = CANDLES.length - 1;

var MERGED = ChanAlgo.mergeInclusion(CANDLES);
var FX = ChanAlgo.findFenxing(MERGED);
var BI = ChanAlgo.buildBi(FX);
var XD = ChanAlgo.buildXianduan(BI);
var CENTERS = ChanAlgo.buildAllZhongshu(XD, BI).bi;
var BEICHI = ChanAlgo.computeBeichi(CENTERS, CANDLES, BI);
var SIGNALS = ChanAlgo.deriveSignals(CENTERS, BEICHI);
var STRENGTH = ChanAlgo.computeTrendStrength(CENTERS, CANDLES, BI);
var MACD = STRENGTH.macd;

var TYPE_CN = {'1B':'一买','2B':'二买','3B':'三买','1S':'一卖','2S':'二卖','3S':'三卖'};

function fmt(p){ return (p==null || isNaN(p)) ? '—' : Number(p).toFixed(2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function dateOf(idx){ return CANDLES[clamp(idx,0,LAST_IDX)].date; }
function biById(id){ for (var i=0;i<BI.length;i++) if (BI[i].id===id) return BI[i]; return null; }
function centerById(id){ for (var i=0;i<CENTERS.length;i++) if (CENTERS[i].id===id) return CENTERS[i]; return null; }
function signalById(id){ for (var i=0;i<SIGNALS.length;i++) if (SIGNALS[i].id===id) return SIGNALS[i]; return null; }
function beichiById(id){ for (var i=0;i<BEICHI.length;i++) if (BEICHI[i].id===id) return BEICHI[i]; return null; }
function beichiByZs(zsId){ for (var i=0;i<BEICHI.length;i++) if (BEICHI[i].zsId===zsId) return BEICHI[i]; return null; }
function objLabel(o){
  if (!o) return '—';
  var sd = o.start ? o.start.date : o.startDate, ed = o.end ? o.end.date : o.endDate;
  var sp = o.start ? o.start.price : o.startPrice, ep = o.end ? o.end.price : o.endPrice;
  return sd + ' → ' + ed + '（' + fmt(sp) + ' → ' + fmt(ep) + '）';
}
function objIdx(o, which){
  if (!o) return null;
  if (which === 'start') return o.start ? o.start.idx : o.startIdx;
  return o.end ? o.end.idx : o.endIdx;
}
function objPrice(o, which){
  if (!o) return null;
  if (which === 'start') return o.start ? o.start.price : o.startPrice;
  return o.end ? o.end.price : o.endPrice;
}

// -------- 默认视窗：2025-04-14 ~ 2025-10-27（现算，不硬编码标记位置） --------
function idxOfDate(d){ for (var i=0;i<CANDLES.length;i++) if (CANDLES[i].date===d) return i; return -1; }
var DEFAULT_FROM = idxOfDate('2025-04-14');
var DEFAULT_TO = idxOfDate('2025-10-27');
if (DEFAULT_FROM < 0) DEFAULT_FROM = 0;
if (DEFAULT_TO < 0) DEFAULT_TO = LAST_IDX;

// -------- 阶段带分段（简化规则：中枢期=zone, 离开段延伸到下一个中枢开始前=trend leg） --------
var PHASES = (function(){
  var out = [];
  var n = CENTERS.length;
  if (!n){
    out.push({from:0, to:LAST_IDX, kind:'zone', centerId:null});
    return out;
  }
  if (CENTERS[0].startIdx > 0) out.push({from:0, to:CENTERS[0].startIdx-1, kind:'zone', centerId:null});
  for (var i=0;i<n;i++){
    var z = CENTERS[i];
    // 注: z.endIdx 有时会因为引擎的"回溯找真正离开段"规则(E-Z11)而落在 leaveObj 范围内部，
    // 不能直接当作"中枢期结束点"。这里改用 leaveObj.start.idx-1 作为中枢期的结束点，
    // 保证离开段自身的那一段区间总能被涂上方向色，不被"中枢期"吞掉。
    var leaveStart = z.leaveObj ? (z.leaveObj.start ? z.leaveObj.start.idx : z.leaveObj.startIdx) : null;
    var zoneEnd = leaveStart != null ? Math.min(z.endIdx, leaveStart - 1) : z.endIdx;
    if (zoneEnd < z.startIdx) zoneEnd = z.startIdx;
    out.push({from:z.startIdx, to:zoneEnd, kind:'zone', centerId:z.id});
    if (z.leaveObj && z.leaveDir){
      var legStart = zoneEnd+1;
      var leaveEnd = z.leaveObj.end ? z.leaveObj.end.idx : z.leaveObj.endIdx;
      var legEndCandidate = (i+1<n) ? CENTERS[i+1].startIdx-1 : LAST_IDX;
      var legEnd = Math.max(legEndCandidate, leaveEnd);
      if (legEnd >= legStart) out.push({from:legStart, to:legEnd, kind:z.leaveDir, centerId:z.id});
    } else if (i+1<n && CENTERS[i+1].startIdx-1 >= zoneEnd+1) {
      out.push({from:zoneEnd+1, to:CENTERS[i+1].startIdx-1, kind:'zone', centerId:null});
    }
  }
  var lastCovered = out.length ? out[out.length-1].to : -1;
  if (lastCovered < LAST_IDX) out.push({from:lastCovered+1, to:LAST_IDX, kind:'zone', centerId:null});
  return out;
})();

// -------- 价格标尺公共范围（中枢列表） --------
var PRICE_MIN = Infinity, PRICE_MAX = -Infinity;
CENTERS.forEach(function(z){ if (z.zd<PRICE_MIN) PRICE_MIN=z.zd; if (z.zg>PRICE_MAX) PRICE_MAX=z.zg; });
if (!isFinite(PRICE_MIN)) { PRICE_MIN=0; PRICE_MAX=1; }

// -------- state --------
var S = {
  from: DEFAULT_FROM, to: DEFAULT_TO,
  cursorIdx: DEFAULT_TO,
  layers: { bi:true, xd:true, zs:true, sig:true, beichi:true, failLine:false, srLine:false },
  sel: { type:null, id:null },
  inspectorOpen: false,
  macdExpanded: false
};

function currentSignal(){
  for (var i=SIGNALS.length-1;i>=0;i--) if (SIGNALS[i].status !== 'failed') return SIGNALS[i];
  return null;
}

function jumpToCenter(id){
  var z = centerById(id);
  if (!z) return;
  var endBound = z.leaveObj ? objIdx(z.leaveObj,'end') : z.endIdx;
  var span = endBound - z.startIdx + 1;
  var pad = Math.max(6, Math.round(span * 0.25));
  setViewport(z.startIdx - pad, endBound + pad);
  S.sel = { type:'center', id:id };
  renderAll();
}
function jumpToSignal(id){
  var s = signalById(id);
  if (!s) return;
  var width = S.to - S.from;
  setViewport(s.idx - Math.round(width/2), s.idx + Math.round(width/2));
  S.sel = { type:'signal', id:id };
  renderAll();
}

// ================= 视窗 / 缩放 / 平移 =================
function setViewport(from, to){
  from = Math.round(from); to = Math.round(to);
  var width = Math.max(10, to - from + 1);
  if (width > LAST_IDX+1) width = LAST_IDX+1;
  from = clamp(from, 0, LAST_IDX - width + 1);
  to = from + width - 1;
  S.from = from; S.to = to;
}
function zoomBy(factor, anchorIdx){
  var width = S.to - S.from + 1;
  var newWidth = clamp(Math.round(width * factor), 12, LAST_IDX+1);
  if (anchorIdx == null) anchorIdx = (S.from + S.to) / 2;
  var ratio = (anchorIdx - S.from) / Math.max(1,width);
  var newFrom = Math.round(anchorIdx - ratio * newWidth);
  setViewport(newFrom, newFrom + newWidth - 1);
}

// ================= 主图 =================
var mL = 56, mR = 16, mT = 14, mB = 22;

function priceX(idx, plotW, from, to){
  var step = plotW / (to - from + 1);
  return mL + (idx - from + 0.5) * step;
}

function renderPrice(){
  var svg = document.getElementById('priceSvg');
  var wrap = document.getElementById('priceWrap');
  var W = Math.max(300, wrap.clientWidth);
  var H = Math.max(200, wrap.clientHeight);
  var plotW = W - mL - mR, plotH = H - mT - mB;
  var from = S.from, to = S.to;
  var vis = CANDLES.slice(from, to+1);
  if (!vis.length) { svg.innerHTML=''; return; }
  var step = plotW / vis.length;
  function X(idx){ return mL + (idx - from + 0.5) * step; }

  var hi = -Infinity, lo = Infinity;
  vis.forEach(function(c){ if (c.high>hi) hi=c.high; if (c.low<lo) lo=c.low; });
  CENTERS.forEach(function(z){
    if (z.endIdx < from || z.startIdx > to) return;
    if (z.zg > hi) hi = z.zg; if (z.zd < lo) lo = z.zd;
  });
  var pad = (hi-lo)*0.08 || 1;
  hi += pad; lo -= pad;
  function Y(p){ return mT + (hi-p)/(hi-lo) * plotH; }

  var out = [];

  // grid + price ticks
  for (var g=0; g<=4; g++){
    var price = hi - (g/4)*(hi-lo);
    var gy = Y(price);
    out.push('<line x1="'+mL+'" y1="'+gy+'" x2="'+(W-mR)+'" y2="'+gy+'" stroke="#eeece3" stroke-width="1"/>');
    out.push('<text x="'+(mL-8)+'" y="'+gy+'" dy="3.5" text-anchor="end" font-size="10.5" fill="#a19c8c">'+fmt(price)+'</text>');
  }

  // 中枢
  if (S.layers.zs){
    CENTERS.forEach(function(z){
      if (z.endIdx < from || z.startIdx > to) return;
      var isSel = S.sel.type==='center' && S.sel.id===z.id;
      var x1 = X(Math.max(from,z.startIdx)) - step/2;
      var x2 = X(Math.min(to,z.endIdx)) + step/2;
      var yTop = Y(z.zg), yBot = Y(z.zd);
      var dash = z.status==='confirmed' ? '0' : '4 3';
      var strokeCol = isSel ? '#2f2b24' : '#8b8677';
      var sw = isSel ? 2.2 : 1;
      out.push('<rect data-kind="center" data-id="'+z.id+'" x="'+x1+'" y="'+yTop+'" width="'+Math.max(2,x2-x1)+'" height="'+Math.max(2,yBot-yTop)+
        '" fill="rgba(107,102,89,0.07)" stroke="'+strokeCol+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+'" style="cursor:pointer;"/>');
      if (x2-x1 > 60){
        out.push('<text x="'+(x1+4)+'" y="'+(yTop-4)+'" font-size="10" fill="#6b6659">'+fmt(z.zd)+'–'+fmt(z.zg)+'</text>');
      }
      // role highlight when selected
      if (isSel) out.push(centerRoleSvg(z, X, Y, from, to));
    });
  }

  // 线段
  if (S.layers.xd){
    XD.forEach(function(x){
      if (x.endIdx < from || x.startIdx > to) return;
      out.push('<line x1="'+X(x.startIdx)+'" y1="'+Y(x.startPrice)+'" x2="'+X(x.endIdx)+'" y2="'+Y(x.endPrice)+
        '" stroke="#c9955a" stroke-width="1.4" stroke-dasharray="'+(x.status==='confirmed'?'0':'5 3')+'" opacity="0.55"/>');
    });
  }

  // 笔
  if (S.layers.bi){
    BI.forEach(function(b){
      if (b.end.idx < from || b.start.idx > to) return;
      out.push('<line x1="'+X(b.start.idx)+'" y1="'+Y(b.start.price)+'" x2="'+X(b.end.idx)+'" y2="'+Y(b.end.price)+
        '" stroke="#4a4740" stroke-width="'+(b.provisional?1:1.4)+'" stroke-dasharray="'+(b.provisional?'4 3':'0')+'" stroke-linecap="round"/>');
    });
  }

  // K线
  vis.forEach(function(c){
    var up = c.close >= c.open;
    var col = up ? 'var(--up)'.replace('var(--up)','#1f9d63') : '#d1453a';
    var x = X(c.i);
    var bw = Math.max(1.2, step*0.62);
    var yo=Y(c.open), yc=Y(c.close);
    out.push('<line x1="'+x+'" y1="'+Y(c.high)+'" x2="'+x+'" y2="'+Y(c.low)+'" stroke="'+col+'" stroke-width="1"/>');
    out.push('<rect x="'+(x-bw/2)+'" y="'+Math.min(yo,yc)+'" width="'+bw+'" height="'+Math.max(1,Math.abs(yc-yo))+'" fill="'+col+'"/>');
  });

  // 信号
  if (S.layers.sig){
    SIGNALS.forEach(function(s){
      if (s.idx < from || s.idx > to) return;
      var isBuy = s.dir === 'buy';
      var col = s.status==='failed' ? '#9c9788' : (s.status==='candidate' ? '#b8790a' : (isBuy?'#1f9d63':'#d1453a'));
      var solid = s.status==='confirmed';
      var isSel = S.sel.type==='signal' && S.sel.id===s.id;
      var cy = Y(s.price) + (isBuy?22:-22);
      var r = isSel ? 11 : 9;
      out.push('<circle data-kind="signal" data-id="'+s.id+'" cx="'+X(s.idx)+'" cy="'+cy+'" r="'+r+'" fill="'+(solid?col:'#ffffff')+
        '" stroke="'+col+'" stroke-width="'+(isSel?2.4:1.4)+'" stroke-dasharray="'+(solid?'0':'3 2')+'" style="cursor:pointer;" opacity="'+(s.status==='failed'?0.6:1)+'"/>');
      out.push('<text data-kind="signal" data-id="'+s.id+'" x="'+X(s.idx)+'" y="'+cy+'" dy="3.2" text-anchor="middle" font-size="9.5" font-weight="700" fill="'+
        (solid?'#ffffff':col)+'" style="cursor:pointer;pointer-events:none;">'+esc(s.type)+'</text>');
    });
  }

  // 背驰标记
  if (S.layers.beichi){
    BEICHI.forEach(function(bc){
      if (bc.idx < from || bc.idx > to) return;
      var col = bc.status==='confirmed' ? '#b8790a' : '#c9a25a';
      var isSel = S.sel.type==='beichi' && S.sel.id===bc.id;
      var bx = X(bc.idx), by = Y(bc.price);
      out.push('<path data-kind="beichi" data-id="'+bc.id+'" d="M'+bx+' '+(by-14)+' L'+(bx+9)+' '+by+' L'+bx+' '+(by+14)+' L'+(bx-9)+' '+by+' Z" fill="'+
        (isSel?col:'#fff')+'" stroke="'+col+'" stroke-width="'+(isSel?2.2:1.5)+'" style="cursor:pointer;"/>');
      out.push('<text data-kind="beichi" data-id="'+bc.id+'" x="'+bx+'" y="'+(by+3.5)+'" text-anchor="middle" font-size="8.5" font-weight="700" fill="'+
        (isSel?'#fff':col)+'" style="pointer-events:none;">背驰</text>');
    });
  }

  // 防守/失效线 + 支撑压力线
  if (S.layers.failLine){
    var cur = currentSignal();
    if (cur && cur.boundary != null && cur.idx <= to){
      var flCol = cur.status==='failed' ? '#9c9788' : cur.status==='candidate' ? '#b8790a' : '#b23b30';
      var flx1 = X(Math.max(from, cur.idx));
      var fly = Y(cur.boundary);
      out.push('<line x1="'+flx1+'" y1="'+fly+'" x2="'+(W-mR)+'" y2="'+fly+'" stroke="'+flCol+'" stroke-width="1.4" stroke-dasharray="2 3"/>');
      out.push('<text x="'+flx1+'" y="'+(fly-4)+'" font-size="10.5" font-weight="700" fill="'+flCol+'">防守 '+fmt(cur.boundary)+'</text>');
    }
  }
  if (S.layers.srLine){
    ChanAlgo.supportResistance(CENTERS).forEach(function(l){
      var ly = Y(l.price);
      var col = l.type==='resistance' ? '#d1453a' : '#1f9d63';
      out.push('<line x1="'+mL+'" y1="'+ly+'" x2="'+(W-mR)+'" y2="'+ly+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="1 4" opacity="0.55"/>');
      out.push('<text x="'+(W-mR-4)+'" y="'+(ly-3)+'" text-anchor="end" font-size="9.5" fill="'+col+'" opacity="0.8">'+esc(l.label)+'</text>');
    });
  }

  // 游标
  if (S.cursorIdx >= from && S.cursorIdx <= to){
    var cx = X(S.cursorIdx);
    out.push('<line x1="'+cx+'" y1="'+mT+'" x2="'+cx+'" y2="'+(mT+plotH)+'" stroke="#2f2b24" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>');
  }

  // 日期刻度
  var ticks = Math.max(4, Math.min(10, Math.floor(plotW/110)));
  for (var t=0;t<ticks;t++){
    var vi = Math.round((t/(ticks-1)) * (vis.length-1));
    var cc = vis[vi];
    out.push('<text x="'+X(cc.i)+'" y="'+(mT+plotH+15)+'" text-anchor="middle" font-size="10" fill="#8b8677">'+cc.date.slice(2)+'</text>');
  }

  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = out.join('');
}

function centerRoleSvg(z, X, Y, from, to){
  var out = [];
  function clampIdx(i){ return clamp(i, from, to); }
  if (z.enterObj){
    var eo = z.enterObj;
    if (objIdx(eo,'end') >= from && objIdx(eo,'start') <= to){
      out.push('<line x1="'+X(clampIdx(objIdx(eo,'start')))+'" y1="'+Y(objPrice(eo,'start'))+'" x2="'+X(clampIdx(objIdx(eo,'end')))+'" y2="'+Y(objPrice(eo,'end'))+
        '" stroke="#6b6659" stroke-width="2" stroke-dasharray="1 3" marker-end="url(#arrowGray)"/>');
    }
  }
  if (z.leaveObj && z.leaveDir){
    var lo = z.leaveObj;
    if (objIdx(lo,'end') >= from && objIdx(lo,'start') <= to){
      var col = z.leaveDir==='up' ? '#1f9d63' : '#d1453a';
      out.push('<line x1="'+X(clampIdx(objIdx(lo,'start')))+'" y1="'+Y(objPrice(lo,'start'))+'" x2="'+X(clampIdx(objIdx(lo,'end')))+'" y2="'+Y(objPrice(lo,'end'))+
        '" stroke="'+col+'" stroke-width="3.4" stroke-linecap="round"/>');
      // 引导线
      var refP = z.leaveDir==='up' ? z.zg : z.zd;
      out.push('<line x1="'+X(clampIdx(z.startIdx))+'" y1="'+Y(refP)+'" x2="'+X(clampIdx(objIdx(lo,'end')))+'" y2="'+Y(refP)+
        '" stroke="'+col+'" stroke-width="1" stroke-dasharray="1 4" opacity="0.7"/>');
      out.push('<line x1="'+X(clampIdx(objIdx(lo,'end')))+'" y1="'+Y(refP)+'" x2="'+X(clampIdx(objIdx(lo,'end')))+'" y2="'+Y(objPrice(lo,'end'))+
        '" stroke="'+col+'" stroke-width="1" stroke-dasharray="1 4" opacity="0.7"/>');
    }
  }
  if (z.pullbackObj){
    var pb = z.pullbackObj;
    if (objIdx(pb,'end') >= from && objIdx(pb,'start') <= to){
      out.push('<line x1="'+X(clampIdx(objIdx(pb,'start')))+'" y1="'+Y(objPrice(pb,'start'))+'" x2="'+X(clampIdx(objIdx(pb,'end')))+'" y2="'+Y(objPrice(pb,'end'))+
        '" stroke="#b8790a" stroke-width="2" stroke-dasharray="3 3"/>');
    }
  }
  return out.join('');
}

// ================= MACD =================
function renderMacd(){
  var svg = document.getElementById('macdSvg');
  var wrap = document.getElementById('macdWrap');
  var W = Math.max(300, wrap.clientWidth), H = wrap.clientHeight;
  var plotW = W - mL - mR, plotH = H - 10;
  var from = S.from, to = S.to;
  var vis = MACD.slice(from, to+1);
  if (!vis.length){ svg.innerHTML=''; return; }
  var step = plotW / vis.length;
  function X(idx){ return mL + (idx-from+0.5)*step; }
  var mx = 0.0001;
  vis.forEach(function(m){ if (Math.abs(m.hist)>mx) mx=Math.abs(m.hist); });
  var mid = 6 + plotH/2;
  var out = [];
  out.push('<line x1="'+mL+'" y1="'+mid+'" x2="'+(W-mR)+'" y2="'+mid+'" stroke="#e2ddd0" stroke-width="1"/>');
  out.push('<text x="'+(mL-8)+'" y="'+(mid+3.5)+'" text-anchor="end" font-size="10" fill="#a19c8c">MACD</text>');

  // 背驰 A/C 高亮区间
  var sel = S.sel;
  var abox = null, cbox = null, bc = null;
  if (sel.type === 'beichi') bc = beichiById(sel.id);
  if (bc){
    var A = biById(bc.evidence.enterObjId), C = biById(bc.evidence.exitObjId);
    if (A) abox = { s: objIdx(A,'start'), e: objIdx(A,'end') };
    if (C) cbox = { s: objIdx(C,'start'), e: objIdx(C,'end') };
  }
  function drawBox(box, color, label, area){
    if (!box) return;
    var s = clamp(box.s, from, to+1), e = clamp(box.e, from, to+1);
    if (e < from || s > to) { return; }
    var x1 = X(s), x2 = X(e);
    out.push('<rect x="'+Math.min(x1,x2)+'" y="6" width="'+Math.max(2,Math.abs(x2-x1))+'" height="'+plotH+'" fill="'+color+'" opacity="0.16"/>');
    out.push('<text x="'+Math.min(x1,x2)+'" y="16" font-size="9.5" font-weight="700" fill="'+color+'">'+label+' 面积'+(area!=null?fmt(area):'—')+'</text>');
  }
  if (bc){
    drawBox(abox, '#6b6659', 'A', bc.areaA);
    drawBox(cbox, bc.dir==='up'?'#1f9d63':'#d1453a', 'C', bc.areaC);
    out.push('<text x="'+(W-mR)+'" y="16" text-anchor="end" font-size="10" font-weight="700" fill="#2f2b24">比值 '+bc.ratio+'</text>');
  }

  vis.forEach(function(m){
    var h = (Math.abs(m.hist)/mx) * (plotH/2 - 4);
    var col = m.hist >= 0 ? '#1f9d63' : '#d1453a';
    var bw = Math.max(1, step*0.5);
    out.push('<rect x="'+(X(m.idx)-bw/2)+'" y="'+(m.hist>=0?mid-h:mid)+'" width="'+bw+'" height="'+Math.max(0.8,h)+'" fill="'+col+'" opacity="0.8"/>');
  });
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.innerHTML = out.join('');
}

// ================= minimap =================
var MM_L = 4, MM_R = 4;
function renderMinimap(){
  var svg = document.getElementById('minimapSvg');
  var W = Math.max(200, svg.parentNode ? svg.clientWidth || svg.parentNode.clientWidth*0.6 : 400);
  W = svg.clientWidth || 400;
  var H = 34;
  var plotW = W - MM_L - MM_R;
  function X(idx){ return MM_L + (idx/LAST_IDX) * plotW; }
  var closes = CANDLES.map(function(c){ return c.close; });
  var hi = Math.max.apply(null, closes), lo = Math.min.apply(null, closes);
  function Y(p){ return 3 + (hi-p)/(hi-lo) * (H-6); }
  var out = [];
  var pts = [];
  var stride = Math.max(1, Math.floor(CANDLES.length/260));
  for (var i=0;i<CANDLES.length;i+=stride){ pts.push(X(i)+','+Y(closes[i])); }
  pts.push(X(LAST_IDX)+','+Y(closes[LAST_IDX]));
  out.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="#c9c4b3" stroke-width="1.2"/>');
  var bx1 = X(S.from), bx2 = X(S.to);
  out.push('<rect id="mmBox" x="'+bx1+'" y="0" width="'+Math.max(3,bx2-bx1)+'" height="'+H+'" fill="rgba(47,43,36,0.10)" stroke="#2f2b24" stroke-width="1.2" style="cursor:grab;"/>');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = out.join('');
  svg._W = W;
}

// ================= Inspector =================
function renderInspector(){
  var concl = document.getElementById('inspConclusion');
  var body = document.getElementById('inspBody');
  var cur = currentSignal();
  concl.textContent = fullConclusion(cur);

  if (S.sel.type === 'center') body.innerHTML = inspectorCenter(centerById(S.sel.id));
  else if (S.sel.type === 'signal') body.innerHTML = inspectorSignal(signalById(S.sel.id));
  else if (S.sel.type === 'beichi') body.innerHTML = inspectorBeichi(beichiById(S.sel.id));
  else body.innerHTML = cur ? inspectorSignal(cur) : '<div class="empty-hint">当前窗口暂无生效信号，也未选中任何对象。点击左侧列表或图上的标记查看证据。</div>';
}

function fullConclusion(sig){
  if (!sig) return '数据范围内暂无有效买卖点信号，价格仍在既有结构内运行，暂不构成新的买卖点判断。';
  var cn = TYPE_CN[sig.type];
  var statusWord = sig.status==='confirmed' ? '已确认' : (sig.status==='candidate' ? '候选' : '已失效');
  var lastClose = CANDLES[LAST_IDX].close;
  var isBuy = sig.dir === 'buy';
  var breachVerb = isBuy ? '跌破' : '涨破';
  var breached = isBuy ? lastClose < sig.boundary : lastClose > sig.boundary;
  var breachText = breached ? ('价格已' + breachVerb + '防守位 ' + fmt(sig.boundary) + '，结构可能已经失效') : ('价格尚未' + breachVerb + '防守位');
  var tail = sig.status==='failed' ? '该信号已失效，不构成当前有效买卖点。' : '结构未失效，暂不构成新的买卖点。';
  return statusWord + cn + '（' + sig.date + '起，防守位 ' + fmt(sig.boundary) + '），' + breachText + '；' + tail;
}

function inspectorCenter(z){
  if (!z) return '<div class="empty-hint">未找到该中枢。</div>';
  var members = z.memberIds.map(biById).filter(Boolean);
  var seed = members.slice(0,3);
  var html = '';
  html += '<div class="insp-sect"><h4>已满足条件</h4>';
  html += '<p>由笔 ' + seed.map(function(b){ return b.id + '（' + b.start.date + '→' + b.end.date + '）'; }).join('、') +
    ' 三段区间重叠构成：ZG（各段高点的最小值）= ' + fmt(z.zg) + '，ZD（各段低点的最大值）= ' + fmt(z.zd) + '，形成中枢区间 [' + fmt(z.zd) + ', ' + fmt(z.zg) + ']。共 ' + z.memberCount + ' 笔成员，状态：' + (z.status==='confirmed'?'已确认':'候选') + '。</p></div>';

  html += '<div class="insp-sect"><h4>四个角色</h4>';
  function role(label, obj, color){
    return '<div class="role-item"><span class="role-dot" style="background:' + color + ';"></span>' +
      '<span class="role-label">' + label + '</span><span class="role-val mono">' + objLabel(obj) + '</span></div>';
  }
  html += role('进入段', z.enterObj, '#6b6659');
  html += '<div class="role-item"><span class="role-dot" style="background:#4a4740;"></span><span class="role-label">成员笔</span><span class="role-val mono">' +
    (members.length ? members[0].start.date + ' → ' + members[members.length-1].end.date + '（共' + members.length + '笔）' : '—') + '</span></div>';
  html += role('离开段', z.leaveObj, z.leaveDir==='up' ? '#1f9d63' : z.leaveDir==='down' ? '#d1453a' : '#9c9788');
  html += role('回踩段', z.pullbackObj, '#b8790a');
  html += '</div>';

  html += '<div class="insp-sect"><h4>为什么说"' + (z.leaveDir==='up'?'向上':z.leaveDir==='down'?'向下':'尚未') + '离开"</h4>';
  if (z.leaveObj && z.leaveDir){
    var endP = objPrice(z.leaveObj,'end');
    var ref = z.leaveDir==='up' ? z.zg : z.zd;
    var diff = Math.abs(endP - ref);
    html += '<p>离开段终点价 ' + fmt(endP) + (z.leaveDir==='up'?' 高于 中枢上沿 ZG ':' 低于 中枢下沿 ZD ') + fmt(ref) + '，差值 ' + fmt(diff) +
      '。判定"离开方向"取终点所落的区间侧（leaveDir），而不是离开段自身的涨跌方向（leaveObj.dir 可能不同）——规则 E-Z11/E-Z12。</p>';
  } else {
    html += '<p>离开段终点仍落在中枢区间内，尚不构成"离开"（规则 E-Z11/E-Z12）。</p>';
  }
  html += '</div>';
  return html;
}

function inspectorSignal(s){
  if (!s) return '<div class="empty-hint">未找到该信号。</div>';
  var z = centerById(s.zsId);
  var bc = (s.evidence && s.evidence.beichiId) ? beichiById(s.evidence.beichiId) : beichiByZs(s.zsId);
  var isBuy = s.dir === 'buy';
  var lastClose = CANDLES[LAST_IDX].close;
  var dist = isBuy ? (lastClose - s.boundary) : (s.boundary - lastClose);

  var trigger;
  if (s.type === '1B' || s.type === '1S'){
    trigger = 'MACD 面积比 ' + (bc ? bc.ratio : '—') + ' < ' + ChanAlgo.STRENGTH_WEAK + '（力度减弱阈值），且价格创出新极值，判定为背驰，' + TYPE_CN[s.type] + '成立。';
  } else if (s.type === '2B' || s.type === '2S'){
    trigger = '回踩段后价格' + (isBuy?'未跌破':'未涨破') + '一' + (isBuy?'买':'卖') + '点位置 ' + fmt(s.evidence && s.evidence.refPrice) + '，' + TYPE_CN[s.type] + (s.status==='confirmed'?'确认':'候选') + '。';
  } else {
    var zg = z ? z.zg : null, zd = z ? z.zd : null;
    trigger = isBuy
      ? '回踩最低点未跌回中枢上沿 ZG ' + fmt(zg) + '，价格站稳在中枢之上，三买' + (s.status==='confirmed'?'确认':(s.status==='failed'?'失败':'候选')) + '。'
      : '回踩最高点未涨回中枢下沿 ZD ' + fmt(zd) + '，价格站稳在中枢之下，三卖' + (s.status==='confirmed'?'确认':(s.status==='failed'?'失败':'候选')) + '。';
  }

  var html = '';
  html += '<div class="insp-sect"><h4>触发条件</h4><p>' + trigger + '</p></div>';
  html += '<div class="insp-sect"><h4>防守/失效价</h4><dl class="kv2">' +
    '<dt>防守位</dt><dd class="mono">' + fmt(s.boundary) + '</dd>' +
    '<dt>当前价</dt><dd class="mono">' + fmt(lastClose) + '</dd>' +
    '<dt>距离</dt><dd class="mono" style="color:' + (dist>=0?'#1f9d63':'#d1453a') + ';">' + fmt(Math.abs(dist)) + (dist>=0?'（安全）':'（已击穿）') + '</dd>' +
  '</dl></div>';
  html += '<div class="insp-sect"><h4>关联中枢与背驰</h4>' +
    '<p>所属中枢：' + (z ? ('[' + fmt(z.zd) + ', ' + fmt(z.zg) + ']（' + z.startDate + ' ~ ' + z.endDate + '）') : '—') + '</p>' +
    '<p>关联背驰：' + (bc ? ('有，比值 ' + bc.ratio + '，' + (bc.status==='confirmed'?'已确认':'候选')) : '无') + '</p>' +
  '</div>';
  return html;
}

function inspectorBeichi(bc){
  if (!bc) return '<div class="empty-hint">未找到该背驰。</div>';
  var A = biById(bc.evidence.enterObjId), C = biById(bc.evidence.exitObjId);
  var weak = bc.ratio < ChanAlgo.STRENGTH_WEAK;
  var html = '';
  html += '<div class="insp-sect"><h4>参照段 A / 离开段 C</h4>' +
    '<div class="role-item"><span class="role-dot" style="background:#6b6659;"></span><span class="role-label">A</span><span class="role-val mono">' + objLabel(A) + '，MACD面积 ' + fmt(bc.areaA) + '</span></div>' +
    '<div class="role-item"><span class="role-dot" style="background:' + (bc.dir==='up'?'#1f9d63':'#d1453a') + ';"></span><span class="role-label">C</span><span class="role-val mono">' + objLabel(C) + '，MACD面积 ' + fmt(bc.areaC) + '</span></div>' +
  '</div>';
  html += '<div class="insp-sect"><h4>比值与判定阈值</h4><dl class="kv2">' +
    '<dt>比值 C/A</dt><dd class="mono">' + bc.ratio + '</dd>' +
    '<dt>弱阈值</dt><dd class="mono">' + ChanAlgo.STRENGTH_WEAK + '</dd>' +
    '<dt>判定</dt><dd style="color:' + (weak?'#b8790a':'#8b8677') + ';">' + (weak?'比值 < 弱阈值，力度减弱，构成背驰':'比值未低于弱阈值') + '</dd>' +
    '<dt>状态</dt><dd>' + (bc.status==='confirmed'?'已确认':'候选') + '</dd>' +
  '</dl><p style="margin-top:8px;">MACD 面板已同步高亮 A/C 区间（灰色=A，绿/红=C）。</p></div>';
  return html;
}

// ================= 状态栏 =================
function renderStatusbar(){
  var cur = currentSignal();
  var left = document.getElementById('statusLeft');
  if (!cur) left.textContent = '暂无有效信号';
  else {
    var word = cur.status==='confirmed' ? '有效' : (cur.status==='candidate' ? '候选' : '已失效');
    left.textContent = TYPE_CN[cur.type] + ' ' + word + ' · 防守 ' + fmt(cur.boundary);
  }
  document.getElementById('stAsOf').textContent = CANDLES[LAST_IDX].date;
  document.getElementById('stData').textContent = (META.generatedAt ? META.generatedAt.slice(0,10) : (META.begin+'~'+META.end));
  document.getElementById('stRule').textContent = ChanAlgo.RULE_VERSION;
}

function renderRangeLabel(){
  document.getElementById('rangeLabel').textContent = CANDLES[S.from].date + ' ~ ' + CANDLES[S.to].date + ' · ' + (S.to-S.from+1) + '根';
  document.getElementById('zoomPct').textContent = Math.round(((S.to-S.from+1) / (LAST_IDX+1)) * 100) + '%';
}

// ================= 主渲染 =================
function renderAll(){
  applyLayout();
  renderZsList();
  renderSigList();
  renderPrice();
  renderPhase();
  document.getElementById('macdWrap').classList.toggle('expanded', S.macdExpanded);
  renderMacd();
  renderMinimap();
  renderInspector();
  renderStatusbar();
  renderRangeLabel();
}

// ================= 主图 交互：拖拽平移 / 滚轮缩放 / 点击选中 =================
var priceSvg = document.getElementById('priceSvg');
priceSvg.innerHTML = '<defs><marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b6659"/></marker></defs>';

priceSvg.addEventListener('click', function(e){
  var kind = e.target.getAttribute('data-kind');
  var id = e.target.getAttribute('data-id');
  if (!kind) return;
  selectObject(kind, id);
});

function selectObject(kind, id){
  S.sel = { type: kind, id: id };
  S.macdExpanded = (kind === 'beichi');
  renderAll();
}

var dragging = false, dragStartX = 0, dragStartFrom = 0, dragStartTo = 0;
priceSvg.addEventListener('mousedown', function(e){
  if (e.target.getAttribute('data-kind')) return;
  dragging = true;
  dragStartX = e.clientX; dragStartFrom = S.from; dragStartTo = S.to;
  priceSvg.classList.add('dragging');
});
window.addEventListener('mousemove', function(e){
  if (!dragging) return;
  var W = document.getElementById('priceWrap').clientWidth - mL - mR;
  var width = dragStartTo - dragStartFrom + 1;
  var step = W / width;
  var deltaBars = Math.round((dragStartX - e.clientX) / step);
  setViewport(dragStartFrom + deltaBars, dragStartFrom + deltaBars + width - 1);
  renderAll();
});
window.addEventListener('mouseup', function(){
  if (dragging){ dragging = false; priceSvg.classList.remove('dragging'); }
});

priceSvg.addEventListener('wheel', function(e){
  e.preventDefault();
  var rect = priceSvg.getBoundingClientRect();
  var mouseX = e.clientX - rect.left;
  var width = S.to - S.from + 1;
  var step = (rect.width - mL - mR) / width;
  var anchorIdx = S.from + (mouseX - mL) / step;
  var factor = e.deltaY < 0 ? 0.85 : 1/0.85;
  zoomBy(factor, anchorIdx);
  renderAll();
}, { passive: false });

// ================= minimap 交互 =================
var mmSvg = document.getElementById('minimapSvg');
var mmDragging = false;
mmSvg.addEventListener('mousedown', function(e){
  mmDragging = true;
  moveMinimapTo(e);
});
window.addEventListener('mousemove', function(e){ if (mmDragging) moveMinimapTo(e); });
window.addEventListener('mouseup', function(){ mmDragging = false; });
function moveMinimapTo(e){
  var rect = mmSvg.getBoundingClientRect();
  var W = rect.width;
  var plotW = W - MM_L - MM_R;
  var x = e.clientX - rect.left - MM_L;
  var idx = clamp(Math.round((x/plotW) * LAST_IDX), 0, LAST_IDX);
  var width = S.to - S.from + 1;
  setViewport(idx - Math.round(width/2), idx - Math.round(width/2) + width - 1);
  renderAll();
}

document.getElementById('zoomIn').addEventListener('click', function(){ zoomBy(0.7); renderAll(); });
document.getElementById('zoomOut').addEventListener('click', function(){ zoomBy(1/0.7); renderAll(); });
document.getElementById('zoomGlobal').addEventListener('click', function(){ setViewport(0, LAST_IDX); renderAll(); });

// ================= 键盘 =================
document.addEventListener('keydown', function(e){
  var meta = e.metaKey || e.ctrlKey;
  if (meta && e.key === 'i'){ e.preventDefault(); toggleInspector(); return; }
  if (meta && e.key === '0'){ e.preventDefault(); setViewport(0, LAST_IDX); renderAll(); return; }
  if (meta && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault();
    var dir = e.key === 'ArrowRight' ? 1 : -1;
    var target = null;
    // 用中枢中点（而非 startIdx）跟游标比较，避免游标恰好落在某个中枢内部时，
    // "跳到上一个中枢"反而跳回游标所在的这一个中枢本身。
    if (dir === 1){
      for (var i=0;i<CENTERS.length;i++){
        var midI = Math.round((CENTERS[i].startIdx + CENTERS[i].endIdx)/2);
        if (midI > S.cursorIdx) { target = CENTERS[i]; break; }
      }
    } else {
      for (var j=CENTERS.length-1;j>=0;j--){
        var midJ = Math.round((CENTERS[j].startIdx + CENTERS[j].endIdx)/2);
        if (midJ < S.cursorIdx) { target = CENTERS[j]; break; }
      }
    }
    if (target){
      var mid = Math.round((target.startIdx + target.endIdx)/2);
      S.cursorIdx = mid;
      var width = S.to - S.from + 1;
      setViewport(mid - Math.round(width/2), mid - Math.round(width/2) + width - 1);
      renderAll();
    }
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    S.cursorIdx = clamp(S.cursorIdx + (e.key==='ArrowRight'?1:-1), 0, LAST_IDX);
    if (S.cursorIdx < S.from || S.cursorIdx > S.to){
      var w = S.to - S.from + 1;
      setViewport(S.cursorIdx - Math.round(w/2), S.cursorIdx - Math.round(w/2) + w - 1);
    }
    renderAll();
  }
});

window.addEventListener('resize', function(){ applyLayout(); renderPrice(); renderPhase(); renderMacd(); renderMinimap(); });

// ================= 启动 =================
applyLayout();
renderAll();
})();
</script>
