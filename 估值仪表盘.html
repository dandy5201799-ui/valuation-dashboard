@media (max-width:360px){
  .hpad{padding-left:12px!important;padding-right:12px!important}
  .mkt-grid{gap:6px!important}
  .mkt-card{padding:10px 8px 8px!important}
}

/* ---- C. 大屏 ≥768px：不做桌面版重设计，只给内容更多呼吸空间 ---- */

  #app{max-width:720px}

  .mkt-card{padding:18px 16px 14px!important}

  .dnarrow{max-width:640px;width:100%;margin-left:auto;margin-right:auto}
}

/* ---- 工具 ---- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct   = (v,a) => (v - a[0]) / (a[1] - a[0]) * 100;
const ps    = v => v.toFixed(1) + '%';
const clamp = v => Math.max(0, Math.min(100, v));
const fmt = (v, ref) => {
  const cur = String(ref).indexOf('HK$') === 0 ? 'HK$' : '¥';
  const n = v >= 100 ? Math.round(v).toLocaleString('en-US') : v.toFixed(1);
  return cur + n;
};
const cap = p => p < 22 ? {l:'0%', t:'0'} : (p > 78 ? {l:'100%', t:'-100%'} : {l:ps(p), t:'-50%'});

/* 对数正态价格分布：中位数=现价（不做方向预测），标准差=σ√T，σ为已实现年化波动率。
   Abramowitz-Stegun 近似 erf，标准正态CDF精度足够本场景使用。 */
function erf(x){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign * y;
}
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));

/* T年后价格落入六档的概率。价格区间不变，只把实用合理区间拆成“合理/合理偏贵”两个叫法。 */
function zoneProbs(s, T){
  const S0 = s.price, sigma = s.vol.sigma;
  const fairMid = (s.fair[0] + s.fair[1]) / 2;
  const edges = [null, s.bounds[0], s.bounds[1], fairMid, s.bounds[2], s.bounds[3], null];
  const z = x => x === null ? null : Math.log(x / S0) / (sigma * Math.sqrt(T));
  const cdf = [0, Phi(z(edges[1])), Phi(z(edges[2])), Phi(z(edges[3])), Phi(z(edges[4])), Phi(z(edges[5])), 1];
  return [0,1,2,3,4,5].map(i => Math.max(0, cdf[i+1] - cdf[i]));
}

/* 该股的"计划买入门槛"：招行用实用区间下沿，其余用严格模型区间上限（与叙事口径一致，非通用规则） */
function buyBarrier(s){
  return s.id === 'cmb' ? s.fair[0] : s.strict[1];
}

/* T年内价格至少触达一次买入门槛的概率：反射原理（driftless布朗运动首次通过时间公式）。
   现价已低于门槛时返回 null，由调用方展示"无需等待"文案而非百分比。 */
function touchProb(s, T){
  const barrier = buyBarrier(s);
  if (barrier >= s.price) return null;
  const d = Math.log(barrier / s.price);
  return 2 * Phi(d / (s.vol.sigma * Math.sqrt(T)));
}

  }));

    })),
    fitBg: r.fitOk ? '#E4EFE9' : '#F6EBDB',
    fitFg: r.fitOk ? '#245C4E' : '#8A5D22'
  });
}

function build(r, i){
  const a = r.axis, b = r.bounds;
  const cuts = [a[0], b[0], b[1], b[2], b[3], a[1]];
  const zones = ZC.map((c, z) => {
    const w = (cuts[z+1] - cuts[z]) / (a[1] - a[0]) * 100;
    return { c, k: w >= 15 ? LVL[z] : (w >= 6 ? ZA[z] : ''), w: ps(w) };
  });
  const mid = (r.fair[0] + r.fair[1]) / 2;
  const dev = (r.price - mid) / mid * 100;
  const st = chipOf(r.status);
  const cn = CONF[r.conf];
  const cc = r.conf === '低' ? '#C08A45' : '#245C4E';
  const loP = pct(b[0], a), hiP = pct(b[3], a);
  return Object.assign({}, r, {
    i, zones, dev,
    pricePct: ps(clamp(pct(r.price, a))),
    fairPct:  ps(clamp(pct(r.fair[0], a))),
    fairW:    ps(pct(r.fair[1], a) - pct(r.fair[0], a)),
    loPct: ps(clamp(loP)), hiPct: ps(clamp(hiP)),
    loCapL: cap(loP).l, loCapTx: cap(loP).t,
    hiCapL: cap(hiP).l, hiCapTx: cap(hiP).t,
    loStr: fmt(b[0], r.priceStr), hiStr: fmt(b[3], r.priceStr),
    strictLoStr: fmt(r.strict[0], r.priceStr), strictHiStr: fmt(r.strict[1], r.priceStr),
    devStr: (dev >= 0 ? '+' : '−') + Math.abs(dev).toFixed(1) + '%',
    devFg: dev >= 0 ? '#8A5D22' : '#245C4E',
    stBg: st.bg, stFg: st.fg,
    confDots: [0,1,2].map(k => ({ c: k < cn ? cc : '#E4E0D6' })),
    homeParams: r.homeParams.map(p => Object.assign({}, p, TAG[p.t])),
    params:     r.params.map(p => Object.assign({}, p, TAG[p.t])),
    calibRows:  r.calib.map((c, k) => Object.assign({}, c, CAL[k]))
  });
}

/* 估值带：五档底色 + 严格区间虚线框（弱化，画在实用区间之下）+ 黑框实用区间 + 黑竖线现价。
   现价竖线三屏统一：黑芯 1px + 左右各 2px 白边（共 5px），上下各超出色带 5px。
   size: 'sm'=列表12px（无标注），'lg'=个股页18px（带现价标签与边界刻度）。 */
const zoneCells = s => s.zones.map(z => `<div style="width:${z.w};background:${z.c};opacity:.55"></div>`).join('');
const priceLine = s =>
  `<div style="position:absolute;left:${s.pricePct};top:-5px;bottom:-5px;width:5px;transform:translateX(-2.5px);background:#15181E;border-left:2px solid #fff;border-right:2px solid #fff"></div>`;

/* 严格模型区间在刻度上的几何位置：clamp 到 [0,100]；若可见宽度小于最小可见宽度
   （含完全落在刻度外的情况），贴边钉出一条最小宽度的虚线框，永远不消失。
   具体数值不在带内重复标注，由下方「严格模型区间」文字框展示，避免同屏重复同一组数字。 */
function strictGeom(r){
  const a = r.axis, MINW = 4;
  const rawLo = pct(r.strict[0], a), rawHi = pct(r.strict[1], a);
  let lo = clamp(rawLo), hi = clamp(rawHi);
  if (hi - lo < MINW){
    if (rawHi <= 0){ lo = 0; hi = MINW; }
    else if (rawLo >= 100){ lo = 100 - MINW; hi = 100; }
    else { const mid = (lo + hi) / 2; lo = Math.max(0, Math.min(100 - MINW, mid - MINW / 2)); hi = lo + MINW; }
  }
  return { pct: ps(lo), w: ps(hi - lo) };
}

function band(s, size, priceLabelText){
  const lg = size === 'lg';
  const sg = strictGeom(s);
  const priceTag = lg ? `<div style="position:relative;height:24px">
      <div style="position:absolute;left:${s.pricePct};top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="font:600 10.5px/1 'Noto Sans SC';color:#15181E;background:#fff;padding:0 3px;white-space:nowrap">${esc(priceLabelText)}</div>
        <div style="width:2px;height:9px;background:#15181E"></div>
      </div>
    </div>` : '';
  const boundsRow = lg ? `<div style="display:flex;padding-top:9px">
      ${s.zones.map(z => `<div style="width:${z.w};font:500 10px/1.5 'Noto Sans SC';color:#6B7280;text-align:center;white-space:nowrap">${esc(z.k)}</div>`).join('')}
    </div>` : '';
  return `${priceTag}
    <div style="position:relative;height:${lg?18:12}px;display:flex;margin:${lg?0:'3px 0'};border-radius:${lg?5:0}px">
      ${zoneCells(s)}
      <div style="position:absolute;left:${sg.pct};width:${sg.w};top:0;bottom:0;border:1.5px dashed #7D7261;border-radius:3px"></div>
      <div style="position:absolute;left:${s.fairPct};width:${s.fairW};top:${lg?'-3px':'-2px'};bottom:${lg?'-3px':'-2px'};border:${lg?'2.5px':'2px'} solid #15181E;border-radius:4px;background:rgba(255,255,255,.3)"></div>
      ${priceLine(s)}
    </div>
    ${boundsRow}`;
}

function confDots(s, w, h){
  return s.confDots.map(c => `<span style="width:${w};height:${h};border-radius:3px;background:${c.c}"></span>`).join('');
}

/* ==========================================================================
   ⑤ 价格区间概率：对数正态模型，σ取真实已实现波动率，无方向漂移假设
   ========================================================================== */
function probBlock(d){
  const T = [1,2,3,5][state.hz || 0];
  const probs = zoneProbs(d, T);
  const touch = touchProb(d, T);
  const barrier = buyBarrier(d);
  const barrierLabel = d.id === 'cmb' ? '实用合理区间下沿' : '严格模型区间上限';
  const barrierStr = fmt(barrier, d.priceStr);

  const tabs = [1,2,3,5].map((h,i) => {
    const on = i === (state.hz || 0);
    return `<div data-act="hz" data-i="${i}" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;background:${on?'#15181E':'transparent'};color:${on?'#fff':'#4B535F'};border:1px solid ${on?'#15181E':'#E1DDD3'};font:600 12.5px/1 'Noto Sans SC';cursor:pointer">${h}年</div>`;
  }).join('');

  const bar = probs.map((p,z) => `<div style="width:${(p*100).toFixed(1)}%;background:${PROB_C[z]};opacity:.72"></div>`).join('');
  const rows = probs.map((p,z) => {
    const pct = p * 100;
    const isMax = p === Math.max(...probs);
    return `<div style="display:flex;align-items:center;gap:9px">
      <span style="width:8px;height:8px;border-radius:2px;background:${PROB_C[z]};flex:none"></span>
      <span style="font:400 12px/1.4 'Noto Sans SC';color:#3A414C;width:68px;flex:none">${PROB_LVL[z]}</span>
      <span style="flex:1;height:6px;background:#F2EFE7;border-radius:3px;overflow:hidden;display:flex"><span style="width:${Math.max(pct*2.2,3)}%;background:${PROB_C[z]};opacity:.72"></span></span>
      <span style="font-weight:${isMax?700:500};font-size:12.5px;line-height:1.3;font-family:'Source Serif 4',serif;font-variant-numeric:tabular-nums;width:44px;text-align:right;flex:none">${pct.toFixed(0)}%</span>
    </div>`;
  }).join('');

  const touchBox = touch !== null
    ? `<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <div style="font:500 12px/1.4 'Noto Sans SC';color:#9AA1AC;flex:1">${T}年内<b style="color:#fff">触达</b>买入门槛（${barrierLabel} ${barrierStr}）的概率</div>
        <div style="font:600 20px/1 'Source Serif 4',serif;color:#9FD8C4;font-variant-numeric:tabular-nums;flex:none">${(touch*100).toFixed(0)}%</div>
      </div>
      <div style="font:400 11px/1.6 'Noto Sans SC';color:#8B94A3">期间任一时点触达即算，与上方「期末落点」是两回事，随年限增加而上升。</div>`
    : `<div style="font:500 13px/1.6 'Noto Sans SC';color:#fff">现价已低于计划买入门槛（${barrierLabel} ${barrierStr}），无需等待触达。</div>`;

  return `<div style="background:#fff;border:1px solid #E1DDD3;border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:15px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <div style="font:500 10.5px/1 'Noto Sans SC';letter-spacing:.16em;color:#8B94A3">⑤ 价格区间概率</div>
      <div style="font:400 10.5px/1 'Noto Sans SC';color:#6B7280">对数正态模型</div>
    </div>
    <div style="font:400 12px/1.7 'Noto Sans SC';color:#4B535F;margin-top:-6px">不预测涨跌方向：中位数取现价，宽度由已实现年化波动率 ${esc(d.vol.sigmaPct)} 决定，随年限 √T 扩大。</div>
    <div style="display:flex;gap:7px">${tabs}</div>
    <div style="display:flex;flex-direction:column;gap:11px">
      <div style="font:700 13px/1.4 'Noto Sans SC'">${T}年后落点概率</div>
      <div style="display:flex;height:16px;border-radius:4px;overflow:hidden">${bar}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
    </div>
    <div style="background:#15181E;border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:9px">${touchBox}</div>
    <div style="display:flex;flex-direction:column;gap:7px;border-top:1px solid #F0ECE3;padding-top:13px">
      <div style="font:600 12px/1.4 'Noto Sans SC';color:#3A414C">计算依据</div>
      <div style="font:400 11.5px/1.8 'Noto Sans SC';color:#6B7280">${esc(d.vol.source)}。假设对数收益率服从正态分布、无方向漂移；六档边界与①一致，不随年限调整（实用合理区间拆为合理/合理偏贵）——年限越长两端概率同时上升，是模型的正常特征，不是矛盾。</div>
    </div>
  </div>`;
}

/* ==========================================================================
   ⑥ 市场观点：卖方研报一致预期 vs 我们自己的两套区间
   ========================================================================== */
function marketBlock(d){
  const m = d.market;
  const ratingRow = Object.entries(m.ratingCounts).map(([k,v]) =>
    `<span style="font:500 11px/1 'Noto Sans SC';padding:5px 8px;border-radius:6px;background:#F2EFE7;color:#3A414C">${esc(k)} ${v}</span>`).join('');

  let compareBlock;
  if (m.targetLow){
    // 有公开目标价（茅台）：两条对比条，同一刻度
    const lo = Math.min(d.axis[0], m.targetLow), hi = Math.max(d.axis[1], m.targetHigh);
    const cp = x => ps(clamp((x - lo) / (hi - lo) * 100));
    compareBlock = `<div style="display:flex;flex-direction:column;gap:13px">
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;justify-content:space-between"><span style="font:600 12px/1 'Noto Sans SC'">我们的实用合理区间</span><span style="font:600 12px/1 'Noto Sans SC';font-variant-numeric:tabular-nums">${esc(d.fairStr)}</span></div>
        <div style="position:relative;height:12px;background:#F0ECE3;border-radius:6px">
          <div style="position:absolute;left:${cp(d.fair[0])};width:${ps(clamp((d.fair[1]-lo)/(hi-lo)*100)-clamp((d.fair[0]-lo)/(hi-lo)*100))};top:0;bottom:0;background:#3A414C;border-radius:6px"></div>
          <div style="position:absolute;left:${cp(d.price)};top:-3px;bottom:-3px;width:3px;transform:translateX(-1.5px);background:#15181E;border-left:1px solid #fff;border-right:1px solid #fff"></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;justify-content:space-between"><span style="font:600 12px/1 'Noto Sans SC';color:#6B7280">市场公开目标价（${m.targetCount}份）</span><span style="font:600 12px/1 'Noto Sans SC';color:#6B7280;font-variant-numeric:tabular-nums">${esc(fmt(m.targetLow,d.priceStr))+' – '+esc(fmt(m.targetHigh,d.priceStr))}</span></div>
        <div style="position:relative;height:12px;background:#F0ECE3;border-radius:6px">
          <div style="position:absolute;left:${cp(m.targetLow)};width:${ps(clamp((m.targetHigh-lo)/(hi-lo)*100)-clamp((m.targetLow-lo)/(hi-lo)*100))};top:0;bottom:0;background:repeating-linear-gradient(45deg,#B9B3A5,#B9B3A5 3px,#CFCABC 3px,#CFCABC 6px);border-radius:6px"></div>
          <div style="position:absolute;left:${cp(d.price)};top:-3px;bottom:-3px;width:3px;transform:translateX(-1.5px);background:#15181E;border-left:1px solid #fff;border-right:1px solid #fff"></div>
        </div>
      </div>
      <div style="font:400 10.5px/1 'Noto Sans SC';color:#6B7280">竖线为现价 · 两条轴刻度一致 · 隐含一致预期(EPS×PE中位数)约 ${esc(fmt(m.impliedPrice, d.priceStr))}</div>
    </div>`;
  } else if (m.impliedPrice){
    // 无公开目标价，只有隐含一致预期（招行）：单条对比 我们实用区间 vs 隐含一致预期点位
    const lo = Math.min(d.axis[0], m.impliedPrice*0.9), hi = Math.max(d.axis[1], m.impliedPrice*1.1);
    const cp = x => ps(clamp((x - lo) / (hi - lo) * 100));
    compareBlock = `<div style="display:flex;flex-direction:column;gap:13px">
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;justify-content:space-between"><span style="font:600 12px/1 'Noto Sans SC'">我们的实用合理区间</span><span style="font:600 12px/1 'Noto Sans SC';font-variant-numeric:tabular-nums">${esc(d.fairStr)}</span></div>
        <div style="position:relative;height:12px;background:#F0ECE3;border-radius:6px">
          <div style="position:absolute;left:${cp(d.fair[0])};width:${ps(clamp((d.fair[1]-lo)/(hi-lo)*100)-clamp((d.fair[0]-lo)/(hi-lo)*100))};top:0;bottom:0;background:#3A414C;border-radius:6px"></div>
          <div style="position:absolute;left:${cp(d.price)};top:-3px;bottom:-3px;width:3px;transform:translateX(-1.5px);background:#15181E;border-left:1px solid #fff;border-right:1px solid #fff"></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;justify-content:space-between"><span style="font:600 12px/1 'Noto Sans SC';color:#6B7280">市场隐含一致预期</span><span style="font:600 12px/1 'Noto Sans SC';color:#6B7280;font-variant-numeric:tabular-nums">≈ ${esc(fmt(m.impliedPrice, d.priceStr))}</span></div>
        <div style="position:relative;height:12px;background:#F0ECE3;border-radius:6px">
          <div style="position:absolute;left:${cp(m.impliedPrice-1)};width:${ps(clamp((m.impliedPrice+1-lo)/(hi-lo)*100)-clamp((m.impliedPrice-1-lo)/(hi-lo)*100))};top:0;bottom:0;background:repeating-linear-gradient(45deg,#B9B3A5,#B9B3A5 3px,#CFCABC 3px,#CFCABC 6px);border-radius:6px"></div>
          <div style="position:absolute;left:${cp(d.price)};top:-3px;bottom:-3px;width:3px;transform:translateX(-1.5px);background:#15181E;border-left:1px solid #fff;border-right:1px solid #fff"></div>
        </div>

    </div>`;
  } else {
    // 无可比目标价（胜宏）：只比每股盈利预期
    compareBlock = `<div style="display:flex;flex-direction:column;gap:10px;background:#F7F5F0;border-radius:12px;padding:14px">
      <div style="display:flex;justify-content:space-between;gap:12px"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">分析师2026E每股盈利预期（人民币，中位数）</span><span style="font:600 12.5px/1.4 'Noto Sans SC'">¥${m.consensusEps.toFixed(2)}</span></div>
      <div style="height:1px;background:#E7E3D9"></div>
      <div style="display:flex;justify-content:space-between;gap:12px"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">我们模型2026E EPS假设</span><span style="font:600 12.5px/1.4 'Noto Sans SC'">¥6.31</span></div>
      <div style="height:1px;background:#E7E3D9"></div>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">差异</span><span style="font:700 12px/1 'Noto Sans SC';padding:6px 9px;border-radius:6px;background:#F6EBDB;color:#8A5D22">市场高约51%</span></div>
      <div style="font:400 10.5px/1.6 'Noto Sans SC';color:#8B94A3">${esc(m.targetWindowNote)}</div>
    </div>`;
  }

  let multipleBlock = '';
  if (m.mktMultiple){
    const STANCE = {
      '基本一致': {bg:'#E4EFE9', fg:'#245C4E'},
      '更乐观':   {bg:'#F6EBDB', fg:'#8A5D22'},
      '明显更乐观': {bg:'#F4E2D8', fg:'#8C3F1D'},
      '更保守':   {bg:'#EDE9E3', fg:'#5A6270'}
    }[m.stance] || {bg:'#F0ECE3', fg:'#4B535F'};
    multipleBlock = `<div style="display:flex;flex-direction:column;gap:10px;background:#F7F5F0;border-radius:12px;padding:14px">
      <div style="display:flex;justify-content:space-between;gap:12px"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">市场通常采用</span><span style="font:600 12.5px/1.4 'Noto Sans SC'">${esc(m.mktMultiple)}</span></div>
      <div style="height:1px;background:#E7E3D9"></div>
      <div style="display:flex;justify-content:space-between;gap:12px"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">我们采用</span><span style="font:600 12.5px/1.4 'Noto Sans SC'">${esc(m.ourMultiple)}</span></div>
      <div style="height:1px;background:#E7E3D9"></div>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span style="font:400 12.5px/1.4 'Noto Sans SC';color:#6B7280">相对我们</span><span style="font:700 12px/1 'Noto Sans SC';padding:6px 9px;border-radius:6px;background:${STANCE.bg};color:${STANCE.fg}">${esc(m.stance)}</span></div>
    </div>`;
  }

  return `<div style="background:#fff;border:1px solid #E1DDD3;border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:15px">
    <div style="font:500 10.5px/1 'Noto Sans SC';letter-spacing:.16em;color:#8B94A3">⑥ 市场观点</div>
    <div style="font:400 11.5px/1.6 'Noto Sans SC';color:#6B7280">${esc(m.windowNote)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${ratingRow}<span style="font:400 11px/1.6 'Noto Sans SC';color:#8B94A3">·${esc(m.ratingWindowNote)}</span></div>
    ${compareBlock}
    ${multipleBlock}
    <div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #F0ECE3;padding-top:13px">
      <div style="font:600 12.5px/1.4 'Noto Sans SC'">差异主要来自</div>
      <div style="font:400 12.5px/1.8 'Noto Sans SC';color:#4B535F">${esc(m.diffNote)}</div>
    </div>
  </div>`;
}

/* ==========================================================================
   渲染与交互
   ========================================================================== */
function render(){
  const app = document.getElementById('app');
  if (!state.data){
    app.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;font:400 12.5px/1.8 'Noto Sans SC';color:#6B7280">正在加载数据…</div>`;
    return;
  }
  let body;
  if (state.screen === 'list')        body = viewList();
  else if (state.screen === 'market') body = viewMarket();
  else                                body = viewDetail();
  app.innerHTML = topBar() + body;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const i = parseInt(el.getAttribute('data-i'), 10);
  if (act === 'mkt' || act === 'mkttab'){ state.screen = 'market'; state.mkt = i; render(); }
  else if (act === 'list'){ state.screen = 'list'; render(); }
  else if (act === 'detail'){ state.screen = 'detail'; state.sel = i; render(); }
  else if (act === 'chip'){
    state.sel = i; render();
    const p = document.getElementById('detailPane');
    if (p) p.scrollTop = 0;
  }
  else if (act === 'hz'){ state.hz = i; render(); }
});

/* ==========================================================================
   数据加载：fetch 成功 → 真实数据；失败 → FALLBACK 并标记「数据未更新」
   ========================================================================== */
async function loadJSON(path){
  const res = await fetch(path, {cache:'no-store'});
  if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
  return res.json();
}

async function boot(){
  let mkt = null, stk = null, stale = null, reasons = [];

  try { mkt = await loadJSON('./data/market_temperature.json'); }
  catch (err){ reasons.push('市场温度：' + err.message); }

  // meta 里若标记 stale，说明最近一次抓取失败、JSON 是旧的，必须提示。
  if (mkt){
    try {
      const meta = await loadJSON('./data/market_temperature.meta.json');
      if (meta && meta.stale) reasons.push('市场温度最近一次抓取失败：' + (meta.reason || '原因未记录'));
    } catch (err){ /* meta 缺失不视为失败 */ }
  }

  try { stk = await loadJSON('./data/stocks.json'); }
  catch (err){ reasons.push('个股：' + err.message); }

  if (!mkt){ mkt = FALLBACK_MARKET; }
  if (!stk){ stk = FALLBACK_STOCKS; }
  if (!mkt || !stk){
    document.getElementById('app').innerHTML =
      `<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;font:400 12.5px/1.8 'Noto Sans SC';color:#8C3F1D">数据文件与内嵌快照都不可用，无法渲染。<br>请先运行 build_mobile_dashboard.py 与 update_market_temperature.py。</div>`;
    return;
  }
  if (reasons.length) stale = { asOf: mkt.asOfDate, reasons };

  state.data = {
    asOfDate: mkt.asOfDate,
    stocksAsOf: (stk.asOfDate || '').slice(5),
    boundaryNote: mkt.boundaryNote,
    markets: mkt.markets,
    stocks: stk.stocks.map(build)
  };
  state.stale = stale;
  render();
}

render();
boot();
</script>
