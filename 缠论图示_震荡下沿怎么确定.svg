<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 800; fill: #162033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 800; fill: #162033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #64748b; }
      .path { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
      .guard { stroke: #f59e0b; stroke-width: 4; }
      .upper { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 8; }
      .lower { stroke: #16a34a; stroke-width: 5; }
      .danger { stroke: #dc2626; stroke-width: 5; }
      .zone { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 8; opacity: .55; }
      .range { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; opacity: .7; }
      .callout { fill: #ffffff; stroke-width: 2; }
      .orange-box { fill: #fff7ed; stroke: #f59e0b; }
      .green-box { fill: #f0fdf4; stroke: #16a34a; }
      .red-box { fill: #fef2f2; stroke: #dc2626; }
      .blue-box { fill: #eff6ff; stroke: #2563eb; }
      .dot-low { fill: #16a34a; stroke: #ffffff; stroke-width: 4; }
      .dot-high { fill: #2563eb; stroke: #ffffff; stroke-width: 4; }
      .dot-bad { fill: #dc2626; stroke: #ffffff; stroke-width: 4; }
      .dot-wait { fill: #f59e0b; stroke: #ffffff; stroke-width: 4; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="820"/>

  <text class="title" x="60" y="62">震荡下沿怎么确定？</text>
  <text class="sub" x="60" y="96">核心：第一次低点只是“候选”，第二次回落到附近并守住，才开始确认下沿。</text>

  <rect class="panel" x="50" y="130" width="385" height="560" rx="22"/>
  <rect class="panel" x="468" y="130" width="385" height="560" rx="22"/>
  <rect class="panel" x="885" y="130" width="385" height="560" rx="22"/>

  <text class="h2" x="82" y="174">① 第一次跌出低点</text>
  <text class="h2" x="500" y="174">② 第二次守住附近</text>
  <text class="h2" x="917" y="174">③ 第二次明显跌穿</text>

  <text class="small" x="82" y="203">只能叫“下沿候选”</text>
  <text class="small" x="500" y="203">A/C 两个低点接近，区间形成</text>
  <text class="small" x="917" y="203">不是震荡确认，更像继续走弱</text>

  <!-- Panel 1 -->
  <line class="guard" x1="90" y1="310" x2="395" y2="310"/>
  <text class="tiny" x="96" y="298">旧防守位 / 回抽压力</text>
  <path class="path" d="M95 430 L150 300 L205 380 L260 250 L330 465"/>
  <circle class="dot-low" cx="330" cy="465" r="11"/>
  <text class="txt" x="346" y="471">A</text>
  <rect class="callout orange-box" x="155" y="505" width="215" height="72" rx="12"/>
  <text class="txt" x="172" y="533">第一次低点 A</text>
  <text class="small" x="172" y="560">先别急着画下沿</text>
  <path class="arrow" d="M300 497 C310 488 318 480 326 470"/>

  <!-- Panel 2 -->
  <rect class="range" x="512" y="268" width="295" height="230" rx="8"/>
  <line class="upper" x1="512" y1="286" x2="807" y2="286"/>
  <line class="lower" x1="512" y1="470" x2="807" y2="470"/>
  <line class="guard" x1="512" y1="334" x2="807" y2="334"/>
  <text class="tiny" x="522" y="322">原防守位被来回穿越</text>
  <text class="tiny" x="522" y="263">震荡上沿：反弹多次过不去</text>
  <text class="tiny" x="522" y="512">震荡下沿：两次以上跌不穿</text>
  <path class="path" d="M510 430 L565 300 L620 382 L680 255 L730 470 L780 292 L815 464"/>
  <circle class="dot-low" cx="730" cy="470" r="11"/>
  <text class="txt" x="710" y="495">A</text>
  <circle class="dot-low" cx="815" cy="464" r="11"/>
  <text class="txt" x="830" y="469">C</text>
  <circle class="dot-high" cx="780" cy="292" r="11"/>
  <text class="txt" x="793" y="298">B</text>
  <rect class="callout green-box" x="530" y="545" width="260" height="82" rx="12"/>
  <text class="txt" x="548" y="574">A ≈ C，第二次守住</text>
  <text class="small" x="548" y="601">下沿才开始确认</text>

  <!-- Panel 3 -->
  <line class="guard" x1="928" y1="310" x2="1232" y2="310"/>
  <text class="tiny" x="938" y="298">旧防守位 / 回抽压力</text>
  <line class="lower" x1="935" y1="465" x2="1116" y2="465"/>
  <text class="tiny" x="944" y="488">A 只是候选下沿</text>
  <path class="path" d="M930 430 L985 300 L1040 382 L1100 255 L1150 465 L1205 340 L1240 560"/>
  <circle class="dot-low" cx="1150" cy="465" r="11"/>
  <text class="txt" x="1128" y="491">A</text>
  <circle class="dot-bad" cx="1240" cy="560" r="12"/>
  <text class="txt" x="1253" y="566">C</text>
  <line class="danger" x1="1192" y1="518" x2="1244" y2="562"/>
  <rect class="callout red-box" x="950" y="592" width="255" height="72" rx="12"/>
  <text class="txt" x="968" y="620">C 明显低于 A</text>
  <text class="small" x="968" y="647">下沿失效，不是震荡确认</text>

  <!-- Bottom summary -->
  <rect x="92" y="720" width="1136" height="58" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text class="txt" x="126" y="756">口诀：</text>
  <text class="txt" x="182" y="756">一低只是候选；二低相近才有下沿；二低明显跌穿，就不是震荡，是继续走弱。</text>
</svg>
