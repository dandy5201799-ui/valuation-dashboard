<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="920" viewBox="0 0 1460 920">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 730; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .card { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .green-card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .red-card { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .orange-card { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; }
      .blue-card { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .path { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 10; }
      .path-ok { fill: none; stroke: #16a34a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .path-bad { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .trigger { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .invalid { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 7; }
      .observe { fill: rgba(245, 158, 11, .12); stroke: #f59e0b; stroke-width: 2; }
      .confirm { fill: rgba(22, 163, 74, .14); stroke: #16a34a; stroke-width: 2; }
      .avoid { fill: rgba(220, 38, 38, .10); stroke: #dc2626; stroke-width: 2; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-high { fill: #dc2626; }
      .dot-low { fill: #16a34a; }
      .dot-buy { fill: #16a34a; }
      .dot-wait { fill: #f59e0b; }
      .dot-risk { fill: #dc2626; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-green { stroke: #16a34a; }
      .box-orange { stroke: #f59e0b; }
      .box-red { stroke: #dc2626; }
      .box-blue { stroke: #2563eb; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1460" height="920"/>

  <text class="title" x="56" y="64">上升趋势回调：真正确认点在哪里？</text>
  <text class="sub" x="56" y="100">防守位附近不是买点，只是观察区。真正确认点要等“防守位没被有效跌破 + 右侧重新向上”。</text>

  <rect class="panel" x="48" y="132" width="1364" height="636" rx="24"/>

  <!-- Left: valid confirmation -->
  <rect class="card green-card" x="88" y="176" width="600" height="520" rx="20"/>
  <text class="h2" x="124" y="220">正确：观察区之后，等右侧确认</text>
  <text class="small" x="124" y="250">不是买在防守位，而是买在守住后的向上确认</text>

  <rect class="observe" x="392" y="404" width="120" height="92" rx="10"/>
  <text class="tiny" x="404" y="518">观察区</text>
  <rect class="confirm" x="496" y="292" width="112" height="88" rx="10"/>
  <text class="tiny" x="510" y="282">确认区</text>

  <line class="guard" x1="128" y1="472" x2="640" y2="472"/>
  <text class="tiny" x="136" y="460">防守位：跌破则这次试错失效</text>
  <line class="trigger" x1="384" y1="352" x2="640" y2="352"/>
  <text class="tiny" x="392" y="340">回调小高点：突破才是确认</text>

  <path class="path-ok" d="M132 492 L200 430 L264 456 L336 364 L408 416 L456 472 L528 352 L616 316"/>
  <circle class="dot dot-low" cx="132" cy="492" r="10"/>
  <circle class="dot dot-high" cx="200" cy="430" r="10"/>
  <circle class="dot dot-low" cx="264" cy="456" r="10"/>
  <circle class="dot dot-high" cx="336" cy="364" r="10"/>
  <circle class="dot dot-wait" cx="456" cy="472" r="12"/>
  <circle class="dot dot-buy" cx="528" cy="352" r="13"/>
  <text class="txt" x="544" y="358">确认点</text>

  <rect class="box box-orange" x="124" y="552" width="240" height="88" rx="12"/>
  <text class="txt" x="144" y="584">① 接近防守位</text>
  <text class="small" x="144" y="612">只观察，不急买</text>

  <rect class="box box-green" x="392" y="552" width="244" height="88" rx="12"/>
  <text class="txt" x="412" y="584">② 突破回调小高点</text>
  <text class="small" x="412" y="612">才进入入手观察</text>

  <!-- Right: failure -->
  <rect class="card red-card" x="772" y="176" width="600" height="520" rx="20"/>
  <text class="h2" x="808" y="220">错误：一碰防守位就买，容易接在破位前</text>
  <text class="small" x="808" y="250">如果没有右侧确认，后面可能直接跌破并转弱</text>

  <rect class="observe" x="1064" y="404" width="120" height="92" rx="10"/>
  <text class="tiny" x="1076" y="518">观察区</text>
  <rect class="avoid" x="1128" y="472" width="160" height="116" rx="10"/>
  <text class="tiny" x="1140" y="612">失效区</text>

  <line class="guard" x1="812" y1="472" x2="1324" y2="472"/>
  <text class="tiny" x="820" y="460">防守位：这里不是无脑买点</text>
  <line class="trigger" x1="1060" y1="352" x2="1324" y2="352"/>
  <text class="tiny" x="1068" y="340">回调小高点：没有突破</text>
  <line class="invalid" x1="812" y1="512" x2="1324" y2="512"/>
  <text class="tiny" x="1112" y="536">有效跌破：不买，原计划失效</text>

  <path class="path-bad" d="M816 492 L884 430 L948 456 L1020 364 L1092 416 L1140 472 L1196 512 L1260 444 L1320 572"/>
  <circle class="dot dot-low" cx="816" cy="492" r="10"/>
  <circle class="dot dot-high" cx="884" cy="430" r="10"/>
  <circle class="dot dot-low" cx="948" cy="456" r="10"/>
  <circle class="dot dot-high" cx="1020" cy="364" r="10"/>
  <circle class="dot dot-wait" cx="1140" cy="472" r="12"/>
  <circle class="dot dot-risk" cx="1196" cy="512" r="13"/>
  <circle class="dot dot-risk" cx="1320" cy="572" r="13"/>
  <text class="txt" x="1212" y="518">不买</text>

  <rect class="box box-red" x="808" y="552" width="252" height="88" rx="12"/>
  <text class="txt" x="828" y="584">① 只碰到防守位</text>
  <text class="small" x="828" y="612">不能当确认点</text>

  <rect class="box box-red" x="1088" y="552" width="244" height="88" rx="12"/>
  <text class="txt" x="1108" y="584">② 有效跌破</text>
  <text class="small" x="1108" y="612">买入条件取消</text>

  <!-- Logic strip -->
  <rect class="panel" x="96" y="792" width="1268" height="84" rx="20"/>
  <text class="txt" x="128" y="828">严谨流程：</text>
  <text class="txt" x="228" y="828">上升趋势成立 → 回调到防守位附近只观察 → 未有效跌破 → 突破回调小高点 / 低级别转强 → 才是确认点。</text>
  <text class="small" x="128" y="856">如果有效跌破防守位，入手计划取消；后面先按破位观察，不再用“上升回调低吸”的逻辑。</text>
</svg>
