function px(){cv.width=Math.max(880,cv.parentElement.clientWidth-6);cv.height=Math.max(600,cv.width*0.72);const s=document.getElementById('slider');s.min=1;s.max=DATA.length-1;s.value=cut;document.getElementById('slab').textContent=DATA[cut].d}
function priceTop(){return padT}
function priceBottom(){return cv.height-padB-110}
function xs(i){return padL+(cv.width-padL-34)*(i/Math.max(1,DATA.length-1))}
function pscale(){const s=DATA.slice(0,cut+1);const mn=Math.min(...s.map(d=>d.l)),mx=Math.max(...s.map(d=>d.h));const g=(mx-mn)||1;return {mn,mx,g}}
function yv(v){const {mn,mx,g}=pscale();const pb=priceBottom();return pb-(pb-priceTop())*(v-(mn-g*0.08))/((mx+g*0.08)-(mn-g*0.08))}
function wk(){return Math.min(30, cut)} // 分析窗口
function seg(){return DATA.slice(Math.max(0,cut-wk()+1), cut+1)} // 当前点之前的窗口(dedup)

// ---- 波段高低点(在窗口内, 用"最近两个波段"保证给到当前点附近的结论) ----
function swing(useHi){
  const s=seg();if(s.length<3)return [];
  const local=[];
  for(let i=1;i<s.length-1;i++){
    const gi=Math.max(0,cut-wk()+1)+i;
    if(useHi && s[i].h>=s[i-1].h && s[i].h>=s[i+1].h) local.push(gi);
    if(!useHi && s[i].l<=s[i-1].l && s[i].l<=s[i+1].l) local.push(gi);
  }
  // 相邻<4合并
  const out=[];
  for(const g of local){
    if(out.length && g-out[out.length-1]<=3){ if(useHi?DATA[g].h>DATA[out[out.length-1]].h:DATA[g].l<DATA[out[out.length-1]].l) out[out.length-1]=g; }
    else out.push(g);
  }
  return out;
}
function safe(o,f){try{return o?f(o):null}catch(e){return null}}

// ---- 绘制 ----
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,cv.width,cv.height);
  const {mn,mx}=pscale(), pb=priceBottom();
  ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;
  for(let k=0;k<=6;k++){const v=mn+(mx-mn)*k/6,yy=pb-(pb-priceTop())*k/6;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(cv.width-34,yy);ctx.stroke();ctx.fillStyle='#8894a6';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(1),padL-6,yy+3)}
  ctx.strokeStyle='#dfe6ef';ctx.beginPath();ctx.moveTo(padL,pb+12);ctx.lineTo(cv.width-34,pb+12);ctx.stroke();
  ctx.fillStyle='#667085';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('MACD 12,26,9',padL,pb+22);
  ctx.textAlign='center';ctx.fillStyle='#99a4b4';ctx.font='9px sans-serif';
  DATA.slice(0,cut+1).forEach((d,i)=>{if(i%7===0)ctx.fillText(d.d.slice(5),xs(i),cv.height-padB+15)});
  // K线
  const s=DATA.slice(0,cut+1);const bw=Math.max(1.5,cv.width/DATA.length*0.42);
  s.forEach((d,i)=>{const up=d.c>=d.o;ctx.strokeStyle=up?'#c0392b':'#1a7a4c';ctx.fillStyle=up?'rgba(192,57,43,.92)':'rgba(26,122,76,.92)';ctx.beginPath();ctx.moveTo(xs(i),yv(d.l));ctx.lineTo(xs(i),yv(d.h));ctx.stroke();const t=Math.min(yv(d.o),yv(d.c)),b=Math.max(yv(d.o),yv(d.c));ctx.fillRect(xs(i)-bw/2,t,bw,Math.max(1,b-t));});
  // MACD
  const macx=Math.max(...s.map(d=>Math.abs(d.macd||0)))*1.2||1;
  const mTop=pb+16,mBot=cv.height-padB-8,mMid=mTop+(mBot-mTop)*0.34;
  s.forEach((d,i)=>{const m=d.macd||0;const hh=(Math.abs(m)/macx)*(mBot-mTop)/2;ctx.fillStyle=m>=0?'rgba(34,160,107,.85)':'rgba(214,64,69,.85)';const y0=m>=0?mMid-hh:mMid;ctx.fillRect(xs(i)-bw/2,y0,bw,hh);});
  // 箱体(仅勾选❸)
  if(sel.has(3)){ctx.save();
    BOXES.forEach(b=>{if(b.i0>cut)return;const x0=xs(b.i0),x1=Math.min(xs(b.i1),xs(cut));const on=cut>=b.i0&&cut<=b.i1;
      ctx.fillStyle=on?'rgba(183,121,31,0.18)':'rgba(183,121,31,0.07)';ctx.fillRect(x0,yv(b.top),x1-x0,yv(b.bot)-yv(b.top));
      ctx.strokeStyle=on?'#b7791f':'rgba(183,121,31,0.5)';ctx.lineWidth=on?2.4:1.2;ctx.setLineDash([6,3]);ctx.strokeRect(x0,yv(b.top),x1-x0,yv(b.bot)-yv(b.top));ctx.setLineDash([]);
      if(on){ctx.font='bold 11px sans-serif';ctx.fillStyle='#b7791f';ctx.textAlign='left';ctx.fillText('上沿/压力 '+b.top.toFixed(2),x0+4,yv(b.top)-8);ctx.fillText('下沿/支撑 '+b.bot.toFixed(2),x0+4,yv(b.bot)+16);}
    });ctx.restore();
  }
  // 趋势/高低点(勾选❶/❷)
  if(sel.has(1)||sel.has(2)){
    const H=swing(true),L=swing(false);
    if(H.length>=2){const a=H[H.length-2],b=H[H.length-1];ctx.save();ctx.strokeStyle='#d64045';ctx.lineWidth=2.4;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(a),yv(DATA[a].h));ctx.lineTo(xs(b),yv(DATA[b].h));ctx.stroke();[a,b].forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].h),5,0,7);ctx.fillStyle='#d64045';ctx.fill()});ctx.restore();}
    if(L.length>=2){const a=L[L.length-2],b=L[L.length-1];ctx.save();ctx.strokeStyle='#1a7a4c';ctx.lineWidth=2.4;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(a),yv(DATA[a].l));ctx.lineTo(xs(b),yv(DATA[b].l));ctx.stroke();[a,b].forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].l),5,0,7);ctx.fillStyle='#1a7a4c';ctx.fill()});ctx.restore();}
    // 标近高/近低
    if(sel.has(2)){
      let hi=s[0],lo=s[0];const wseg=s.slice(Math.max(0,cut-14));
      wseg.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
      const iHi=DATA.indexOf(hi),iLo=DATA.indexOf(lo);
      if(iHi>=0){ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#d64045';ctx.fillText('近高 '+hi.h.toFixed(2), xs(iHi), yv(hi.h)-14);ctx.strokeStyle='#d64045';ctx.beginPath();ctx.arc(xs(iHi),yv(hi.h),6,0,7);ctx.stroke();}
      if(iLo>=0){ctx.fillStyle='#1a7a4c';ctx.fillText('近低 '+lo.l.toFixed(2), xs(iLo), yv(lo.l)+20);ctx.strokeStyle='#1a7a4c';ctx.beginPath();ctx.arc(xs(iLo),yv(lo.l),6,0,7);ctx.stroke();}
    }
  }
  // 当前点竖线+标签(防越界)
  const xCut=xs(cut),cLabel='▮ '+DATA[cut].d+' 收'+DATA[cut].c.toFixed(2);
  ctx.save();ctx.strokeStyle='#d64045';ctx.lineWidth=2.2;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(xCut,priceTop());ctx.lineTo(xCut,cv.height-padB);ctx.stroke();ctx.restore();
  ctx.font='bold 12px sans-serif';ctx.fillStyle='#d64045';
  const lwTxt=ctx.measureText(cLabel).width;
  if(xCut+lwTxt/2>cv.width-6)ctx.textAlign='right',ctx.fillText(cLabel,xCut-6,priceTop()+16);
  else if(xCut-lwTxt/2<padL)ctx.textAlign='left',ctx.fillText(cLabel,xCut+6,priceTop()+16);
  else ctx.textAlign='center',ctx.fillText(cLabel,xCut,priceTop()+16);
  document.getElementById('nowtag').textContent='当前停在：'+DATA[cut].d+'　收盘 '+DATA[cut].c.toFixed(2)+'　（cut之后无数据=无未来）';
  // 按钮
  const st=document.getElementById('steps');st.innerHTML='';
  STEPS.forEach((nm,i)=>{const b=document.createElement('button');b.className='step'+(sel.has(i+1)?' on':'');b.textContent=nm;
    b.onclick=()=>{if(sel.has(i+1)){sel.delete(i+1)}else{sel.add(i+1);lastStep=i+1}draw();};st.appendChild(b);});
  renderConclusion();
}
// ---- 结论(每步必给, 缺数据明确标注) ----
function renderConclusion(){
  const el=document.getElementById('res'),meta=document.getElementById('meta');
  let html='',metaTxt='窗口'+wk()+'根 · 到 '+DATA[cut].d;
  const cur=DATA[cut];
  const H=swing(true),L=swing(false);
  metaTxt+=' · 波段高'+H.length+'/低'+L.length+' · 箱体'+(BOXES.some(b=>cut>=b.i0&&cut<=b.i1)?'■在':'□不在');
  if(lastStep===1){
    if(H.length>=2&&L.length>=2){
      const aH=H[H.length-2],bH=H[H.length-1],aL=L[L.length-2],bL=L[L.length-1];
      const hp=DATA[bH].h>=DATA[aH].h, lp=DATA[bL].l>=DATA[aL].l;
      const dir=hp&&lp?'<b>上涨趋势</b>（高点抬升+低点抬升）':(!hp&&!lp)?'<b>下跌趋势</b>（高点走低+低点走低）':'<b>横盘/整理</b>';
      html='<b>❶ 走势方向结论</b>：'+dir+'<br><span class="btn-concl">高点线('+DATA[aH].h.toFixed(2)+'=>'+DATA[bH].h.toFixed(2)+') · 低点线('+DATA[aL].l.toFixed(2)+'=>'+DATA[bL].l.toFixed(2)+')</span>';
    } else {html='<b>❶ 走势方向结论</b>：<span class="empty">数据不足以判断方向</span>（当前点往前需至少2个波段高点、2个波段低点）。';}
  }else if(lastStep===2){
    let hi=cur,lo=cur;const wseg=DATA.slice(Math.max(0,cut-14),cut+1);
    wseg.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
    html='<b>❷ 高低点结论</b>：近高 <b>'+hi.h.toFixed(2)+'</b>（'+hi.d.slice(5)+'，压力位）；近低 <b>'+lo.l.toFixed(2)+'</b>（'+lo.d.slice(5)+'，支撑位）。';
  }else if(lastStep===3){
    const b=BOXES.find(x=>cut>=x.i0&&cut<=x.i1);
    if(b){const pos=(cur.c-b.bot)/((b.top-b.bot)||1);html='<b>❸ 箱体结论</b>：当前在<b class="bx">'+b.d0.slice(5)+'~'+b.d1.slice(5)+'</b>窄箱体内，下沿/支撑 <b>'+b.bot.toFixed(2)+'</b>、上沿/压力 <b>'+b.top.toFixed(2)+'</b>，位置<b>'+Math.round(pos*100)+'%</b>。';}
    else{const near=BOXES.reduce((a,x)=>Math.abs(x.i0-cut)<Math.abs(a.i0-cut)?x:a,BOXES[0]);html='<b>❸ 箱体结论</b>：当前<b>不在窄箱体</b>内（趋势/整理段）。最近箱体 <b class="bx">'+near.d0.slice(5)+'~'+near.d1.slice(5)+'</b>（'+near.bot.toFixed(2)+'~'+near.top.toFixed(2)+'）。趋势段不做箱体高抛低吸。';}
  }else if(lastStep===4){
    const bc=(cut>=1&&BEICHI[cut-1]&&!BEICHI[cut-1].none)?BEICHI[cut-1]:null;
    if(bc&&bc.A>=0&&bc.B>=0){
      const A=DATA[bc.A],B=DATA[bc.B];
      const beichi=bc.isTop?'<span style="color:#d64045"><b>有顶背驰</b></span>：价新高('+A.h.toFixed(2)+'→'+B.h.toFixed(2)+')但MACD动能'+bc.mA.toFixed(2)+'→'+bc.mB.toFixed(2)+'减弱，上涨力竭→潜在卖点'
        :bc.pB?'<span style="color:#0e6f46"><b>无顶背驰</b></span>：价创阶段新高('+A.h.toFixed(2)+'→'+B.h.toFixed(2)+')且动能'+bc.mA.toFixed(2)+'→'+bc.mB.toFixed(2)+'未明显衰减'
        :'<b>无顶背驰信号</b>：近高('+B.h.toFixed(2)+')未超过前高('+A.h.toFixed(2)+')，处整理/回落';
      html='<b>❹ 突破/背驰结论</b>：'+beichi+'<br><span style="color:#667085">前高 '+A.d.slice(5)+'('+A.h.toFixed(2)+',动能'+bc.mA.toFixed(2)+') → 近高 '+B.d.slice(5)+'('+B.h.toFixed(2)+',动能'+bc.mB.toFixed(2)+')</span>';
    }else html='<b>❹ 突破/背驰结论</b>：<span class="empty">数据不足以判断背驰</span>（需至少两个波段高点）。';
  }else if(lastStep===5){
    const b=BOXES.find(x=>cut>=x.i0&&cut<=x.i1);let type,txt;
    if(b){const pos=(cur.c-b.bot)/((b.top-b.bot)||1);
      if(pos>0.72){type='sell';txt='贴近箱体上沿'+b.top.toFixed(2)+'：<b>卖/做T止盈区</b>（除非放量站稳突破转多）';}
      else if(pos<0.28){type='buy';txt='贴近箱体下沿'+b.bot.toFixed(2)+'：<b>买/做T低吸区</b>（除非跌破走空）';}
      else{type='hold';txt='箱体中段：<b>持有/等待</b>';}}
    else{const near=BOXES[0];type='hold';
      if(cur.c>near.top)txt='已突破最近箱体上沿'+near.top.toFixed(2)+'：观察<span style="color:#d64045"><b>收盘站稳</b></span>，站稳看多';
      else if(cur.c<near.bot)txt='已跌破最近箱体下沿'+near.bot.toFixed(2)+'：关注<span style="color:#d64045"><b>收盘收回</b></span>，收回则假破位';
      else txt='非箱体段，<b>趋势延续</b>，持有/跟随，不早反判';}
    const color=type==='buy'?'#e5f6ee':type==='sell'?'#fdeaea':'#eef2f7';
    html='<b>❺ 纯技术买卖建议</b><br><span style="background:'+color+';display:inline-block;padding:8px 12px;border-radius:8px;font-weight:700;">'+txt+'</span><br><span style="color:#8899aa">（仅缠论纯技术信号，不含估值）</span>';
  }
  el.innerHTML=html;meta.innerHTML='<b>自检：</b>'+metaTxt;
}
document.getElementById('slider').addEventListener('input',(e)=>{cut=+e.target.value;draw()});
window.addEventListener('resize',()=>{px();draw()});
px();draw();
</script></body></html>
