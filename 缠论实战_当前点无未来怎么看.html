": 39.15, "h": 39.15, "l": 38.4}, {"d": "2026-08-20", "o": 38.8, "c": 38.86, "h": 39.07, "l": 38.47}, {"d": "2026-08-21", "o": 38.8, "c": 38.9, "h": 39.1, "l": 38.76}];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let cut=DATA.length-1; // 当前点 = 最后一个数据(最新), 用户可前移
let showPanel=1;
function px(){cv.width=Math.max(820,cv.parentElement.clientWidth-6);cv.height=Math.max(500,cv.width*0.62);document.getElementById('slider').max=DATA.length-1}
const padL=54,padT=40,padB=46;
function x(i){const sub=DATA.slice(0,cut+1);return padL+(cv.width-padL-30)*(i/(sub.length-1))}
function yv(v){const sub=DATA.slice(0,cut+1);const mnm=Math.min(...sub.map(d=>d.l)),mxm=Math.max(...sub.map(d=>d.h));const g=mxm-mnm;return padT+(cv.height-padT-padB)*(1-(v-(mnm-g*0.07))/((mxm+g*0.06)-(mnm-g*0.07)))}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,cv.width,cv.height);
  const sub=DATA.slice(0,cut+1);
  const mnm=Math.min(...sub.map(d=>d.l)),mxm=Math.max(...sub.map(d=>d.h));
  ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;
  for(let k=0;k<=6;k++){const v=mnm+(mxm-mnm)*k/6,yy=yv(v);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(cv.width-30,yy);ctx.stroke();ctx.fillStyle='#8894a6';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText(v.toFixed(1),padL-7,yy+4)}
  // 日期轴
  ctx.textAlign='center';ctx.font='10px sans-serif';ctx.fillStyle='#99a4b4';
  sub.forEach((dd,i)=>{ if(i%8===0) ctx.fillText(dd.d.slice(5),x(i),cv.height-padB+20); });
  // 当前点垂直线
  ctx.save();ctx.strokeStyle='#d64045';ctx.lineWidth=2;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(x(cut),padT);ctx.lineTo(x(cut),cv.height-padB);ctx.stroke();ctx.restore();
  ctx.font='bold 12px sans-serif';ctx.fillStyle='#d64045';ctx.fillText('当前点 '+DATA[cut].d, x(cut), padT+12);
  // K线
  const bw=Math.max(1.5,cv.width/sub.length*0.5);
  sub.forEach((dd,i)=>{const up=dd.c>=dd.o;ctx.strokeStyle=up?'#c0392b':'#1a7a4c';ctx.fillStyle=up?'rgba(192,57,43,.9)':'rgba(26,122,76,.9)';ctx.beginPath();ctx.moveTo(x(i),yv(dd.l));ctx.lineTo(x(i),yv(dd.h));ctx.stroke();const top=Math.min(yv(dd.o),yv(dd.c)),bot=Math.max(yv(dd.o),yv(dd.c));ctx.fillRect(x(i)-bw/2,top,bw,Math.max(1.5,bot-top));});
  // 近高/近低标注(基于cut之前局部极值)
  if(showPanel>=2){
    // 近低: cut前最低收盘; 近高: 一小段最高
    const win=sub.slice(Math.max(0,cut-20),cut+1);
    const lo=win.reduce((a,b)=>a.c<b.c?a:b);
    const hi=win.reduce((a,b)=>a.c>b.c?a:b);
    const ilo=DATA.indexOf(lo), ihi=DATA.indexOf(hi);
    ctx.font='bold 11px sans-serif';
    ctx.fillStyle='#1a7a4c';ctx.fillText('近低 '+lo.c, x(ilo), yv(lo.c)+18);
    ctx.fillStyle='#d64045';ctx.fillText('近高 '+hi.c, x(ihi), yv(hi.c)-14);
  }
  document.getElementById('nowline').textContent='〔当前停在：'+DATA[cut].d+'，收盘 '+DATA[cut].c+'〕你在这天判断，没有未来。';
  document.getElementById('posLabel').textContent=DATA[cut].d;
  showPanel>=1?drawTips():showTipBy(showPanel);
}
function hideAll(){['A','B','C','D'].forEach((k,i)=>{document.getElementById('tip'+k).classList.remove('show')})}
function drawTips(){}
// 四个判断按钮的说明
const GUIDE={
 A:`<b>◆ 第一步：当下这段走势，方向是什么？</b><br>不看未来，只看"当前点"已出现的 K 线：最近一段的<b>收盘高点是抬高还是走低</b>？<br>就招商银行当前：从 38.2 往上到 40.5 附近（7月底高点），再回落、再反抽——<b>更接近"反弹中的整理"</b>，还没走出明确单边。判断：<b>当前是"反弹乏力、在 38–40 之间整理"</b>，不是强的上升，也不是恐慌下跌。`,
 B:`<b>■ 第二步：近高、近低在哪？</b><br>找出"当前点"之前最近的关键<b>高位</b>和<b>低位</b>，作为判断突破/跌破的参照物。<br>当前点附近：<b>近期高点约 40.4–40.5（7/30、8/3）</b>，<b>近期低点约 38.2（8/17）</b>。<br>意义：上方 40.4 过不去=压力，下方 38.2 破不破=支撑。这就是你要盯的两个价位。`,
 C:`<b>≡ 第三步：当前像不像箱体？</b><br>箱体 = 高点低点被卡在一条线里来回。当前 38.2–40.4 之间，股价已多日在这区间里上下（8月整月），<b>更像一个箱体/震荡区，上沿≈40.4、下沿≈38.2</b>。<br>在箱体里：<b>不谈反转</b>，只是高抛低吸。<b>什么时候有方向</b>——突破 40.4 或跌破 38.2 且站稳。`,
 D:`<b>→ 第四步：反转/转折到底怎么判断（当前点，无未来）</b><br>你没有未来，所以只能设"触发条件"，等信号兑现：<br>① 若<b>收盘站上 40.4</b>且回抽不回 → 看多，可能向上；<br>② 若<b>收盘跌破 38.2</b>且回抽不回 → 看空，可能转跌；<br>③ 两者之间都不动 → 仍在箱体整理。<br><b>关键</b>：实战不是"预测"，是<b>设好触发价位 + 等确认 + 设失效</b>——这跟你的估值体系"每个判断都要有失效条件"是同一套思想。`
};
function showTipBy(n){hideAll();document.getElementById('tip'+chr(n)).innerHTML=GUID[chr(n)];document.getElementById('tip'+chr(n)).classList.add('show')}
function chr(n){return ['A','B','C','D'][n-1]}
['j0','j1','j2','j3'].forEach((id,i)=>{document.getElementById(id).addEventListener('click',()=>{showPanel=i+1;hideAll();showTipBy(i+1);draw()})});
