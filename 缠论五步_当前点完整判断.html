const STEPNAMES=['❶ 走势方向','❷ 高低点','❸ 箱体','❹ 突破/背驰','❺ 买卖建议'];
function px(){cv.width=Math.max(880,cv.parentElement.clientWidth-6);cv.height=Math.max(580,cv.width*0.72);document.getElementById('slider').max=DATA.length-1;document.getElementById('slider').value=cut}
const padL=54,padT=40,padB=50;

function xs(i){const s=sub();return padL+(cv.width-padL-34)*(i/Math.max(1,s.length-1))}
function yv(v){const s=sub();const mn=Math.min(...s.map(d=>d.l)),mx=Math.max(...s.map(d=>d.h));const g=(mx-mn)||1;const priceH=priceBottom();return priceH-(priceH-padT)*(v-(mn-g*0.06))/((mx+g*0.06)-(mn-g*0.06))}

function showStepConclusion(s){

      if(DATA[gi].h>=DATA[gi-1].h && DATA[gi].h>=DATA[gi+1].h) hiPiv.push(gi);
    }
    // 合并相邻(保留更高)并取最近两个真正的波段顶(与cut保持一定间隔)
    const merged=[];
    for(const g of hiPiv){ if(merged.length&&g-merged[merged.length-1]<=2){ if(DATA[g].h>DATA[merged[merged.length-1]].h)merged[merged.length-1]=g;} else merged.push(g);}
    const lastTwo=merged.slice(-2);
    // 构建结论
    let btxt, bcolor, verdict;
    if(lastTwo.length>=2){
      const A=DATA[lastTwo[0]], B=DATA[lastTwo[1]]; // A=前高, B=近高
      const pUp=B.h>=A.h;                 // 价格是否创新高
      const mB=Math.abs(B.macd||0), mA=Math.abs(A.macd||0);
      if(pUp && mB < mA*0.8){
        btxt='有 <b style="color:#d64045">顶背驰</b>'; bcolor='#d64045';
        verdict='价格创阶段新高（'+A.h.toFixed(2)+' → '+B.h.toFixed(2)+'），但上涨动能（MACD）反而从 '+mA.toFixed(2)+' 降到 '+mB.toFixed(2)+'——<b>上涨力竭，是潜在见顶/卖点信号</b>。';
      } else if(pUp){
        btxt='<b>无顶背驰</b>'; bcolor='#0e6f46';
        verdict='价格创阶段新高，且 MACD 动能未减弱（'+mA.toFixed(2)+'→'+mB.toFixed(2)+'，跟上）——<b>上涨健康，暂无见顶信号</b>。';
      } else {
        btxt='目前无顶背驰信号'; bcolor='#33475e';
        verdict='近高点（'+B.h.toFixed(2)+'）<b>未超过前高</b>（'+A.h.toFixed(2)+'），本就在下降/整理结构里，谈不上"顶背驰创新高衰竭"。';
      }
      el.innerHTML='<b>❹ 突破/背驰结论</b>：'+btxt+'<br><span style="color:'+bcolor+'">'+verdict+'</span>'
        +'<br>对比的两个阶段高点：前高 <b>'+A.h.toFixed(2)+'</b>（'+A.d.slice(5)+'，MACD动能'+mA.toFixed(2)+'）→ 近高 <b>'+B.h.toFixed(2)+'</b>（'+B.d.slice(5)+'，MACD动能'+mB.toFixed(2)+'）。'
        +'<br><span style="color:#667085">突破触发（仍需回抽不回的确认）：<b>收盘站上 '+top.toFixed(2)+'</b> 看多；<b>收盘跌破 '+bot.toFixed(2)+'</b> 看空。</span>';
    } else {
      el.innerHTML='<b>❹ 突破/背驰结论</b>：当前点往前数据不足以形成两个完整阶段高点，<b>暂无法稳定判断背驰</b>。<br>需更多K线才能对比"新高+MACD动能"的关系。<span style="color:#667085">（这也是缠论"级别内数据要够"的体现。）</span>';
    }
  }
}
// ---- 第一步: 高低点连线方向 ----
function findPivots(seg,useHigh){
  const out=[];
  for(let i=1;i<seg.length-1;i++){const a=seg[i-1],c=seg[i],b=seg[i+1];
    if(useHigh&& c.h>=a.h&&c.h>=b.h) out.push(i+ (seg[0]===sub()[0]?0:sub().indexOf(seg[0])));
    if(!useHigh&& c.l<=a.l&&c.l<=b.l) out.push(i+ (seg[0]===sub()[0]?0:sub().indexOf(seg[0])));
  }
  return out;
}
function drawStep1(s){
  const seg=segment();
  const H=findPivots(seg,true).slice(-2),L=findPivots(seg,false).slice(-2);
  ctx.save();
  if(H.length>=2){ctx.strokeStyle='#d64045';ctx.lineWidth=2.2;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(H[0]),yv(DATA[H[0]].h));ctx.lineTo(xs(H[1]),yv(DATA[H[1]].h));ctx.stroke();H.forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].h),4.5,0,7);ctx.fillStyle='#d64045';ctx.fill()});ctx.font='bold 11px sans-serif';ctx.fillStyle='#d64045';ctx.fillText('高点'+(DATA[H[1]].h>=DATA[H[0]].h?'↑抬升':'↓走低'),xs(cut)-10,yv(DATA[H[1]].h)-12);}
  if(L.length>=2){ctx.strokeStyle='#1a7a4c';ctx.lineWidth=2.2;ctx.setLineDash([6,3]);ctx.beginPath();ctx.moveTo(xs(L[0]),yv(DATA[L[0]].l));ctx.lineTo(xs(L[1]),yv(DATA[L[1]].l));ctx.stroke();L.forEach(i=>{ctx.beginPath();ctx.arc(xs(i),yv(DATA[i].l),4.5,0,7);ctx.fillStyle='#1a7a4c';ctx.fill()});ctx.font='bold 11px sans-serif';ctx.fillStyle='#1a7a4c';ctx.fillText('低点'+(DATA[L[1]].l>=DATA[L[0]].l?'↑抬升':'↓走低'),xs(cut)-10,yv(DATA[L[1]].l)+22);}
  ctx.restore();
}
// ---- 第二步: 近高低 ----
function drawStep2(s){
  const seg=segment();let hi=seg[0],lo=seg[0];
  seg.forEach(d=>{if(d.h>=hi.h)hi=d;if(d.l<=lo.l)lo=d});
  const iHi=DATA.indexOf(hi),iLo=DATA.indexOf(lo);
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#d64045';ctx.fillText('近高 '+hi.h.toFixed(2)+' ('+hi.d.slice(5)+')',xs(iHi),yv(hi.h)-14);
  ctx.fillStyle='#1a7a4c';ctx.fillText('近低 '+lo.l.toFixed(2)+' ('+lo.d.slice(5)+')',xs(iLo),yv(lo.l)+20);
  ctx.strokeStyle='#d64045';ctx.beginPath();ctx.arc(xs(iHi),yv(hi.h),6,0,7);ctx.stroke();
  ctx.strokeStyle='#1a7a4c';ctx.beginPath();ctx.arc(xs(iLo),yv(lo.l),6,0,7);ctx.stroke();
}
// ---- 第三步: 箱体(缠论标准三段重叠) ----
function drawStep3(s){
  const seg=segment();
  // 简化: 用近段收盘价找窄横盘: 若收盘价集中, 上下沿=min高点/max低点
  const top=Math.min(...seg.map(d=>d.h)), bot=Math.max(...seg.map(d=>d.l));
  const range=top-bot;
  if(range>2.5){ // 太宽=趋势, 不画箱体
    ctx.font='12px sans-serif';ctx.fillStyle='#b7791f';ctx.textAlign='center';ctx.fillText('(这段波动大/偏趋势，窄箱体不明显)',cv.width/2,priceBottom()-10);
    return;
  }
  const x0=xs(Math.max(0,cut-win()+1)),x1=xs(cut),yt=yv(top),yb=yv(bot);
  ctx.save();ctx.fillStyle='rgba(183,121,31,0.12)';ctx.fillRect(x0,yt,x1-x0,yb-yt);
  ctx.strokeStyle='#b7791f';ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.strokeRect(x0,yt,x1-x0,yb-yt);
  ctx.setLineDash([]);ctx.font='bold 11px sans-serif';ctx.fillStyle='#b7791f';ctx.textAlign='left';
  ctx.fillText('压力 '+top.toFixed(2),x0+4,yt-8);ctx.fillText('支撑 '+bot.toFixed(2),x0+4,yb+16);
  ctx.fillStyle='#d64045';ctx.fillText('卖点区(上沿)',xs(cut)-6,yt-22);
  ctx.fillStyle='#22a06b';ctx.fillText('买点区(下沿)',x0+4,yb+30);
  ctx.restore();
}
// ---- 第四步: 突破/背驰 ----
function drawStep4(s){
  const seg=segment();const top=Math.min(...seg.map(d=>d.h)),bot=Math.max(...seg.map(d=>d.l));
  const cur=s[cut].c;
  // 背驰: 找近高及前高MACD
  let beichi='（附近无明显背驰信号）';
  let hi=seg[0];seg.forEach(d=>{if(d.h>hi.h)hi=d});const iHi=DATA.indexOf(hi);
  if(iHi>2){
    let prev=seg[0];seg.forEach(d=>{if(d.h>prev.h&&d!==hi&&DATA.indexOf(d)<iHi)prev=d});
    const iPrev=DATA.indexOf(prev);
    if(iPrev>=0&&iPrev<iHi){
      const m=Math.abs(hi.macd||0),mp=Math.abs(prev.macd||0);
      if(hi.h>=prev.h && m<mp*0.8) beichi='顶背驰（价新高但MACD动能减）';
      else if(m>=mp) beichi='未背驰（动能跟上）';
    }
  }
  // 突破判定
  let trig='';
  if(cur<bot) trig='已在箱体下沿外：临界位≈'+bot.toFixed(2)+'，收盘站回则看多、再破则看空';
  else if(cur>top) trig='已在箱体上沿外：临界位≈'+top.toFixed(2)+'，收盘站稳则看多';
  else trig='突破触发：收盘站上 '+top.toFixed(2)+' → 多；收盘跌破 '+bot.toFixed(2)+' → 空（需回抽不回确认）';
  // 画触发虚线
  ctx.save();ctx.strokeStyle=beichi.includes('顶背驰')?'#d64045':'#b7791f';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;
  [top,bot].forEach((lv,k)=>{const yy=yv(lv);ctx.beginPath();ctx.moveTo(xs(0),yy);ctx.lineTo(xs(cut),yy);ctx.stroke();});
  ctx.restore();
}
function updateVerdict(s){
  const v=document.getElementById('verdict'),d=document.getElementById('detail');
  const seg=segment(),top=Math.min(...seg.map(d=>d.h)),bot=Math.max(...seg.map(d=>d.l)),cur=s[cut].c;
  const range=top-bot;
  if(step<5){v.style.display='none';d.innerHTML='<b>逐步分析</b>：点上方五个步骤按钮，每步基于当前点之前数据实时画到图上、说明判断依据。第5步综合给出买卖建议。';return;}
  v.style.display='block';
  // 综合建议
  let type,txt;
  const pos=(cur-bot)/(range||1);
  const nearTop=cur>=top-(range)*0.12, nearBot=cur<=bot+(range)*0.12;
  // 背驰
  let hi=seg[0];seg.forEach(x=>{if(x.h>hi.h)hi=x});let beichi=''; 
  const iHi=DATA.indexOf(hi);
  // 简化建议
  if(cur<bot&&cur<top){type='sell';txt='跌破箱体下沿'+bot.toFixed(2)+'：破位看空，建议减/止损（纯技术）';}
  else if(cur>top){type='hold';txt='突破箱体上沿'+top.toFixed(2)+'：观察是否站稳，站稳看多、否则假突破(持有)';}
  else if(nearTop){type='sell';txt='贴近上沿'+top.toFixed(2)+'：压力位，做T止盈/波段减（除非突破站稳）';}
  else if(nearBot){type='buy';txt='贴近下沿'+bot.toFixed(2)+'：支撑位，做T低吸/波段加（除非跌破）';}
  else {type='hold';txt='处箱体中段（'+bot.toFixed(2)+'~'+top.toFixed(2)+'）：无明确信号，持有/等待';}
  v.className='verdict '+(type==='buy'?'v-buy':type==='sell'?'v-sell':'v-hold');
  v.innerHTML='【'+s[cut].d+' · 纯技术】'+txt;
  d.innerHTML='当前价 '+cur.toFixed(2)+'，箱体 '+bot.toFixed(2)+'~'+top.toFixed(2)+'，位置'+Math.round(pos*100)+'%。<br>'
  +'（注：这仅验证缠论纯技术信号，不含你的估值判断。）';
}
document.getElementById('slider').addEventListener('input',(e)=>{cut=+e.target.value;if(step>0)step=0;draw()});
window.addEventListener('resize',()=>{px();draw()});
// 默认走第一步
function initSteps(){const st=document.getElementById('steps');st.innerHTML='';STEPNAMES.forEach((nm,i)=>{const b=document.createElement('button');b.className='step'+(i===0?' on':'');b.textContent=nm;b.onclick=()=>{step=i+1;draw();};st.appendChild(b);});}
initSteps();px();draw();
</script></body></html>
