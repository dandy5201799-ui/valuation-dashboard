  fill.style.background=vType==='buy'?'#22a06b':vType==='sell'?'#d64045':'#2563eb';
  const d=document.getElementById('detail');
  d.innerHTML='箱体：下沿(支撑)<b>'+bot.toFixed(2)+'</b> ~ 上沿(压力)<b>'+top.toFixed(2)+'</b>；当前价 <b>'+cur.toFixed(2)+'</b>，位置 <b>'+Math.round(pos*100)+'%</b>'+(pos>0.75?'（贴近上沿）':pos<0.25?'（贴近下沿）':'（中段）')+'。<br>'
  +'背驰：'+(beichi||'（阶段高点MACD动能对比暂不明显）')+'<br>'
  +'<span style="color:#667085">注：这是缠论<b>纯技术</b>信号，不含估值判断，仅供验证理论。做T依据看上下沿，趋势看突破后。</span>';
  // 画箱体
  ctx.save();ctx.strokeStyle='#b7791f';ctx.lineWidth=2;ctx.setLineDash([6,3]);
  const x0=xs(Math.max(0,cut-w+1)),x1=xs(cut),yt=yyP(top),yb=yyP(bot);
  ctx.fillStyle='rgba(183,121,31,0.1)';ctx.fillRect(x0,yt,x1-x0,yb-yt);
  ctx.strokeRect(x0,yt,x1-x0,yb-yt);
  ctx.setLineDash([]);ctx.font='bold 11px sans-serif';ctx.fillStyle='#b7791f';ctx.textAlign='left';
  ctx.fillText('压力 '+top.toFixed(2),x0+4,yt-6);ctx.fillText('支撑 '+bot.toFixed(2),x0+4,yb+15);
  // 买/卖点标签
  ctx.font='bold 11px sans-serif';
  ctx.fillStyle='#22a06b';ctx.fillText('← 买点区(下沿)',x0+4,yb+28);
  ctx.fillStyle='#d64045';ctx.fillText('卖点区(上沿) →',xs(cut)-30,yt-20);
  ctx.restore();
}
document.getElementById('slider').addEventListener('input',(e)=>{cut=+e.target.value;draw()});
window.addEventListener('resize',()=>{px();draw()});
px();draw();
</script></body></html>
