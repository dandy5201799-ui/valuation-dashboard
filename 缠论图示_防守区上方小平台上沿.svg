<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 760; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .guard-zone { fill: rgba(245, 158, 11, .14); stroke: #f59e0b; stroke-width: 2; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .platform-zone { fill: rgba(37, 99, 235, .10); stroke: #2563eb; stroke-width: 2; }
      .platform-top { stroke: #2563eb; stroke-width: 5; }
      .breakout { stroke: #16a34a; stroke-width: 5; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-blue { fill: #2563eb; }
      .dot-green { fill: #16a34a; }
      .dot-orange { fill: #f59e0b; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .label { fill: #ffffff; stroke-width: 2; }
      .label-blue { stroke: #2563eb; }
      .label-green { stroke: #16a34a; }
      .label-orange { stroke: #f59e0b; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <text class="title" x="56" y="64">什么是“防守区上方的小平台上沿”？</text>
  <text class="sub" x="56" y="100">只看这一件事：防守区上方，几根小 K 横住，高点差不多；这些高点连成的上边界，就是小平台上沿。</text>

  <rect class="panel" x="56" y="136" width="1088" height="488" rx="24"/>

  <!-- chart frame -->
  <rect x="112" y="188" width="976" height="340" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="140" y1="244" x2="1060" y2="244"/>
  <line class="axis" x1="140" y1="320" x2="1060" y2="320"/>
  <line class="axis" x1="140" y1="396" x2="1060" y2="396"/>
  <line class="axis" x1="140" y1="472" x2="1060" y2="472"/>

  <!-- defense zone -->
  <rect class="guard-zone" x="140" y="456" width="920" height="48" rx="8"/>
  <line class="guard" x1="140" y1="480" x2="1060" y2="480"/>
  <text class="small" x="152" y="444">防守区：价格跌到这里附近，先观察</text>

  <!-- previous pullback into guard -->
  <g>
    <line class="wick-down" x1="180" y1="280" x2="180" y2="424"/><rect class="down" x="166" y="316" width="28" height="76"/>
    <line class="wick-down" x1="244" y1="340" x2="244" y2="492"/><rect class="down" x="230" y="376" width="28" height="82"/>
    <line class="wick-up" x1="308" y1="432" x2="308" y2="504"/><rect class="up" x="294" y="456" width="28" height="28"/>
  </g>

  <!-- platform -->
  <rect class="platform-zone" x="356" y="372" width="284" height="88" rx="10"/>
  <line class="platform-top" x1="356" y1="372" x2="640" y2="372"/>
  <text class="small" x="368" y="360">小平台上沿：几根小 K 的高点集中区</text>
  <line class="arrow" x1="500" y1="350" x2="500" y2="370"/>

  <g>
    <line class="wick-up" x1="388" y1="374" x2="388" y2="472"/><rect class="up" x="374" y="410" width="28" height="36"/>
    <line class="wick-down" x1="452" y1="368" x2="452" y2="464"/><rect class="down" x="438" y="398" width="28" height="36"/>
    <line class="wick-up" x1="516" y1="376" x2="516" y2="468"/><rect class="up" x="502" y="404" width="28" height="34"/>
    <line class="wick-down" x1="580" y1="370" x2="580" y2="476"/><rect class="down" x="566" y="402" width="28" height="42"/>
  </g>

  <circle class="dot dot-blue" cx="388" cy="374" r="8"/>
  <circle class="dot dot-blue" cx="452" cy="368" r="8"/>
  <circle class="dot dot-blue" cx="516" cy="376" r="8"/>
  <circle class="dot dot-blue" cx="580" cy="370" r="8"/>

  <!-- breakout -->
  <g>
    <line class="wick-up" x1="668" y1="324" x2="668" y2="440"/><rect class="up" x="654" y="360" width="28" height="56"/>
    <line class="wick-up" x1="732" y1="292" x2="732" y2="392"/><rect class="up" x="718" y="324" width="28" height="44"/>
  </g>
  <line class="breakout" x1="640" y1="372" x2="760" y2="316"/>
  <circle class="dot dot-green" cx="668" cy="360" r="12"/>
  <text class="txt" x="688" y="366">确认 A</text>
  <text class="small" x="688" y="392">收盘突破平台上沿</text>

  <!-- callouts -->
  <rect class="label label-orange" x="804" y="232" width="240" height="72" rx="12"/>
  <text class="txt" x="828" y="262">第一步</text>
  <text class="small" x="828" y="288">回到防守区附近</text>
  <path class="arrow" d="M804 290 C720 380 480 484 320 484"/>

  <rect class="label label-blue" x="804" y="332" width="240" height="92" rx="12"/>
  <text class="txt" x="828" y="362">第二步</text>
  <text class="small" x="828" y="388">2-4 根小 K 横住</text>
  <text class="small" x="828" y="412">高点落在同一区域</text>
  <path class="arrow" d="M804 388 C752 384 696 376 640 372"/>

  <rect class="label label-green" x="804" y="452" width="240" height="72" rx="12"/>
  <text class="txt" x="828" y="482">第三步</text>
  <text class="small" x="828" y="508">收盘突破上沿</text>
  <path class="arrow" d="M804 484 C756 448 708 392 672 364"/>

  <!-- footer -->
  <rect x="88" y="660" width="1024" height="56" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <circle class="dot dot-blue" cx="128" cy="688" r="8"/>
  <text class="txt" x="148" y="694">蓝色区域 = 小平台；蓝色粗线 = 平台上沿；绿色点 = 收盘突破平台上沿后的较早确认点。</text>
</svg>
