let cut=DATA.length-1;
const togg={fen:true, bi:true, zs:true}; // 分型/笔/中枢
const padL=54,padT=42,padB=58;
function px(){cv.width=Math.max(920,cv.parentElement.clientWidth-6);cv.height=Math.max(600,cv.width*0.72);const s=document.getElementById('sl');s.min=2;s.max=DATA.length-1;s.value=cut;document.getElementById('lab').textContent=DATA[cut].d}
function xs(i){return padL+(cv.width-padL-34)*(i/Math.max(1,DATA.length-1))}
function yv(v){const s=DATA.slice(0,cut+1);const mn=Math.min(...s.map(d=>d.l)),mx=Math.max(...s.map(d=>d.h));const g=(mx-mn)||1,pb=cv.height-padB-70;return pb-(pb-padT)*(v-(mn-g*0.03))/((mx+g*0.03)-(mn-g*0.03))}

  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,cv.width,cv.height);
