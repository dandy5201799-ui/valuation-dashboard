<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#f5f5f5}
      .title{font:400 34px "Times New Roman","Songti SC",serif;fill:#2d3142}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .panel{fill:#fff;stroke:rgba(45,49,66,.16);stroke-width:1.2}
      .panel-soft{fill:rgba(45,49,66,.025);stroke:rgba(45,49,66,.14);stroke-width:1.2}
      .txt{font:800 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4f5d75}
      .tiny{font:600 12px "SF Mono","Menlo",monospace;fill:#7a8399}
      .label{font:800 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .price{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 7}
      .up{fill:#dc2626;stroke:#dc2626}
      .down{fill:#16a34a;stroke:#16a34a}
      .guard{stroke:#f59e0b;stroke-width:2.6}
      .pressure{stroke:#2563eb;stroke-width:2.6}
      .range{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 6}
      .redline{stroke:#dc2626;stroke-width:2.6}
      .arrow{fill:none;stroke:#4f5d75;stroke-width:2.2;marker-end:url(#arrow)}
      .arrow-red{fill:none;stroke:#dc2626;stroke-width:2.4;marker-end:url(#arrow-red)}
      .arrow-blue{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow-blue)}
      .tag-green{fill:#f0fdf4;stroke:#16a34a}
      .tag-yellow{fill:#fff7ed;stroke:#f59e0b}
      .tag-red{fill:#fef2f2;stroke:#dc2626}
      .tag-blue{fill:#eff6ff;stroke:#2563eb}
      .tag-gray{fill:#f8fafc;stroke:#94a3b8}
    </style>
  </defs>

  <rect class="bg" width="1400" height="940"/>
  <text class="title" x="64" y="70">卖出 / 减仓 / 止损：五个结构触发点</text>
  <text class="sub" x="64" y="102">持仓后的核心不是预测最高点，而是分清：正常回调、尾声变弱、有效破防、弱反弹、修复确认。</text>

  <!-- top kline panel -->
  <rect class="panel" x="64" y="132" width="1272" height="408" rx="10"/>
  <text class="txt" x="96" y="170">一、上升趋势里的持仓管理：没破防不乱卖，破防不硬扛</text>
  <text class="small" x="96" y="198">上升趋势里，防守位是“继续持有”的核心分界。靠近防守位不等于卖；有效跌破才是必须降风险。</text>

  <!-- grid -->
  <g opacity=".7">
    <line x1="112" y1="448" x2="1288" y2="448" stroke="#e8eef7"/>
    <line x1="112" y1="388" x2="1288" y2="388" stroke="#e8eef7"/>
    <line x1="112" y1="328" x2="1288" y2="328" stroke="#e8eef7"/>
    <line x1="112" y1="268" x2="1288" y2="268" stroke="#e8eef7"/>
  </g>

  <!-- uptrend candles -->
  <g>
    <line class="up" x1="132" y1="384" x2="132" y2="460"/><rect class="up" x="120" y="408" width="24" height="32"/>
    <line class="up" x1="188" y1="328" x2="188" y2="424"/><rect class="up" x="176" y="356" width="24" height="48"/>
    <line class="down" x1="244" y1="348" x2="244" y2="444"/><rect class="down" x="232" y="372" width="24" height="44"/>
    <line class="up" x1="300" y1="292" x2="300" y2="388"/><rect class="up" x="288" y="320" width="24" height="46"/>
    <line class="down" x1="356" y1="324" x2="356" y2="416"/><rect class="down" x="344" y="350" width="24" height="40"/>
    <line class="up" x1="412" y1="248" x2="412" y2="356"/><rect class="up" x="400" y="280" width="24" height="52"/>
    <line class="down" x1="468" y1="300" x2="468" y2="408"/><rect class="down" x="456" y="328" width="24" height="54"/>
    <line class="up" x1="524" y1="228" x2="524" y2="340"/><rect class="up" x="512" y="260" width="24" height="58"/>
    <line class="down" x1="580" y1="284" x2="580" y2="428"/><rect class="down" x="568" y="320" width="24" height="76"/>
    <line class="up" x1="636" y1="300" x2="636" y2="396"/><rect class="up" x="624" y="332" width="24" height="36"/>
    <line class="down" x1="692" y1="288" x2="692" y2="420"/><rect class="down" x="680" y="328" width="24" height="64"/>
    <line class="up" x1="748" y1="240" x2="748" y2="348"/><rect class="up" x="736" y="272" width="24" height="52"/>
    <line class="down" x1="804" y1="264" x2="804" y2="376"/><rect class="down" x="792" y="294" width="24" height="50"/>
    <line class="up" x1="860" y1="216" x2="860" y2="336"/><rect class="up" x="848" y="250" width="24" height="58"/>
    <line class="down" x1="916" y1="252" x2="916" y2="388"/><rect class="down" x="904" y="284" width="24" height="78"/>
    <line class="down" x1="972" y1="316" x2="972" y2="460"/><rect class="down" x="960" y="354" width="24" height="76"/>
    <line class="up" x1="1028" y1="344" x2="1028" y2="436"/><rect class="up" x="1016" y="376" width="24" height="34"/>
    <line class="down" x1="1084" y1="356" x2="1084" y2="488"/><rect class="down" x="1072" y="392" width="24" height="70"/>
    <line class="up" x1="1140" y1="372" x2="1140" y2="472"/><rect class="up" x="1128" y="408" width="24" height="34"/>
    <line class="down" x1="1196" y1="384" x2="1196" y2="512"/><rect class="down" x="1184" y="420" width="24" height="64"/>
  </g>

  <!-- swing and levels -->
  <path class="price" d="M132 440 L188 328 L244 416 L300 292 L356 390 L412 248 L468 382 L524 228 L580 396 L636 332 L692 392 L748 240 L804 344 L860 216 L916 362 L972 430 L1028 376 L1084 462 L1140 408 L1196 484"/>
  <line class="guard" x1="112" y1="396" x2="1288" y2="396"/>
  <text class="tiny" x="1184" y="386">当前防守位</text>
  <line class="pressure" x1="1016" y1="376" x2="1288" y2="376"/>
  <text class="tiny" x="1136" y="366">破防后反弹压力</text>

  <!-- markers -->
  <g>
    <circle cx="580" cy="396" r="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect class="tag-green" x="456" y="444" width="248" height="50" rx="8"/>
    <text class="label" x="580" y="464" text-anchor="middle" fill="#15803d">① 正常回调：守住防守</text>
    <text class="tiny" x="580" y="484" text-anchor="middle">动作：继续持有，不因靠近防守就卖</text>

    <circle cx="916" cy="362" r="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect class="tag-yellow" x="776" y="444" width="280" height="50" rx="8"/>
    <text class="label" x="916" y="464" text-anchor="middle" fill="#b45309">② 尾声变弱：但还没破防</text>
    <text class="tiny" x="916" y="484" text-anchor="middle">动作：减仓/停止加仓，等待确认</text>

    <circle cx="972" cy="430" r="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <rect class="tag-red" x="1072" y="444" width="220" height="50" rx="8"/>
    <text class="label" x="1182" y="464" text-anchor="middle" fill="#b91c1c">③ 有效破防：承认错误</text>
    <text class="tiny" x="1182" y="484" text-anchor="middle">动作：离场/明显降仓</text>
  </g>

  <!-- arrows from markers -->
  <path class="arrow" d="M580 432 L580 444"/>
  <path class="arrow" d="M916 398 L916 444"/>
  <path class="arrow-red" d="M994 438 L1072 460"/>

  <!-- bottom panel -->
  <rect class="panel" x="64" y="580" width="1272" height="292" rx="10"/>
  <text class="txt" x="96" y="620">二、破防之后：不是永远不能买，而是必须重新确认</text>
  <text class="small" x="96" y="648">破防后，原来的“持有逻辑”已经失效。接回要看修复结构，不看情绪反弹。</text>

  <!-- two branches -->
  <g transform="translate(112 688)">
    <rect class="panel-soft" x="0" y="0" width="544" height="132" rx="8"/>
    <text class="txt" x="24" y="34">④ 弱反弹不过压力：不接回</text>
    <line class="pressure" x1="284" y1="48" x2="504" y2="48"/>
    <text class="tiny" x="392" y="38" text-anchor="middle">压力位</text>
    <path class="price" d="M44 92 L96 44 L148 84 L200 112 L252 72 L304 52 L356 88 L408 108"/>
    <circle cx="304" cy="52" r="9" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <rect class="tag-red" x="268" y="88" width="236" height="30" rx="6"/>
    <text class="label" x="386" y="108" text-anchor="middle" fill="#b91c1c">反弹失败：仍按弱势处理</text>
  </g>

  <g transform="translate(744 688)">
    <rect class="panel-soft" x="0" y="0" width="544" height="132" rx="8"/>
    <text class="txt" x="24" y="34">⑤ 修复确认：才考虑接回</text>
    <line class="pressure" x1="40" y1="58" x2="504" y2="58"/>
    <text class="tiny" x="392" y="48" text-anchor="middle">重新站回关键位</text>
    <path class="price" d="M44 98 L96 64 L148 88 L200 44 L252 66 L304 58 L356 76 L408 40 L492 28"/>
    <circle cx="200" cy="44" r="9" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="408" cy="40" r="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <rect class="tag-blue" x="248" y="88" width="252" height="30" rx="6"/>
    <text class="label" x="374" y="108" text-anchor="middle" fill="#1d4ed8">突破 + 回踩守住 + 再上</text>
  </g>

  <!-- compact decision boxes -->
  <g>
    <rect class="tag-gray" x="96" y="892" width="1208" height="28" rx="6"/>
    <text class="tiny" x="112" y="911">口诀：守住防守位，不乱卖；尾声变弱，先减仓；有效破防，先降风险；反弹不过压力，不接回；修复确认后，才重新考虑。</text>
  </g>
</svg>
