<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 36px; font-weight: 850; fill: #172033; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #667085; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 850; fill: #172033; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 740; fill: #334155; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #64748b; }
      .tiny { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 750; fill: #64748b; }
      .axis { stroke: #e2e8f0; stroke-width: 1.5; }
      .up { fill: #dc2626; stroke: #dc2626; stroke-width: 2; }
      .down { fill: #16a34a; stroke: #16a34a; stroke-width: 2; }
      .wick-up { stroke: #dc2626; stroke-width: 3; }
      .wick-down { stroke: #16a34a; stroke-width: 3; }
      .path { fill: none; stroke: #64748b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .guard { stroke: #f59e0b; stroke-width: 4; stroke-dasharray: 8 7; }
      .confirm-line { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 8 7; }
      .buy-line { stroke: #16a34a; stroke-width: 4; }
      .zone-guard { fill: rgba(245, 158, 11, .12); stroke: #f59e0b; stroke-width: 2; }
      .zone-blue { fill: rgba(37, 99, 235, .10); stroke: #2563eb; stroke-width: 2; }
      .zone-green { fill: rgba(22, 163, 74, .12); stroke: #16a34a; stroke-width: 2; }
      .box { fill: #ffffff; stroke-width: 2; }
      .box-blue { stroke: #2563eb; }
      .box-green { stroke: #16a34a; }
      .box-orange { stroke: #f59e0b; }
      .box-gray { stroke: #94a3b8; }
      .dot { stroke: #ffffff; stroke-width: 4; }
      .dot-a { fill: #f59e0b; }
      .dot-b { fill: #2563eb; }
      .dot-buy { fill: #16a34a; }
      .arrow { stroke: #94a3b8; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="980"/>

  <text class="title" x="56" y="64">无二次回落时：小高点不是标准 B，而是“替代确认线”</text>
  <text class="sub" x="56" y="100">如果 A 后直接强势上冲，没有 B 后回落，就不能硬说日线 B 已确认；只能用局部压力线作为第一层确认。</text>

  <!-- Main chart -->
  <rect class="panel" x="52" y="132" width="1396" height="500" rx="24"/>
  <text class="h2" x="92" y="180">真实 K 线情形：A 后没有二次回落，直接连续上冲</text>
  <text class="small" x="92" y="210">这时确认点来自“收盘突破局部压力线”，不是来自二次回踩确认。</text>

  <rect x="96" y="240" width="1308" height="320" rx="16" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <line class="axis" x1="128" y1="300" x2="1372" y2="300"/>
  <line class="axis" x1="128" y1="380" x2="1372" y2="380"/>
  <line class="axis" x1="128" y1="460" x2="1372" y2="460"/>

  <rect class="zone-guard" x="128" y="484" width="1244" height="44" rx="8"/>
  <line class="guard" x1="128" y1="506" x2="1372" y2="506"/>
  <text class="tiny" x="140" y="476">防守区：A 点附近止跌，只是观察区</text>

  <!-- Three alternative confirmation lines -->
  <line class="confirm-line" x1="492" y1="312" x2="1372" y2="312"/>
  <text class="tiny" x="506" y="302">确认线 1：最后明显阴线高点</text>

  <line class="confirm-line" x1="604" y1="420" x2="1372" y2="420"/>
  <text class="tiny" x="618" y="410">确认线 2：防守区上方小平台上沿</text>

  <line class="buy-line" x1="708" y1="392" x2="1372" y2="392"/>
  <text class="tiny" x="724" y="382">第一层确认 A：强阳收盘突破小平台上沿</text>
  <line class="buy-line" x1="876" y1="294" x2="1372" y2="294"/>
  <text class="tiny" x="908" y="284">第一层确认 B：收盘突破最后明显阴线高点</text>

  <!-- Candles: left trend -->
  <g>
    <line class="wick-up" x1="152" y1="452" x2="152" y2="528"/><rect class="up" x="138" y="478" width="28" height="34"/>
    <line class="wick-up" x1="208" y1="372" x2="208" y2="504"/><rect class="up" x="194" y="406" width="28" height="66"/>
    <line class="wick-down" x1="264" y1="396" x2="264" y2="520"/><rect class="down" x="250" y="430" width="28" height="52"/>
    <line class="wick-up" x1="320" y1="312" x2="320" y2="452"/><rect class="up" x="306" y="348" width="28" height="72"/>
    <line class="wick-down" x1="376" y1="356" x2="376" y2="516"/><rect class="down" x="362" y="394" width="28" height="84"/>
    <line class="wick-up" x1="432" y1="240" x2="432" y2="408"/><rect class="up" x="418" y="284" width="28" height="90"/>
  </g>

  <!-- Pullback: last big bearish candle, small platform, A -->
  <g>
    <line class="wick-down" x1="500" y1="312" x2="500" y2="472"/><rect class="down" x="486" y="348" width="28" height="100"/>
    <line class="wick-down" x1="556" y1="356" x2="556" y2="512"/><rect class="down" x="542" y="392" width="28" height="84"/>
    <line class="wick-up" x1="612" y1="436" x2="612" y2="528"/><rect class="up" x="598" y="462" width="28" height="38"/>
    <line class="wick-down" x1="668" y1="420" x2="668" y2="524"/><rect class="down" x="654" y="448" width="28" height="44"/>
  </g>

  <!-- Direct strong breakout without C -->
  <g>
    <line class="wick-up" x1="724" y1="356" x2="724" y2="500"/><rect class="up" x="710" y="392" width="28" height="84"/>
    <line class="wick-up" x1="780" y1="320" x2="780" y2="420"/><rect class="up" x="766" y="346" width="28" height="48"/>
    <line class="wick-up" x1="836" y1="288" x2="836" y2="392"/><rect class="up" x="822" y="318" width="28" height="50"/>
    <line class="wick-up" x1="892" y1="264" x2="892" y2="360"/><rect class="up" x="878" y="294" width="28" height="44"/>
    <line class="wick-down" x1="948" y1="280" x2="948" y2="376"/><rect class="down" x="934" y="306" width="28" height="40"/>
    <line class="wick-up" x1="1004" y1="248" x2="1004" y2="344"/><rect class="up" x="990" y="278" width="28" height="44"/>
  </g>

  <path class="path" d="M152 512 L208 372 L264 482 L320 312 L376 478 L432 240 L668 492 L724 356 L780 320 L836 288 L892 264 L1004 248"/>

  <circle class="dot dot-a" cx="668" cy="492" r="13"/>
  <text class="txt" x="684" y="498">A</text>
  <text class="tiny" x="620" y="548">防守区止跌</text>
  <path class="arrow" d="M660 540 C660 524 664 504 668 496"/>

  <circle class="dot dot-b" cx="500" cy="312" r="11"/>
  <text class="tiny" x="468" y="296">最后明显阴线高点</text>
  <path class="arrow" d="M504 300 C504 304 504 308 500 312"/>

  <circle class="dot dot-b" cx="668" cy="420" r="10"/>
  <text class="tiny" x="612" y="444">小平台上沿</text>

  <circle class="dot dot-buy" cx="724" cy="356" r="14"/>
  <text class="txt" x="740" y="362">确认 A</text>
  <text class="tiny" x="740" y="386">突破小平台</text>

  <circle class="dot dot-buy" cx="892" cy="264" r="14"/>
  <text class="txt" x="908" y="270">确认 B</text>
  <text class="tiny" x="908" y="294">突破大阴线高点</text>

  <rect class="box box-blue" x="1100" y="276" width="260" height="108" rx="12"/>
  <text class="txt" x="1124" y="310">这里没有标准 B-C-D</text>
  <text class="small" x="1124" y="338">因为没有“B 后回落”</text>
  <text class="small" x="1124" y="362">所以只叫替代确认线</text>

  <rect class="box box-green" x="1100" y="408" width="260" height="104" rx="12"/>
  <text class="txt" x="1124" y="442">怎么确定强势突破？</text>
  <text class="small" x="1124" y="470">选哪条压力线</text>
  <text class="small" x="1124" y="494">确认点就对齐哪条线</text>

  <!-- Three method panels -->
  <rect class="panel" x="52" y="668" width="1396" height="220" rx="24"/>
  <text class="h2" x="92" y="716">无二次回落时，确认线可以从哪里来？</text>

  <rect class="box box-blue" x="92" y="748" width="396" height="96" rx="12"/>
  <text class="txt" x="116" y="782">① 最后明显阴线高点</text>
  <text class="small" x="116" y="812">突破它，说明回调里的主要卖压被吃掉</text>

  <rect class="box box-blue" x="552" y="748" width="396" height="96" rx="12"/>
  <text class="txt" x="576" y="782">② 防守区上方小平台上沿</text>
  <text class="small" x="576" y="812">横住后向上突破，说明买盘开始占优</text>

  <rect class="box box-blue" x="1012" y="748" width="396" height="96" rx="12"/>
  <text class="txt" x="1036" y="782">③ 更小级别的小高点</text>
  <text class="small" x="1036" y="812">日线看不出 B，就到小时级别找 B</text>

  <rect x="84" y="916" width="1332" height="44" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <text class="txt" x="112" y="944">口诀：没有二次回落，就没有标准 B；突破小平台是较早确认，突破最后明显阴线高点更强，后面仍要靠跟随或回踩补确认。</text>
</svg>
